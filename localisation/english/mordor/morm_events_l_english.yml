l_english:

 morm.100.t:0 "The Growing Menace of Mordor"

 morm.100.desc:0 "In the desolate lands of Mordor, a dark power is amassing its strength. The Dark Lord of Barad-dûr intends to extend his shadow over all of Middle-earth, and soon his armies may march upon our very lands.\n\nYet, his power is not limitless. To raise the legions he envisions, he requires resources bexond the dark mountains. It would be prudent to obstruct his access to our wealth and goods."

 morm.100.a:0 "Close all paths and sever any aiding hand."

 morm.100.b:0 "The threat of Mordor is but a distant whisper."

 morm.101.t:0 "Shadow of Mordor Expands"

 morm.101.desc:0 "The dark power of Mordor casts its shadow ever further, as the legions of Sauron sweep through the lands, carving a path of destruction. It seems that the Dark Lord will not rest until all of Middle-earth trembles under his iron fist. We must ponder our course of action lest this darkness engulfs our own realm."

 morm.101.a:0 "What strength remains to resist this relentless foe?"

 morm.102.t:0 "Time to Choose"

 morm.102.desc:0 "The shadow of Mordor reaches ever further, spreading dread across the lands as Sauron's might grows with each passing day. The long war has taken its toll, and the bleak truth is undeniable: He seeks dominion over all of Middle-earth, and we are not spared his ambitions.\n\nWith this grim reality before us, we find ourselves at a crossroads. There is no room for negotiation or neutrality. We stand before two stark paths: Yield to Sauron and become thralls beneath his dark standard, or muster our courage, rally our warriors, and stand defiantly against the encroaching darkness."

 morm.102.a:0 "We have no other path. Pledge allegiance to the Dark Lord."

 morm.102.b:0 "We shall fight until the end. Rally to arms!"

 morm.105.t:0 "[FROM.GetName] Joins Our Cause"

 morm.105.desc:0 "[FROM.GetName], acknowledging the immense superiority of our forces and the dark magnificience of Lord Sauron, has submitted and joined our forces."

 morm.105.a:0 "A wise choice."

 morm.106.t:0 "Mordor Menace"
 morm.106.desc:0 "As Mordor's power grows, the Free Peoples will start to acknowledge the threat and take increasingly desperate measures to stop us. There are five levels of menace, each granting a bonus to the Free Peoples (all countries not aligned with Mordor) as well as a choice between two bonuses for us. At the highest menace level we represent an existential threat that cannot be ignored, and all neutral countries neighbouring us or our allies will (eventually) be compelled to join us or declare war on us.\n\nMenace level is affected by various things, including conquered territory, fielded divisions, casualties inflicted, as well as the passage of time. Hover over the menace level progress bar to see a full breakdown. Menace can not decrease, even if our power decreases. It will only ever go up."
 morm.106.a:0 "Got it!"
