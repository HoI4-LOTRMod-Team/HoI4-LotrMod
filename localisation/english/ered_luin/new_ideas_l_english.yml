ELU_volunteer_gon:0 "Volunteer Expeditions"
ELU_volunteer_gon_desc:0 "The bravest of dwarves venture forth from the mountains and aid the free peoples of Middle Earth in the struggle against evil."

ELU_mines_nationalization_act:0 "Mines Nationalization Act"
ELU_mines_nationalization_act_desc:0 "The Dwarves have decided to nationalize the mines in the Blue Mountains, preventing the mines from falling into the hands of wealthy mining conglomerates."

ELU_abolished_unions:0 "Abolished Unions"
ELU_abolished_unions_desc:0 "The Dwarves have decided to abolish the unions in the Blue Mountains, directing their people to aid the nation, not themselves, in its time of need."

ELU_supressing_radicalism:0 "Supressing Radicalism"
ELU_supressing_radicalism_desc:0 "The Dwarves have decided to supress radicalism in the Blue Mountains, preventing the rise of extremist factions that could threaten the stability of the nation."

ELU_dwarvish_supremacy:0 "Dwarvish Supremacy"
ELU_dwarvish_supremacy_desc:0 "It is the destiny of the mountain to stand over the fields and forests."

ELU_agriculture_department:0 "Agriculture Department"
ELU_agriculture_department_desc:0 "Ensuring a stable supply of food in these turbulent times, the Dwarves have established an agriculture department to oversee the production of food in the Blue Mountains."

ELU_agriculture_department_2:0 "Agriculture Department"
ELU_agriculture_department_2_desc:0 "Ensuring a stable supply of food in these turbulent times, the Dwarves have established an agriculture department to oversee the production of food in the Blue Mountains."

ELU_market_recession:0 "Market Recession"
ELU_market_recession_desc:0 "The market of Bree has been hit by a recession, causing a decrease in trade and a rise in instability."

ELU_bull_market:0 "Bull Market"
ELU_bull_market_desc:0 "The market of Bree is thriving, causing an increase in trade and a rise in stability."

ELU_dunland_trade:0 "Special Trade Agreement"
ELU_dunland_trade_desc:0 "Ered Luin and Dunland have negotiated a special trade agreement, allowing for increased trade between the two nations."

ELU_financial_payments_GON:0 "Financial Support"
ELU_financial_payments_GON_desc:0 "The Dwarves have decided to send financial payments to the free peoples of Middle Earth, aiding them in their struggle against evil."

ELU_mountain_warfare_0:0 "Mountain Warfare"
ELU_mountain_warfare_0_desc:0 "The Dwarves are masters in the art of mountain warfare, allowing them to fight more effectively in the rugged terrain of the Blue Mountains."

ELU_mountain_warfare_1:0 "Mountain Warfare"
ELU_mountain_warfare_1_desc:0 "The Dwarves are masters in the art of mountain warfare, allowing them to fight more effectively in the rugged terrain of the Blue Mountains."

ELU_mountain_warfare_2:0 "Mountain Warfare"
ELU_mountain_warfare_2_desc:0 "The Dwarves are masters in the art of mountain warfare, allowing them to fight more effectively in the rugged terrain of the Blue Mountains."