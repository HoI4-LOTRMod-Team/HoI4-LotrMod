l_english:
##### Event 
isengard.7.t:0 "The Hunt for the One Ring: Argonath"
isengard.7.d:0 "The One Ring is in the hands of the Fellowship. Our scouts report the fellowship travelling near Argonath, east of the dead marshes."
isengard.7.a:0 "This is our chance! Send a group of hunters to retrieve the ring."
isengard.7.b:0 "Leave them be."

isengard.6.t:0 "Saruman dies"
isengard.6.d:0 "The lord of Isengard and Leader of the wizards, Saruman, is dead."
isengard.6.a:0 "Oh dear..."

isengard.5.t:0 "Grima Wormtongue seeks refuge in Isengard"
isengard.5.d:0 "Having miserably failed his task to turn Rohan to our side, Grima Wormtongue seeks refuge in Orthanc."
isengard.5.a:0 "Whatever."

isengard.4.t:0 "Saruman demands complete Submission"
isengard.4.d:0 "Saruman has declared himself Lord of Enedwaith. Either we take up arms against him or bend the knee and serve."
isengard.4.a:0 "We bow to our new overlord: Saruman."
isengard.4.b:0 "We'll shove the tower of Orthanc up the old wizards arse!"

isengard.3.t:0 "Rohan refuses to give up the Westmarch"
isengard.3.d:0 "Rohan have declined our demands to surrender the Westmarch. Our troops stand ready for retaliation."
isengard.3.a:0 "We shall meet their stubborness with bloodshed."

isengard.2.t:0 "Rohan surrenders the Westmarch"
isengard.2.d:0 "Rohan has met our demands and cede the region known as the Westmarch to us."
isengard.2.a:0 "Excellent."

isengard.1.t:0 "Gandalf the Grey arrives in Isengard"
isengard.1.d:0 "Smoke rises from the Mountain of Doom. The hour grows late, and Gandalf the Grey rides to Isengard, seeking Sarumans counsel. Yet he would not hear his wisdom. Even when confronted with the unparalleled power of Sauron, he refuses to hand over the Ring leaving it instead in the careless hands of a halfling! What is to be done with this old fool? "
isengard.1.a:0 "Imprison him!"
isengard.1.b:0 "He is right. We must stand against Sauron."

isengard.8.t:0 "[From.GetName] suggests a alliance"
isengard.8.d:0 "We both want the same thing, we both hate the same thing. Lets take over Middle-Earth together"
isengard.8.a:0 "We should join hands"
isengard.8.b:0 "I will take over Middle-Earth myself"

isengard.9.t:0 "[From.GetName] says it is time"
isengard.9.d:0 "Lets attack Gondor together and share the taken land. Gondor wont be able to withstand a two front war."
isengard.9.a:0 "Fighting we will"
isengard.9.b:0 "We dont want to share anything"

isengard.10.t:0 "[From.GetName] demands submission"
isengard.10.d:0 "How there they demand submission. Altough, Mordor has grown very powerfull. Maybe this is truly the only way to survive..."
isengard.10.a:0 "Fighting is no use"
isengard.10.b:0 "We don't surrender that easy"

isengard.11.t:0 "The Fellowship is crossing the Misty Mountains"
isengard.11.d:0 "We have received confirmation that the Fellowship of the Ring is currently attempting to cross the Misty Mountains through the Redhorn Pass."
isengard.11.a:0 "Wake the Redhorn. Do not let the fellowship pass!"
isengard.11.a.tt:0 "The fellowship will be forced to go through the mines of Moria, where dark forces are rumoured to dwell."
isengard.11.b:0 "Let them cross. Their foolish mission is doomed either way."
isengard.11.b.tt:0 "The fellowship will safely cross the Misty Mountains, bypassing Moria."

isengard.12.t:0 "[From.GetName] suggests a alliance"
isengard.12.d:0 "[From.LeaderName] claims to have regained his power in Angmar. Saying that to conquer Middle-Earth once more they should work together. "
isengard.12.a:0 "Agreed"
isengard.12.b:0 "We have other goals"

isengard.13.t:0 "Gondor requests hegemonic alliance"
isengard.13.d:0 "A missive from Gondor reaches Isengard, proposing a significant alliance: to join the realm of Gondor as a vassal or fiefdom. The terms outline shared military cooperation and economic collaboration, promising stability and protection under the banner of Gondor."
isengard.13.a:0 "Agreed."
isengard.13.b:0 "Is this a joke?"

isengard.14.t:0 "Will we interfere with the civil war?"
isengard.14.d:0 "Our plots have yielded results, and the tribes are divided and embroiled in conflict. This moment provides an opportunity to interfere and ensure Orthanc's interests find benefit from the resulting victor. Such efforts would not be without cost, however."
isengard.14.a:0 "We will"
isengard.14.b:0 "Why would we bother?"

isengard.15.t:0 "Great news from [From.GetName]"
isengard.15.d:0 "The guardians of the Entwood have agreed to our proposal and a pursuit of closer relations."
isengard.15.a:0 "Splendid"

isengard.16.t:0 "[From.GetName] reject our collaboration proposal"
isengard.16.d:0 "The Ents are weary of the rising smokes in Isengard. They have rejected our approach."
isengard.16.a:0 "Unfortunate"

isengard.17.t:0 "[From.GetName] agrees"
isengard.17.d:0 "Mordor has agreed to lend aid to our covert pursuits in the Shire."
isengard.17.a:0 "Excellent"

isengard.18.t:0 "No commitment of support from [From.GetName]"
isengard.18.d:0 "The Lord of Mordor has no resources to spare for our follies. No aid will be leant by Barad-dûr towards our efforts in the Shire."
isengard.18.a:0 "Disappointing"

isengard.19.t:0 "[From.GetName] sends help in our desprate times"
isengard.19.d:0 "The white wizard of Isengard has sent us supplies and aid amidst our desperate hours. May the frailty of our kingdom recover, and may the Rohirrim find prosperity and glory once more."
isengard.19.a:0 "Agreed."
isengard.19.a:0 "No need of this"

isengard.20.t:0 "Great news from [From.GetName]"
isengard.20.d:0 "Dignitaries from Rohan have welcomed our proposal of a mutual knowledge exchange with welcome arms."
isengard.20.a:0 "Splendid."

isengard.21.t:0 "Disappointing answer from [From.GetName]"
isengard.21.d:0 "Rohan, misstrusting our intentions, has sought to reject our proposal for mutual knowledge exachange."
isengard.21.a:0 "Bollocks."

isengard.22.t:0 "Support from [From.GetName]"
isengard.22.d:0 "Saruman the Wise, seeking to strengthen the men of the west against Mordor's encroaching influence, has sent us provinded us with support."
isengard.22.a:0 "Always welcome"

isengard.23.t:0 "Mordor suggest declaring war on Gondor"
isengard.23.d:0 "A message from the Back Tower has reached Orthanc. The Dark Lord expects our immediate aid against the realm of Gondor."
isengard.23.a:0 "Agreed."
isengard.23.b:0 "Is this a joke?"

isengard.24.t:0 "Mordor suggest a non-aggression pact"
isengard.24.d:0 "A message from Mordor carries the words of the Dark Lord. Sauron deigns our interests mutually aligned, and wishes for a commitment to fight the future wars side by side, not against each other."
isengard.24.a:0 "Agreed."
isengard.24.b:0 "There is no need for this."

isengard.25.t:0 "[From.GetName]'s increasing influence"
isengard.25.d:0 "The Eye of the east has set on Isengard, and regards Orthanc as a vital piece in Sauron's great plan of conquest. With Mordor's strength growing faster than our own, it becomes increasingly difficult to assert ourselves agains the Dark Lord's absolute will."
isengard.25.a:0 "We are not his pawn yet."

isengard.26.t:0 "[From.GetName] suggests a alliance"
isengard.26.d:0 "The white city and Isengard share a common history, and the Stewards of Gondor have long welcomed the guardianship of Saruman the Wise. Now, they hope to see a more formal alliance."
isengard.26.a:0 "Agreed."
isengard.26.b:0 "This is not a good idea."

isengard.27.t:0 "[From.GetName] accepts us into their faction"
isengard.27.d:0 "Mordor has accepted us into the graces of the Dark Pact. Henceforth we shall fight under the banner of the Dark Lord, and see to it that it is hoisted above every tower in the west."
isengard.27.a:0 "Excellent."

isengard.28.t:0 "[From.GetName] declines us entrance into their faction"
isengard.28.d:0 "Mordor has rejected our proposal for a formal ascendance into the Dark Pact. They deem we have not yet proven our worth to march under the Eye's banner."
isengard.28.a:0 "It is what it is."

isengard.29.t:0 "[From.GetName] succumbs"
isengard.29.d:0 "[From.GetName] has made the final step and succumbed to our influence. Henceforth they shall fight under the banner of the White Hand, and see to it that it is hoisted above every tower in the west."
isengard.29.a:0 "A wise choice."

isengard.30.t:0 "[From.GetName] resists our influence"
isengard.30.d:0 "[From.GetName] has rallied under a new-found patriotic fervor which does not leave room for a wizard overlord. They have rejected our demands of dominion, and are prepared to fight for incependence, if necessary."
isengard.30.a:0 "A foolish folly on their part."

# DUN/ENE Request to join faction
isengard.31.t:0 "[FROM.GetName] request to be allowed into the faction"
isengard.31.d:0 "[FROM.GetName] seeks to march under the banners of the White Hand and serve the whims of Saruman the Wise. Are they worthy of our leadership?"
isengard.31.a:0 "Accept"
isengard.31.b:0 "If they wish to bend the knee, they should bend low."
isengard.31.c:0 "They are a liability, not an asset."

isengard.32.t:0 "[FROM.GetName] demands following suit and betraying [MOR.GetLeader]"
isengard.32.d:0 "The White Wizard of Orthanc, Saruman, has gotten his hands on the One Ring. Using it's unspeakable power, the wizard has sought to betray his ally in Mordor, and bring Middle Earth under his own submission. Isengard wishes for us to follow suit and turn our swords against Mordor."
isengard.32.a:0 "Long live Saruman!"
isengard.32.b:0 "This will put us in the crossfire..."

isengard.33.t:0 "[FROM.GetName] joins us"
isengard.33.d:0 "[FROM.GetName] are in awe of the White Wizard, wielding the One Ring. They have bent the knee eagerly, and hope to find in us an overlord that will deliver them to glory."
isengard.33.a:0 "A wise choice."

isengard.34.t:0 "[FROM.GetName] rejects us"
isengard.34.d:0 "[FROM.GetName], skeptical of our betrayal of Mordor, has deemed it unwise to yield to us."
isengard.34.a:0 "It shall be their undoing."

isengard.35.t:0 "[SHI.GetName] makes contact with us"
isengard.35.d:0 "The halflings of the Shire have taken notice of the turbulent times disrupting the otherwise peaceful hobbits. Seeking the wise guidance of the white wizard, they have fallen deeper under out influence."
isengard.35.a:0 "Curious."

isengard.36.t:0 "[ROH.GetName] fights back on the Westmarch"
isengard.36.d:0 "Rohan is clinging onto their lands in the Westmarch with desperation, refusing to give it up to the hordes of orcs weraking havoc behind their lines."
isengard.36.a:0 "The Rohirrim are treading on mighty thin ice."

#Response events for the three proposals possible for Isengard. 
#Non-agression pact/Faction/Trade deal
isengard.37.t:0 "[ROH.GetName] agrees to our proposal"
isengard.37.d:0 "Rohan has welcomed our diplomatic approach and accepted the proposal brought to them."
isengard.37.a:0 "Accept"

#Response events for the three proposals possible for Isengard. 
#Non-agression pact/Faction/Trade deal
isengard.38.t:0 "[ROH.GetName] refuses our proposal"
isengard.38.d:0 "The crown of Rohan, too misstrusting of our intentions, has rejected the proposal for collaboration with Orthanc."
isengard.38.a:0 "Accept"