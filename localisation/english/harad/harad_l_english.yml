HAR_secure_the_bay_tt:0 "Guarantees the ownership of §YTolfalas§! at the end of the §YWar of the Ring§!."
HAR_eyes_on_the_prize_tt:0 "Guarantees the ownership of §YLebennin§! and §YPelargir§! at the end of the §YWar of the Ring§!.\n\nIf §Y[HDR.GetNameDEF]§! does not accept our offer upon the completion of the focus "§YThe Delta for Their Allegiance§!" or it's not completed, §YEthir Anduin§! too will be guaranteed."
HAR_return_to_poros_tt:0 "Guarantees the ownership of §YPoros§! and §YSouth Ithilien§! at the end of the §YWar of the Ring§!."
HAR_supporting_umbari_claims_tt:0 "Guarantees §Y[UMB.GetNameDEF]§!'s ownership of all starting §Y[DAM.GetAdjective]§! starting core states upon their defeat with §Y[UMB.GetNameDEF]§! in your faction."
