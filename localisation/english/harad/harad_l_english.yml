#################################
#Events
#################################
harad.1.t:0 "Our Allies Triumph in the East!"
harad.1.d:0 "After a bloody yet necessary war to entrench ourselves further, we now feast with the spoils of victory. The Variags have maintained their grip over Khand and our aid has given us a dominant position over their affairs as well as prestige in ours."
harad.1.a:0 "Soon all will bend to our will!"

harad.2.t:0 "A Shattering Defeat"
harad.2.d:0 "The Temple of the All-Seeing had given their all into this unnecessary war but their gamble bankrupted them whole. The people have at last realised that the Temple is not as as absolute as they were led to believe and if there is a dent..."
harad.2.a:0 "...it can be torn down."
harad.2.b:0 "...it can be repaired."

harad.3.t:0 "[FROM.GetNameDEFCap] Proposes Mutual Collaboration"
harad.3.d:0 "From the lands down south, a delegate has appeared bearing gifts. His overlord wishes to establish diplomatic relations and as a gesture of goodwill, a most beneficial trade agreement."
harad.3.a:0 "Let us strengthen our bonds."
harad.3.b:0 "We trust none bearing the mark of a snake!"

harad.4.t:0 "[FROM.GetNameDEFCap] Accepts Mutual Collaboration"
harad.4.d:0 "The deal was a success. Our delegate was welcomed with open arms and hosted a feast for following his delivery of our message regarding the establishment of diplomatic and trade relations. Together we are stronger."
harad.4.a:0 "Excellent."

harad.5.t:0 "[FROM.GetNameDEFCap] Declines Mutual Collaboration"
harad.5.d:0 "The deal was a failure. Not long after the delegate delivered our message regarding the establishment of diplomatic and trade relations, he was swiftly kicked out and was forced to return empty handed."
harad.5.a:0 "So be it."

harad.6.t:0 "The Fire Rises"
harad.6.d:0 "In what seems to be a coordinated incident based on the previous manouvers of the Royal Palace, many buildings thought to house those affiliated with the Temple of the All-Seeing have been set ablaze. The Royal Guard has been deployed to persecute and "deal with" the fleeing templars under the guise of treason and conspiracy against Lord [ROOT.GetLeader]."
harad.6.a:0 "One by one, this disease will be rid of."
harad.6.b:0 "This isn't over."

harad.7.t:0 "Dark Clouds Gather in the North"
harad.7.d:0 "Our scouts up north have spotted a heavily armed convoy of orcs surrounding a dark figure making its way to our position. From the description they have given, this dark figure seems to be the infamous..."
harad.7.a:0 "A village in sight needs no guide. Dark times are upon us."
harad.7.b:0 "...Mouth of Sauron."
harad.7.c:0 "...Ninth of the Nazgûl."

harad.8.t:0 "The Emperor Lies Dead"
harad.8.d:0 "While [HAR.GetNameDEF] is no less familiar with the constant stream of conspiracies from all across the territories it administers, it appears this familiarity was not enough to save the hide of the current Emperor of the Sun. Despite his relatively pragmatic rulership over the Realm, he was found stabbed 28 times in his bedchambers, ironically meeting the same end as his predecessor."
harad.8.a:0 "Chalk it up for another one..."

harad.9.t:0 "End of the Temple"
harad.9.d:0 "With the last of its major holdouts eliminated, the Temple of the All-Seeing has entirely collapsed. What remains now regarding its members are those that are on the run, blending with the common populace until we gather more leads to root them out for good. Although, for Lord [ROOT.GetLeader], this is still no time to celebrate as the Temple left behind a gaping power vacuum that may soon be taken over by an another faction if it's not filled immediately."
harad.9.a:0 "And so another chapter is closed."

harad.10.t:0 "[FROM.GetNameDEFCap] Requests Tribute"
harad.10.d:0 "An envoy from [FROM.GetNameDEF] has arrived with the request that we pay tribute to them as payment for their support in our civil war. The set demands are not too high, but surely they may be better used in the reconstruction efforts?"
harad.10.a:0 "Fair enough."
harad.10.b:0 "Tribute? What tribute?"

harad.11.t:0 "[FROM.GetNameDEFCap] Demands Further Tribute"
harad.11.d:0 "Not long after the first, yet another envoy has arrived. [FROM.GetNameDEFCap] demands that we pay higher sums of gold as a means of "protection" against potential future rebellions and other sorts of threats. Although this is clearly a shakedown, [FROM.GetNameDEF] is certainly not to double-crossed."
harad.11.a:0 "Feed the crow and it will peck out your eye..."
harad.11.b:0 "Enough!"

harad.12.t:0 "[FROM.GetAdjective] Interference in our Politics"
harad.12.d:0 "And yet another envoy... We have given them the gold [FROM.GetNameDEF] wanted and now they seek to interfere with our way of life? How long will we continue polishing the [FROM.GetAdjective] boot? We may be weaker than them, but our men have the zeal to stand against this extortion. All it will take is one "no.""
harad.12.a:0 "We cannot risk war."
harad.12.b:0 "This cannot stand!"

harad.13.t:0 "[FROM.GetNameDEFCap] Refuses our Demands!"
harad.13.d:0 "Those double-crossing cowards have refused our very simple request. Payment for the services rendered. Therefore, what stands before us are two choices. Either we seize land off of them to remind them who we are, or break them outright."
harad.13.a:0 "If they won't pay in gold, they'll pay in land."
harad.13.b:0 "War!"

harad.14.t:0 "[FROM.GetNameDEFCap] seizes [115.GetName]"
harad.14.d:0 "Reports are coming in from our scouts that soldiers carrying [FROM.GetAdjective] banners have moved into [115.GetName]. Ideally this is merely a mistake, but given our recent opposition to their demands it may very well be intentional. It appears that we have no choice but to give into their demands... or not."
harad.14.a:0 "We shan't be pushed around any longer!"
harad.14.b:0 "Fine..."

harad.15.t:0 "Fate of Harad"
harad.15.d:0 "Conflict is boiling all across Middle-earth and [ROOT.GetNameDEF] now stands at the crossroads of destiny. Although [ROOT.GetNameDEF] has its own internal problems at hand, which were largely solved through our steady hand but are yet to be rid of, we cannot give up on this opportunity."
harad.15.a:0 "The whole structure is rotten. The time has come to rid ourselves of it!"
harad.15.b:0 "A new day is dawning. And [ROOT.GetLeader] shall be its herald."
harad.15.c:0 "Direct rule from Mordor!"
harad.15.e:0 "We shall stand on the right side of history."

harad.16.t:0 "The Envoy of Sauron"
harad.16.d:0 "During our feast, a figure clad in robes darker than night arrived, yet his words were a stark contrast. Plain as day, he offered us a place alongside Lord [MOR.GetLeader] so that we too partake in the new world he would soon unleash."
harad.16.a:0 "We shall stand alongside the strong."

harad.17.t:0 "[FROM.GetNameDEFCap] Requests the Return of [115.GetName]"
harad.17.d:0 "It appears our seizure of [115.GetName] has beaten [FROM.GetNameDEFCap] some sense into them for they themselves now seek to pay the tribute we've demanded of them in exchange for the return of their land."
harad.17.a:0 "They've learnt their lesson."
harad.17.b:0 "A bit late for that, is it not?"

harad.18.t:0 "[FROM.GetNameDEFCap] Demands A Corridor to [GON.GetNameDEF]"
harad.18.d:0 "Although we maintained our neutrality in the matters beyond our borders, envoys from [FROMGetNameDEF] arrived with a stern demand. They seek [107.GetName] for their future affairs against [GON.GetNameDEF] and in exchange will leave us alone.\n\nShould we refuse however, war is inevitable."
harad.18.a:0 "We've bled enough."
harad.18.b:0 "To arms!"

harad.19.t:0 "[FROM.GetNameDEFCap] Offers [176.GetName] for Our Allegiance"
harad.19.d:0 "Once more, envoys from [FROMGetNameDEF] arrived. This time however, they offer us an interesting deal. They seek our allegiance, and thus our neutrality, in exchange of the promise of [176.GetName] from [176.controller.GetName] at the end of the war."
harad.19.a:0 "We've lost some and now we'll gain some."
harad.19.b:0 "We'd rather stay out of harm's way."

harad.20.t:0 "[FROM.GetNameDEFCap] demands our annexation!"
harad.20.d:0 "As expected from the recent rise of a pretender in [FROM.GetNameDEF], special envoys belonging to the [FROM.GetAdjective] branch of the Temple of the All-Seeing have arrived today with the most grave demand. Their demand is that we give up our sovereignty to [FROM.GetNameDEF] so that we "adhere to the vision of the All-Seeing and collaborate in the the great struggle ahead.""
harad.20.a:0 "We have no choice."
harad.20.b:0 "We will not go down without a fight!"

harad.21.t:0 "Collapse of Order"
harad.21.d:0 "Following the defeat of Lord [MOR.GetLeader], our war effort has collapsed both in the battlefield and at home. The earth has torn asunder and swallowed the establishments of the Temple of the All-Seeing alongside its idols and now, chaos rules the streets.\n\n[GON.GetNameDEFCap] has forwarded us the terms for our surrender. We are to cede the lands of Harondor and Umbar to them in exchange for the cessation of hostilities. Given our situation, we have little choice in this matter as a revolution is inevitable."
harad.21.a:0 "We will start anew."
harad.21.b:0 "This is merely a setback! We will return!"

harad.22.t:0 "[HAR.GetNameDEFCap] Seizes [135.GetName]"
harad.22.d:0 "After a surprise attack on the [135.GetName] Garrison, the forces of [HAR.GetNameDEF] have successfully driven out the soldiers of [135.controller.GetNameDEF] from the area."
harad.22.a:0 "We have shown our strength."
harad.22.b:0 "Damn them!"

harad.23.t:0 "[135.GetName] Garrison Holds On"
harad.23.d:0 "Despite the surprise attack of the forces of [HAR.GetNameDEF], the [135.GetNmae] Garrison belonging to [135.controller.GetNameDEF] was successful in driving them out once more.\n\nThe site was previously a battlefield between the two powers in what is dubbed the "Battle of Poros" and it seems history has once again repeated itself."
harad.23.a:0 "We'll get them next time."
harad.23.b:0 "Get those men a raise!"

harad.24.t:0 "[FROM.GetNameDEFCap] Calls for Aid!"
harad.24.d:0 "A cult in Harad bearing the name "Order of the Azure," has started a revolt against the established rule. These blue-wearing cultists look far more favourably with cooperating with us against the forces of evil and thus it is our obligation to help them triumph."
harad.24.a:0 "We will dispatch our finest."
harad.24.b:0 "Prepare the carts. We're sending them equipment."
harad.24.c:0 "Not our problem."

harad.25.t:0 "[FROM.GetNameDEFCap] is Preparing to Send Forces"
harad.25.d:0 "Our call for aid was answered and [FROM.GetNameDEF] has begun the preparations to send us their own soldiers to support our cause."
harad.25.a:0 "We shall welcome them to our ranks."

harad.26.t:0 "[FROM.GetNameDEFCap] has Sent Equipment"
harad.26.d:0 "Our call for aid was answered and [FROM.GetNameDEF] has sent a sizaeble amount of equipment. Both swords and spears alike."
harad.26.a:0 "We shall arm our troops immediately."

harad.27.t:0 "[FROM.GetNameDEFCap] has Refused to Support Us"
harad.27.d:0 "Despite our call for aid, it appears that [FROM.GetNameDEF] has decided to turn a blind eye to the current events."
harad.27.a:0 "We shall hold on without them."

harad.28.t:0 "Cross-Anduin Diplomacy"
harad.28.d:0 "There are many points at which our belief and goals align with [FROM.GetNameDEF], something to be expected given their place in our alliance. However, upon their request we have figured that further cooperation can bear more fruit in research by sending our finest scholars so that they may learn from our ally."
harad.28.a:0 "A wonderful idea."
harad.28.b:0 "Research and development are expensive matters."

harad.29.t:0 "[FROM.GetNameDEFCap] Accepts Our Request"
harad.29.d:0 "[FROM.GetNameDEFCap] has accepted our request to exchange knowledge. All that is left is to have our scholars prepare accordingly and send them on their way while we prepare to accomodate [FROM.GetNameDEF]'s."
harad.29.a:0 "Wonderful."

harad.30.t:0 "[FROM.GetNameDEFCap] Turned Down Our Request"
harad.30.d:0 "Although we offered to exchange our knowledge with that of [FROM.GetNameDEF], it appears that this will not come to be as they've refused to send their scholars for us to learn from them."
harad.30.a:0 "Do they deem us inferior?"

harad.31.t:0 "[FROM.GetNameDEFCap] Offers to Carve [HDR.GetNameDEF]"
harad.31.d:0 "[HDR.GetNameDEFCap] came to existence from the power vacuum that occurred following the Battle of Poros and served as an important buffer zone to ease tension. Now, with an alliance secured with [FROM.GetNameDEF], they've pointed out that its existence is meaningless and that we should divide it between us."
harad.31.a:0 "A good idea."
harad.31.b:0 "We don't know if this alliance will last."

harad.32.t:0 "[FROM.GetNameDEFCap] Demands the End of Our Neutrality!"
harad.32.d:0 "Unfortunately expected, the alliance formed between [FROM.GetNameDEF] and [GON.GetNameDEF] resulted in their gaze turning against us. They demand that we give up on our neutrality and join their alliance or be crushed."
harad.32.a:0 "We have no choice."
harad.32.b:0 "We will not give into their mobbing!"

harad.33.t:0 "[FROM.GetNameDEFCap] Offers Unification"
harad.33.d:0 "With the change of government in [FROM.GetNameDEF], their thought has become far more aligned with that of ours. They too know of this, hence envoys from [FROM.GetNameDEF] have just arrived to propose unification so that we join our forces against the forces of [MOR.GetLeader]."
harad.33.a:0 "We will stand or fall together."
harad.33.b:0 "This is merely a plot to strip us of our identity!"

harad.34.t:0 "[FROM.GetNameDEFCap] Accepts Unification"
harad.34.d:0 "Great news from our envoys as [FROM.GetNameDEF] has accepted our offer of unification. Through their might and ours, [MOR.GetNameDEF] stands no chance against the free peoples of the South!"
harad.34.a:0 "Together, we are stronger!"

harad.35.t:0 "[FROM.GetNameDEFCap] Refuses Unification"
harad.35.d:0 "Despite the best efforts of our envoys, it appears that [FROM.GetNameDEF] is unwilling to unite with us. Now all we can do is to hope they are not tricked by [MOR.GetLeader] and turn against us."
harad.35.a:0 "A terrible shame."

harad.36.t:0 "[FROM.GetNameDEFCap] Offers a Trade Agreement"
harad.36.d:0 "Envoys from [FROM.GetNameDEF] have arrived with a peculiar request. Although we do not have the best of relations, they request that we sign a mutual trade agreement in which we give one another preferential treatment in hopes of improving said relations down the line."
harad.36.a:0 "These terms are acceptable."
harad.36.b:0 "We will not feed the snake!"

harad.37.t:0 "[FROM.GetNameDEFCap] Accepts Trade Agreement"
harad.37.d:0 "A rather surprising outcome, it appears that [FROM.GetNameDEF] has decided to put the past behind and sign the trade agreement."
harad.37.a:0 "We will both benefit greatly."

harad.38.t:0 "[FROM.GetNameDEFCap] Refuses Trade Agreement"
harad.38.d:0 "Despite the best efforts of our envoys, it appears that [FROM.GetNameDEF] is unwilling to sign the trade agreement. The scars of the past continue to haunt our relations."
harad.38.a:0 "So be it."

harad.39.t:0 "[FROM.GetNameDEFCap] Offers Conditional Alliance"
harad.39.d:0 "Envoys from [FROM.GetNameDEF] have arrived with a daring offer. They state that [FROM.GetNameDEF] will assist in our conquest of Middle-earth, for a price."
harad.39.a:0 "This is nothing."
harad.39.b:0 "We do not need their help."

harad.40.t:0 "[FROM.GetNameDEFCap] Accepts Our Offer of Conditional Alliance"
harad.40.d:0 "Although slightly dazed from the encounter, our envoys returned with success and gold. [FROM.GetNameDEFCap] will offer us payment in exchange for our services in their conquest."
harad.40.a:0 "To arms, men!"

harad.41.t:0 "[FROM.GetNameDEFCap] Rejects Our Offer of Conditional Alliance"
harad.41.d:0 "It was clear that this was daring from the start, and it was just proven right. A band of orcs marched in front of the front gate of the capital city and threw the severed heads of our envoys right at our doorstep."
harad.41.a:0 "We best not anger them further."

harad.42.t:0 "[FROM.GetNameDEFCap] Demands [185.GetName]!"
harad.42.d:0 "As part of their payment, these puny yet audicious men have decided that they should have [185.GetName] instead. Surely Lord [MOR.GetLeader] agrees that this is a ridiculous proposal?"
harad.42.a:0 "Their benefits outweigh the costs."
harad.42.b:0 "Who do they think they are?"

harad.43.t:0 "[FROM.GetNameDEFCap] Withdraws From [185.GetName]!"
harad.43.d:0 "Following our demand for [185.GetName] as payment for our services, it appears that the forces of [FROM.GetNameDEF] have withdrawn from the area, leaving it for us take charge."
harad.43.a:0 "Huh, that worked?"

harad.44.t:0 "[FROM.GetNameDEFCap] Refused Our Demand"
harad.44.d:0 "Despite our demand for compensation for our services in their war for the conquest of Middle-earth, [FROM.GetNameDEF] has turned a blind eye. Perhaps it may be wiser to collaborate with the other side?"
harad.44.a:0 "We won't forget this."

harad.45.t:0 "Matter of Payment"
harad.45.d:0 "The cost of the war has risen to the point we must demand greater compensation from [MOR.GetNameDEF].\n\nBefore us lies two chocies. Either we demand territorial expansion into [11.GetName] in order to secure resources to fuel the war machine or merely increased payment which is more likely to be considered than the former."
harad.45.a:0 "We must push for greater borders."
harad.45.b:0 "Higher payment is enough."

harad.46.t:0 "[FROM.GetNameDEFCap] Demands [11.GetName]!"
harad.46.d:0 "Once more the men demand for land from us and this time [11.GetName]. The region is a key asset for our war machine and it seems like they know of it. We believe that they've begun to run out of equipment and seek the infrastructure to forge them."
harad.46.a:0 "They could've just asked for weapons but... this works too."
harad.46.b:0 "We have entertained their nonsense far enough."

harad.47.t:0 "[FROM.GetNameDEFCap] Withdraws From [185.GetName]!"
harad.47.d:0 "Following our demand for [11.GetName] as payment for our services, it appears that the forces of [FROM.GetNameDEF] have withdrawn from the area, leaving it for us take charge."
harad.47.a:0 "Wait, really?"

harad.48.t:0 "[FROM.GetNameDEFCap] Demands Increased Payment"
harad.48.d:0 "Citing the rapidly increasing costs of waging the war, [FROM.GetNameDEF] has demanded of us increased payment to fuel their war machine."
harad.48.a:0 "If all it takes is some coin to grease the gears..."
harad.48.b:0 "No."

harad.49.t:0 "[FROM.GetNameDEFCap] Agrees for Increased Payment"
harad.49.d:0 "Lord [MOR.GetLeader], with his infinite wisdom, has granted us an increased payment so that we may use it to aid in his war effort."
harad.49.a:0 "Praise be!"

harad.50.t:0 "[FROM.GetNameDEFCap] Requests Mutual Collaboration"
harad.50.d:0 "Although we had countless wars in the past, we've all been defeated the same in the last war. [FROM.GetNameDEFCap] has gone through civil unrest and we had our own sets of problems.\n\nPointing the similarities in our situation, the envoys of [FROM.GetNameDEF] have requested our support should they form a faction to resist the Dúnedain's perverse influence."
harad.50.a:0 "Enemy of my enemy is my friend."
harad.50.b:0 "They certainly have plans against us."

harad.51.t:0 "[FROM.GetNameDEFCap] Accepts Mutual Collaboration"
harad.51.d:0 "[FROM.GetNameDEFCap] has accepted our request. Should we form an united front against the Dúnedain and bring the fight to them, they will come to our aid."
harad.51.a:0 "Together, we will avenge the fallen."

harad.52.t:0 "[FROM.GetNameDEFCap] Refuses Mutual Collaboration"
harad.52.d:0 "[FROM.GetNameDEFCap] has refused our request. Clearly they're plotting something and it is in our best interest to watch our backs."
harad.52.a:0 "If they are not with us, they are against us."
