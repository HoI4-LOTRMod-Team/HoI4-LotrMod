l_english:
#################################
#Focuses
#################################
HAR_a_doom_sweeping_the_land:0 "A Doom Sweeping the Land"
HAR_a_doom_sweeping_the_land_desc:0 "WIP"
HAR_a_feast_of_40_days_and_40_nights:0 "A Feast of 40 Days and 40 Nights"
HAR_a_feast_of_40_days_and_40_nights_desc:0 "Every victory may have its cost, but it must certainly have its feast as well. We will host one so that the relations between [ROOT.GetNameDEF] and [KND.GetNameDEF] is further strengthened."
HAR_a_haul_most_worthy:0 "A Haul Most Worthy"
HAR_a_haul_most_worthy_desc:0 "WIP"
HAR_a_high_seas_fleet:0 "A High Seas Fleet"
HAR_a_high_seas_fleet_desc:0 "We will build the mightiest of ships that will dominate the Sundering Seas. Those that stand against us will sink into despair as their puny ships too will sink into the bottom."
HAR_a_humiliation_avenged:0 "A Humiliation Avenged"
HAR_a_humiliation_avenged_desc:0 "At last, we've avenged the fallen from our humiliating defeat in the Battle of [135.GetName] and turned the tide by eliminating our ancient enemy once and for all. For them, the Sun descending upon them may be harrowing; but for us, it is a sign of our divine right to rule over them."
HAR_a_new_age_of_piracy:0 "A New Age of Piracy"
HAR_a_new_age_of_piracy_desc:0 "Towns? Plundered. Ships? Captured. Goods? Seized. As we continue our conquests on land, we have now begun our conquests at sea as well."
HAR_a_new_sun_rises:0 "A New Sun Rises"
HAR_a_new_sun_rises_desc:0 "WIP"
HAR_a_pact_of_convenience:0 "A Pact of Convenience"
HAR_a_pact_of_convenience_desc:0 "WIP"
HAR_a_shift_in_the_sands:0 "A Shift in the Sands"
HAR_a_shift_in_the_sands_desc:0 "WIP"
HAR_addressing_the_oliphant:0 "Addressing the Oliphaunt"
HAR_addressing_the_oliphant_desc:0 "Our Mûmakil, our oliphaunts, must become the bulk of our forces that will stop at nothing to terrorise the enemy. When their lines are broken, we will march forwards."
HAR_adopt_religious_plurality:0 "Adopt Religious Plurality"
HAR_adopt_religious_plurality_desc:0 "WIP"
HAR_all_under_our_dominion:0 "All Under Our Dominion"
HAR_all_under_our_dominion_desc:0 "WIP"
HAR_allure_the_royal_guard:0 "Allure the Royal Guard"
HAR_allure_the_royal_guard_desc:0 "Lord [ROOT.GetLeader] remains eerily silent in the face of all this whole situation. We need to find out what is going on at the Royal Palace, and the quickest way to do that is to make his own royal guards answer to us."
HAR_amass_the_templars:0 "Amass the Templars"
HAR_amass_the_templars_desc:0 "We must gather our Templars to devise a plan for the difficult days ahead. The fact that they are scattered throughout the realm may provide insights that we might not have thought of on our own."
HAR_an_alliance_under_our_terms:0 "An Alliance Under Our Terms"
HAR_an_alliance_under_our_terms_desc:0 "WIP"
HAR_an_army_to_fear:0 "An Army to Fear"
HAR_an_army_to_fear_desc:0 "To achieve victory, we must shape our men to be unparalleled in times of war. The very sight of them must invoke fear in the hearts of our adversaries."
HAR_an_arrow_most_deadly:0 "An Arrow Most Deadly"
HAR_an_arrow_most_deadly_desc:0 "Our forces will train so that they shall deliver death with their aim true. For what is the point of crossing blades when an arrow will do just the same?"
HAR_an_illusion_shattered:0 "An Illusion Shattered"
HAR_an_illusion_shattered_desc:0 "I thought we were- I thought-- I thought we were stronger..."
HAR_an_uneasy_request:0 "An Uneasy Request"
HAR_an_uneasy_request_desc:0 "The presence of [UMB.GetAdjective] forces on both sides in Harad could determine the outcome of the entire war, and we're already at a disadvantage. Although the likelihood is low, we could try contacting [UMB.GetNameDEF] for even the slightest chance of help."
HAR_animal_herding:0 "Animal Herding"
HAR_animal_herding_desc:0 "We are in need of quality food and leather to feed and outfit our soldiers. We will grant the herders what they need to fulfill this need."
HAR_antagonise_the_black_numenorians:0 "Antagonise the Black Numenorians"
HAR_antagonise_the_black_numenorians_desc:0 "[UMB.GetLeader] and his corsairs are not to be trusted. As far as we know, they may have provided refuge to the remnants of the Temple of the All-Seeing, and they could launch an attack the moment our guard is down. This cannot come to pass."
HAR_assert_influence:0 "Assert Influence"
HAR_assert_influence_desc:0 "WIP"
HAR_back_the_kindred_of_the_coins:0 "Back the Kindred of the Coins"
HAR_back_the_kindred_of_the_coins_desc:0 "A council of seven individuals with diverse yet highly influential backgrounds, the Kindred of the Coins are more than eager to leave behind the legacy of [MOR.GetNameDEF] and guide [UMB.GetNameDEF] to a new future. They are precisely what we need to bring the present order down."
HAR_begin_purges_within_the_echelons:0 "Begin Purges Within the Echelons"
HAR_begin_purges_within_the_echelons_desc:0 "As expected, those fools took the bait. Now we know exactly who is plotting treacherously with whom; all that is left is to cut off these snakes' heads."
HAR_begin_the_march_of_conquest:0 "Begin the March of Conquest"
HAR_begin_the_march_of_conquest_desc:0 "WIP"
HAR_beheld_in_darkness:0 "Beheld in Darkness"
HAR_beheld_in_darkness_desc:0 "WIP"
HAR_bleed_them_dry:0 "Bleed Them Dry"
HAR_bleed_them_dry_desc:0 "If they can pay this measly amount, surely they can pay further for "protection." We will put forward a demand for so."
HAR_bolster_dominion_over_harwan:0 "Bolster Dominion Over Harwan"
HAR_bolster_dominion_over_harwan_desc:0 "Harwan is a key area for us to maintain control over the rest of the territories under our control. Therefore, we must ensure at all costs that it remains under our control."
HAR_break_off_from_mordor:0 "Break Off From Mordor"
HAR_break_off_from_mordor_desc:0 "WIP"
HAR_bust_open_weapon_caches:0 "Bust Open Weapon Caches"
HAR_bust_open_weapon_caches_desc:0 "As expected, not all dissidents were close-lipped. All that was needed was the false promise that we would let them go if they were to speak, and they revealed the location of their caches prepared for their silly little revolt planned ahead."
HAR_buy_the_loyalty_of_the_variags:0 "Buy the Loyalty of the Variags"
HAR_buy_the_loyalty_of_the_variags_desc:0 "If there is one easterner folk that knows how to handle the lot, it is the Variags. We will recruit those that we can in order to keep the other tribes leashed."
HAR_carve_out_the_eye:0 "Carve Out the Eye"
HAR_carve_out_the_eye_desc:0 "The Temple of the All-Seeing is in complete disarray. Now is our chance to strike."
HAR_carve_up_harondor:0 "Carve Up Harondor"
HAR_carve_up_harondor_desc:0 "The daily lives of the [HDR.GetAdjective] people are best managed by powers that care about their interests and not some self-proclaimed "Marquess" that is spreading separatist lies and feasting on the hard-earned work of the people. We will suggest [GON.GetNameDEF] to divide Harondor based on where our peoples live."
HAR_cast_out_the_darkness:0 "Cast Out the Darkness"
HAR_cast_out_the_darkness_desc:0 "WIP"
HAR_construct_a_high_security_prison:0 "Construct a High Security Prison"
HAR_construct_a_high_security_prison_desc:0 "Silencing dissidents can only go on for so long. For every killed, two more appear hell-bent on avenging the "martyred." What if we were to just tuck them in a small yet secure box and throw away the keys?"
HAR_contain_the_darkness_to_the_west:0 "Contain the Darkness to the West"
HAR_contain_the_darkness_to_the_west_desc:0 "As expected, [UMB.GetNameDEF] too has been corrupted by the influence of the Temple of the All-Seeing. We must attack them before they attack us; for the best defense is a strong offensive to protect the South from the Dark Lord's pervasive influence."
HAR_crack_down_on_dissident_thought:0 "Crack Down on Dissident Thought"
HAR_crack_down_on_dissident_thought_desc:0 "Many from the tribes of Harwan harbour dangerous thoughts that threaten our rule over the region. They must be silenced swiftly before it gets out of hand."
HAR_cross_anduin_diplomacy:0 "Cross Anduin Diplomacy"
HAR_cross_anduin_diplomacy_desc:0 "We will reach out to our ally, [GON.GetNameDEF], beyond the Anduin River and propose them a scholarly exchange that we will both benefit from greatly."
HAR_declare_support_for_the_free_folk:0 "Declare Support for the Free Folk"
HAR_declare_support_for_the_free_folk_desc:0 "Out there, the free peoples of Middle-earth are fighting to the bitter end against Sauron's unending armies. Their cause is our cause, and we will do everything in our power to help them in their struggle for their future."
HAR_demand_adherence_to_sauron:0 "Demand Adherence to Sauron"
HAR_demand_adherence_to_sauron_desc:0 "WIP"
HAR_demand_an_eastern_corridor:0 "Demand an Eastern Corridor"
HAR_demand_an_eastern_corridor_desc:0 "WIP"
HAR_demand_an_end_to_complacency:0 "Demand an End to Complacency"
HAR_demand_an_end_to_complacency_desc:0 "WIP"
HAR_demand_the_harondor_valley:0 "Demand the Harondor Valley"
HAR_demand_the_harondor_valley_desc:0 "WIP"
HAR_deploy_local_garrisons:0 "Deploy Local Garrisons"
HAR_deploy_local_garrisons_desc:0 "There are many that prefer the stability that we bring over the chaos of uncertainty. By having them swear allegiance to us as fresh blood, we will secure the region."
HAR_direct_rule_from_mordor:0 "Direct Rule From Mordor"
HAR_direct_rule_from_mordor_desc:0 "WIP"
HAR_down_with_the_marquess:0 "Down with the Marquess"
HAR_down_with_the_marquess_desc:0 "WIP"
HAR_down_with_the_sauronites:0 "Down with the Sauronites"
HAR_down_with_the_sauronites_desc:0 "WIP"
HAR_eastern_affairs:0 "Eastern Affairs"
HAR_eastern_affairs_desc:0 "WIP"
HAR_eclipse_over_khand:0 "Eclipse Over Khand"
HAR_eclipse_over_khand_desc:0 "The preparations are finished. We are now to attack the rebels inciting revolt in the land of the Khand on behalf of our ally the Variags. Should we succeed, which is inevitable, the vines of Temple of the All-Seeing will extend far beyond."
HAR_embody_the_doctrine_of_mordor:0 "Embody Sauron's Will"
HAR_embody_the_doctrine_of_mordor_desc:0 "WIP"
HAR_embody_the_spirit_of_the_ancestors:0 "Embody the Spirit of the Ancestors"
HAR_embody_the_spirit_of_the_ancestors_desc:0 "WIP"
HAR_encourage_haradwaith_colonisation:0 "Encourage Colonisation"
HAR_encourage_haradwaith_colonisation_desc:0 "We will encourage those aligned with our rule to move to Harwan and ensure a tight grip over the region by drowning out the voices calling out to resist our rule."
HAR_establish_a_raiding_party:0 "Establish a Raiding Party"
HAR_establish_a_raiding_party_desc:0 "Coastal cities and towns are ripe with goods to plunder. We will make sure to take advantage of their carelessness of exposing such valuables out in the open."
HAR_establish_contact_with_rhun:0 "Establish Contact with Rhun"
HAR_establish_contact_with_rhun_desc:0 "Through the Variags we have learnt of a folk further north that share similar beliefs and customs as us. This provides us an unique opportunity to strike an agreement that we can both benefit from."
HAR_extort_the_weak:0 "Extort the Weak"
HAR_extort_the_weak_desc:0 "The defeat has brought down the Temple of the All-Seeing to near financial collapse. This leaves us with no choice but to put our foot down and seize anything and everything our people have got as recompensation. Whether it be goods or even themselves."
HAR_eyes_and_ears:0 "Eyes and Ears"
HAR_eyes_and_ears_desc:0 "Our enemies are on the move, and we need to find out what they're up to as soon as possible. We'll plant agents in many towns and make sure they report everything they hear to us immediately. There is no time to waste."
HAR_eyes_on_the_prize:0 "Eyes on the Prize"
HAR_eyes_on_the_prize_desc:0 "Our rivalry with [GON.GetNameDEF] runs thicker than water. Therefore, it is of utmost importance that they are wholly humiliated and groveling before our feet as the might of our army marches on into the Southeast. That is the grand prize in and of itself."
HAR_fate_of_harad:0 "Fate of Harad"
HAR_fate_of_harad_desc:0 "A great war that will determine the fate of Middle-earth is upon us. Although we have largely resolved our own problems, we have very little time before we are pounced upon. Thus, we must act swiftly yet deliberately."
HAR_flush_out_the_templar_remnants:0 "Flush Out the Templar Remnants"
HAR_flush_out_the_templar_remnants_desc:0 "Although their numbers are few, there are still some Templars lurking in the shadows and continuing to weave their web of lies. We will hunt them down and bring them to justice."
HAR_from_devastation:0 "From Devastation..."
HAR_from_devastation_desc:0 "Harondor was left in ruin following our defeat at the Battle of Poros many moons ago. Countless settlements were burnt down, many farms were torched and animals were killed. The time has come to return and rebuild."
HAR_from_the_south:0 "From the West"
HAR_from_the_south_desc:0 "WIP"
HAR_further_concessions:0 "Further Concessions"
HAR_further_concessions_desc:0 "WIP"
HAR_harad_and_the_war_of_the_ring:0 "Harad and the War of the Ring"
HAR_harad_and_the_war_of_the_ring_desc:0 "WIP"
HAR_hold_out_a_branch_for_umbar:0 "Hold Out a Branch for [UMB.GetName]"
HAR_hold_out_a_branch_for_umbar_desc:0 "WIP"
HAR_host_the_envoy_of_sauron:0 "Host the Envoy of Sauron"
HAR_host_the_envoy_of_sauron_desc:0 "It was not just the Variags that attended our feast. Our victory has caught the gaze of our master, and an envoy has arrived."
HAR_impose_transit_fees:0 "Impose Transit Fees"
HAR_impose_transit_fees_desc:0 "We control the chokepoint, therefore it is only natural that we will seek to benefit from it. By imposing transit fees, we will force all the passing merchant fleets to either pay up or return where they've come from. It is not like they have any other choice."
HAR_influence_harondor:0 "Influence Harondor"
HAR_influence_harondor_desc:0 "WIP"
HAR_interfere_in_khandian_politics:0 "Interfere in Khandian Politics"
HAR_interfere_in_khandian_politics_desc:0 "What is Khand but a rogue and volatile region in the South? The tribes under our control are most certainly content with our absolute rule and the stability and order it brings. Certainly the people of Khand would prefer that over the chaos?"
HAR_interrogate_dissidents:0 "Interrogate Dissidents"
HAR_interrogate_dissidents_desc:0 "Long ago, two Wizards clad in azure robes, Morinehtar and Rómestámo, came to Harad to incite a rebellion and hinder Sauron. Although those times are past, there are still those biding their time in the fringes whose beliefs threaten the foundation of the Temple of the All-Seeing. They must be found and taken care of."
HAR_invest_into_the_people:0 "Invest into the People"
HAR_invest_into_the_people_desc:0 "The wealth that the Temple of the All-Seeing acquired through unjust means will be redistributed to the people to compensate for the losses we suffered during the Eastern Campaign. The remaining portion will then be used to create new job opportunities."
HAR_invite_a_proxy_of_sauron:0 "Invite a Proxy of Sauron"
HAR_invite_a_proxy_of_sauron_desc:0 "His might grows by the day. In order to maintain our grasp, we will attempt to establish contact with the loyal subjects of the All-Seeing and invite them to lead us onwards in his steps."
HAR_joint_endeavours:0 "Joint Endeavours"
HAR_joint_endeavours_desc:0 "Strength comes from collaboration. The soldiers of our alliance will train together as part of a joint training regimen that addresses their weaknesses and bolsters their strengths."
HAR_joint_invasion_force:0 "Charter the Land"
HAR_joint_invasion_force_desc:0 "We will begin the preparations for a grand assault against those that defy Sauron's authority. Although our lands may be familiar with that of theirs, it is nonetheless a fruitful endeavour to map out the territory before engaging in battle."
HAR_kickstart_haradwaith_maritime_trade:0 "Kickstart [HAR.GetAdjective] Maritime Trade"
HAR_kickstart_haradwaith_maritime_trade_desc:0 "Access to a coastline provides us with the opportunity of engaging in commerce with nations previously thought difficult to do so. Construction of vessels inspired from those most generously "borrowed" from [UMB.GetNameDEF] must be encouraged."
HAR_know_all_see_all:0 "Know All See All"
HAR_know_all_see_all_desc:0 "Every letter, every word, everything that passes through the Royal Palace will first be heard by the Temple of the All-Seeing."
HAR_land_of_the_sun:0 "Land of the Sun"
HAR_land_of_the_sun_desc:0 "Harad, a vast land down south where the stars are strange, is home to the Haradrim whose ancestors were the Men who awoke in Hildórien during the Age of the Sun. Proud, doughty and warlike, they are the ancient enemies of [GON.GetNameDEF]."
HAR_learn_new_walks_of_life:0 "Learn New Walks of Life"
HAR_learn_new_walks_of_life_desc:0 "It would be ignorant not to absorb the knowledge passed down on many tribes for generations. Whether it be knowing how to twist a blade in a certain way, what cures a certain ailment or how to graze animals effectively, any knowledge is worth its weight in gold."
HAR_lease_umbari_ports:0 "Lease [UMB.GetAdjective] Ports"
HAR_lease_umbari_ports_desc:0 "WIP"
HAR_leave_but_a_wasteland:0 "Leave but a Wasteland"
HAR_leave_but_a_wasteland_desc:0 "WIP"
HAR_legacy_of_the_blue_wizards:0 "Legacy of the Blue Wizards"
HAR_legacy_of_the_blue_wizards_desc:0 "Morinehtar and Rómestámo, the Blue Wizards, have bestowed upon us a great gift: the teachings necessary to stand against the evil forces of [MOR.GetLeader]. These teachings will spread far and wide, and when the time comes, we will be there to fight against the darkness."
HAR_legitimise_our_rule:0 "Secure Our Rule"
HAR_legitimise_our_rule_desc:0 "We had never advanced this far in our campaign to conquer [GON.GetNameDEF]. As we advance, the [GON.GetAdjective] behind our lines look upon us with fear and contempt, and it is clear that those ready to oppose us will do everything in their power to thwart our rule. Therefore, to maintain order, we will settle our loyal subjects in the newly conquered territories."
HAR_local_investments:0 "Local Investments"
HAR_local_investments_desc:0 "One method of curtailing dissent is to actually invest in the region. By doing so, we will show the tribesmen that we're there to improve their daily lives."
HAR_manouvers_for_harondor:0 "Manouvers for Harondor"
HAR_manouvers_for_harondor_desc:0 "Harondor is the field upon which our past defeat against [GON.GetNameDEF] was carved in blood. At the moment, it is under the rule of a so-called "Marquess" that claims neutrality to the affairs between us and [GON.GetNameDEF], but if there is one thing the two of us can agree with, it is that this will not hold on for long."
HAR_march_on_the_march:0 "March on the March"
HAR_march_on_the_march_desc:0 "WIP"
HAR_maritime_investments:0 "Maritime Investments"
HAR_maritime_investments_desc:0 "If we seek to maintain our rule over [14.GetName], it is critical that we have the fleet to do so. By investing into to construction of new dockyards, we will ensure that we can respond to a potential naval invasion of the island or worse, the mainland. "
HAR_marking_our_claims:0 "Marking Our Claims"
HAR_marking_our_claims_desc:0 "WIP"
HAR_master_the_horse:0 "Master the Horse"
HAR_master_the_horse_desc:0 "Riding horses for the [KND.GetAdjective]s is as natural is walking. We will learn from their expertise so that we too may make use of these steeds."
HAR_mercenaries:0 "Mercenaries"
HAR_mercenaries_desc:0 "Even though they may be untrustworthy and ruthless, we must accept this risk when hiring mercenaries who are willing to shed blood for us in exchange for payment. Because even if we don't pay them, our enemy will."
HAR_move_against_the_temple:0 "Move Against the Temple"
HAR_move_against_the_temple_desc:0 "It took long enough, but they've finally made a mistake. The time has come to avenge the former Emperor of the Sun and get rid of this dark menace once and for all."
HAR_no_room_for_banditry:0 "No Room for Banditry"
HAR_no_room_for_banditry_desc:0 "Bandits have been terrorizing the people, and cutting into our tax revenues, for far too long. Their pointless murders are no good for our realm; therefore they must be made an example of by establishing hunting parties dedicated to taking them out."
HAR_open_for_commerce:0 "Open for Commerce"
HAR_open_for_commerce_desc:0 "WIP"
HAR_pacifying_the_east:0 "Pacifying the East"
HAR_pacifying_the_east_desc:0 "The recent civil war in [KND.GetNameDEF] has caused much unrest within the territories in the region that are under our control. We must ensure those within it too don't rise up against us."
HAR_pillage_the_land:0 "Pillage the Land"
HAR_pillage_the_land_desc:0 "WIP"
HAR_plead_for_the_mighty:0 "Plead for the Mighty"
HAR_plead_for_the_mighty_desc:0 "WIP"
HAR_plot_against_the_emperor:0 "Plot Against the Emperor"
HAR_plot_against_the_emperor_desc:0 "That insolent fool was trying to get rid of us. Us! Just as we placed him in his equally insolent father's place all those years ago, we will do to him exactly what he was trying to do us. And unlike him, we will succeed."
HAR_proclaim_kas_shadoul:0 "Proclaim Kas-shadûl"
HAR_proclaim_kas_shadoul_desc:0 "[225.GetName] has been under our control and lived in by our people for long enough that it is justifiable to rename it to something that befits our culture."
HAR_propogandise_the_incident:0 "Propogandise the Incident"
HAR_propogandise_the_incident_desc:0 "WIP"
HAR_put_an_end_to_the_extortion:0 "Put an End to the Extortion"
HAR_put_an_end_to_the_extortion_desc:0 "WIP"
HAR_rally_for_the_campaign:0 "Rally for the Campaign"
HAR_rally_for_the_campaign_desc:0 "We need young capable men for the war ahead. To achieve that, we must stoke sentiments and give them an enemy they will lay their lives fighting against."
HAR_reach_out_for_a_helping_hand:0 "Reach Out for a Helping Hand"
HAR_reach_out_for_a_helping_hand_desc:0 "No matter how popular our movement may be, our chances of victory are very slim without outside help. We will reach out to brother nations to enlist their support in our fight against evil."
HAR_recoup_from_the_fiasco:0 "Recoup From the Fiasco"
HAR_recoup_from_the_fiasco_desc:0 "We did everything in our power to secure victory in the Eastern Campaign, but we failed miserably. It is paramount that we regain our former strength before the people realize that our authority is by no means permanent."
HAR_reinforce_ramlond:0 "Reinforce [225.GetName]"
HAR_reinforce_ramlond_desc:0 "In [225.GetName], [UMB.GetAdjective] people make up an overwhelming majority. If we are to establish any kind of relationship with [UMB.GetNameDEF], we must ensure that we are not gutted in our weakest point and strengthen [225.GetName] accordingly."
HAR_reinforce_temple_apparatus:0 "Reinforce Temple Apparatus"
HAR_reinforce_temple_apparatus_desc:0 "The rebels were crushed, and with them gone the Temple of the All-Seeing can further entrench its rule over all lands down South. After all, it was through Sauron's will that victory was achieved."
HAR_rekindle_relations_with_the_tribes:0 "Rekindle Relations with the Tribes"
HAR_rekindle_relations_with_the_tribes_desc:0 "WIP"
HAR_repair_the_devastation:0 "Repair the Devastation"
HAR_repair_the_devastation_desc:0 "The war has caused widespread destruction both in our territories and in those of our enemies. It is vitally important that we begin the reconstruction process as soon as possible to restore civilian life and, with it, tax revenues."
HAR_repair_the_neglected_routes:0 "Repair the Neglected Routes"
HAR_repair_the_neglected_routes_desc:0 "The lack of proper road maintenance is hindering the flow of trade and the extent of our authority. Existing routes must be made safe through patrols, and new roads must be paved in areas where there is an urgent need."
HAR_resolve_intratribal_conflicts:0 "Resolve Intratribal Conflicts"
HAR_resolve_intratribal_conflicts_desc:0 "Although it was largely resolved through the establishment of our rule, there are still some tribes bickering over pointless matters. We will lend our hand once more."
HAR_restore_pharazons_wall:0 "Restore Ar-Pharazôn's Wall"
HAR_restore_pharazons_wall_desc:0 "When the Númenórean King Ar-Pharazôn landed at [108.GetName] and began his march on Mordor to challenge Sauron, he had a mighty wall erected on [225.GetName] to secure the city so that it may serve as a major hub of unhindered commerce and operations. This long neglected wall must be restored so that the city can serve its purpose once more."
HAR_restoring_order:0 "Restoring Order"
HAR_restoring_order_desc:0 "Our authority stretches thinner the further away from our capital. In order to put an end to lawlessness and disorder, we must put our foot down."
HAR_return_to_poros:0 "Return to [135.GetName]"
HAR_return_to_poros_desc:0 "We will not allow our past defeat to stand in the way of our future. The lives we lost while trying to capture [135.GetName] prove that, among our allies, we have the strongest claim to these lands, and our conquest of this place is entirely justified."
HAR_revere_the_emperor:0 "Revere the Emperor"
HAR_revere_the_emperor_desc:0 "WIP"
HAR_rid_the_old_order:0 "Rid the Old Order"
HAR_rid_the_old_order_desc:0 "WIP"
HAR_rouse_for_an_incident:0 "Rouse for an Incident"
HAR_rouse_for_an_incident_desc:0 "Thanks to the information gathered from the documents seized as well as the bait we have planted, we've come to figure out where the Temple of the All-Seeing is hiding. When they least expect it, we will torch their hideouts and send them running to be picked off. One by one."
HAR_secure_the_bay:0 "Secure the Bay"
HAR_secure_the_bay_desc:0 "[14.GetName] serves as a crucial chokepoint at the mouth of the Anduin River. Whoever controls this island determines what comes in and out, and it is we who must control it."
HAR_secure_the_border_towns:0 "Secure the Border Towns"
HAR_secure_the_border_towns_desc:0 "We must ensure that our reconstruction efforts are unhindered through taking command of key positions within our borders. Not even a single bird must escape lest our enemies catch wind and feel "threatened" to justify war."
HAR_seek_gondor_aid:0 "Seek Gondor Aid"
HAR_seek_gondor_aid_desc:0 "Our people have a rather complicated relationship with [GON.GetNameDEF]. However, over time, they will come to understand why we would ask for help from someone they view as an enemy."
HAR_seize_temple_property:0 "Seize Temple Property"
HAR_seize_temple_property_desc:0 "The defeat of the forces of the Temple of All-Seeing in the Eastern Campaign has brought them to the brink of bankruptcy, and they will undoubtedly attempt to extort tribute from the people by exploiting their temples for the sake of their cause. We, too, will act before they do and seize their assets using precisely the same justification they are trying to use to take from others."
HAR_seize_the_pelargir_fleet:0 "Seize the [164.GetName] Fleet"
HAR_seize_the_pelargir_fleet_desc:0 "Centuries ago, Ship-king Eärnil I of [GON.GetNameDEF] built a grand armada in [164.GetName] to use against our neighbour, [UMB.GetNameDEF]. Although this armada has been in decline and beaten following the War of the Ring, we may seize it for our own purposes rather than let it rot in harbour."
HAR_bend_to_our_will:0 "Bend to Our Will"
HAR_bend_to_our_will_desc:0 "Whether they like it or not, [135.GetName] is rightful domain of [ROOT.GetNameDEF]. Either the [ITH.GetAdjective]s will bend their knee, or we will make them."
HAR_send_envoys_to_the_east:0 "Send Envoys to the East"
HAR_send_envoys_to_the_east_desc:0 "WIP"
HAR_shuffle_the_royal_court:0 "Shuffle the Royal Palace"
HAR_shuffle_the_royal_court_desc:0 "The Temple of the All-Seeing has been around for so long that its tentacles have reached deep into the very heart of the Royal Palace. We will have to take drastic measures by reorganizing the entire palace staff and spread false information, piece by piece, to guide us precisely to the source of the stench of corruption."
HAR_side_by_side_with_a_friend:0 "Side By Side with a Friend"
HAR_side_by_side_with_a_friend_desc:0 "Even though they were our sworn enemies in the past, we have much to gain from cooperating with [GON.GetNameDEF]. Only by forging an alliance with them can we vanquish the forces of evil."
HAR_spread_the_word_of_the_all_seeing:0 "Spread the Word of the All-Seeing"
HAR_spread_the_word_of_the_all_seeing_desc:0 "It is our duty to ensure that our people do not lose heart. We will spread his words far and wide and rekindle the fire within our people."
HAR_sprouts_anew:0 "...Sprouts Anew"
HAR_sprouts_anew_desc:0 "Our reconstruction efforts have started to finally bear fruit as the region has started to see commerce, something which hadn't happened in a long time within the portions under our control. The people now see clearly that we are not merciless beasts; so long as they don't stand in our way, of course."
HAR_stand_together_stand_strong:0 "Stand Together Stand Strong"
HAR_stand_together_stand_strong_desc:0 "WIP"
HAR_stop_the_rot:0 "Stop the Rot"
HAR_stop_the_rot_desc:0 "The chains of the Temple of the All-Seeing may have been broken, but a great threat still looms. Before the Royal Palace consolidates its power, we must act quickly to overthrow them and secure our dominance."
HAR_strength_in_collaboration:0 "Strength in Collaboration"
HAR_strength_in_collaboration_desc:0 "What greater endeavor exists than that of collaboration? Refusal to collaborate is simply a refusal to grow, an insistence on suicide, if they will. We must all collaborate, willingly, eagerly, if we expect to reap the benefits of unification. And reap we shall. "
HAR_strength_in_unity:0 "Strength in Unity"
HAR_strength_in_unity_desc:0 "WIP"
HAR_strike_a_pact_with_the_variags:0 "Strike a Pact with the Variags"
HAR_strike_a_pact_with_the_variags_desc:0 "Through their belief in Sauron, the Variags in the lands to the East make natural allies. As such, in their time of great struggle, it is in our best interest to support them."
HAR_sunrise_over_the_moon:0 "Sunrise Over the Moon"
HAR_sunrise_over_the_moon_desc:0 "Although we have put our foot down, there is still dissent due to the uncertainty of whether our rule over Harnitihilien is truly legitimate. Fine, we will play their game of titulary."
HAR_support_the_cause_in_rhun:0 "Support the Cause in Rhun"
HAR_support_the_cause_in_rhun_desc:0 "WIP"
HAR_temple_affairs:0 "Temple Affairs"
HAR_temple_affairs_desc:0 "The Temple of the All-Seeing, devoted to the worship of Sauron, functions as both a spiritual hierarchy and a powerful instrument of political control in [ROOT.GetNameDEF]. Its doctrine venerates Sauron's constant awareness and dominion while also emphasising obedience, surveillance, and submission."
HAR_test_the_gondorian_guard:0 "Test the Gondorian Guard"
HAR_test_the_gondorian_guard_desc:0 "WIP"
HAR_the_delta_for_their_allegiance:0 "The Delta for Their Allegiance"
HAR_the_delta_for_their_allegiance_desc:0 "WIP"
HAR_the_king_and_his_kingdom:0 "The King and His Kingdom"
HAR_the_king_and_his_kingdom_desc:0 "WIP"
HAR_the_mouth:0 "The Mouth"
HAR_the_mouth_desc:0 "WIP"
HAR_the_new_lord_of_pelargir:0 "The New Lord of [164.GetName]"
HAR_the_new_lord_of_pelargir_desc:0 "[GON.GetAdjective]s must be made to believe that we are here to stay. By making up a new title for the region and essentially cutting all ties to [GON.GetNameDEF], we will force them to accept their new reality under our boot."
HAR_the_ninth:0 "The Ninth"
HAR_the_ninth_desc:0 "WIP"
HAR_the_second_battle_of_poros:0 "Avenge the Battle of Poros"
HAR_the_second_battle_of_poros_desc:0 "WIP"
HAR_the_secrets_of_the_night:0 "The Secrets of the Night"
HAR_the_secrets_of_the_night_desc:0 "WIP"
HAR_the_southern_flank:0 "The Southern Flank"
HAR_the_southern_flank_desc:0 "WIP"
HAR_the_will_to_empire:0 "The Will to Empire"
HAR_the_will_to_empire_desc:0 "Although we were already an empire in every respect except for the name, we lacked the authority to put it into practice. That is no longer the case. In time, everyone will kneel before us and venerate our name: the Empire of Harad."
HAR_their_price_for_victory:0 "Their Price for Victory"
HAR_their_price_for_victory_desc:0 "Of course we did not assist the Variags for the sake of goodwill. Although the Temple of the All-Seeing's prestige was bolstered, we've lost both men and equipment for which the Variags must pay for."
HAR_ties_to_the_black_numenoreans:0 "Ties to the Black Numenoreans"
HAR_ties_to_the_black_numenoreans_desc:0 "WIP"
HAR_tighten_the_grip_in_royal_affairs:0 "Tighten the Grip in Royal Affairs"
HAR_tighten_the_grip_in_royal_affairs_desc:0 "The new Emperor of the Sun, Lord [ROOT.GetLeader], is a tricky figure to work with. Although he was initially palatable to the Temple of the All-Seeing, he quickly turned out to be a rather cunning figure. No matter, for all that needs to be done is to isolate him from his allies. He will come around when he has no other choice but to abide us."
HAR_to_the_north:0 "To the North"
HAR_to_the_north_desc:0 "WIP"
HAR_topple_the_idols_of_sauron:0 "Topple the Idols of Sauron"
HAR_topple_the_idols_of_sauron_desc:0 "There are countless shrines and statues erected by the Temple of the All-Seeing that are dedicated to the Dark Lord. Now that the tide has turned, we must destroy them to herald the beginning of a new era."
HAR_towards_a_new_world_order:0 "Towards a New World Order"
HAR_towards_a_new_world_order_desc:0 "WIP"
HAR_triumph_in_the_east:0 "Triumph in the East"
HAR_triumph_in_the_east_desc:0 "Variags were able to hold onto Khand through our assistance. From their victory, we too have gained both prestige and an upper hand to make use of when the time is right."
HAR_under_the_shadow_of_mordor:0 "Under the Shadow of Mordor"
HAR_under_the_shadow_of_mordor_desc:0 "WIP"
HAR_unite_with_khand:0 "Unite with Khand"
HAR_unite_with_khand_desc:0 "WIP"
HAR_unity_in_belief:0 "Unity in Belief"
HAR_unity_in_belief_desc:0 "WIP"
HAR_vanquish_the_great_evil:0 "Vanquish the Great Evil"
HAR_vanquish_the_great_evil_desc:0 "WIP"
HAR_venerate_cult_worship:0 "Venerate Cult Worship"
HAR_venerate_cult_worship_desc:0 "We must ensure that our people learn the truth and free themselves from the despicable lies that the Temple of the All-Seeing has used to cloud their minds. Only then will they finally be able to break free from their chains."
HAR_we_bow_before_no_one:0 "We Bow Before No One"
HAR_we_bow_before_no_one_desc:0 "WIP"
HAR_we_move_as_one:0 "We Move As One"
HAR_we_move_as_one_desc:0 "We will ensure that our soldiers have an overwhelming superiority in tactics of war and will accept nothing less than full victory. With our full confidence in their courage, devotion to duty and skill in battle, the Free Peoples of Middle-earth shall march together as one."
HAR_you_shall_not_pass:0 "You Shall Not Pass"
HAR_you_shall_not_pass_desc:0 "WIP"
HAR_crush_the_weak:0 "Crush the Weak"
HAR_crush_the_weak_desc:0 "Mûmakil are smart creatures and they can be taught. We will kill their fear so that they may crush those that dare stand between them and our goal."
HAR_fortify_the_howdahs:0 "Fortify the Howdahs"
HAR_fortify_the_howdahs_desc:0 "If there is one thing that may hinder our might, it is the current structure of our howdahs. They must be reinforced so that our riders are not taken out and our Mûmakil remain firmly under our control."
HAR_prime_breeding_grounds:0 "Prime Breeding Grounds"
HAR_prime_breeding_grounds_desc:0 "We will take the very best of our Mûmakil and have them breed so that the best of their traits pass on to create the next generation of Mûmak."
HAR_to_climb_ered_nimrais:0 "To Climb Ered Nimrais"
HAR_to_climb_ered_nimrais_desc:0 "[GON.GetNameDefCap]'s capital city may be on top of a mountain, but our Mûmakil are resilient. When the time comes, we will give them a sight that they will not believe with their own eyes."
HAR_the_way_of_the_desert:0 "The Way of the Desert"
HAR_the_way_of_the_desert_desc:0 "Although we have settled down and established a powerbase, we must never forget the way of the desert. To forget it is to forget our heritage; worse still, this would leave us vulnerable."
HAR_mark_the_watering_holes:0 "Mark the Watering Holes"
HAR_mark_the_watering_holes_desc:0 "A strong army must have its needs met. By marking where the water is plentiful, we will ensure that they are quenched and ready to fight."
HAR_sew_flowing_attire:0 "Sew Flowing Attire"
HAR_sew_flowing_attire_desc:0 "Our clothes must be sewn to fit for the life in the vast sea of the Dune. For otherwise would be inviting a disaster even before engaging a battle."
HAR_burrowing_like_a_snake:0 "Burrowing Like a Snake"
HAR_burrowing_like_a_snake_desc:0 "Our life in the desert gives us a home-field advantage that our enemies don't have. While they're exhausted and parched, searching for a single drop of water, we will be right there. Ready to be the snake that swallows them whole."
HAR_coat_in_snake_venom:0 "Coat in Snake Venom"
HAR_coat_in_snake_venom_desc:0 "Ideally, the arrows themselves would be enough to bring forth a swift deliverance. Though if it just so happens that they are not, the venom will do the rest."
HAR_chase_the_prey:0 "Chase the Prey"
HAR_chase_the_prey_desc:0 "When the volley of death is raining down upon our prey, they will seek a way out. We will not let them flee."
HAR_a_ferocious_hunt:0 "A Ferocious Hunt"
HAR_a_ferocious_hunt_desc:0 "Our Mûmakil are strong, but they are clumsy and slow. We must look to the East, where riding horses is a common sight. For their four legs will carry us to victory."
HAR_new_methods_of_engagement:0 "New Methods of Engagement"
HAR_new_methods_of_engagement_desc:0 "With enough training, arrows may fly just as truly while riding as while standing. We will perfect this craft and throw the enemy into disarray."
HAR_a_legacy_of_war:0 "A Legacy of War"
HAR_a_legacy_of_war_desc:0 "Before we established our dominance, these lands were rife with conflict. Amidst the endless feuds between tribes and wars waged over trivial matters, their perspective remained narrow. That is no longer the case; for as long as we exist, they have a new perspective. One shaped under our guidance."
HAR_beaten_and_defeated:0 "Beaten and Defeated"
HAR_beaten_and_defeated_desc:0 "WIP"
HAR_come_to_terms:0 "Come to Terms"
HAR_come_to_terms_desc:0 "WIP"
HAR_drop_the_claims:0 "Drop the Claims"
HAR_drop_the_claims_desc:0 "WIP"
HAR_dismantle_the_temple:0 "Dismantle the Temple"
HAR_dismantle_the_temple_desc:0 "WIP"
HAR_establish_a_northern_embassy:0 "Establish a Northern Embassy"
HAR_establish_a_northern_embassy_desc:0 "WIP"
HAR_towards_peace_in_our_time:0 "Towards Peace for Our Time"
HAR_towards_peace_in_our_time_desc:0 "WIP"
HAR_appropriate_the_leftovers:0 "Appropriate the Leftovers"
HAR_appropriate_the_leftovers_desc:0 "WIP"
HAR_an_alliance_under_the_shade:0 "An Alliance Under the Shade"
HAR_an_alliance_under_the_shade_desc:0 "WIP"
HAR_subdue_umbar:0 "Subdue [UMB.GetNameDEF]"
HAR_subdue_umbar_desc:0 "WIP"
HAR_end_variag_rule:0 "End Variag Rule"
HAR_end_variag_rule_desc:0 "WIP"
