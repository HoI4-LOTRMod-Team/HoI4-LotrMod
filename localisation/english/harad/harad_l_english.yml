HAR_tighten_the_grip_in_royal_affairs:0 "Tighten the Grip in Royal Affairs"
HAR_tighten_the_grip_in_royal_affairs_desc:0 "The current Emperor of the Sun, [ROOT.GetLeader], is a tricky figure to work with. Although he was initially more palatable to the Temple of the All-Seeing following his father's assassination, he quickly turned out to be a rather cunning figure. No matter, for all that needs to be done is to isolate him from his allies. He will come around when he has no other choice but to abide us."
