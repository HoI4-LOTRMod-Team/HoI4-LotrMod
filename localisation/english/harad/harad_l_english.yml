HAR_test_the_gondorian_guard_tt:0 "We will launch a §Ysurprise attack§! on the [135.GetName] Garrison hoping to overwhelm and §Yseize the territory§!. If successful, it will also result in [176.controller.GetNameDEF]'s §Ywithdrawal§! from [176.GetName]."
