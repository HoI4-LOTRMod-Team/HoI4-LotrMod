harad.1.t:0 "Our Allies Triumph in the East!"
harad.1.d:0 "After a bloody yet necessary war to entrench ourselves further, we now feast with the spoils of victory. The Variags have maintained their grip over Khand and our aid has given us a dominant position over their affairs as well as prestige in ours."
harad.1.a:0 "Soon all will bend to our will!"

harad.2.t:0 "A Shattering Defeat"
harad.2.d:0 "The Temple of the All-Seeing had staked everything on this unnecessary war, but this risky move drove them into complete bankruptcy. The people have finally realized that the Temple is not the absolute authority they had been led to believe it was, and if there is a crack..."
harad.2.a:0 "...it can be broken."
harad.2.b:0 "...it can be repaired."

harad.3.t:0 "[FROM.GetNameDEFCap] Proposes Mutual Collaboration"
harad.3.d:0 "An envoy arrived from the southern lands, bearing gifts. His master wishes to establish diplomatic relations and sign an extremely favorable trade agreement as a gesture of goodwill."
harad.3.a:0 "Let us strengthen our bonds."
harad.3.b:0 "We trust none bearing the mark of a snake!"

harad.4.t:0 "[FROM.GetNameDEFCap] Accepts Mutual Collaboration"
harad.4.d:0 "The agreement was successfully concluded. Our envoy was greeted with great enthusiasm and, after conveying our message regarding the establishment of diplomatic and commercial relations, hosted a banquet. Together, we are stronger."
harad.4.a:0 "Excellent."

harad.5.t:0 "[FROM.GetNameDEFCap] Declines Mutual Collaboration"
harad.5.d:0 "The negotiations ended in failure. Shortly after our envoy conveyed our message regarding the establishment of diplomatic and commercial relations, he was immediately expelled and was forced to return empty-handed."
harad.5.a:0 "So be it."

harad.6.t:0 "The Fire Rises"
harad.6.d:0 "In what seems to be a coordinated incident based on the previous manouvers of the Royal Palace, many buildings thought to house those affiliated with the Temple of the All-Seeing have been set ablaze. The Royal Guard has been deployed to persecute and "deal with" the fleeing templars under the guise of treason and conspiracy against Lord [ROOT.GetLeader]."
harad.6.a:0 "One by one, this disease will be rid of."
harad.6.b:0 "This isn't over."

harad.7.t:0 "Dark Clouds Gather in the North"
harad.7.d:0 "Our scouts in the north have spotted a heavily armed orc convoy surrounding a dark figure advancing toward our position. According to their report, this dark figure is the infamous..."
harad.7.a:0 "A village in sight needs no guide. Dark times are upon us."
harad.7.b:0 "...Mouth of Sauron."
harad.7.c:0 "...Ninth of the Nazgûl."

harad.8.t:0 "The Emperor Lies Dead"
harad.8.d:0 "While [HAR.GetNameDEF] is no less familiar with the constant stream of conspiracies from all across the territories it administers, it appears this familiarity was not enough to save the hide of the current Emperor of the Sun. Despite his relatively pragmatic rulership over the Realm, he was found stabbed 28 times in his bedchambers, ironically meeting the same end as his predecessor."
harad.8.a:0 "Chalk it up for another one..."

harad.9.t:0 "End of the Temple"
harad.9.d:0 "With the last of its major holdouts eliminated, the Temple of the All-Seeing has entirely collapsed. What remains now regarding its members are those that are on the run, blending with the common populace until we gather more leads to root them out for good. Although, for Lord [ROOT.GetLeader], this is still no time to celebrate as the Temple left behind a gaping power vacuum that may soon be taken over by an another faction if it's not filled immediately."
harad.9.a:0 "And so another chapter is closed."

harad.10.t:0 "[FROM.GetNameDEFCap] Requests Tribute"
harad.10.d:0 "An envoy arrived from [FROM.GetNameDEF] and demanded that we pay them tribute in exchange for the support they provided during our civil war. The demands aren't too high, but these resources could be put to better use in our reconstruction efforts, couldn't they?"
harad.10.a:0 "Fair enough."
harad.10.b:0 "Tribute? What tribute?"

harad.11.t:0 "[FROM.GetNameDEFCap] Demands Further Tribute"
harad.11.d:0 "Shortly after the first one arrived, another envoy arrived. [FROM.GetNameDEFCap] is demanding that we pay a larger amount of gold under the guise of "protection" against potential future uprisings and other types of threats. Although this is clearly a shakedown, [FROM.GetNameDEF] is definitely not the kind to double-cross."
harad.11.a:0 "Feed the crow and it will peck out your eye..."
harad.11.b:0 "Enough!"

harad.12.t:0 "[FROM.GetAdjective] Interference in our Politics"
harad.12.d:0 "And yet another envoy... We gave them the gold [FROM.GetNameDEF] demanded, but are they now trying to meddle in our way of life? How much longer will we keep polishing [FROM.GetAdjective] boots? We may be weaker than them, but our men have the resolve to stand up to this extortion. All it takes is a single "no.""
harad.12.a:0 "We cannot risk war."
harad.12.b:0 "This cannot stand!"

harad.13.t:0 "[FROM.GetNameDEFCap] Refuses our Demands!"
harad.13.d:0 "Those deceitful cowards have rejected our extremely simple demand: to pay for the services provided. Therefore, we have two options. Either we seize their territory from them to remind them of who we are, or we crush them completely."
harad.13.a:0 "If they won't pay in gold, they'll pay in land."
harad.13.b:0 "War!"
harad.13.c:0 "This is pointless."

harad.14.t:0 "[FROM.GetNameDEFCap] seizes [115.GetName]"
harad.14.d:0 "According to reports from our scouts, soldiers carrying [FROM.GetAdjective] banners have entered the [115.GetName] region. Ideally, this could just be a mistake, but given our recent resistance to their demands, it’s quite possible that this move was intentional. It seems we have no choice but to yield to their demands... or perhaps we do."
harad.14.a:0 "We shan't be pushed around any longer!"
harad.14.b:0 "Fine..."

harad.15.t:0 "Fate of Harad"
harad.15.d:0 "Conflict is boiling all across Middle-earth and [ROOT.GetNameDEF] now stands at the crossroads of destiny. Although [ROOT.GetNameDEF] has its own internal problems at hand, which were largely solved through our steady hand but are yet to be rid of, we cannot let this opportunity pass us by."
harad.15.a:0 "The whole structure is rotten. The time has come to rid ourselves of it!"
harad.15.b:0 "A new day is dawning. And [ROOT.GetLeader] shall be its herald."
harad.15.c:0 "Direct rule from Mordor!"
harad.15.e:0 "We shall stand on the right side of history."

harad.16.t:0 "The Envoy of Sauron"
harad.16.d:0 "During our feast, a figure clad in robes darker than night arrived, yet his words were a stark contrast. Plain as day, he offered us a place alongside Lord [MOR.GetLeader] so that we too partake in the new world he would soon unleash."
harad.16.a:0 "We shall stand alongside the strong."

harad.17.t:0 "[FROM.GetNameDEFCap] Requests the Return of [115.GetName]"
harad.17.d:0 "It seems that our capture of [115.GetName] must have brought [FROM.GetNameDEFCap] to its senses for they are now willing to pay the tribute we demanded in exchange for the return of their lands."
harad.17.a:0 "They've learnt their lesson."
harad.17.b:0 "A bit late for that, is it not?"

harad.18.t:0 "[FROM.GetNameDEFCap] Demands A Corridor to [GON.GetNameDEF]"
harad.18.d:0 "Although we maintain our neutrality in matters beyond our borders, the envoys from [FROM.GetNameDEF] have made a firm demand. They demand control over [107.GetName] to make use of in their future struggles against [GON.GetNameDEF], and in return, they will not interfere with us.\n\nHowever, if we refuse, war will be inevitable."
harad.18.a:0 "We've bled enough."
harad.18.b:0 "To arms!"

harad.19.t:0 "[FROM.GetNameDEFCap] Offers [176.GetName] for Our Allegiance"
harad.19.d:0 "Once again, envoys have arrived from [FROM.GetNameDEF]. This time, however, they have presented us with an interesting offer. In exchange for a promise that [176.GetName] from [176.controller.GetName] will be handed over at the end of the war, they are asking for our allegiance and, consequently, our neutrality."
harad.19.a:0 "We have lost some and now we will gain some."
harad.19.b:0 "We'd rather stay out of harm's way."

harad.20.t:0 "[FROM.GetNameDEFCap] demands our annexation!"
harad.20.d:0 "As expected from the recent rise of a pretender in [FROM.GetNameDEF], special envoys belonging to the [FROM.GetAdjective] branch of the Temple of the All-Seeing have arrived today with the most grave demand. Their demand is that we give up our sovereignty to [FROM.GetNameDEF] so that we "adhere to the vision of the All-Seeing and collaborate in the the great struggle ahead.""
harad.20.a:0 "We have no choice."
harad.20.b:0 "We will not go down without a fight!"

harad.21.t:0 "Collapse of Order"
harad.21.d:0 "Following the defeat of Lord [MOR.GetLeader], our war efforts have collapsed both on the battlefield and within the realm. The earth has split open and swallowed the buildings of the Temple of the All-Seeing along with their idols and chaos now reigns in the streets.\n\n[GON.GetNameDEFCap] has forwarded the terms of surrender to us. In exchange for an end to hostilities, we must cede the lands of Harondor and Umbar to them. Given our current situation, and since revolution is inevitable, we have little choice in the matter."
harad.21.a:0 "We will start anew."
harad.21.b:0 "This is merely a setback! We will return!"

harad.22.t:0 "[HAR.GetNameDEFCap] Seizes [135.GetName]"
harad.22.d:0 "Following a surprise attack on the [135.GetName] garrison, [HAR.GetNameDEF] forces successfully drove [135.controller.GetNameDEF] troops out of the area."
harad.22.a:0 "We have shown our strength."
harad.22.b:0 "Damn them!"

harad.23.t:0 "[135.GetName] Garrison Holds On"
harad.23.d:0 "Despite a surprise attack by [HAR.GetNameDEF] forces, the [135.GetName] Garrison of [135.controller.GetNameDEF], managed to drive them out of the region once again.\n\nThis region had previously been a battlefield between the two forces in what was known as the “Battle of Poros,” and it appears that history has repeated itself once again."
harad.23.a:0 "Third time will be the charm..."
harad.23.b:0 "Get those men a raise!"

harad.24.t:0 "[FROM.GetNameDEFCap] Calls for Aid!"
harad.24.d:0 "A cult in Harad bearing the name "Order of the Azure" has launched a rebellion against the current regime. The members of this order, who are clad in blue robes, are much more open to cooperating with us against the forces of evil; therefore, it is our duty to help them achieve victory."
harad.24.a:0 "We will dispatch our finest."
harad.24.b:0 "Prepare the carts. We're sending them equipment."
harad.24.c:0 "Not our problem."

harad.25.t:0 "[FROM.GetNameDEFCap] is Preparing to Send Forces"
harad.25.d:0 "Our call for aid was answered and [FROM.GetNameDEF] has begun the preparations to send us their own soldiers to support our cause."
harad.25.a:0 "We shall welcome them to our ranks."

harad.26.t:0 "[FROM.GetNameDEFCap] has Sent Equipment"
harad.26.d:0 "Our call for aid was answered and [FROM.GetNameDEF] has sent a sizaeble amount of equipment. Both swords and spears alike."
harad.26.a:0 "We shall arm our troops immediately."

harad.27.t:0 "[FROM.GetNameDEFCap] has Refused to Support Us"
harad.27.d:0 "Despite our call for aid, it appears that [FROM.GetNameDEF] has decided to turn a blind eye to the current events."
harad.27.a:0 "We shall hold on without them."

harad.28.t:0 "Cross-Anduin Diplomacy"
harad.28.d:0 "Our beliefs and goals align with [FROM.GetNameDEF] in many respects; this is to be expected, given their positions within our alliance. However, at their request, we have figured we could foster more productive collaboration in the field of research by exchanging our most distinguished scholars to learn from one another."
harad.28.a:0 "A wonderful idea."
harad.28.b:0 "Research and development are expensive matters."

harad.29.t:0 "[FROM.GetNameDEFCap] Accepts Our Request"
harad.29.d:0 "[FROM.GetNameDEFCap] has accepted our request for a scholarly exchange. All that remains is to ensure that our scholars are properly prepared and to send them on their way; in the meantime, we will make preparations to host [FROM.GetNameDEF]'s scholars."
harad.29.a:0 "Wonderful."

harad.30.t:0 "[FROM.GetNameDEFCap] Turned Down Our Request"
harad.30.d:0 "Although we have offered to exchange our knowledge with that of [FROM.GetNameDEF], it appears that this will not come to be as they have refused to send their scholars for us to learn from them."
harad.30.a:0 "Do they deem us inferior?"

harad.31.t:0 "[FROM.GetNameDEFCap] Offers to Carve [HDR.GetNameDEF]"
harad.31.d:0 "[HDR.GetNameDEFCap] emerged from the power vacuum that followed the Battle of Poros and served as an important buffer zone to ease tensions. Now that an alliance has been formed with [FROM.GetNameDEF], they have stated that the existence of this region is meaningless and that we should divide it among ourselves."
harad.31.a:0 "A good idea."
harad.31.b:0 "We don't know if this alliance will last."

harad.32.t:0 "[FROM.GetNameDEFCap] Demands the End of Our Neutrality!"
harad.32.d:0 "Unfortunately, as expected, the alliance formed between [FROM.GetNameDEF] and [GON.GetNameDEF] has led them to take a stand against us. They are demanding us to abandon our neutrality and join their alliance, or else we will be destroyed."
harad.32.a:0 "We have no choice."
harad.32.b:0 "We will not give into their mobbing!"

harad.33.t:0 "[FROM.GetNameDEFCap] Offers Unification"
harad.33.d:0 "With the change of government in [FROM.GetNameDEF], their thought has become far more aligned with that of ours. They are aware of this as well; that is why envoys from [FROM.GetNameDEF] have just arrived here to propose an alliance aimed at forming a united front against the forces of [MOR.GetLeader]."
harad.33.a:0 "We stand or fall together."
harad.33.b:0 "This is merely a plot to strip us of our identity!"

harad.34.t:0 "[FROM.GetNameDEFCap] Accepts Unification"
harad.34.d:0 "Great news from our envoys as [FROM.GetNameDEF] has accepted our offer of unification. Through their might and ours, [MOR.GetNameDEF] stands no chance against the Free Peoples of the South!"
harad.34.a:0 "Together, we are stronger!"

harad.35.t:0 "[FROM.GetNameDEFCap] Refuses Unification"
harad.35.d:0 "Despite all our envoys' efforts, it appears that [FROM.GetNameDEF] is not willing to join us. All we can do now is hope that they won't be deceived by [MOR.GetLeader] and turn against us."
harad.35.a:0 "A terrible shame."

harad.36.t:0 "[FROM.GetNameDEFCap] Offers a Trade Agreement"
harad.36.d:0 "Envoys from [FROM.GetNameDEF] have made a peculiar request. Although our relations are not particularly good, they are asking us to sign a mutual trade agreement under which we would grant each other preferential treatment, in the hope that these relations will improve in the future."
harad.36.a:0 "These terms are acceptable."
harad.36.b:0 "We will not feed the snake!"

harad.37.t:0 "[FROM.GetNameDEFCap] Accepts Trade Agreement"
harad.37.d:0 "In what appears to be a rather surprising turn of events, [FROM.GetNameDEF] has apparently decided to put the past behind them and sign the trade agreement."
harad.37.a:0 "We will both benefit greatly."

harad.38.t:0 "[FROM.GetNameDEFCap] Refuses Trade Agreement"
harad.38.d:0 "Despite all the efforts of our envoys, it appears that [FROM.GetNameDEF] is not willing to sign the trade agreement. The lingering effects of the past continue to cast a shadow over our relations."
harad.38.a:0 "So be it."

harad.39.t:0 "[FROM.GetNameDEFCap] Offers Conditional Alliance"
harad.39.d:0 "Envoys from [FROM.GetNameDEF] arrived with a bold proposal. They state that [FROM.GetNameDEF] will help us conquer Middle-earth, but for a price."
harad.39.a:0 "This is nothing."
harad.39.b:0 "We do not need their help."

harad.40.t:0 "[FROM.GetNameDEFCap] Accepts Our Offer of Conditional Alliance"
harad.40.d:0 "Although they were a bit dazed from this encounter, our envoys returned with success and gold. [FROM.GetNameDEFCap] will pay us in return for the services we provided during the conquest."
harad.40.a:0 "To arms, men!"

harad.41.t:0 "[FROM.GetNameDEFCap] Rejects Our Offer of Conditional Alliance"
harad.41.d:0 "It was clear from the start that this was a daring move, and that prediction proved correct. A group of orcs advanced all the way to the main gate of the capital and tossed the severed heads of our envoys onto our doorstep."
harad.41.a:0 "We best not anger them further."

harad.42.t:0 "[FROM.GetNameDEFCap] Demands [185.GetName]!"
harad.42.d:0 "These scrawny but insolent men decided that they should receive [185.GetName] as part of their pay. Doesn't Lord [MOR.GetLeader] agree that this is a ridiculous proposal?"
harad.42.a:0 "Their benefits outweigh the costs."
harad.42.b:0 "Who do they think they are?"

harad.43.t:0 "[FROM.GetNameDEFCap] Withdraws From [185.GetName]!"
harad.43.d:0 "After we demanded [185.GetName] in exchange for our services, it appears that [FROM.GetNameDEF] forces withdrew from the region and handed control over to us."
harad.43.a:0 "Huh, that worked?"

harad.44.t:0 "[FROM.GetNameDEFCap] Refused Our Demand"
harad.44.d:0 "Despite our request for compensation in exchange for the services we provide in the war for the conquest of Middle-earth, [FROM.GetNameDEF] ignored our request. Perhaps it would be wiser to collaborate with the opposing side?"
harad.44.a:0 "We will not forget this."

harad.45.t:0 "Matter of Payment"
harad.45.d:0 "The cost of the war has risen to a level where we must demand more compensation from [MOR.GetNameDEF].\n\nWe have two options before us. Either we demand territorial expansion from [11.GetName] to secure the resources needed to fuel the war machine, or we demand only an increase in the payment amount, which is far more likely to be accepted than the first."
harad.45.a:0 "We must push for greater borders."
harad.45.b:0 "Higher payment is enough."

harad.46.t:0 "[FROM.GetNameDEFCap] Demands [11.GetName]!"
harad.46.d:0 "The Men of the South are demanding territory from us once again, and this time it's [11.GetName]. This region is a crucial asset for our war machine, and it seems they're well aware of that. We believe their supplies are running low and that they're looking for the infrastructure needed to produce them."
harad.46.a:0 "They could've just asked for weapons but... this works too."
harad.46.b:0 "We have entertained their nonsense far enough."

harad.47.t:0 "[FROM.GetNameDEFCap] Withdraws From [185.GetName]!"
harad.47.d:0 "After we demanded [11.GetName] in exchange for our services, it appears that [FROM.GetNameDEF] forces withdrew from the region and handed control over to us."
harad.47.a:0 "Wait, really?"

harad.48.t:0 "[FROM.GetNameDEFCap] Demands Increased Payment"
harad.48.d:0 "Using the rapidly rising costs of the war as an argument, [FROM.GetNameDEF] demanded that we increase our payments to help keep the war machine running."
harad.48.a:0 "If all it takes is some coin to grease the gears..."
harad.48.b:0 "No."

harad.49.t:0 "[FROM.GetNameDEFCap] Agrees for Increased Payment"
harad.49.d:0 "Lord [MOR.GetLeader], in his infinite wisdom, has given us a raise so that we can use it to support our war efforts."
harad.49.a:0 "Praise be!"

harad.50.t:0 "[FROM.GetNameDEFCap] Requests Mutual Collaboration"
harad.50.d:0 "Although we have fought countless wars in the past, we all suffered defeat in the same way in the last war. [FROM.GetNameDEFCap] experienced internal strife, and we, too, had our own problems.\n\nPointing out the similarities in our situations, the envoys of [FROM.GetNameDEF] requested our support should they form a faction to resist the might of the Dúnedain."
harad.50.a:0 "Enemy of my enemy is my friend."
harad.50.b:0 "They certainly have plans against us."

harad.51.t:0 "[FROM.GetNameDEFCap] Accepts Mutual Collaboration"
harad.51.d:0 "[FROM.GetNameDEFCap] has accepted our request. Should we form a united front against the Dúnedain and take the war to their lands, they will come to our aid."
harad.51.a:0 "Together, we will avenge the fallen."

harad.52.t:0 "[FROM.GetNameDEFCap] Refuses Mutual Collaboration"
harad.52.d:0 "[FROM.GetNameDEFCap] has rejected our request. They are clearly planning something, and it would be in our best interest to proceed with caution."
harad.52.a:0 "If they are not with us, they are against us."
