HAR_southern_united_front:0 "Southern United Front"
HAR_southern_united_front_desc:0 "WIP"
HAR_support_umbari_claims:0 "Support [UMB.GetAdjective] Claims"
HAR_support_umbari_claims_desc:0 "WIP"
HAR_northern_expedition:0 "Northern Expedition"
HAR_northern_expedition_desc:0 "WIP"
HAR_come_to_rhuns_aid:0 "Come to [RHU.GetNameDEF]'s Aid"
HAR_come_to_rhuns_aid_desc:0 "WIP"
HAR_absorb_umbar:0 "Absorb [UMB.GetNameDEF]"
HAR_absorb_umbar_desc:0 "The Place of [UMB.GetNameDEF] is right here with us. Together, we will make up for the mistakes of the past and look towards the future."
