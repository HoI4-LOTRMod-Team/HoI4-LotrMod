HAR_interfere_in_khandian_politics:0 "Interfere in Khandian Politics"
HAR_interfere_in_khandian_politics_desc:0 "What is Khand but a rogue and volatile region in the South? The tribes under our control are most certainly content with our absolute rule and the stability and order it brings. Certainly the people of Khand would prefer that over the chaos?"
HAR_interrogate_dissidents:0 "Interrogate Dissidents"
HAR_interrogate_dissidents_desc:0 "Long ago, two Wizards clad in azure robes, Morinehtar and Rómestámo, came to Harad to incite a rebellion and hinder Sauron. Although those times are past, there are still those biding their time in the fringes whose beliefs threaten the foundation of the Temple of the All-Seeing. They must be found and taken care of."
