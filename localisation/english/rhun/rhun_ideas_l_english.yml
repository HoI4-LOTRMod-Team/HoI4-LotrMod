### New Expanded stuff:
RHU_shadow_of_mordor:0 "Shadow of Mordor"
RHU_shadow_of_mordor_desc:0 "Mordor is imposing their will on us, and we are powerless to stop it."
RHUN_khamul_expanded:0 "Khamûl"
RHUN_khamul_expanded_desc:0 "The Ringwraith Khamûl is influencing the politics of Rhûn, and his presence is felt in every decision made by the ruling class."
RHUN_nation_driven_by_fear_expanded:0 "Nation Driven by Fear"
RHUN_nation_driven_by_fear_expanded_desc:0 "Rhûn's leadership is concerned less with the well-being of its people, and more with the potential reprisals from Mordor if they do not comply with their demands."

RHUN_rhun_doctrine_expanded:0 "Rhûn Doctrine"
RHUN_rhun_doctrine_expanded_desc:0 "The art of war, as conceived in the lands of the East, is a doctrine that emphasizes mobility, surprise, and overwhelming force, while also incorporating unique elements, apt for war across vast steppes and desert dunes."
RHUN_mordor_doctrine_expanded:0 "Mordor Doctrine"
RHUN_mordor_doctrine_expanded_desc:0 "The military strategy of Mordor is rooted in fear, domination, and relentless aggression, seeking to crush all opposition through sheer force and intimidation."


RHUN_empire_of_rhun:0 "Empire of Rhûn"
RHUN_empire_of_rhun_desc:0 "From the vast, sun-baked plains to the shadowy mountains, Rhûn's conquests have laid the foundation for a new, glorious age. No longer mere rulers of a land, but architects of an Empire, destined to reshape the East."