l_english:
 rhunexpanded.7.a:0 "Worrying."
 rhunexpanded.7.t:0 "One Ring Destroyed!"
 rhunexpanded.7.d:0 "With the ring destroyed, our armies are routing, men are fleeing, strength has faded. Generals suggest it is critical to fall back and set up a defensive line or find a diplomatic means to end to the war before we are finished..."
 rhunexpanded.8.t:0 "Free Rhûn supporters start a civil war!"
 rhunexpanded.8.d:0 "Internal conflict in Rhûn has once more reignited, with the Free Rhûnian supporters seeking an independent state!"
 rhunexpanded.8.a:0 "So be it."
 rhunexpanded.9.t:0 "Rhûn Demands [208.GetName]"
 rhunexpanded.9.d:0 "Tensions with Rhûn have escalated, and their delegates now demand immediate control over [208.GetName], claiming that it poses a potential threat to their security if it remains under our rule. Refusal to these terms will likely ignite the flames of war."
 rhunexpanded.9.a:0 "We are unprepared! Concede."
 rhunexpanded.9.b:0 "We will not be strong-armed into concessions!"
 rhunexpanded.10.t:0 "Dorwinion Yields"
 rhunexpanded.10.d:0 "The nation of Dorwinion has succumbed to pressure and reluctantly granted [208.GetName] to us."
 rhunexpanded.10.a:0 "The rest, in due time."
 rhunexpanded.11.t:0 "Dorwinion Stands Firm"
 rhunexpanded.11.d:0 "The proud folk of Dorwinion have declared they shall negotiate no concessions with Mistrand."
 rhunexpanded.11.a:0 "Pride born of ignorance."
 rhunexpanded.12.t:0 "Rhûn Offers to Establish Vineyards in Szrel-Kain"
 rhunexpanded.12.d:0 "The Easterlings of Rhûn have presented us with a proposal that promises mutual benefit – the enhancement of our wine production through the construction of new vineyards."
 rhunexpanded.12.a:0 "This will strengthen our wine economy."
 rhunexpanded.12.b:0 "These Easterlings may have ulterior motives."
 rhunexpanded.13.t:0 "Dorwinion Embraces Our Proposal"
 rhunexpanded.13.d:0 "The citizens of Dorwinion have greeted our initiative for mutual cooperation positively and are eager to proceed with the vineyard project."
 rhunexpanded.13.a:0 "A promising development."
 rhunexpanded.14.t:0 "Dorwinion Declines Our Proposal"
 rhunexpanded.14.d:0 "Distrust among the people of Dorwinion persists, leaving them unwilling to permit us entrance upon their land."
 rhunexpanded.14.a:0 "An unfortunate setback."
 rhunexpanded.15.t:0 "Rhûn Demands Submission"
 rhunexpanded.15.d:0 "The eastern realm of Rhûn marches ever closer to our borders. Their emissaries bring terms, albeit far from gracious ones.\n\nRhûn perceives us as a backward and fragile kingdom, expecting little resistance. Should we refuse to become their vassals, their armies will surely darken our fields and forests."
 rhunexpanded.15.a:0 "Enough blood has been shed. Peace it is."
 rhunexpanded.15.b:0 "We won't stand down before these Easterling savages."
 rhunexpanded.16.t:0 "Rhovanion Succumbs"
 rhunexpanded.16.d:0 "The kingdom of Rhovanion has accepted the grim reality of their position and conceded to the overlordship of Rhûn."
 rhunexpanded.16.a:0 "A great success."
 rhunexpanded.17.t:0 "Rhovanion Resists"
 rhunexpanded.17.d:0 "Despite the dire odds stacked against them, the kingdom of Rhovanion has refused our terms. They seem prepared to test their mettle on the battlefield."
 rhunexpanded.17.a:0 "Commence their final lesson."
 rhunexpanded.18.t:0 "Rhûn demands West Chelkar"
 rhunexpanded.18.d:0 "Rhûn demands Khand be given their native land of West Chelkar, in our eastern territory."
 rhunexpanded.18.a:0 "Let them have it."
 rhunexpanded.18.b:0 "It is rightfully ours."
 rhunexpanded.19.t:0 "Harad gives up West Chelkar"
 rhunexpanded.19.d:0 "The Haradrian leadership has announced they will cede the historic lands of West Chelkar back to the Khand."
 rhunexpanded.19.a:0 "As they should."
 rhunexpanded.20.t:0 "Harad refuses"
 rhunexpanded.20.d:0 "The Haradrian leadership has announced they will not cede the historic lands of West Chelkar back to the Khand."
 rhunexpanded.20.a:0 "There is nothing we can do."
 rhunexpanded.21.t:0 "Border raid victory"
 rhunexpanded.21.d:0 "We have succesfully driven the Haradrian out of Khand and can now liberate the bordering Khandian territories."
 rhunexpanded.21.a:0 "For Khand!"
 rhunexpanded.22.t:0 "Border raid concludes"
 rhunexpanded.22.d:0 "It seems the border raid has yielded no gains."
 rhunexpanded.22.a:0 "We will be back."
 rhunexpanded.23.t:0 "Khandians raid succesful"
 rhunexpanded.23.d:0 "The Khandians have reclaimed some of their eastern territories from us in recent raids launched from the Khandian state."
 rhunexpanded.23.a:0 "Worrying."
 rhunexpanded.24.t:0 "Khandian raid unsuccesful"
 rhunexpanded.24.d:0 "Khandian rabble tried raiding into our eastern territories but they were fended off and retreated back to Khand."
 rhunexpanded.24.a:0 "They will be back."
 rhunexpanded.25.t:0 "Mordor calls us to war!"
 rhunexpanded.25.d:0 "Lord Sauron demand we begin our conquest of the North-Eastern Territories such as the Logath and the cowardly Dalish and Dwarven Kingdom of Erebor."
 rhunexpanded.25.a:0 "And we shall."
 rhunexpanded.100.t:0 "Rhûn Advocates for Variag Autonomy"

 rhunexpanded.100.desc:0 "Rhûn, having recently engaged in significant diplomatic endeavors with the Variags far to the east of our lands, now approaches us as their spokesperson.\n\nRhûn petitions that the territories of Khand be granted increased autonomy, reducing direct governance from our Haradrim palace."

 rhunexpanded.100.a:0 "Accede to their plea."

 rhunexpanded.101.t:0 "Harad Assents"

 rhunexpanded.101.desc:0 "The rulers of Harad have acceded to our plea, and thus the Variags of Khand shall henceforth enjoy greater autonomy. This shall enhance our sway over them."

 rhunexpanded.101.a:0 "Excellent news."

 rhunexpanded.102.t:0 "Harad Refuses"

 rhunexpanded.102.desc:0 "Our petition for a more autonomous Khand has been denied by the Haradian authorities. In response, they will endeavor to tighten their grasp on the Variags."

 rhunexpanded.102.a:0 "Regrettable."

 rhunexpanded.100.b:0 "They should not interfere in our matters!"

 rhunexpanded.103.t:0 "Proposal of a Neutral Buffer Zone by Rhûn"

 rhunexpanded.103.desc:0 "In light of potential frictions along our eastern borders, Rhûn has put forth a proposal to establish an independent and neutral Khand between our nations. This would require both parties to contribute land for the creation of this buffer."

 rhunexpanded.103.a:0 "This is a wise proposition."

 rhunexpanded.104.t:0 "Harad Agrees to the Proposal"

 rhunexpanded.104.desc:0 "The realm of Harad has consented to our proposal. Together, we shall establish an independent Khand as a neutral buffer between our lands."

 rhunexpanded.104.a:0 "This is excellent news."

 rhunexpanded.105.t:0 "Harad Declines the Proposal"

 rhunexpanded.105.desc:0 "The realm of Harad has rejected our proposal to create a neutral Khand as a buffer state."

 rhunexpanded.105.a:0 "A regrettable decision."

 rhunexpanded.103.b:0 "They seek only to expand their own influence under the guise of peace!"

 rhunexpanded.106.t:0 "Rhûn Seeks Resource Entitlements"

 rhunexpanded.106.desc:0 "The mighty realm of Rhûn, instrumental in securing our recent autonomy, now seeks rights to harvest the abundant resources within our lands. Their contribution to our newfound freedom is undeniable, but granting such privileges may strain our dominion."

 rhunexpanded.106.a:0 "Grant the resource rights to Rhûn."

 rhunexpanded.106.b:0 "Deny their request."

 rhunexpanded.107.t:0 "The Blue Wizards Propose a Joint Effort"

 rhunexpanded.107.desc:0 "The Blue Wizards, Alator and Pallando, have been at the forefront of disloging the belligerent, tyrannical regime in Rhûn. \n\nRestinace movements in Rhûn have undertaken great preparations, and stand poised to strike. The wizards hope to see our help when the time right. Toppling the Mistrand regime in Rhûn would likewise remove a major threat to ourselves."

 rhunexpanded.107.a:0 "We will decide when the time comes."
