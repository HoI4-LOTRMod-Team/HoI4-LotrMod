l_english:
 rhun.11.a:0 "Worrying."
 rhun.11.t:0 "One Ring Destroyed!"
 rhun.11.d:0 "With the ring destroyed, our armies are routing, men are fleeing, strength has faded. Generals suggest it is critical to fall back and set up a defensive line or find a diplomatic means to end to the war before we are finished..."
 rhun.12.t:0 "Free Rhûn supporters start a civil war!"
 rhun.12.d:0 "Internal conflict in Rhûn has once more reignited, with the Free Rhûnian supporters seeking an independent state!"
 rhun.12.a:0 "So be it."
 rhun.13.t:0 "Rhûn Demands [208.GetName]"
 rhun.13.d:0 "Tensions with Rhûn have escalated, and their delegates now demand immediate control over [208.GetName], claiming that it poses a potential threat to their security if it remains under our rule. Refusal to these terms will likely ignite the flames of war."
 rhun.13.a:0 "We are unprepared! Concede."
 rhun.13.b:0 "We will not be strong-armed into concessions!"
 rhun.14.t:0 "Dorwinion Yields"
 rhun.14.d:0 "The nation of Dorwinion has succumbed to pressure and reluctantly granted [208.GetName] to us."
 rhun.14.a:0 "The rest, in due time."
 rhun.15.t:0 "Dorwinion Stands Firm"
 rhun.15.d:0 "The proud folk of Dorwinion have declared they shall negotiate no concessions with Mistrand."
 rhun.15.a:0 "Pride born of ignorance."
 rhun.16.t:0 "Rhûn Offers to Establish Vineyards in Szrel-Kain"
 rhun.16.d:0 "The Easterlings of Rhûn have presented us with a proposal that promises mutual benefit – the enhancement of our wine production through the construction of new vineyards."
 rhun.16.a:0 "This will strengthen our wine economy."
 rhun.16.b:0 "These Easterlings may have ulterior motives."
 rhun.17.t:0 "Dorwinion Embraces Our Proposal"
 rhun.17.d:0 "The citizens of Dorwinion have greeted our initiative for mutual cooperation positively and are eager to proceed with the vineyard project."
 rhun.17.a:0 "A promising development."
 rhun.18.t:0 "Dorwinion Declines Our Proposal"
 rhun.18.d:0 "Distrust among the people of Dorwinion persists, leaving them unwilling to permit us entrance upon their land."
 rhun.18.a:0 "An unfortunate setback."
 rhun.19.t:0 "Rhûn Demands Submission"
 rhun.19.d:0 "The eastern realm of Rhûn marches ever closer to our borders. Their emissaries bring terms, albeit far from gracious ones.\n\nRhûn perceives us as a backward and fragile kingdom, expecting little resistance. Should we refuse to become their vassals, their armies will surely darken our fields and forests."
 rhun.19.a:0 "Enough blood has been shed. Peace it is."
 rhun.19.b:0 "We won't stand down before these Easterling savages."
 rhun.20.t:0 "Rhovanion Succumbs"
 rhun.20.d:0 "The kingdom of Rhovanion has accepted the grim reality of their position and conceded to the overlordship of Rhûn."
 rhun.20.a:0 "A great success."
 rhun.21.t:0 "Rhovanion Resists"
 rhun.21.d:0 "Despite the dire odds stacked against them, the kingdom of Rhovanion has refused our terms. They seem prepared to test their mettle on the battlefield."
 rhun.21.a:0 "Commence their final lesson."
 rhun.22.t:0 "Rhûn demands West Chelkar"
 rhun.22.d:0 "Rhûn demands Khand be given their native land of West Chelkar, in our eastern territory."
 rhun.22.a:0 "Let them have it."
 rhun.22.b:0 "It is rightfully ours."
 rhun.23.t:0 "Harad gives up West Chelkar"
 rhun.23.d:0 "The Haradrian leadership has announced they will cede the historic lands of West Chelkar back to the Khand."
 rhun.23.a:0 "As they should."
 rhun.24.t:0 "Harad refuses"
 rhun.24.d:0 "The Haradrian leadership has announced they will not cede the historic lands of West Chelkar back to the Khand."
 rhun.24.a:0 "There is nothing we can do."
 rhun.25.t:0 "Border raid victory"
 rhun.25.d:0 "We have succesfully driven the Haradrian out of Khand and can now liberate the bordering Khandian territories."
 rhun.25.a:0 "For Khand!"
 rhun.26.t:0 "Border raid concludes"
 rhun.26.d:0 "It seems the border raid has yielded no gains."
 rhun.26.a:0 "We will be back."
 rhun.27.t:0 "Khandians raid succesful"
 rhun.27.d:0 "The Khandians have reclaimed some of their eastern territories from us in recent raids launched from the Khandian state."
 rhun.27.a:0 "Worrying."
 rhun.28.t:0 "Khandian raid unsuccesful"
 rhun.28.d:0 "Khandian rabble tried raiding into our eastern territories but they were fended off and retreated back to Khand."
 rhun.28.a:0 "They will be back."
 rhun.29.t:0 "Mordor calls us to war!"
 rhun.29.d:0 "Lord Sauron demand we begin our conquest of the North-Eastern Territories such as the Logath and the cowardly Dalish and Dwarven Kingdom of Erebor."
 rhun.29.a:0 "And so we shall."
 rhun.100.t:0 "Rhûn Advocates for Variag Autonomy"

 rhun.100.desc:0 "Rhûn, having recently engaged in significant diplomatic endeavors with the Variags far to the east of our lands, now approaches us as their spokesperson.\n\nRhûn petitions that the territories of Khand be granted increased autonomy, reducing direct governance from our Haradrim palace."

 rhun.100.a:0 "Accede to their plea."

 rhun.101.t:0 "Harad Assents"

 rhun.101.desc:0 "The rulers of Harad have acceded to our plea, and thus the Variags of Khand shall henceforth enjoy greater autonomy. This shall enhance our sway over them."

 rhun.101.a:0 "Excellent news."

 rhun.102.t:0 "Harad Refuses"

 rhun.102.desc:0 "Our petition for a more autonomous Khand has been denied by the Haradian authorities. In response, they will endeavor to tighten their grasp on the Variags."

 rhun.102.a:0 "Regrettable."

 rhun.100.b:0 "They should not interfere in our matters!"

 rhun.103.t:0 "Proposal of a Neutral Buffer Zone by Rhûn"

 rhun.103.desc:0 "In light of potential frictions along our eastern borders, Rhûn has put forth a proposal to establish an independent and neutral Khand between our nations. This would require both parties to contribute land for the creation of this buffer."

 rhun.103.a:0 "This is a wise proposition."

 rhun.104.t:0 "Harad Agrees to the Proposal"

 rhun.104.desc:0 "The realm of Harad has consented to our proposal. Together, we shall establish an independent Khand as a neutral buffer between our lands."

 rhun.104.a:0 "This is excellent news."

 rhun.105.t:0 "Harad Declines the Proposal"

 rhun.105.desc:0 "The realm of Harad has rejected our proposal to create a neutral Khand as a buffer state."

 rhun.105.a:0 "A regrettable decision."

 rhun.103.b:0 "They seek only to expand their own influence under the guise of peace!"

 rhun.106.t:0 "Rhûn Seeks Resource Entitlements"

 rhun.106.desc:0 "The mighty realm of Rhûn, instrumental in securing our recent autonomy, now seeks rights to harvest the abundant resources within our lands. Their contribution to our newfound freedom is undeniable, but granting such privileges may strain our dominion."

 rhun.106.a:0 "Grant the resource rights to Rhûn."

 rhun.106.b:0 "Deny their request."

 rhun.107.t:0 "The Blue Wizards Propose a Joint Effort"

 rhun.107.desc:0 "The Blue Wizards, Alator and Pallando, have been at the forefront of disloging the belligerent, tyrannical regime in Rhûn. \n\nRestinace movements in Rhûn have undertaken great preparations, and stand poised to strike. The wizards hope to see our help when the time right. Toppling the Mistrand regime in Rhûn would likewise remove a major threat to ourselves."

 rhun.107.a:0 "We will decide when the time comes."

 rhun.108.t:0 "War Preparations"

 rhun.108.desc:0 "The signs are undeniable; war looms ever closer on the horizon. As we continue our preparations for the coming conflict, a decision must be made regarding our primary focus and the aspects of our military that demand further reinforcement."

 rhun.108.a:0 "Double our recruitment efforts. We must field a massive army!"

 rhun.108.b:0 "Our ranks are sufficient; it is the arms that need fortification!"

 rhun.108.c:0 "Victory will be determined by mobility and might; let us expand our chariot forces!"

 rhun.109.t:0 "Rhûn Demands Territorial Settlement"

 rhun.109.desc:0 "The realm of Rhûn stands poised for war, its armies mobilizing with the unmistakable aim of conquest. However, it appears their ambitions are truly directed towards the west: Erebor and Dales. We find ourselves an impediment on their chosen path.\n\nAs Rhûn's demands upon us grow ever more insistent, they extend a lifeline in the form of a treaty.\n\nThis treaty stipulates minor territorial concessions to Rhûn. Furthermore, vast stretches of our lands leading westward would be reshaped into a 'Rhûnian Logathvuld' - a vassal state under Rhûn's sovereignty - while we retain our freedom and independence in the far east. By the treaty's terms, we would have priority access to resources within the Rhûnian Logathvuld.\n\nShould we accept these terms?"

 rhun.109.a:0 "Better this than the end of our nation."

 rhun.109.b:0 "We will fight to the last!"

 rhun.110.t:0 "Logath Accepts"

 rhun.110.desc:0 "The realm of Logath, recognizing our supremacy, has agreed to yield and accept the terms of our dictated treaty."

 rhun.110.a:0 "Excellent!"

 rhun.111.t:0 "Logath Refuses"

 rhun.111.desc:0 "The realm of Logath has declined to endorse our proposed treaty. It seems they choose the path of war over what they deem a 'humiliating peace'."

 rhun.111.a:0 "War shall be their fate."

 rhun.112.t:0 "Rhûn Demands Submission"

 rhun.112.desc:0 "The mighty realm of Rhûn prepares for war, mobilizing vast armies with conquest in mind. Though we lie in their path, the true objectives of their crusade lie westward: the lands of Erebor and Dale. Rhûn's diplomacy grows ever more stringent, yet they present us with a chance to avoid destruction through a treaty.\n\nThis treaty demands we cede certain territories to Rhûn, while the remainder of our land serves as a vassal state under their rule. In return, they promise us considerable military aid, positioning us as a potential barrier between the East and West."

 rhun.112.a:0 "What other option do we have?"

 rhun.113.t:0 "Logath Accepts"

 rhun.113.desc:0 "Acknowledging our dominance, the realm of Logath has chosen to step aside, agreeing to our terms and accepting the conditions of the treaty."

 rhun.113.a:0 "Excellent!"

 rhun.114.t:0 "Logath Refuses"

 rhun.114.desc:0 "The realm of Logath has boldly refused our treaty, choosing the path of war over what they deem a 'humiliating peace.'"

 rhun.114.a:0 "Then war they shall have."

 rhun.112.b:0 "If they wish to march westward, they must overcome us first!"

 rhun.115.t:0 "Rhûn Assumes Dominion Over Khand"

 rhun.115.desc:0 "The great realm of Rhûn has meticulously woven its webs of diplomacy to the east, gradually drawing Khand into its sphere of influence.\n\nNow, with our military might diminished compared to theirs, Khand has been enveloped under the dominion of Mistrand."

 rhun.115.a:0 "In time, we shall reclaim them."

 rhun.116.t:0 "The Treaty of the Steppe"

 rhun.116.desc:0 "In our struggle for the liberty of the Rhûn people, we have been locked in a fierce civil war against the Mordor-aligned regime in Mistrand. The enemy presses hard against us, their hold tightening as they position themselves to quash our rebellion.\n\nFortune, however, has not entirely abandoned us, for we have negotiated a truce with Mistrand which allows us to remain as an independent realm.\n\nAccording to the terms of the truce, we shall retain our capital of [128.GetName] and the territories under our control. In return, we shall agree to a ceasefire with Rhûn, lasting for one full year, and concede minor terms to Mistrand.\n\nShall we embrace these terms of peace, or fight on with unyielding resolve?"

 rhun.116.a:0 "Accept the terms of the treaty."

 rhun.116.b:0 "Over our dead bodies!"

 rhun.117.t:0 "Dealing With the Dwarves"

 rhun.117.desc:0 "Our conquest of Dale is complete, yet the realm of Erebor lies to the north. How are we to deal with these Dwarves?"

 rhun.117.a:0 "There will be no deals. Only war."

 rhun.117.b:0 "They should give up some territory."

 rhun.117.c:0 "They should bow before us."
