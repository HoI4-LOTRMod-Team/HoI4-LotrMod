l_english:
 RHUN_1_tt:0 "Start a §Rcivil war§! as §Y[DRH.GetNameWithFlag]§! in §Y180 days§!."
 RHUN_2_tt:0 "Builds a §Grailway§! from §OKelepar§! connecting with §ORhunea§! establishing a §Gsupply depot§!, and from there connects with the main path. Builds another seperate §Grailway§! from the middle intersection branching right establishing a §Gsupply depot§! east."
 RHUN_3_tt:0 "Branches §Grailway network§! down in §ORhudel Steppe§! and establishes two §Gsupply depots§! north- and south of the §RMordorian§! border in §ORhudel Steppe§! state."
 RHUN_4_tt:0 "This will ensure §OCentral Rhûn's§! §Gallegiance§! to our home state of Agasha Dag in the upcoming §Rcivil war§!."
 RHUN_5_tt:0 "This will ensure §OEastern Rhûn's§! §Gallegiance§! to our home state of Agasha Dag in the upcoming §Rcivil war§!."
 RHUN_6_tt:0 "One of §YRhûn§!'s' generals will defect to our side when the §Rcivil war§! breaks out."
 RHUN_7_tt:0 "We will receive §G+50%§! §Ysurrender limit§! when the §Rcivil war§! breaks out."
 RHUN_8_tt:0 "Gain §G-25%§! §Ysupply consumption§! and §Yattrition§! when the §Rcivil war breaks out§!."
 RHUN_9_tt:0 "Gain §G+1§! §Ycivilian factory§! and §G+2§! §Ymilitary factories§! when the §Rcivil war§! breaks out."
 RHUN_10_tt:0 "Add §G+15§! §Ysteel§! to §Y[128.GetName]§! when the §Rcivil war§! breaks out."
 RHUN_11_tt:0 "§Y[RHU.GetName]§! will get a §R-12%§! §Yattack§! and §R-12%§! §Ydefense§! modifier when the §Rcivil war§! breaks out."
 RHUN_12_tt:0 "Add §Ylevel 1Barracks§! to §Y[128.GetName]§! when the §Rcivil war§! breaks out."
 RHUN_13_tt:0 "This will spawn §Ymilitias§! in this state when the §Rwar§! breaks out."
 RHUN_14_tt:0 "Gain §G+5000§! §YInfantry Equipment§! when the §Rcivil war§! breaks out."
 RHUN_15_tt:0 "Gain §G+500§! §YChariot Equipment§! when the §Rcivil war§! breaks out"
 RHUN_16_tt:0 "Add §Yarchers§! and §Yrecon§! support companies to our §YWainrider Chieftain§! template."
 RHUN_17_tt:0 "Create a §YWainrider Chieftain§! 12 width §Ychariot division§!."
 RHUN_18_tt:0 "Expand our §YWainrider Chieftain§! template  by two additional §Ychariot brigades§!."
 RHUN_19_tt:0 "Create a §YBalchoth Chieftain§! 12 width §Ychariot division§!."
 RHUN_20_tt:0 "Adds two brigades of §YInfantry§! and one brigade of §GArchers§! to our §YBalchoth Chieftain§! template."
