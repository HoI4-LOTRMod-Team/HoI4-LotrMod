 RHUN_reallocate_civilian_resources:0 "Reallocate Civilian Resources"
 RHUN_light_cavalry_desc:0 "The vast plains of Rhûn demand swiftness. Our light cavalry will be the eyes and ears of our army, striking where the enemy least expects and disappearing before a counter-attack can be launched."
 RHUN_heavy_cavalry_desc:0 "The thundering hooves of our heaviest riders can break even the most stubborn formations. We must invest in their training and armor to ensure their devastating impact on the battlefield."
 RHUN_integrate_the_logath_desc:0 "The last embers of Logathvuld's resistance have been stamped out, and their tribal leaders have bowed to our will. The old ways are gone; a new order dawns over the steppe."
 RHUN_support_orc_efforts_desc:0 "The Orcs gnaw at the Elves of Mirkwood, a useful distraction for our own ambitions. We shall send them weapons and warm bodies, ensuring the Woodland Realm bleeds against a foe it underestimates."
 RHUN_dorwinion_rhovanion_trade_desc:0 "With Dorwinion's fertile lands and Rhovanion's vast steppes now firmly under our control, it is time to intertwine their economies and reap the bountiful rewards for Rhûn."
 RHUN_agasha_dag_secession_desc:0 "With carefully woven words and discreet aid, we have swayed the fierce tribal leaders of Agasha Dag to our banner, adding their strength to our cause."
 RHUN_govedalend_militia_desc:0 "The hardy folk of Govedalend refuse to be mere subjects. From their scattered homesteads, militias assemble, rekindling an ancient tradition of self-defense."
 RHUN_dervesalend_militia_desc:0 "From the scattered hamlets of Dervesalend, a defiant spirit emerges. These aren't professional soldiers, but their fierce loyalty and hatred of oppression will forge them into a fighting force."
 DRH_face_the_threat_alone_desc:0 "No allies stand with us, but neither do chains bind us. We shall face the shadow of Rhûn alone, and by our own hand carve out our destiny."
 DRH_call_upon_dorwinion_desc:0 "The reports indicate Dorwinion, always a bastion of quiet prosperity, is keenly observing our rebellion. A common enemy often makes for strong allies, and their support could be invaluable in our fight."
 DRH_bolster_the_war_effort_desc:0 "This is a war for the soul of Rhûn, and we will spare no effort in winning it. The furnaces burn brighter, the smiths work harder, for our existence depends on it."
 DRH_bolster_the_industry_desc:0 "Our coffers are bare, our stores depleted. A war of liberation, it seems, is also a war of diligent paperwork and relentless industrial output."
 DRH_rally_to_the_blue_wizards_desc:0 "Our people are fractured, but the presence of the Istari could be the rallying point we desperately need. Let their ancient authority and benevolent influence unite the warring factions under a common banner against true tyranny."
 DRH_guided_by_the_magic_desc:0 "The ancient wisdom of the Blue Wizards now shines upon us, illuminating paths to knowledge long shrouded in darkness."
 DRH_treaty_of_the_steppe_desc:0 "The drums of war have finally quieted, at least for a time. While our victory has been limited, we retain autonomy over some lands, and our independence remains intact."
 DRH_treaty_of_mistrand_desc:0 "With the loyalist regime brought to its knees, the final terms of surrender are signed in the bustling halls of Mistrand. The old order is broken, and a new era for the Easterlings dawns."
 DRH_face_the_storm_desc:0 "Having weathered our internal strife, a greater storm now gathers on our western borders. We must prepare to confront the ultimate source of darkness, or be consumed by it."
 DRH_civil_war_desc:0 "The die is cast. The path to true independence will be paved in the blood of our own, as factions vie for control of the newly liberated Rhûn. May the strongest prevail."
 RHUN_secure_dorwinion_support_desc:0 "The looming civil war demands allies, and Dorwinion is too strategically important to ignore. Their fertile lands and a robust populace could tip the scales in our favor."
 DRH_bolster_the_war_effort_2_desc:0 "We have poured our blood and sweat into this conflict, and it demands even more. Let the fires of our foundries burn brighter, consuming all to produce the tools of our liberation."
 DRH_bolster_the_industry_2_desc:0 "The tools forged today will build the Rhûn of tomorrow."
 DRH_wartime_endeavours_desc:0 "The shadow of war looms large, demanding our utmost effort. It is time to organize, to empower our commanders, and to galvanize the support of every Rhunic heart for the arduous fight."
 RHUN_handle_logathvuld:0 "Handle Logathvuld"
 RHUN_handle_logathvuld_desc:0 "Logathvuld holds a key position in our eastern expansion. Our agents will begin cultivating dissent and alliances, paving the way for our eventual influence."
 RHUN_strongarm_diplomacy_desc:0 "To ensure our interests are heard, we must make our intentions unmistakably clear. The sight of our war-host on the horizon tends to focus the minds of any reluctant negotiators."
 RHUN_demand_a_settlement_desc:0 "Our patience with Logathvuld's feebleness has worn thin. We shall extend a 'generous' offer: cede a portion of their land to our direct administration, ensuring stability for all involved."
 RHUN_align_logathvuld_desc:0 "The drums of our legions have spoken, and Logathvuld has heard. The time has come to bind their future to our own, securing their loyalty and integrating their strength into the rising power of Rhûn."
 RHUN_merge_administrations_desc:0 "The newly acquired territories of Logathvuld, or their puppet regime, now require a more cohesive administrative structure. By merging our systems, we shall ensure efficiency and greater control over these vital lands."
 RHUN_crack_down_on_resistance:0 "Crack Down on Resistance"
 RHUN_crack_down_on_resistance_desc:0 "The embers of Logathvuld defiance still glow, but such insubordination cannot be tolerated. Our legions will ensure that all pockets of resistance are thoroughly extinguished."
 RHUN_the_western_thrust_desc:0 "The Dark Lord's gaze now falls upon the West, and Rhûn is poised to be his spear."
 RHUN_antagonize_dale_and_erebor_desc:0 "Our patience with the Northmen and the Mountain-folk wears thin. Deliberate provocations shall serve to test their resolve and remind them of our growing strength."
 RHUN_the_path_to_mirkwood_desc:0 "Before our legions can sweep through the Elf-woods, the vital arteries of supply must be established."
 RHUN_take_matters_into_our_own_hands_desc:0 "No longer shall we rely on the sluggish efforts of Orcish raids or the distant commands of the Dark Lord. The time has come for Rhûn to claim its own spoils from the Elven forest."
 RHUN_wood_skirmishing_tactics_desc:0 "The tangled depths of Mirkwood demand a new approach. Our light infantry, usually more at home on the plains, must learn to move unseen and strike swiftly amongst the trees."
 RHUN_economy_of_conquest_desc:0 "The war shall feed itself!"
 RHUN_seize_the_marshes_desc:0 "The treacherous Dead Marshes have long served as a natural, albeit deadly, frontier. It is time to assert our control over these sodden lands, securing our western borders and denying passage to any who would emerge from the west."
 RHUN_focus_on_dale_desc:0 "At the foot of the Lonely Mountain, a small kingdom of Men thrives, oblivious to the encroaching shadow from the East. Their moment of reckoning is at hand."
 RHUN_territorial_expansion_desc:0 "Our ancestors once ruled a vast domain, and the ancient maps still show the true extent of Rhûn's rightful lands. The time has come to reclaim what is ours."
 RHUN_army_of_conquest_desc:0 "From the Black Sea to the Gates of Mordor, the war drums beat louder each day. Our banners unfurl, our legions muster."
 RHUN_settle_the_land_desc:0 "Even the wretched mire of the Dead Marshes can be made to serve. We will force the very earth to yield to our will, settling our people where once only ghosts of forgotten battles roamed, and extracting what little bounty it offers."
 RHUN_deal_with_the_dwarves_desc:0 "The Lonely Mountain, a trove of gold and gems, looms large on our northern frontier. Its dwarven inhabitants, though formidable, must now acknowledge the new order emerging from the East."
 RHUN_fortify_the_southern_border_desc:0 "The shadow of Mordor looms large over our southern marches. While we chart a new destiny, we are not so naive as to ignore the dark forces that still fester in the lands beyond."
 RHUN_deter_the_lord_of_mordor_desc:0 "Let the whispers carry far: the lands of Rhûn are not ripe for further subjugation. Our strength, though pledged to the East, is first and foremost for our own protection."
 RHUN_palace_politics_desc:0 "The court of Rhûn is a viper's nest of ambition and intrigue. This move aims to outmaneuver our rivals and solidify our grasp on the levers of power."
 RHUN_backstabbing_and_treachery_desc:0 "The inner workings of the Eastern courts are a tangle of whispered conspiracies and sudden falls from grace. To master the realm, one must first master the shadows."
 RHUN_replace_nepotistic_army_leaders_desc:0 "For too long, the command of our legions has been swayed by kinship rather than competence. The time has come to elevate merit above birthright, and prune the deadwood from our ranks."
 RHUN_accelerate_decision_making_desc:0 "The wheels of governance must turn faster if we are to seize the opportunities of this age. Old traditions of sluggish debate and cautious counsel must give way to swift, decisive action."
 RHUN_purge_corrupt_officials_desc:0 "The festering rot of corruption has spread throughout the civilian bureaucracy, impeding progress and draining the realm's strength. Only a thorough purge can restore integrity and efficiency to the halls of power."
 RHUN_bribe_laketown_delegates_desc:0 "Some negotiations require a more… personal touch. A generous offering to key delegates in Laketown will grease the wheels of commerce and open new markets."
 RHUN_bribe_dwarven_envoys_desc:0 "Direct confrontation with the Dwarves of Erebor is a costly affair. Instead, we shall employ more subtle arts, convincing their envoys that Rhûn's friendship is worth more than any grievance."
 DRH_restore_stability_desc:0 "Well, that was certainly… eventful. Now that the dust has settled and the terms are agreed, perhaps we can finally get down to the truly exciting work of making things stable again. Everyone loves stability, right?"
 DRH_restore_diplomatic_channels_desc:0 "After years of turmoil, both internal and external, it is time to rebuild bridges. Let us re-establish communication with those beyond our borders and normalize our standing in the world."
 DRH_path_to_revancha_desc:0 "Though fractured, our spirit remains unbowed. The usurpers who seized control of Rhûn will soon learn that the cost of their betrayal is far greater than they imagined."
 DRH_seek_protection_from_dale_desc:0 "An alliance with Dale, though unexpected, could serve as a powerful deterrent. Their influence in the North might just be the bulwark we need against our former masters."
 DRH_rebuild_forces_desc:0 "Though our coffers are drained and our forces diminished by strife, we shall not falter. Our people will dedicate themselves to the urgent task of raising fresh battalions and expanding our capacity to arm them."
 DRH_ally_with_logath_desc:0 "Our recent struggles have taught us the value of strength in numbers. Logathvuld, though not without its own troubles, will find in us a staunch ally, and together, we might just be enough."
 DRH_break_the_treaty_desc:0 "A true Free Rhûn cannot exist while our kin remain under the dominion of those who once served the Dark Lord. The treaty that binds us is a relic of a darker age; we must break it to bring liberty to all Easterlings."
 DRH_resume_research_efforts_desc:0 "Our libraries gather dust no more! With the urgent matters of survival and treaties handled, perhaps it's finally time to invest in the forgotten arts of scientific inquiry once again."
 DRH_join_the_dwarves_desc:0 "After breaking free from Mordor's shadow, we must seek out those who still stand for freedom. The stubborn yet steadfast Dwarves of the Lonely Mountain might just be the allies we need."
 DRH_deterrence_desc:0 "Let the echoes of our rebellion resonate across the lands, a clear message to all: we stand ready, vigilant, and fiercely determined to defend every inch of our hard-won liberty."
 DRH_maintain_military_formations_desc:0 "Having broken free from the Dark Lord's grasp, we must now prove ourselves worthy of that freedom. A standing army, well-trained and disciplined, is the bedrock of our new sovereignty."
 DRH_restore_a_stable_admin_desc:0 "The ashes of civil war cling to our boots, but order must rise from the chaos. A new, stable administration is paramount to cementing our hard-won freedom and governing the liberated lands."
 DRH_beacon_of_freedom_desc:0 "From the ashes of servitude, we emerge, not as another vassal of darkness, but as a bastion of independence."
 DRH_set_up_southern_supplylines_desc:0 "No longer will our southern garrisons face want. This vital project will ensure our brave defenders are supplied, well-fed, and ready to meet any challenge."
 DRH_scholarly_endeavours_desc:0 "Long were the centuries when the shadow of Mordor stifled all light of learning. Now, free from that blight, we shall rekindle the fires of knowledge and wisdom."
 RHUN_cavalry_focus_desc:0 "The boundless plains of Rhûn are the cradle of our cavalry. It is time to refine our ancient equestrian traditions and unleash the full power of our mounted warriors."
 RHUN_doctrine_focus_desc:0 "Our lands have been charted and our borders defined. Now, it is time to refine the martial spirit of our people and forge a coherent military philosophy that will guide our armies to victory."
 RHUN_doctrine_focus_2_desc:0 "The raw strength of our armies must now be guided by sharper minds and more intricate plans. Even the mightiest horde benefits from thoughtful preparation and cunning strategy."
 RHUN_infantry_modernization_desc:0 "From improved blades to more resilient shields and effective support armaments, our infantry shall receive the upgrades necessary to stand firm against any foe. The era of crude tools is at an end."
 RHUN_eastern_adaptations_desc:0 "The vast, sun-scorched lands of the East are not merely our home, but our proving ground. Our warriors must adapt to these harsh climes, making the desert an ally against any who would challenge our domain."
 RHUN_logathin_scholars_desc:0 "Our dominion over Logathvuld means their houses of learning now serve the greater glory of Rhûn. Their scholars, once isolated, now stand ready to contribute to our national advancement."
RHUN_wipe_out_the_seccesionists:0 "Wipe Out the Seccesionists"
 RHUN_wipe_out_the_seccesionists_desc:0 "The treacherous rebels speak of freedom, but they only sow chaos. Order must be restored, and the rebellious spirit crushed beneath the might of Rhûn's legions. Let their cries be a warning to any who would defy the East."
 RHUN_contact_the_avari_desc:0 "For too long, the Elves of the East have been estranged by our past allegiances. Now, with a new vision for Rhûn, we seek to mend these ancient rifts and invite their scattered communities to join us in building a truly independent future."
 RHUN_secure_the_oracarni_desc:0 "To truly claim our independence, we must command the very backbone of the East. The Orocarni will become a stronghold, its hidden resources and defiant folk now sworn to our new banner."
 DRH_integrate_the_eastern_tribes_desc:0 "Our influence in the eastern wilds has long extended. Now, we formalize our dominion over these tribes, ensuring their loyalty and compliance through the undeniable might of our enlightened rule."
 RHUN_reallocate_civilian_resources_desc:0 "The drums of war beat louder, demanding a unified effort. Civilian industries must now bend their will to the needs of our growing army."
 RHUN_demand_submission_desc:0 "Our patience with Dorwinion's indecisiveness has worn thin. We shall make our intentions for Eastern Dorwinion abundantly clear: yield, or face the consequences."
 RHUN_request_khand_autonomy_desc:0 "Harad's distant hold over Khand is tenuous. A formal request for their autonomy, seemingly benevolent, could be the first step to bringing the fierce Variags into our own sphere of influence."
 RHUN_trade_with_the_variags_desc:0 "The Variags of Khand have long been a source of exotic wares and unique craftsmanship. Opening these vital trade routes will undoubtedly bolster our burgeoning economy."
 RHUN_negotiate_resource_rights_desc:0 "The Variags are a generous folk, eager to contribute to the greater glory of Rhûn. We simply guide their efforts in sharing the bounty of their lands, for a stronger Rhûn means a stronger Khand."
 RHUN_reward_from_mordor_desc:0 "Sauron's gaze falls upon Rhûn, a grim approval for our recent conquests. A reward is granted, not out of generosity, but out of recognition for service rendered to the Dark Lord's will."
 RHUN_join_forces_with_mordor_desc:0 "The time for pretense is over. The path to true power lies with the Dark Lord, and Rhûn shall march proudly under the Shadow's banner, forever bound to Mordor's will."
 RHUN_form_a_faction_desc:0 "With Khamûl banished and internal strife mended, the Easterlings of Rhûn now stand ready to forge their own destiny. A new alliance, born of common purpose and shared ambition, shall rise to assert our dominion over the eastern lands."