 RHUN_mission_of_the_blue_wizards_1_desc:0 "Alator and Pallando, the enigmatic Blue Wizards, travel the lands of the East attempting to undermine the influence of Sauron and rally support for the free peoples. Despite remaining largely out of sight, the influence of two Istari has hardly gone unnoticed by those who seek cast off the yoke of Mistrand."
