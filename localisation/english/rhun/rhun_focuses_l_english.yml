 RHUN_way_of_balchoth:0 "Way of the Balchoth"
 RHUN_way_of_balchoth_desc:0 "The ancient war-ways of the Balchoth once brought terror to the lands of Rhovanion. Let their relentless aggression strike fear into the hearts of our enemies and let their blades fell legions of enemies as in the days of old."
 RHUN_way_of_wainriders:0 "Way of the Wainriders"
 RHUN_way_of_wainriders_desc:0 "A single weinrider is worth over a hundred common foot. Let us train our chieftains to lead with the ferocity and tactical brilliance that has made them legends on the battlefield."
 #blue wizard stuff
 RHUN_mission_of_the_blue_wizards:0 "Mission of the Blue Wizards"
 RHUN_mission_of_the_blue_wizards_desc:0 "Alator and Pallando, the enigmatic Blue Wizards, travel the lands of the East attempting to undermine the influence of Sauron and rally support for the free peoples. Despite remaining largely out of sight, the influence of two Istari has hardly gone unnoticed by those who seek cast off the yoke of Mistrand."
