 #civil war
 RHUN_civil_war:0 "Civil War"
 RHUN_civil_war_desc:0 "The people of Rhûn have taken up arms against the tyranny of Mistrand. The land is torn asunder by internal strife, and the future of the East hangs in the balance."
 RHUN_fierce_resistance:0 "Fierce Resistance"
 RHUN_fierce_resistance_desc:0 "The people of Free Rhûn have rallied and united under the purpose of reclaiming their homeland. They will fight tooth and nail before giving up their new-found freedom."
 RHUN_hidden_supplies:0 "Hidden Supplies"
 RHUN_hidden_supplies_desc:0 "Hidden supply depots have been established across the land, ensuring that the resistance can continue to fight even in the face of overwhelming odds."
 RHUN_sabotaged_military:0 "Sabotaged Military"
 RHUN_sabotaged_military_desc:0 "Military supplies and leadership have been sabotaged, leaving the forces of Mistrand disorganized and ill-equipped to deal with the uprising."
