l_english:
 RHUN_teachings_of_morgoth:0 "The Temple of Melkor"
 RHUN_teachings_of_morgoth_desc:0 "The ancient hymns of praise to the Great Enemy echo once more through the halls of Rhûn. Our devotion shall be absolute, our resolve forged in the deepest shadows, as we dedicate ourselves to the true source of all power."
 RHUN_recognize_sauron:0 "Bow to the Dark Tower"
 RHUN_recognize_sauron_desc:0 "The Dark Lord's might is undeniable, his shadow inescapable. To resist is to perish, but to kneel is to find purpose in the grand design of Middle-earth's true master."
 RHUN_warlord_of_the_east:0 "Khamûl the Easterling"
 RHUN_warlord_of_the_east_desc:0 "Lord Khamûl, the second of the Nazgûl, assumes direct command. His rule promises an era of efficient, unyielding order, forged in the fires of Mordor and executed with absolute power."
 RHUN_nation_driven_by_fear:0 "Nation Driven by Fear"
 RHUN_nation_driven_by_fear_desc:0 "The teachings of the Dark Lord have shown us the true path to obedience. Loyalty born of love is fleeting; loyalty forged in terror is eternal."
 RHUN_ask_mordor_for_trolls:0 "Request Troll Reinforcements"
 RHUN_ask_mordor_for_trolls_desc:0 "The battlefield has grown stagnant. A sudden, thunderous charge of colossal Trolls is precisely the disruption needed to turn the tide decisively in our favour."
 RHUN_guide_the_tribes:0 "Guide the Tribes"
 RHUN_guide_the_tribes_desc:0 "While some seek to bend the knee to an external master, true strength comes from within. We shall forge the scattered tribes of Rhûn into a cohesive nation, dictating our own formidable destiny."
 RHUN_one_tribe_supremacy:0 "Tribal Hierarchy"
 RHUN_one_tribe_supremacy_desc:0 "The ancient customs and diverse chieftains have served their purpose. Now, a new order must be established, centralizing power and loyalty to a singular authority."
 RHUN_our_own_way:0 "Local Leader"
 RHUN_our_own_way_desc:0 "Connecting with our rich history, it is evident we must shape our own future with a leader of our peoples."
 RHUN_mend_the_conflict:0 "Inter-Tribal Councils"
 RHUN_mend_the_conflict_desc:0 "For too long, the clans of Rhûn have been divided, exploited by external powers. By reviving ancient traditions of counsel and accord, we can bind our disparate folk into a cohesive and proud nation."
 RHUN_expel_khamul:0 "Expel Khamûl"
 RHUN_expel_khamul_desc:0 "To break free from the invisible chains that bind us to the Dark Lord, the most visible symbol of his will must depart. Khamûl's expulsion marks a definitive step towards Rhûn's independence."
 RHUN_Mordor_doctrine:0 "Mordor Doctrine"
 RHUN_Mordor_doctrine_desc:0 "We have learned from the greatest strategist of our age. Our armies, our laws, our very society shall be reformed according to Mordor's iron discipline."
 RHUN_Rhun_Doctrine:0 "Rhûn Doctrine"
 RHUN_Rhun_Doctrine_desc:0 "The Mountains of Ash separate our kin from the dark lands. Why should we align our methods with those so distant to us?"
 ##eastern campaign
 RHUN_eastern_campaign:0 "Eastern Campaign"
 RHUN_eastern_campaign_desc:0 "Under the guidance of our Lord Sauron we must expand our influence in the East of Middle-Earth."
 RHUN_strike_rhovania:0 "Strike at Rhovanion"
 RHUN_strike_rhovania_desc:0 "Our scouts have mapped the wild lands, and our chariots are restless. The time has come for the East to reclaim dominion over the plains of Rhovanion."
 RHUN_proclaim_empire_of_rhun:0 "Proclaim the Empire of Rhûn"
 RHUN_proclaim_empire_of_rhun_desc:0 "From the vast, sun-baked plains to the shadowy mountains, our conquests have laid the foundation for a new, glorious age. We are not merely rulers of a land, but architects of an Empire, destined to reshape the East."
 #dorwinion
 RHUN_tackle_dorwinion:0 "Tackle Dorwinion"
 RHUN_tackle_dorwinion_desc:0 "Enough of diplomatic niceties! The time has come to cut through the pleasantries and seize what is ours. Dorwinion will be ours, by conquest and by might."
 RHUN_nurukhizdin_or_war:0 "Territory or War"
 RHUN_nurukhizdin_or_war_desc:0 "A new order rises in the East, and Dorwinion must adapt or perish. They may surrender the provinces we deem vital to our future, or invite the conflict that will decide their fate."
 RHUN_militarize_dorwinion:0 "Militarize Dorwinion"
 RHUN_militarize_dorwinion_desc:0 "Our dominion over Dorwinion is complete. It is time to harness its strategic location and burgeoning workforce, establishing new arms factories to bolster our military and secure our gains."
 RHUN_build_vineyards:0 "Construct Vineyards"
 RHUN_build_vineyards_desc:0 "The fertile plains of Dorwinion have long yielded prized vintages. Now, under our administration, these vast vineyards will be expanded and managed to extract every drop of their strategic value."
 RHUN_study_dorwinian_doctrine:0 "Study Dorwinian Doctrine"
 RHUN_study_dorwinian_doctrine_desc:0 "We may be able to learn useful information from analyzing the Dorwinian fighting methods."
 RHUN_expand_wine_trade:0 "Let the Wine Flow"
 RHUN_expand_wine_trade_desc:0 "What better then... Wine! A tasteful import profit."
 RHUN_establish_rhunian_dorwinion:0 "Establish Rhûnian Dorwinion"
 RHUN_establish_rhunian_dorwinion_desc:0 "A new administrative structure will allow the rich region of Dorwinion to maintain its distinct character, all while serving the greater interests of Rhûn."
 RHUN_clamp_down_on_resistance:0 "Clamp Down on Resistance."
 RHUN_clamp_down_on_resistance_desc:0 "The whispers of rebellion must be silenced. An iron fist is often the only language a stubborn populace understands."
 RHUN_establish_colonial_garrisons:0 "Strengthen Garrisons"
 RHUN_establish_colonial_garrisons_desc:0 "Strengthening our Garrisons will ensure our men are more capable of dealing with any resistance that may arise."
 #rhovanion
 RHUN_demand_rhovanion_submission:0 "Demand Rhovanion's Submission"
 RHUN_demand_rhovanion_submission_desc:0 "Our campaigns have secured the East; now our eyes turn west. The clans of Rhovanion shall be given one opportunity to acknowledge their true overlords and accept our protection."
 RHUN_tackle_rhovanion:0 "Tackle Rhovanion"
 RHUN_tackle_rhovanion_desc:0 "The plains of Rhovanion have long been a frontier, but no longer. It is time for the East to assert its rightful dominion over these rich lands and bring their scattered peoples to heel."
 RHUN_puppet_king:0 "The Puppet King"
 RHUN_puppet_king_desc:0 "The old king may sit on his gilded chair. But the words he speaks, the commands he gives, will not be his own."
 RHUN_fortress_of_the_east:0 "Fortify Settlements"
 RHUN_fortress_of_the_east_desc:0 "Our dominion over Rhovanion must be solidified. The East is here to stay."
 RHUN_import_dorwinian_wine:0 "Import Dorwinian Wine"
 RHUN_import_dorwinian_wine_desc:0 "All must share in the Wine.. Surely Vidugavia will forget about our quarrels in a rather timely manner with enough bottles."
 RHUN_land_reclamation_order:0 "Land Reclamation"
 RHUN_land_reclamation_order_desc:0 "The soil of Rhovanion is wasted on clueless Rhovanion farmers. We will install Rhûnian governors to ensure their produce is taxed appropriately, and their land used efficiently."
 RHUN_pathfinding_companies:0 "Pathfinding Companies"
 RHUN_pathfinding_companies_desc:0 "From the heartland of Rhûn to the newly charted plains, our pathfinding companies shall extend the long arm of the Empire."
 RHUN_outpost_towers:0 "Establish Outposts"
 RHUN_outpost_towers_desc:0 "Our gaze must extend beyond the horizon. Towers, both natural and crafted, shall serve as the unblinking eyes of Rhûn, keeping watch over the vast plains and distant threats."
 ##orders from lord sauron
 RHUN_orders_from_lord_sauron:0 "The Dark Lord's Bidding"
 RHUN_orders_from_lord_sauron_desc:0 "Our fealty has been given, and now the demands of that allegiance are laid bare. We are but instruments in the Dark Lord's grand design, and his bidding is our unshakeable command."
 RHUN_prepare_for_the_conflict:0 "Prepare for the Conflict"
 RHUN_prepare_for_the_conflict_desc:0 "Sauron's will is absolute, and his shadow lengthens over the lands. We must ready ourselves to strike when the time is ripe, for the Dark Lord tolerates no delay."
 RHUN_aid_from_mordor:0 "Aid from Mordor"
 RHUN_aid_from_mordor_desc:0 "Lord Sauron has allocated to us a sizeable force to help us in our war effort."
 RHUN_an_army_worthy_of_mordor:0 "An Army Worthy of Mordor"
 RHUN_an_army_worthy_of_mordor_desc:0 "The Eye demands strength, and we shall provide it. Our warriors will be drilled, equipped, and hardened to stand alongside the mighty hosts of the Black Land."
 RHUN_siege_of_the_lonely_mountain:0 "Siege of the Lonely Mountain"
 RHUN_siege_of_the_lonely_mountain_desc:0 "Let the trumpets of war sound across the Iron Hills and the shores of the Long Lake! The last bastions of the free peoples in the north will fall."
 RHUN_conquest_of_the_logath:0 "Conquest of the Logath"
 RHUN_conquest_of_the_logath_desc:0 "The drums of war thunder across the plains. The Logath, standing defiantly in our path, will learn the true might of the East as our legions sweep through their lands."
 RHUN_integrate_the_logath:0 "Integrate the Logath"
 RHUN_integrate_the_logath:0 "Integrate the Logath"
 RHUN_stir_the_men_west:0 "Stir the Men West"
 RHUN_stir_the_men_west_desc:0 "By using our vassals to distract the men, we can operate freely in the north."
 ##northern_ambitions
 RHUN_northern_ambitions:0 "Northern Ambitions"
 RHUN_northern_ambitions_desc:0 "Our banners have flown victorious across the East, but the lands to the North remain untamed and ripe for the taking."
 RHUN_exploit_dorwinian_resources:0 "Exploit Dorwinian Resources"
 RHUN_exploit_dorwinian_resources_desc:0 "The wines of Dorwinion once graced the tables of kings, but now its lands offer something more tangible."
 RHUN_raid_into_mirkian_territory:0 "Raid into Mirkian Territory"
 RHUN_raid_into_mirkian_territory_desc:0 "The vile Elvish of the Greenwood are now bordering our lands. The time has come to put an end to their rule."
 ##khand 
 RHUN_contact_the_variags:0 "Contact the Variags"
 RHUN_contact_the_variags_desc:0 "Messengers are dispatched to the lands of the Variags. Their famed warriors and unique fighting methods could prove invaluable, if we can bridge the cultural divide."
 RHUN_khandian_buffer_zone:0 "Khandian Buffer Zone"
 RHUN_khandian_buffer_zone_desc:0 "Harad's shadow looms large, and Khand lies in its path. By establishing a buffer zone, we ensure that if war comes, it will not be fought on Rhûnish soil."
 RHUN_skirmishes_west:0 "Skirmishes West"
 RHUN_skirmishes_west_desc:0 "Encourage the Variags to strike into Haradrain territory and expand their borders."
 RHUN_rhunian_khand:0 "Rhûnian Khand"
 RHUN_rhunian_khand_desc:0 "The Variags of Khand, ever practical, have chosen their new allegiance. With Harad's grip faltering, the East calls to them, and they answer."
 RHUN_ultimatum_of_sturlusta:0 "Ultimatum of Sturlusta"
 RHUN_ultimatum_of_sturlusta_desc:0 "We shall present a list of demands to Harad that support our argument concerning West Chelkar being rightfully Khandian."
 RHUN_build_up_khand:0 "Build up Khand"
 RHUN_build_up_khand_desc:0 "Our Variag allies possess great potential, both industrial and martial. By generously investing in their lands, we ensure that Khand's strength grows, inevitably tying its fortunes closer to our own."
 RHUN_learn_from_the_variags:0 "Learn from the Variags"
 RHUN_learn_from_the_variags_desc:0 "For centuries, the Variags have ridden the mighty Mûmakil into battle. Their methods of training and deploying these living siege-engines are a valuable lesson we would be fools to ignore."
 RHUN_integrate_khandian_forces:0 "Integrate Khandian Forces"
 RHUN_integrate_khandian_forces_desc:0 "Khand bolsters great warriors, we must integrate them into our forces to strengthen our war effort."
 ##industry branch
 RHUN_mapcharting_expeditions:0 "Mapcharting Expeditions"
 RHUN_mapcharting_expeditions_desc:0 "The vastness of Rhûn remains largely untamed and uncharted. Our first step towards a unified, prosperous empire must be to truly know our lands, their resources, and their hidden paths."
 RHUN_army_focus:0 "Army Focus"
 RHUN_army_focus_desc:0 ""
 RHUN_army_calvery:0 "Cavalry"
 RHUN_army_calvery_desc:0 ""
 RHUN_better_calvery:0 "Better Cavalry"
 RHUN_better_calvery_desc:0 ""
 RHUN_ballista:0 "Ballistics Focus"
 RHUN_ballista_desc:0 "A dedicated program to advance ballista technology will provide the heavy ranged support crucial for future campaigns across Middle-earth."
 RHUN_archery:0 "Longbow Archers"
 RHUN_archery_desc:0 "The longbow has been a staple of Rhûn's armies for generations. We shall dedicate ourselves to perfecting this ancient art, ensuring our archers rain death upon any who stand against us."
 RHUN_crossbow:0 "Crossbow Archers"
 RHUN_crossbow_desc:0 "While traditional bows require artistry, the crossbow offers brutal efficiency. A single pull of the trigger can fell the mightiest foe, and our eastern legions shall master its unforgiving power."
 RHUN_army_of_the_east:0 "Army of the East"
 RHUN_army_of_the_east_desc:0 "Our ancestors rode across these lands with unmatched might. It falls to us to rekindle that ancient fire and build an army to rival the legends."
 RHUN_subsidize_wainrider_chariots:0 "Subsidize Chariot Production"
 RHUN_subsidize_wainrider_chariots_desc:0 "Our enemies tremble at the sight of our Wainriders. Let us grant them further cause for fear by ensuring our formidable chariots can be fielded with swiftness and in numbers never before seen."
 RHUN_light_cavalry:0 "Light Cavalry"
 RHUN_heavy_cavalry:0 "Heavy Cavalry"
 RHUN_exploit_southern_deposits:0 "Exploit Southern Deposits"
 RHUN_exploit_southern_deposits_desc:0 "Our scouts have confirmed what whispers suggested: the southern lands are rich in iron ore."
 RHUN_subsidize_mountain_logging:0 "Subsidize the Loggers"
 RHUN_subsidize_mountain_logging_desc:0 "Felling trees in the perilous mountain ranges is no easy task, but the necessity of these resources makes the arduous labor worthwhile."
 RHUN_forge_of_mistrand:0 "Forge of Mistrand"
 RHUN_forge_of_mistrand_desc:0 "Mistrand, a hub of trade and travel, is destined for greater things. The establishment of this great forge transforms it into a bastion of industry, vital for the strength of Rhûn."
 RHUN_state_investment:0 "Ramp Up Investments"
 RHUN_state_investment_desc:0 "The Grand Council has approved the new initiative. A monumental undertaking involving countless decrees and considerable administrative effort."
 RHUN_strengthen_the_north:0 "Strengthen the North"
 RHUN_strengthen_the_north_desc:0 "No longer shall the North be merely a borderland. It shall be transformed into a wellspring of industrial might and military prowess, a testament to our strength."
 RHUN_modernize_the_south:0 "Build Up the South"
 RHUN_modernize_the_south_desc:0 "As Rhûn looks ever eastward and westward, a strong and self-sufficient southern flank is indispensable."
 RHUN_develop_the_industry:0 "Improve Construction Techniques"
 RHUN_develop_the_industry_desc:0 "The hands of Rhûn are strong, but skill must guide them. By refining our construction methods, we can erect monuments to our power and fortify our frontiers with unprecedented speed."
 RHUN_market_of_mistrand:0 "Markets of Mistrand"
 RHUN_market_of_mistrand_desc:0 "From the silks of the south to the furs of the north, Mistrand shall be the vibrant heart where all goods converge."
 RHUN_farms_of_the_steppe:0 "Farms of the Steppe"
 RHUN_farms_of_the_steppe_desc:0 "The boundless steppes of Rhûn are ripe for cultivation."
 RHUN_construct_barracks:0 "Construct Barracks"
 RHUN_construct_barracks_desc:0 "Improved training facilities in Mistrand mean more disciplined recruits and a faster path to the battle lines."
 RHUN_library_of_mistrand:0 "Library of Mistrand"
 RHUN_library_of_mistrand_desc:0 "A thousand years of scattered lore, and endless tales yet untold. Let the halls of Mistrand's library  finally gather the intellectual might of the East."
 RHUN_southern_pathfinding:0 "Southern Pathfinding"
 RHUN_southern_pathfinding_desc:0 "The ancient maps and recently gathered intelligence from Mistrand have unveiled the challenges of the southern territories."
 RHUN_market_of_kelepar:0 "Markets of Kelepar"
 RHUN_market_of_kelepar_desc:0 "Our caravans have charted the routes and secured the goods. Now, the bustling stalls and trading houses of Kelepar will elevate our economic might."
 RHUN_fishing_industry_of_the_north:0 "Northern Fisheries"
 RHUN_fishing_industry_of_the_north_desc:0 "We shall invest in modern techniques and expanded fleets, turning the sea's offerings into a cornerstone of our northern economy."
 RHUN_granary_for_the_north:0 "Northern Granaries"
 RHUN_granary_for_the_north_desc:0 "To truly integrate our northern territories, we must invest in their prosperity. Robust granaries will strengthen local economies and provide a stable food supply for all."
 RHUN_university_of_kelepar:0 "Library of Kelepar"
 RHUN_university_of_kelepar_desc:0 "A grand institution for scholars and scribes will be constructed in Kelepar. Let the ancient lore and the secrets of the world be meticulously collected and studied within the Library of Kelepar."
 RHUN_northern_pathfinding:0 "Northern Pathfinding"
 RHUN_northern_pathfinding_desc:0 "The vast northern plains and scattered settlements have long remained isolated."
 ##ahistorical
 RHUN_break_free_from_mordor:0 "Reject the Shadow"
 RHUN_break_free_from_mordor_desc:0 "The long night under the Shadow must end. Let the whispers of defiance turn into a roar, even if it tears our homeland asunder."
 RHUN_denounce_dark_pact:0 "Denounce the Dark Pact"
 RHUN_denounce_dark_pact_desc:0 "The pact with Mordor has brought only hardship and internal strife. We publicly renounce its vile terms, a defiant declaration that may yet buy us precious time against the looming civil war."
 RHUN_stir_confusion:0 "Stir Confusion."
 RHUN_stir_confusion_desc:0 "As Mordor's shadow stretches, we must turn their gaze inwards. Whispers of discontent and calculated misdirection will sow internal strife, buying us precious time to prepare."
 RHUN_ask_the_blue_wizards_to_buy_time:0 "Bide Our Time"
 RHUN_ask_the_blue_wizards_to_buy_time_desc:0 "The Blue Wizards have long walked the lands east of Rhûn, known for their subtle influence. Perhaps their presence can provide a necessary distraction, buying us time to consolidate our strength."
 RHUN_rally_support:0 "Rally Tribal Support"
 RHUN_rally_support_desc:0 "The Dervesalend is ripe for our message. Their fierce warriors and deep-rooted traditions will be vital in securing our popular mandate."
 RHUN_central_rhunian_secession:0 "Central Rhûnian Secession"
 RHUN_central_rhunian_secession_desc:0 "Rally the central Rhûnian people to our cause."
 RHUN_east_rhunian_secession:0 "East Rhûnian Secession"
 RHUN_east_rhunian_secession_desc:0 "A new banner rises in the east, challenging the central authority. The regions of East Rhûn declare their intent to break away."
 RHUN_turn_the_military:0 "Turn the Military"
 RHUN_turn_the_military_desc:0 "The chains of Mordor are heavy, but the spirit of the Easterling is defiant. We remind our generals and footmen of their heritage."
 RHUN_sabotage_the_military:0 "Sabotage the Military"
 RHUN_sabotage_the_military_desc:0 "Before the first blade is drawn, we will ensure their armories are barren, their supply lines cut, and their chariots without wheels."
 RHUN_resistance_preparation:0 "Prepare Resistance Efforts"
 RHUN_resistance_preparation_desc:0 "While the Tyrant's attention is fixed elsewhere, we shall quietly lay the foundations of our uprising. Let the oppressors underestimate the strength of a people preparing to reclaim their destiny."
 RHUN_hide_supplies:0 "Hidden Supply Depots"
 RHUN_hide_supplies_desc:0 "Our stores of arms and armor must be secured away from prying eyes. When the time for rebellion comes, we will need every spear and shield we can find."
 RHUN_offshore_industry:0 "Underground Production Efforts"
 RHUN_offshore_industry_desc:0 "The looming storm threatens our visible industries. We shall move our vital production deep underground, sacrificing immediate output for long-term survival."
 RHUN_secret_mines:0 "Secret Mines"
 RHUN_secret_mines_desc:0 "Beneath the desolate northern hills, secret veins of ore are being tapped. These hidden bounties will soon forge the weapons of our liberation, unseen by the Dark Lord's gaze."
 RHUN_secret_militias:0 "Secret Militias"
 RHUN_secret_militias_desc:0 "While the Dark Lord's eye is fixed on the West, loyal men of Rhûn gather in the shadows. We must arm and train these hidden forces, preparing for the day we stand for ourselves."
 RHUN_agasha_militia:0 "Agasha Militia"
 RHUN_agasha_militia_desc:0 "With the will of Agasha-Dag set on independence, it falls to us to arm our people. Farmers and hunters will trade their tools for spears, forming the backbone of our new army."
 RHUN_central_rhunian_militia:0 "Central Rhûnian Militia"
 RHUN_central_rhunian_militia_desc:0 ""
 RHUN_east_rhunian_militia:0 "East Rhûnian Militia"
 RHUN_east_rhunian_militia_desc:0 ""
 RHUN_stockpile_spears:0 "Stockpile Spears"
 RHUN_stockpile_spears_desc:0 "The storm gathers, and our people must be ready. We may bribe the guards of supply depots to 'miss-place' some shipments."
 RHUN_stockpile_chariots:0 "Stockpile War Chariots"
 RHUN_stockpile_chariots_desc:0 "The chariots are among our most feared weapons. Any chariot that does not fall into hands of the Melkorites is a win."
 ##wainriders of rhun 
 RHUN_wainriders_of_rhun:0 "Wainriders of Rhûn"
 RHUN_wainriders_of_rhun_desc:0 "For generations, the Wainriders have been the vanguard of our armies, their chariots carving paths of conquest."
 RHUN_chariot_modernization:0 "Melee Chariots"
 RHUN_chariot_modernization_desc:0 "The ancient tradition of the Wainriders is not to be abandoned, but perfected. By integrating new techniques and materials, our war chariots will reclaim their rightful place as kings of the battlefield."
 RHUN_chariot_archers:0 "Archer Chariots"
 RHUN_chariot_archers_desc:0 "Our swift war-wagons become mobile platforms for death, raining down volleys of arrows upon unsuspecting foes before they can even close the distance."
 RHUN_commission_expert_craftmanship:0 "Commission Expert Craftmanship"
 RHUN_commission_expert_craftmanship_desc:0 "Chariot warfare is an art, and we demand masterpieces. By commissioning the foremost experts, we aim to engineer swifter, more resilient vehicles that will leave our foes in the dust."
 RHUN_way_of_the_wainriders:0 "Way of the Wainriders"
 RHUN_way_of_the_wainriders_desc:0 "Our elite chieftain divisions will ride at the vanguard. The Way of the Wainriders is not merely about chariots; it is about absolute, crushing dominance."
 RHUN_focus_on_war_chariots:0 "Heavy War Chariots"
 RHUN_focus_on_war_chariots_desc:0 "Let the enemy tremble at the sight of an even larger, more concentrated chariot force."
 RHUN_a_balanced_force:0 "Tactical Balance"
 RHUN_a_balanced_force_desc:0 "By mastering the art of tactical balance, our chariot divisions will become versatile and deadly, combining mobility with overwhelming firepower and intelligence."
 RHUN_way_of_the_balchoth:0 "Way of the Balchoth"
 RHUN_way_of_the_balchoth_desc:0 "The ancient war-ways of the Balchoth call to us once more. Let our chariots thunder across the plains, bringing ruin to those who oppose the might of Rhûn."
 RHUN_skirmisher_companies:0 "Skirmisher Companies"
 RHUN_skirmisher_companies_desc:0 "Why meet the enemy head-on when their flanks lie exposed? These new skirmisher companies will ride circles around their heavy formations, sowing chaos and fear."
 RHUN_bow_companies:0 "Longbow Companies"
 RHUN_bow_companies_desc:0 "The composite bows of the Easterlings are famed across the East. Organizing our master archers into dedicated Companies will ensure a storm of arrows precedes our chariot charges."
 RHUN_subsidize_production:0 "Advanced Wainrider Tactics"
 RHUN_subsidize_production_desc:0 "To sustain our campaigns across the vast steppe, a steady and abundant supply of war-chariots is paramount."
 RHUN_train_chieftains:0 "Advanced Chieftain Training"
 RHUN_train_chieftains_desc:0 "The fierce chieftains of Rhûn are born leaders, yet even raw courage needs refinement."
 ##diminish the magic
 RHUN_crackdown_on_the_blue_wizards:0 "Autocratic Perogatives"
 RHUN_crackdown_on_the_blue_wizards_desc:0 "In the shadowed halls of Barad-dûr, the Dark Lord does not suffer divided loyalties. The so-called Istari, with their dubious agendas, present a challenge to the supremacy of Sauron's will in the East that must be firmly put down."
 RHUN_inspire_loyalty_in_wainriders:0 "Suppress Internal Resistance"
 RHUN_inspire_loyalty_in_wainriders_desc:0 "The proud Wainrider clans, a formidable force on the plains, must be united in their purpose. We shall inspire their loyalty through firm governance and a clear vision for Rhûn's future."
 RHUN_diminish_the_magic:0 "Drive Out the Blue Wizards"
 RHUN_diminish_the_magic_desc:0 "These wandering mystics have overstayed their welcome in Rhûn. Their 'blessings' are a weakness, and their presence a constant challenge to our sovereignty. They must be driven out."
 RHUN_crackdown_in_agasha_dag:0 "Crackdown on Agasha Dag"
 RHUN_crackdown_in_agasha_dag_desc:0 "The persistent unrest in Agasha Dag demands an immediate and forceful response. Our legions will sweep through the region and restore order with an iron fist."
 RHUN_crackdown_in_central_rhun:0 "Crackdown on Central Rhûn"
 RHUN_crackdown_in_central_rhun_desc:0 "The restless heartland of Rhûn demands our attention. A firm hand is required to quell the whispers of dissent and restore order to the central provinces."
 RHUN_crackdown_in_eastern_rhun:0 "Crackdown on Eastern Rhûn"
 RHUN_crackdown_in_eastern_rhun_desc:0 "The eastern provinces have echoed with whispers of independence, spurred by alien philosophies. An iron fist shall remind these distant peoples of their true masters and quell all disloyal murmurings."
 RHUN_reclaim_the_north:0 "Subsume Northern Territories"
 RHUN_reclaim_the_north_desc:0 "With order restored and dissent purged, these territories are at last truly unified under the banner of Rhûn."
 ##other
 commonwealth_rhun:0 "Commonwealth of Rhûn"
 commonwealth_rhun_desc:0 ""
 RHUN_one_ring_destroyed:0 "One Ring Destroyed"
 RHUN_one_ring_destroyed_desc:0 "With the ring destroyed, our armies are routing, men are fleeing, strength has faded. Generals suggest it is critical to find a diplomatic means to end to the war before we are finished..."
 ##ideas
 RHUN_operation_grape:0 "Operation Grape"
 RHUN_operation_grape_desc:0 "Rhûn has embarked on an invasion of Dorwinion, a land rich in resources and strategically vital. This operation aims to swiftly conquer Dorwinion, securing its valuable vineyards and trade routes, while also sending a clear message to our enemies that Rhûn's ambitions know no bounds."
 RHUN_operation_grape_AI:0 "Operation Grape"
 RHUN_operation_grape_AI_desc:0 "Rhûn has embarked on an invasion of Dorwinion, a land rich in resources and strategically vital. This operation aims to swiftly conquer Dorwinion, securing its valuable vineyards and trade routes, while also sending a clear message to our enemies that Rhûn's ambitions know no bounds."
 RHU_shadow_of_mordor:0 "Shadow of Mordor"
 RHU_shadow_of_mordor_desc:0 "The shadow of Mordor looms over Rhûn, and the easterlings are bound to the wills of the Dark Tower. Fears of an orc invasion far outshines any desires for independence."
 RHUN_khamul_expanded:0 "Khamûl"
 RHUN_khamul_expanded_desc:0 "Mordor has dispatched the Ringwraith Khamûl to oversee operations in Rhûn. His presence puts the squeeze on Easterling leadership to mobilize their armies and commit themselves to the cause of the Dark Pact."
 RHUN_eastern_campaign_desc:0 "A great campaign will be launched to subjugate all who stand in Rhûn's way and extend the might of our empire across the continent."
 RHUN_rhunian_chiefdom:0 "Rhûnian Chiefdom"
 RHUN_rhunian_chiefdom_desc:0 "This country has been reduced to a tributary of Mistrand."
 RHUN_bolstered_economy:0 "Bolstered Economy"
 RHUN_bolstered_economy_desc:0 ""
 RHUN_stolen_steel_profits:0 "Stolen Steel Profits"
 RHUN_stolen_steel_profits_desc:0 ""
 RHUN_to_war:0 "To War!"
 RHUN_to_war_desc:0 ""
 RHUN_sovereign_pride:0 "Sovereign Pride"
 RHUN_sovereign_pride_desc:0 "After countless centuries of division and strife, the various tribes that inhabit the steppes of the east have set their differences aside and conceived a political system that allows them to act as one cohesive force."
 #chariot tactics
 RHUN_advanced_chariot_tactics_1:0 "Advanced Chariot Tactics"
 RHUN_advanced_chariot_tactics_1_desc:0 "The chariot riders of Rhûn are as renowned for their lethality as the Mûmakil of the Haradrim, or the knights of Dol Amroth. Few would be so foolish as to deign meeting them on an open battlefield."
 RHUN_advanced_chariot_tactics_2:0 "Advanced Chariot Tactics"
 RHUN_advanced_chariot_tactics_2_desc:0 "The chariot riders of Rhûn are as renowned for their lethality as the Mûmakil of the Haradrim, or the knights of Dol Amroth. Few would be so foolish as to deign meeting them on an open battlefield."
