lthi_influence_bonuses: "Elven Faction Bonuses"
lthi_influence_bonuses_desc: "The people of Lothlórien are comprised of elves from many different backgrounds and heritages. Each faction contributes their unique skills and knowledge, based on how much influence they have over the silver enclave."

lothlorien_influence_decisions_category: "Lothlórien's Elven Factions"
lth_immortal_endurance_modifier: "Immortal Endurance"
lth_immortal_endurance_modifier_desc: "The longevity of elven immortality comes with a mental tenacity that primitive mortals cannot even begin to comprehend."
