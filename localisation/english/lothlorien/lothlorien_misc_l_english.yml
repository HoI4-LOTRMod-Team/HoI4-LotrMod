LTH_harmonic_ascendancy: "Harmonic Ascendancy"
LTH_harmonic_ascendancy_desc: "A new era dawns upon the enchanting realm of Lothlórien as Lady Galadriel and Lord Celeborn cast aside the fractures that once divided them, and agree to once more work together in the interests of the people of Lothlórien.\n\nTime must pass until the wounds of the schism heal and the two rulers bridge the gaps that once separated them. Once they do, the path will paved for a future where their combined strength and wisdom will usher in a new age for our realm."

LTH_harmonic_ascendancy_2: "Harmonic Ascendancy"
LTH_harmonic_ascendancy_2_desc: "A new era dawns upon the enchanting realm of Lothlórien as Lady Galadriel and Lord Celeborn cast aside the fractures that once divided them, and agree to once more work together in the interests of the people of Lothlórien.\n\nTime must pass until the wounds of the schism heal and the two rulers bridge the gaps that once separated them. Once they do, the path will paved for a future where their combined strength and wisdom will usher in a new age for our realm."

