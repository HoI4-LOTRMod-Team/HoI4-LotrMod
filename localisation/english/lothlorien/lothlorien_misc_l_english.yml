LTH_total_isolation_idea: "Total Isolation"
LTH_total_isolation_idea_desc: "Enveloped in an aura of isolation, Lothlórien has chosen the path of self-sufficiency and fortification. Turning inward, the realm withdraws from the tumultuous world, focusing on unassailable defenses and enduring the storm of Middle-earth's conflicts in solitude."

LTH_isolationist_reservations_total_isolation: "Isolationist Reservations"
LTH_isolationist_reservations_3: "Isolationist Reservations"
LTH_isolationist_reservations_2: "Isolationist Reservations"
LTH_isolationist_reservations_1: "Isolationist Reservations"

LTH_isolationist_reservations_total_isolation_desc: "Rooted in a tradition of solitude, Lothlórien's inhabitants hold to a reserved stance, preferring the company of their own kind and the sanctuary of their enchanted realm. Diplomacy is approached with caution, as the elves of Lothlórien remain hesitant to venture beyond their borders, safeguarding their way of life from the uncertainties of the wider world."
LTH_isolationist_reservations_3_desc: "Rooted in a tradition of solitude, Lothlórien's inhabitants hold to a reserved stance, preferring the company of their own kind and the sanctuary of their enchanted realm. Diplomacy is approached with caution, as the elves of Lothlórien remain hesitant to venture beyond their borders, safeguarding their way of life from the uncertainties of the wider world."
LTH_isolationist_reservations_2_desc: "Rooted in a tradition of solitude, Lothlórien's inhabitants hold to a reserved stance, preferring the company of their own kind and the sanctuary of their enchanted realm. Diplomacy is approached with caution, as the elves of Lothlórien remain hesitant to venture beyond their borders, safeguarding their way of life from the uncertainties of the wider world."
LTH_isolationist_reservations_1_desc: "Rooted in a tradition of solitude, Lothlórien's inhabitants hold to a reserved stance, preferring the company of their own kind and the sanctuary of their enchanted realm. Diplomacy is approached with caution, as the elves of Lothlórien remain hesitant to venture beyond their borders, safeguarding their way of life from the uncertainties of the wider world."

LTH_celeborn_and_galadriel: "Rule of Celeborn and Galadriel"
LTH_celeborn_and_galadriel_desc: "Celeborn and Galadriel are the joint, benevolent leaders of Lothlórien. Their wisdom and strength has guided the realm through previous perils. The populance has complete confidence in their leadership"

LTH_great_schism: "The Schism"
LTH_great_schism_desc: "In the time of crisis, differences in world-view have led to unprecedented tensions between Celeborn and Galadriel. If these disagreements are not solved soon, it could have catastrophic consequences."

LTH_celeborn_and_galadriel_mended: "Rule of Celeborn and Galadriel Mended"
LTH_celeborn_and_galadriel_mended_desc: "Celeborn and Galadriel, despite their opposing perspectives, have reconciled their differences to form an alliance that navigates the realms between egalitarianism and authority."

LTH_sky_soil_and_water: "Sky, Soil and Water"
LTH_sky_soil_and_water_desc: "Lothlórien has reaffirmed the Ñoldorin oath of Fëanor, which lays claim to the infamous Silmarils. As prohpesized by Mandor, the Silmarils are now embedded into the three elements of sky, soil and water, but that does not nullify the Oath."

LTH_the_last_eldar: "Last Eldar of Middle-Earth"
LTH_the_last_eldar_desc: "As the last enclave of the Eldar in Middle-Earth, Lothlórien preserves ancient elven traditions and wisdom. Acting as the solemn rear-guard of Elvendom, these prevailing elves are unrivaled in their prowess for war and wisdom."

LTH_the_sacred_trees: "Magical Essence of the Mallorn Trees"
LTH_the_sacred_trees_desc: "The Mallorn trees, revered and magical, lend their guardianship to Lothlórien, bestowing the realm with both beauty and enchantment"

LTH_the_sacred_trees_2: "Magical Essence of the Mallorn Trees"
LTH_the_sacred_trees_2_desc: "The Mallorn trees, revered and magical, lend their guardianship to Lothlórien, bestowing the realm with both beauty and enchantment"

LTH_blades_of_the_eldar: "Blades of the Eldar"
LTH_blades_of_the_eldar_desc: "An elven warriors wield blades forged with the precision and artistry of the Eldar. Their enchanted blades glow in presence of orcs and goblins."

LTH_silverthorn_arrows: "Silverthorn Arrows"
LTH_silverthorn_arrows_desc: "Lothlórien's archers are famed for their silverthorn arrows, a deadly testament to elven craftsmanship."

LTH_silvan_elite_warriors: "Silvan Elite Warriors"
LTH_silvan_elite_warriors_desc: "Lothlórien's elite warriors are well-versed in silvan combat techniques, blending nature and martial prowess."

LTH_decadent_nobility: "Decadent Nobility"
LTH_decadent_nobility_desc: "The wealthiest and most influential elves of the Golden Wood are primarily concerned with their departure to Valinor. If there were to be a Dark Lord in the need of stopping, it would be best if somebody else took care of it."

LTH_decadent_nobility_coop: "Decadent Nobility"
LTH_decadent_nobility_coop_desc: "The wealthiest and most influential elves of the Golden Wood are primarily concerned with their departure to Valinor. If there were to be a Dark Lord in the need of stopping, it would be best if somebody else took care of it."

LTH_noldor_elite: "Ñoldor Elite"
LTH_noldor_elite_desc: "Lothlórien's nobility is dominated by a powerful cabal of Ñoldrin aristocrats."

LTH_borders_sealed: "Sealed Borders"
LTH_borders_sealed_desc: "Lothlórien's borders are sealed against outside influences. One would be wise not to enter the Golden Wood uninvited."

LTH_hidden_realm: "The Hidden Realm"
LTH_hidden_realm_desc: "Through means of magical enchantments and relentless isolation, Lothlórien has become a hidden realm, preserving its ethereal beauty and enigmatic allure. To most, the elven enclave ruled by Galadriel is little more than a fairytale."

LTH_the_last_stand: "The Last Stand"
LTH_the_last_stand_desc: "In the face of adversity, Lothlórien's inhabitants stand united, ready to defend their realm to the last."

LTH_limited_intervention_idea: "Limited Intervention"
LTH_limited_intervention_idea_desc: "Lothlórien is committed to limited intervention in external conflicts, focusing on self-preservation and maintaining stabilty for long enough to facilitate their departure for Valinor."

LTH_aegis_of_light: "Aegis of Light"
LTH_aegis_of_light_desc: "Whatever happens to rest of Middle Earth, the light of Lothlórien shall never be snuffed out."

LTH_river_anduin_commerce: "River Anduin Commerce"
LTH_river_anduin_commerce_desc: "Lothlórien's commerce benefits from its location along the River Anduin, facilitating trade and cultural exchange."

LTH_unflinching_defender: "Unflinching Defender"
LTH_unflinching_defender_desc: "The lands around the Nimrodel have been the home of elves since early history. The forces of darkness will surely attempt to change that. Let them try, if they dare."

LTH_girdle_of_melian: "Girdle of Melian"
LTH_girdle_of_melian_desc: "A fence enchantment that prevents entry into this country's land without the will and consent of it's rulers."

LTH_tha_fate_of_mortals: "The Fate of Mortals"
LTH_tha_fate_of_mortals_desc: "The sun sets on the pitiful, fleeting existence of the mortal races. How is the fading life of man to compare to the eternity of elvendom?"

LTH_merit_based_advancement: "Merit-Based Advancement"
LTH_merit_based_advancement_desc: "Lothlórien's society values merit, offering advancement based on skill and contribution."

LTH_peasant_assembly: "Peasant Assembly"
LTH_peasant_assembly_desc: "The peasants of this country have an active role in governance, participating in local assemblies to voice their opinions."

LTH_fading_trees: "Fading Mallorn Trees"
LTH_fading_trees_desc: "The mighty Mallorn Trees of Lothlórien have begun to fade. The bond between the elves and trees is decaying."
LTH_fading_trees_2: "Mysterious Disease"
LTH_fading_trees_2_desc: "With the fading of the Mallorn trees, a dark rift has taken hold of Lothlórien. It's people are suffering under a mysterious illness."
LTH_fading_trees_protective_enchantment: "Dark Rift Enchantment"
LTH_fading_trees_protective_enchantment_desc: "With the dark rift expunged, Lothlórien enjoys the boons of newly created protective enchantment."

investigate_the_giant: "Investigate the giant"
investigate_the_giant_desc: "The mystical mound we discovered appears to be a dormant giant. We should investigate it."
investigate_the_giant_2: "Attack the giant"
investigate_the_giant_2_desc: "The giant has defeated our forces before, but this time we come better prepared."
lothlorien_mirror_decisions_category: "Galadriel's Mirror"
LTH_giant_slayer: "Giant Slayer"
LTH_giant_slayer_desc: "This nation has slain a giant."
m_storyline_giant_arrows: "Has acquired giantslayer arrows"
m_storyline_giant_rod: "Has acquired a control rod"
LTH_loose_giant: "Loose Giant"
LTH_loose_giant_desc: "A giant wanders aimlessly through the forests of Lothlórien."
LTH_fortification_focus: "Fortification Focus"

