l_english:
 thefateofangmar:0 "The Fate of Angmar"
 thefateofangmar_desc:0 "Angmar was once the iron fist of the Witch-king, raised in the cold North to break the kingdoms of Men and drown Arnor in shadow. Though its armies were shattered and its dark lord driven from the field, the memory of that realm has never truly faded. Among the ruins of Carn Dûm and the frozen wastes, old loyalties, old fears, and old ambitions still linger. Now, as darkness gathers once more in the East, Angmar must decide whether it shall remain a corpse of history or rise again under a new fate."

 ANG_neutral_foreign_policy:0 "Neutral Foreign Policy"
 ANG_neutral_foreign_policy_desc:0 "Angmar stands at a dangerous crossroads, surrounded by old enemies, uncertain neighbours, and powers that would gladly pull the North into their own designs. A neutral foreign policy will allow the realm to act with caution while preserving the freedom to choose its own course. We will neither kneel to Mordor nor bind ourselves blindly to distant crowns."

 ANG_denounce_the_witch_king_neutral_path:0 "Cast Off the Mantle"
 ANG_denounce_the_witch_king_neutral_path_desc:0 "The Witch-king's shadow has long clung to Angmar, shaping how its people are feared abroad and how they see themselves at home. Yet the realm cannot build a future while wearing the mantle of a fallen tyrant. By denouncing his legacy, Angmar sends a clear message to Mordor and to the North alike. The days of serving as a weapon of darkness are over."

 ANG_deterrence:0 "Deterrence"
 ANG_deterrence_desc:0 "Neutrality without strength is only an invitation to be tested. Angmar must make clear that any threat against its borders will be met with steel, discipline, and the full resolve of the northern realm. Peace will be preserved not by promises alone, but by the knowledge that aggression will carry a price."
 ANG_its_in_the_past:0 "Bridge Old Schisms"
 ANG_its_in_the_past_desc:0 "The scars left by the wars of old still divide the peoples of the North. Yet endless suspicion serves only those who wish to see the region weak and divided. By acknowledging the past without surrendering to it, Angmar can begin to bridge the old schisms and prepare for a more stable future."
 ANG_non_agression:0 "Policy of Non-Aggression"
 ANG_non_agression_desc:0 "Angmar has no need to waste its strength in reckless wars or inherited grudges. A policy of non-aggression will signal that the realm seeks security, not conquest, and that its neighbours have more to gain from peace than from fear. The North must have room to breathe before it can truly recover."
 ANG_request_investment_neighbours:0 "Attract Foreign Investment"
 ANG_request_investment_neighbours_desc:0 "The rebuilding of Angmar will require more than pride and promises. Roads, workshops, and towns must be restored, and outside investment can help turn northern isolation into northern opportunity. By opening controlled channels of trade and capital, Angmar can strengthen itself without surrendering its independence."

 ANG_focus_on_industry_1:0 "Focus on Industry"
 ANG_focus_on_industry_1_desc:0 "Angmar's future cannot rest on ruined halls and memories of vanished power. The realm must turn its attention to workshops, mines, roads, and the practical foundations of recovery. A stronger industry will give Angmar the means to defend itself and shape its own destiny."
 ANG_focus_on_industry_2:0 "Expand the Industry"
 ANG_focus_on_industry_2_desc:0 "The first steps of reconstruction have shown what the North can still become. By expanding our industrial base, Angmar can move beyond survival and begin to build real strength. The cold lands of the North may be harsh, but they still hold the resources needed for renewal."
 ANG_better_roads:0 "Winter Roads"
 ANG_better_roads_desc:0 "The roads of Angmar were never made for comfort, and winter has broken many of those that remain. If armies, workers, and supplies are to move across the northern wastes, the realm must invest in roads that can endure snow, stone, and war. Better roads will bind Angmar together where distance once divided it."


 ANG_stay_true_to_the_people:0 "Stay True to the People"
 ANG_stay_true_to_the_people_desc:0 "Angmar's past was written by kings, tyrants, and dark powers, but its future need not be. The people of the North have endured war, ruin, and suspicion for generations. If the realm is to be reborn, it must be built for those who live beneath its cold skies, not for the ambitions of another master."
 ANG_invest_in_the_people:0 "Invest in the People"
 ANG_invest_in_the_people_desc:0 "No realm can rise if its people are left poor, fearful, and forgotten. Angmar must invest in homes, food, education, and local security if it wishes to become more than a fortress against the dark. The strength of the North will come from its people before it comes from its armies."
 ANG_establish_democratic_goverment:0 "Establish a Democratic Goverment"
 ANG_establish_democratic_goverment_desc:0 "The old ways placed the fate of Angmar in the hands of masters who ruled by fear and command. A new government must answer to the people and give them a voice in the future of their homeland. Democracy in Angmar will not erase the past, but it can ensure that such darkness never rules unchecked again."
 ANG_grow_a_forest:0 "Establish a Woodcutter's Camp"
 ANG_grow_a_forest_desc:0 "The rebuilding of Angmar demands timber, tools, and steady work. Establishing a woodcutter's camp will provide materials for construction while giving the local population a clear stake in the realm's recovery. Even in the cold North, practical industry can take root."
 ANG_change_in_governing:0 "Change in Government"
 ANG_change_in_governing_desc:0 "A realm cannot claim to serve its people while ruling them through old habits of fear and secrecy. Angmar must reform its institutions, replace loyalists of the old order, and build a government that can survive without the shadow of the Witch-king behind it. This change will not be easy, but it is necessary."

 ANG_send_out_a_warning_desc:0 "The orcs of Mount Gundabad have long troubled the North with raids, threats, and cruelty from their mountain stronghold. Yet not every conflict must end in conquest if the enemy is willing to step back from darkness. Angmar will send a clear warning to Gundabad, offering them a final chance to abandon their hostility and support a more cooperative future for the North."

 ANG_defeat_our_neighbours_evil_desc:0 "If Gundabad refuses the path of cooperation, warnings will no longer be enough. So long as the orcs remain entrenched in their halls and committed to violence, the roads of the North will remain unsafe and Angmar's future will remain threatened. To protect our people and secure the region, Gundabad must be forced into submission."


 ANG_denounce_the_witch_king:0 "Denounce the Witch-King"
 ANG_denounce_the_witch_king_desc:0 "The name of the Witch-king has poisoned Angmar for too long. His rule brought fear, ruin, and servitude to powers that cared nothing for the people of the North. By denouncing him openly, Angmar breaks with its darkest legacy and claims the right to define itself anew."
 ANG_create_faction:0 "The Northern Alliance"
 ANG_create_faction_desc:0 "The North has too often stood divided while greater powers shaped its fate. A Northern Alliance can unite those who fear Mordor, distrust old imperial ambitions, and seek stability beyond the reach of southern courts. Together, the peoples of the North can become more than scattered survivors."
 ANG_protector_of_the_north:0 "Protector of the North"
 ANG_protector_of_the_north_desc:0 "Angmar's strength gives it a responsibility that cannot be ignored. The realm must protect the roads, borders, and settlements of the North from orcs, raiders, and the influence of Mordor. By acting as protector rather than conqueror, Angmar may finally earn the trust it once destroyed."
 ANG_invite_gundabad_coop:0 "Invite Gundabad"
 ANG_invite_gundabad_coop_desc:0 "Gundabad has long been a source of fear, but endless war would only bleed the North further. If its rulers can be drawn away from Mordor and bound to a broader northern order, an old enemy may become a useful partner. Peace with Gundabad will be difficult, but domination is not the only path to security."
 ANG_create_a_university:0 "Build an University"
 ANG_create_a_university_desc:0 "The future of Angmar cannot be built by soldiers and workers alone. Scholars, engineers, healers, and administrators are needed if the realm is to stand among the powers of Middle-earth. A university in the North will turn knowledge into strength and give the next generation more than war to inherit."
 ANG_improve_gondor_relations:0 "Improve Relations"
 ANG_improve_gondor_relations_desc:0 "Gondor remembers Angmar as an enemy of Men, and not without reason. Still, the threat of Mordor gives both realms reason to seek understanding instead of bitterness. Improving relations with Gondor will not erase history, but it may open the way to cooperation against a far greater darkness."
 ANG_join_gondor:0 "Unite with Gondor"
 ANG_join_gondor_desc:0 "The Shadow in the East grows stronger, and divided resistance may not be enough. By uniting with Gondor, Angmar can place its strength beside the greatest realm of Men still standing against Mordor. It is a difficult step for a proud northern people, but survival may demand more than pride."
 ANG_gondor_research_sharing:0 "Research Sharing"
 ANG_gondor_research_sharing_desc:0 "Gondor holds centuries of military, architectural, and administrative knowledge, while Angmar offers hard lessons learned in the North. By sharing research, both realms can strengthen their defenses and prepare for the coming war. Cooperation will turn old suspicion into practical advantage."
 ANG_nal_trade_route_gondor:0 "Naval Trade Agremeent"
 ANG_nal_trade_route_gondor_desc:0 "A formal trade agreement with Gondor will connect Angmar to southern markets and resources. Goods, tools, and knowledge can flow where distrust once closed the road. The agreement will also show that Angmar seeks a lawful place among the realms opposed to Mordor."
 ANG_request_outpost_gondor:0 "Request Tol-Fuin"
 ANG_request_outpost_gondor_desc:0 "Tol-Fuin lies far from Angmar's heartland, yet its position near Gondor and the southern lands gives it great strategic value. By requesting access to the outpost, we can strengthen cooperation with Gondor while gaining a foothold from which to watch the movements of Harad and other threats beyond the southern frontier. If Gondor accepts, it will be a clear sign that Angmar is no longer judged only by its past."


 ANG_reconcile_with_arnor:0 "Reconcile with Arnor"
 ANG_reconcile_with_arnor_desc:0 "No wound in the North runs deeper than the fall of Arnor and the role Angmar played in its destruction. Reconciliation will require humility, guarantees, and a willingness to face old crimes without hiding behind necessity. If peace is to endure, Angmar and the heirs of Arnor must finally speak as neighbours rather than ghosts of an ancient war."
 ANG_reunification_with_rhudaur:0 "Reunification with Rhudaur"
 ANG_reunification_with_rhudaur_desc:0 "Rhudaur has long stood between Angmar and the broken legacy of Arnor. Reunification offers a chance to bring divided northern lands under a stable and cooperative order. If handled with care, this union can heal old fractures instead of repeating the conquests of the past."
 ANG_supply_the_angle:0 "Supply the Angle"
 ANG_supply_the_angle_desc:0 "The Angle remains a vital region for any northern alliance, yet its security is fragile and its needs are immediate. By supplying the area with equipment, food, and support, Angmar can prove that its promises are backed by action. Trust is earned fastest when help arrives before speeches."
 ANG_invite_cardolan:0 "Invite Cardolan"
 ANG_invite_cardolan_desc:0 "Cardolan has suffered from the same divisions and dangers that weakened the North for generations. Inviting it into our alliance will strengthen the common defense and bring another fragment of the old realm into a shared future. The North cannot be rebuilt one isolated land at a time."
 ANG_invite_arthedain:0 "Invite Arthedain"
 ANG_invite_arthedain_desc:0 "Arthedain carries the proudest surviving memory of Arnor, and its cooperation would give legitimacy to any northern project. Inviting Arthedain is more than diplomacy, it is a test of whether the old enemies of the North can finally stand together. If they accept, the alliance will gain both strength and meaning."
 ANG_request_control_north_arthedain:0 "Request Northern Arthedain"
 ANG_request_control_north_arthedain_desc:0 "The northern reaches of Arthedain were once bound to the long and bitter history between Angmar and the kingdoms of Arnor. Though those lands are no longer a battlefield, their legacy remains tied to our own. By requesting control through negotiation rather than force, Angmar can seek the return of historic territories while proving that its ambitions no longer need to be carried by war."


 ANG_intergrate_trade_within_faction:0 "Integrate Trade within the Faction"
 ANG_intergrate_trade_within_faction_desc:0 "A political alliance is weak if its members remain economically divided. Integrated trade will allow goods, timber, ore, tools, and food to move across the faction with fewer delays and fewer rival interests. The North must become a functioning region, not merely a collection of banners."
 ANG_invest_in_our_country:0 "Invest in [ROOT.GetName]"
 ANG_invest_in_our_country_desc:0 "The lands tied to Angmar's future must not be left neglected, whether they stand under our direct rule or beside us as allies. Roads, workshops, farms, and settlements all require support if the North is to become more than a patchwork of weak realms. By investing in these territories, we strengthen the foundations of a greater northern order."
 ANG_the_true_arnor:0 "The True Arnor"
 ANG_the_true_arnor_desc:0 "Arthedain clings to the name of Arnor, but names alone do not restore a fallen kingdom. If the North is to be united, it must be led by a power willing to act rather than wait for old claims to settle themselves. Angmar will press its claim as the true heir of Arnor, and if Arthedain refuses to accept this new reality, the matter will be settled by force."
 ANG_establish_new_arnor:0 "Establish New Arnor"
 ANG_establish_new_arnor_desc:0 "The old Arnor collapsed under division, weakness, and war. From its ruins, Angmar shall proclaim a new Arnor, forged not by nostalgia but by strength and unity. The realm that rises now will not beg for recognition from broken heirs. It will impose order upon the North and give the name of Arnor a future once again."
 ANG_establish_new_borders:0 "Establish New Borders"
 ANG_establish_new_borders_desc:0 "A reborn Arnor cannot exist while its borders remain trapped in the disputes of dead kingdoms and fading dynasties. The lands of Arthedain belong within the northern order we are building, and our claims must be made clear before the world. These new borders will define the shape of the realm to come."
 
 ANG_republic_of_angmar:0 "The Republic of Angmar"
 ANG_republic_of_angmar_desc:0 "The Republic of Angmar marks a decisive break from the thrones and shadows that once ruled the North. Authority will no longer flow from terror, bloodline, or dark inheritance, but from the people and the institutions that represent them. It is a bold experiment for a harsh land, but one worth defending."
 ANG_nation_of_the_people:0 "Nation of the People"
 ANG_nation_of_the_people_desc:0 "Angmar must become a nation whose people are more than subjects, soldiers, or survivors. Their labor, loyalty, and voice will form the foundation of the new state. A people who believe the realm belongs to them will defend it with a strength no tyrant can command."
 ANG_mountain_pass:0 "The Mountain Pass"
 ANG_mountain_pass_desc:0 "The northern reaches of the Anduin Vale hold great value for any power seeking influence beyond the Misty Mountains. By requesting control over these lands, Angmar can secure a stronger position along the eastern approaches and extend its reach into a region shaped by trade, movement, and strategic opportunity. Such a demand must be framed carefully, but its importance to our future cannot be ignored."
 ANG_wood_and_string_mirkwood:0 "Sharing is Caring"
 ANG_wood_and_string_mirkwood_desc:0 "Mirkwood's craftsmen and hunters know the value of strong wood, reliable bows, and practical exchange. A cooperative arrangement will give Angmar access to materials and techniques suited for the wars ahead. In the North, even modest trade can carry serious military value."
 ANG_core_east_world:0 "Integrate the Eastern Territories"
 ANG_core_east_world_desc:0 "The newly gained lands of the northern Anduin Vale cannot remain a distant possession or a temporary arrangement. If they are to serve the future of Angmar, they must be brought fully into our administration, protected by our forces, and tied to our economy. Integration will turn these eastern territories from contested borderlands into a lasting part of the realm."

 ANG_wisdom_of_centries:0 "Wisdom of Centuries"
 ANG_wisdom_of_centries_desc:0 "The peoples of the North have endured centuries of war, winter, exile, and recovery. Their memories carry lessons that no new ruler should ignore. By drawing on this wisdom, Angmar can avoid the arrogance that destroyed older kingdoms and build with patience instead of vanity."
 ANG_the_true_ruler_of_the_north:0 "True Ruler of the North"
 ANG_the_true_ruler_of_the_north_desc:0 "The North needs leadership strong enough to protect it and wise enough not to repeat the crimes of the past. Angmar now claims that role not as a servant of darkness, but as the power capable of holding the region together. Whether others accept the claim will depend on what we do with it."

 ANG_wargoal_isengard:0 "Pre-empt the threat"
 ANG_wargoal_isengard_desc:0 "Isengard's ambition cannot be ignored while the world moves toward war. If Saruman's designs threaten the free peoples and the balance of the West, Angmar must act before Orthanc becomes another tower of darkness. A pre-emptive strike may prevent a greater disaster later."
 ANG_enslave_the_uruk_hai:0 "Enslave the Uruk-hai"
 ANG_enslave_the_uruk_hai_desc:0 "The Uruk-hai were bred for war and obedience, shaped by a will that saw them only as weapons. Angmar will turn that brutal legacy to its own purposes and force them into service. It is a harsh solution, but the wars ahead will not be won by sentiment alone."
 ANG_reinstate_orthanc:0 "Reinstate the Tower of Orthanc"
 ANG_reinstate_orthanc_desc:0 "Orthanc is too powerful a fortress to be left leaderless, ruined, or contested. Reinstating authority over the tower will secure Isengard and deny its use to darker powers. Under firm control, the tower can become a shield rather than a dagger pointed at the West."
 ANG_orthanc_give_back_to_gondor:0 "Return Orthanc to its Rightful Owner"
 ANG_orthanc_give_back_to_gondor_desc:0 "Orthanc rightfully belongs within the order of the West, and returning it to Gondor would show that Angmar's intentions are not imperial. Still, such a transfer cannot ignore the cost of taking and securing the tower. Good faith deserves recognition, but sacrifice deserves compensation."
 ANG_saruman_has_betrayed_us:0 "Strike Back at Saruman"
ANG_saruman_has_betrayed_us_desc:0 "Saruman believed he could claim the power of darkness for himself while turning against the will of Sauron. Such betrayal cannot be tolerated by those who still serve the true Dark Lord. Angmar must answer this treachery with force and remind Isengard that ambition without obedience leads only to ruin."

### Alternate
 ANG_seek_former_glory:0 "Seek Former Glory"
 ANG_seek_former_glory_desc:0 "The North remembers..."
 ANG_civil_unrest:0 "Civil unrest"
 ANG_civil_unrest_desc:0 "Its the fucking Boltons all over again."

### Belligerent ###
 ANG_back_to_the_old_ways:0 "Pivot to the Past"
 ANG_back_to_the_old_ways_desc:0 "The North remembers the terror of Angmar, but some within the realm remember it as strength. They reject apology, cooperation, and weakness, demanding a return to the discipline and ambition of the old order. What was once buried beneath snow and ruin now begins to stir again."
 ANG_seek_help_from_mordor:0 "Seek Help from Mordor"
 ANG_seek_help_from_mordor_desc:0 "Mordor understands power in a way the softer realms of the West never will. If Angmar is to reclaim its place, it may need the aid of the Dark Lord and the resources of the East. Such help will come at a price, but ambition has never been cheap."
 ANG_join_forces_with_orcs:0 "Join Forces with the Orcs"
 ANG_join_forces_with_orcs_desc:0 "The orcs of the North are brutal, unruly, and hated by our enemies, which makes them useful. By joining forces with them, Angmar can field armies that civilized realms would fear to face. This alliance will disgust the weak, but it will strengthen the realm."
 ANG_strengthen_the_new_goverment:0 "Strengthen the New Government"
 ANG_strengthen_the_new_goverment_desc:0 "The rise of a new government has left Angmar divided, uncertain, and restless. If the realm is to move forward, disorder must be brought under control and the authority of the state must be restored in every town, fortress, and province. By securing loyal support and ending the unrest, the new leadership can finally turn its rule from a fragile claim into a stable order."


 ANG_unite_with_sauron:0 "Unite with Sauron"
 ANG_unite_with_sauron_desc:0 "The Dark Lord rises, and Angmar must choose whether to resist the inevitable or stand beside it. Unity with Sauron offers protection, power, and a place in the coming order of Middle-earth. Those who once feared Angmar will learn to fear it again as part of a greater shadow."
 ANG_welcome_back_the_old_master:0 "Welcome Back the Old Master"
 ANG_welcome_back_the_old_master_desc:0 "Didnt hear no Bell."

 ANG_a_force_for_our_master:0 "A Force for our Master"
 ANG_a_force_for_our_master_desc:0 "Sauron's cause demands more than words of loyalty. Angmar must build an army worthy of its master, disciplined enough to obey and ruthless enough to prevail. The North will provide steel, blood, and terror for the wars to come."
 ANG_demand_gundabad:0 "Pressure Gundabad"
 ANG_demand_gundabad_desc:0 "Gundabad cannot remain outside the designs of Angmar and Sauron while war gathers across Middle-earth. Its orcs must be made to understand that isolation is no longer an option. Through pressure, threats, and the promise of shared conquest, we shall force Gundabad to join our cause and take its place within the armies of the Dark Lord."

 ANG_honor_morgoth:0 "Honor Morgoth"
 ANG_honor_morgoth_desc:0 "Before Sauron, before the Witch-king, there was Morgoth, the first darkness and the first source of terror. Honoring his memory binds Angmar to a legacy older and deeper than any mortal kingdom. It is a declaration that our cause reaches into the oldest hatred of the world."
 ANG_cult_of_the_witch_king:0 "Cult of the Witch King"
 ANG_cult_of_the_witch_king_desc:0 "For when you reaaally need that manpower."

 ANG_request_investment:0 "Request Investment"
 ANG_request_investment_desc:0 "Mordor and its allies possess resources that Angmar desperately needs. Requesting investment will strengthen our mines, workshops, and war economy while tying our realm more closely to the shadow in the East. Gold and steel are rarely innocent, but they are always useful."
 ANG_restore_carn_dum:0 "Restore Carn Dûm"
 ANG_restore_carn_dum_desc:0 "Carn Dûm was once the dark heart of Angmar, a fortress whose name carried dread through the North. Restoring it will give the realm a capital worthy of its ambitions and a symbol around which loyalists can rally. The old stones will rise again, and with them the power they once represented."
 ANG_restore_fornost:0 "Restore Fornost"
 ANG_restore_fornost_desc:0 "Fornost was once a proud seat of Arnor before war and ruin claimed it. Restoring the city under Angmar's control would be a triumph over the memory of our enemies and a practical gain for the realm. The ruins of old kingdoms will serve the power that outlasted them."

 ANG_our_own_empire:0 "Our own Empire"
 ANG_our_own_empire_desc:0 "THE KING IN THE NORTH!"
 ANG_orc_lead_faction:0 "Orc Lead faction"
 ANG_orc_lead_faction_desc:0 "Angmar will not trade one master for another. If Sauron believes every dark power in the North must bend to his will, he has mistaken obedience for strength. By gathering the orc tribes under our own banner, we shall forge a faction led from the North itself, bound not to Mordor's designs but to Angmar's ambition and the promise of conquest."

 ANG_find_a_new_leader:0 "Find a New Leader"
 ANG_find_a_new_leader_desc:0 "Has anyone seen Jon Snow?"
 ANG_demand_submission_rhudaur:0 "Demand their Submission"
 ANG_demand_submission_rhudaur_desc:0 "Rhudaur has lingered too long in weakness and uncertainty. Angmar will demand submission and bring the land into its sphere by pressure if possible and by force if necessary. The northern order will not be delayed by hesitant neighbours."
 ANG_strengthen_our_bonds:0 "Strengthen our Bonds"
 ANG_strengthen_our_bonds_desc:0 "Rhudaur now stands beneath Angmar's influence, but control alone is not enough to secure lasting loyalty. Its rulers, soldiers, and people must be tied more closely to our cause through obligation, protection, and shared ambition. By strengthening these bonds, Rhudaur can become more than a subject. It can become a reliable pillar of Angmar's growing power."

 ANG_legacy_of_a_new_king:0 "Legacy of a New King"
 ANG_legacy_of_a_new_king_desc:0 "He got sent back to the wall..."
 ANG_invite_gundabad:0 "Invite Gundabad"
 ANG_invite_gundabad_desc:0 "Gundabad's strength would be wasted as an enemy and valuable as an ally. By inviting its rulers into our order, Angmar can bind the mountain to a larger northern design. Their savagery will be given direction, and their raids will become strategy."
 ANG_strengthen_the_army:0 "Strengthen the Army"
 ANG_strengthen_the_army_desc:0 "Diplomacy, terror, and claims mean little without an army able to enforce them. Angmar must expand training, improve command, and prepare its forces for the campaigns ahead. The North will not be ruled by speeches, but by disciplined steel."

 ANG_ruler_of_the_west_coast:0 "Rules of the West Coast"
 ANG_ruler_of_the_west_coast_desc:0 "The western coast offers ports, trade, and strategic reach far beyond Angmar's frozen heartland. Control there would give the realm access to the sea and a stronger position against rivals in the West. The coast must be brought under our influence before others seize the advantage."
 ANG_ruler_by_force:0 "Ruler by Force"
 ANG_ruler_by_force_desc:0 "Some lands will not accept Angmar's rule through diplomacy, fear, or promise. They will have to be made to accept it. Force may create enemies, but weakness invites more of them."
 ANG_reclaim_the_arthedain:0 "Reclaim Arthedain"
 ANG_reclaim_the_arthedain_desc:0 "Arthedain carries the memory of Arnor and the pride of those who once resisted Angmar. Reclaiming it would complete an old ambition and shatter one of the last symbols of northern defiance. The banners of Angmar will fly where its enemies once stood."
 ANG_reclaim_cardolan:0 "Reclaim Cardolan"
 ANG_reclaim_cardolan_desc:0 "Cardolan's lands are part of the broken inheritance of the North, and they cannot remain beyond our reach. By reclaiming them, Angmar extends its authority and tightens its grip over the old territories of Arnor. The map must be redrawn by strength, not nostalgia."
 ANG_reclaim_rhudaur:0 "Reclaim Rhudaur"
 ANG_reclaim_rhudaur_desc:0 "Rhudaur has too often drifted between weakness, survival, and opportunism. Angmar will reclaim it and bind its people, roads, and fortresses to our northern order. What was once contested will become unquestioned."
 ANG_intergrate_rhudaur:0 "Integrate Rhudaur"
 ANG_intergrate_rhudaur_desc:0 "Watch out for trolls."

 ANG_reinstate_our_formor_glory:0 "Affirm our Former Glory"
 ANG_reinstate_our_formor_glory_desc:0 "The time for apology and hesitation has ended. Angmar will affirm its former glory and declare that the realm has not returned to be tolerated, but to be feared and obeyed. The North will remember what power looks like."
 ANG_avenge_rivendell:0 "Revenge on Rivendell"
 ANG_avenge_rivendell_desc:0 "Rivendell has long stood as a refuge of Elven pride and resistance to the designs of darkness. To strike it would avenge old humiliations and remove a beacon that has guided our enemies for too long. The hidden valley will learn that memory cuts both ways."
 ANG_expend_to_the_east:0 "Expand to the East"
 ANG_expend_to_the_east_desc:0 "The East offers space, resources, and new routes for Angmar's ambitions. Expansion there will reduce dependence on the fractured North and open a wider field for conquest. A realm that looks only backward will never become an empire again."

 ANG_boost_the_industry:0 "Boost the industry"
 ANG_boost_the_industry_desc:0 "Angmar's ambitions require workshops, mines, roads, and a labor force capable of sustaining growth. A general boost to industry will provide the foundation for both civilian recovery and military expansion. Without production, every plan remains only ink on a map."
 ANG_dig_out_the_mountains:0 "Dig Out the Mountains"
 ANG_dig_out_the_mountains_desc:0 "The mountains of the North hold stone, ore, and hidden wealth beneath their frozen slopes. By digging deeper and organizing extraction, Angmar can turn harsh terrain into economic strength. What once isolated the realm will now feed its industry."
 ANG_boost_the_industry_civilian:0 "Boost the Civilian Industry"
 ANG_boost_the_industry_civilian_desc:0 "Civilian industry is the backbone of reconstruction. More workshops, tools, and building capacity will allow Angmar to repair its towns and expand its infrastructure. A realm that can build quickly can recover quickly."
 ANG_long_term_plan:0 "The Long Term Plan"
 ANG_long_term_plan_desc:0 "Angmar must look beyond emergency measures and short bursts of production. A long term industrial plan will coordinate mines, farms, roads, and workshops into a stable economic strategy. The North will not be rebuilt by improvisation alone."
 ANG_boost_the_industry_civilian_2:0 "Expand the Civilian Workshops"
 ANG_boost_the_industry_civilian_2_desc:0 "The first workshops have proven their value, but Angmar's needs continue to grow. Expanding civilian production will allow greater construction efforts and support a stronger domestic economy. The realm must build the tools with which it will build everything else."
 ANG_expand_the_farms:0 "Farm Expansion"
 ANG_expand_the_farms_desc:0 "The cold lands of Angmar make farming difficult, but not impossible. Expanding farms and improving food distribution will support a growing population and reduce dependence on outside supplies. Armies march on food long before they march on glory."
 ANG_a_human_lead_industry:0 "Human led Industry"
 ANG_a_human_lead_industry_desc:0 "A human led industry will rely on skilled workers, stable communities, and practical administration. It may grow more slowly than forced labor, but it will create a more durable economy and a population invested in the realm's success. Angmar can build strength without devouring its own people."
 ANG_a_orc_lead_industry:0 "Orc led Industry"
 ANG_a_orc_lead_industry_desc:0 "An orc led industry values speed, obedience, and brutal output over comfort or stability. Mines and workshops can be driven harder when the labor force is treated as a weapon rather than a community. The result will be harsh, but Angmar's enemies will feel its production soon enough."

### Hidden part
 ANG_the_return_of_sauron:0 "The Necromancer"
 ANG_the_return_of_sauron_desc:0 "The Necromancer is no mere rumor from the south, but the shadow of Sauron returning to power. His rise will change the fate of every realm in Middle-earth, and Angmar cannot remain untouched. Whether as servant, rival, or instrument, the North must prepare for the Dark Lord's return."
 ANG_recall_loyal_troops:0 "Recall the Loyal Troops"
 ANG_recall_loyal_troops_desc:0 "Scattered loyalists still wait in hidden places, old forts, and distant companies. They remember oaths that others have tried to bury and will answer if called. Recalling them will give the regime a hardened force at a moment when secrecy must give way to action."
 ANG_learn_from_past_mistakes:0 "Learn from our Past"
 ANG_learn_from_past_mistakes_desc:0 "The old Angmar fell not only to enemy strength, but also to overreach, division, and arrogance. If the realm is to rise again, it must study those failures without sentiment. A wiser darkness can be more dangerous than a proud one."
 ANG_reorder_production:0 "Reorder Production"
 ANG_reorder_production_desc:0 "The needs of a hidden power are not the needs of an ordinary state. Production must be reordered toward weapons, supplies, and the tools required for sudden expansion. When the time comes, Angmar must be ready before its enemies understand what has begun."
 ANG_orcs_farming_in_secret:0 "Orc Farming in Secret"
 ANG_orcs_farming_in_secret_desc:0 "Orc forces cannot appear from nothing, and open preparation would alarm every neighbouring realm. Secret breeding grounds, camps, and supply routes will allow Angmar to build strength while maintaining the appearance of weakness. By the time the truth is known, it may already be too late."
 ANG_regain_strength:0 "Regain Strength"
 ANG_regain_strength_desc:0 "Years of concealment and weakness have left Angmar diminished, but not broken. Through recruitment, production, and ruthless preparation, the realm can regain the strength it needs for the coming struggle. The shadow in the North will grow quietly before it moves openly."
 ANG_tell_the_world:0 "Re-enter the World"
 ANG_tell_the_world_desc:0 "The time for hiding behind rumor and silence is ending. Angmar will re-enter the world and make its intentions known to allies, enemies, and those still unsure which side they fear more. A realm that has rebuilt in secret can now speak with force."

 ANG_recall_the_nazguls:0 "Recall the Nazgûl"
 ANG_recall_the_nazguls_desc:0 "The Nazgûl are more than servants of Sauron, they are symbols of terror that can bend the courage of armies. Recalling them will bind Angmar more closely to the old darkness and strengthen the hand of those who seek dominion. Where the Ringwraiths ride, fear moves faster than steel."
 ANG_old_allies:0 "Old Allies"
 ANG_old_allies_desc:0 "Angmar's old allies may be scattered, diminished, or hidden, but some bonds of darkness endure across centuries. Reaching out to them can restore networks of loyalty and convenience that once supported the realm's power. Old alliances are dangerous, but familiar dangers can be useful."
 ANG_new_allies:0 "New Allies"
 ANG_new_allies_desc:0 "The world has changed since Angmar's first rise, and new allies must be found among those who share our interests or fear our enemies. Pragmatism will serve where memory fails. If the old order cannot be fully restored, a new web of power must replace it."
 ANG_revenge_the_witch_king:0 "Avenge the Witch King"
 ANG_revenge_the_witch_king_desc:0 "The fall of the Witch-king remains a wound to those who worship his legacy. Revenge will not bring him back, but it will remind the West that Angmar has not forgotten. Blood paid for blood will become the rallying cry of the old loyalists."
 ANG_learn_from_the_civil_war:0 "Learn from the Civil War"
 ANG_learn_from_the_civil_war_desc:0 "Civil war exposed every weakness in Angmar's institutions, loyalties, and command structure. Those lessons must be studied and turned into reforms before another internal struggle destroys the realm from within. Victory means little if the state cannot survive itself."
 ANG_wisedom_of_the_maiar:0 "Wisdom of the Maiar"
 ANG_wisedom_of_the_maiar_desc:0 "The Maiar carry knowledge older than kingdoms and deeper than mortal craft. To draw upon such wisdom is to touch powers that shaped the world before Men understood it. Angmar must treat this knowledge with caution, but also with ambition."
 ANG_honor_morgoth_sauron:0 "Honor Morgoth"
 ANG_honor_morgoth_sauron_desc:0 "Morgoth was the first darkness, and Sauron is his greatest surviving heir. Honoring Morgoth binds our cause to the oldest rebellion against the order of the world. It is not merely worship, but a declaration of where Angmar's deepest loyalties lie."
 ANG_unleash_sauron:0 "Unleash Sauron"
 ANG_unleash_sauron_desc:0 "The Dark Lord has waited behind masks, servants, and whispers for long enough. Unleashing Sauron will cast aside uncertainty and bring the full weight of his power into the struggle for Middle-earth. The age of concealment ends when the Eye opens."
 ANG_retake_mordor:0 "Retake Mordor"
 ANG_retake_mordor_desc:0 "Mordor is the seat of shadow, and whoever controls it commands the greatest fortress of the East. Retaking it will restore order to the Dark Lord's domain and remove any rival authority that dares to claim his land. The Black Land must answer to its true master."
 ANG_control_mordor:0 "Take Back Control"
 ANG_control_mordor_desc:0 "Taking Mordor is only the beginning. Its fortresses, armies, slaves, roads, and fires must be brought under firm control before they can serve a wider war. Without order in Mordor, the shadow will consume itself before it conquers anyone else."
 ANG_pressure_orcs:0 "Pressure the Orcs"
 ANG_pressure_orcs_desc:0 "The orc tribes are useful, but they are rarely obedient without pressure. Angmar must remind them that loyalty is safer than defiance and that service brings rewards only when commands are followed. The whip, the bargain, and the threat must all be ready."

 ANG_orc_farming:0 "Orc Production"
 ANG_orc_farming_desc:0 "Orc production is ugly, brutal, and effective. By expanding breeding grounds, training pits, and supply chains, Angmar can turn raw numbers into a weapon of war. The enemy may despise such methods, but they will still have to survive them."

### Expanded Unaligned

 ANG_the_path_of_balance:0 "Path of Balance"
 ANG_the_path_of_balance_desc:0 "Angmar cannot simply return to the shadow it once served, nor can it surrender its future to the will of distant kings and foreign councils. The North must be rebuilt on its own terms, guided by caution, strength, and the hard lessons of its fallen past. Though Mordor rises once more, Angmar shall face the coming darkness as an independent realm, neither blind to evil nor bound to another's cause."

 ANG_rally_the_people:0 "Rally the People"
 ANG_rally_the_people_desc:0 "The orcs of Mount Gundabad have long cast their shadow over the North, raiding its borders and haunting the old roads of Angmar. Before their threat can be broken, the people must be rallied to the defense of their homeland. From scattered villages, ruined keeps, and hard northern settlements, Angmar shall gather those willing to stand against the darkness in the mountains."

 ANG_put_the_squeeze_in:0 "A Permanent Solution"
 ANG_put_the_squeeze_in_desc:0 "The raids from Mount Gundabad cannot be answered forever with patrols and scattered reprisals. So long as the orcs remain entrenched in their mountain halls, Angmar's borders will never know peace and its people will never be safe. The time has come to end this threat at its source and bring a permanent solution to Gundabad."

 ANG_sole_masters_of_gundabad:0 "Sole Masters of Gundabad"
 ANG_sole_masters_of_gundabad_desc:0 "With Gundabad broken, Angmar can no longer allow the mountain to remain a nest of raiders and rival warlords. The passes, halls, and approaches must be brought under our direct control. From this day forward, Gundabad will serve the security of Angmar rather than threaten it."

 ANG_mend_the_conflict:0 "Mend the Conflict"
 ANG_mend_the_conflict_desc:0 "War with Gundabad would drain the North and feed the very chaos Angmar seeks to overcome. If the conflict can be mended, old raids and grievances may give way to a cold but useful peace. The path is difficult, but even bitter enemies can learn to share a border."

 ANG_sign_a_pact_with_gundabad:0 "Sign a Pact with Gundabad"
 ANG_sign_a_pact_with_gundabad_desc:0 "A pact with Gundabad will not be built on trust, but on necessity. Both sides understand the dangers gathering beyond their borders and the cost of endless skirmishing. By formalizing the peace, Angmar can secure its flank and focus on the greater storms ahead."

 ANG_trade_deal_with_gundabad:0 "Trade Deal with Gundabad"
 ANG_trade_deal_with_gundabad_desc:0 "Trade with Gundabad may be distasteful to some, but iron, stone, tools, and supplies matter more than old disgust. A controlled trade deal will bind the mountain to Angmar's economy and reduce the chance of renewed raids. Commerce can succeed where threats alone have failed."

 ANG_a_new_age_for_angmar:0 "Angmar's New Age"
 ANG_a_new_age_for_angmar_desc:0 "Angmar has survived ruin, fear, and the burden of its own name. Now it can step into a new age defined not by the Witch-king's shadow, but by northern strength, independence, and hard-earned stability. The realm will not forget its past, but it will no longer be imprisoned by it."

 ANG_invite_forodwaith_settlers:0 "Invite Forodwaith Settlers"
 ANG_invite_forodwaith_settlers_desc:0 "The Forodwaith know the northern cold better than any outsider and have endured where others would perish. Inviting their settlers will bring new life, skills, and resilience into Angmar's empty lands. In a harsh realm, those who understand hardship are worth more than gold."

 ANG_integrate_the_settlers:0 "Settler Integration"
 ANG_integrate_the_settlers_desc:0 "Forodwaith settlers cannot remain isolated communities if they are to strengthen the realm. They must be integrated into local administration, trade, defense, and settlement planning. Done carefully, this will expand Angmar's population without erasing the traditions that make them valuable."

 ANG_learn_from_their_methods:0 "Forodwaith Ice-Fishing"
 ANG_learn_from_their_methods_desc:0 "The Forodwaith have survived for generations through methods suited to ice, hunger, and long winters. Their knowledge of fishing, storage, travel, and shelter can improve life across Angmar's northern settlements. Wisdom does not always come from courts or universities."

 ANG_give_the_settlers_jobs:0 "Settler Employment"
 ANG_give_the_settlers_jobs_desc:0 "New settlers need more than land and promises if they are to remain loyal to Angmar. Providing work in farms, roads, fisheries, and workshops will tie them to the realm's recovery. Employment turns outsiders into neighbours and neighbours into citizens."

 ANG_import_dwarven_steel:0 "Import Dwarven Steel"
 ANG_import_dwarven_steel_desc:0 "Dwarven steel is prized across Middle-earth for good reason. Importing it will strengthen Angmar's tools, weapons, and construction efforts while deepening ties with the mountain kingdoms. Good steel is never cheap, but bad steel is paid for in blood."

 ANG_align_with_erebor:0 "Align with Erebor"
 ANG_align_with_erebor_desc:0 "Erebor commands wealth, craft, and influence that Angmar cannot ignore. Aligning with the Dwarves will give the North a stronger economic and military partner against the dangers spreading through Middle-earth. The alliance may be practical rather than warm, but practicality is often enough."

 ANG_join_erebor:0 "Join Erebor"
 ANG_join_erebor_desc:0 "Joining Erebor's sphere offers Angmar security, trade, and access to dwarven expertise. It also marks a clear turn away from Mordor and the old darkness that once defined the realm. Under the mountain's friendship, Angmar can become a northern power without standing alone."

 ANG_learn_from_the_dwarves:0 "Learn from the Dwarves"
 ANG_learn_from_the_dwarves_desc:0 "The Dwarves understand stone, steel, and endurance better than almost any people of Middle-earth. By learning from their craftsmen and engineers, Angmar can improve its mines, forges, and defenses. The North has much to gain from those who have mastered the mountain."

 ANG_skirmishes_with_the_gundabad_orcs:0 "Skirmishes with Gundabad"
 ANG_skirmishes_with_the_gundabad_orcs_desc:0 "The struggle against Mount Gundabad will not begin with a single great battle, but with raids, ambushes, and bloodshed along the northern passes. These skirmishes will cost lives, yet each clash reveals the true nature of the enemy and hardens the resolve of Angmar's people. As the fighting spreads, the realm prepares itself for a greater war in the mountains."

