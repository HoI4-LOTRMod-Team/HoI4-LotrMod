l_english:
khand.1.t: "Khand suggests an alliance... for a price."
khand.1.d: "In typical mercenary fashion, the variags of Khand have come to us with the proposal to stand alongside us in war; though they also want certain payment for it."
khand.1.a: "We will pay them"
khand.1.b: "An outrageous demand"
khand.2.t: "Khand suggests an alliance... for a price."
khand.2.d: "In typical mercenary fashion, the variags of Khand have come to us with the proposal to stand alongside us in war; though they also want certain payment for it."
khand.2.a: "We will pay them"
khand.2.b: "An outrageous demand"
khand.3.t: "Variags of Khand offer to help in our war effort"
khand.3.d: "Having heard of our current war, a few bands of Khandian mercenaries have ventured to our country and are offering to join our side. They do of course charge a fee, as mercenaries are wont to do, but perhaps their aid would be worth it."
khand.3.a: "Their aid would be appreciated"
khand.3.b: "Why should we hire mercenaries to fight our wars for us?"
khand.4.t: "Rising Unrest from our Gondorian war"
khand.4.d: "The tribes of Khand are against the idea of all out war with the west and are becoming more vocal with their anger at the Variag rule. (If Stability gets too low or Revolutionary support too high, the tribes will take over)"
khand.4.a: "Concerning."
khand.5.t: "Tribal Raid on War Supplies"
khand.5.d: "Last night one of the Khandian tribes raided a variag supply wagon, looting the weapons and causing general disruption."
khand.5.a: "Allow them to get away with it... this time"
khand.5.b: "Catch those who are responsible for this!"
khand.6.t: "Variags strike out against Tribe"
khand.6.d: "While on campaign, a group of Variags have harshly mistreeted a local Khandian tribe. Though this does send a message, it has been met with some pushback from the other tribes."
khand.6.a: "It is what it is."
khand.7.t: "Disturbances at the capital"
khand.7.d: "A large disturbance from the tribes has taken place in our capital city, the sight has shaken the resolve of the ruling Variags and further riled up the Khandian tribes."
khand.7.a: "A threat to Variag control"
khand.8.t: "Tribes hold a rally"
khand.8.d: "A group of Tribespeople from the tribes of Khand have gotten together to hold a general protest against Sauron's war, inspiring more popularity to their cause."
khand.8.a: "Worrying"
khand.9.t: "Tribes across the country have made a general takeover"
khand.9.d: "The Variag regime is in turmoil, as a tribal rally has turned to a full on uprising against the rulers of Khand. The tribes have taken over the country and declared themselves separate from Sauron's rule."
khand.9.a: "The tribes of Khand are free again."
khand.10.t: "Victory over Gondor!"
khand.10.d: "Gondor has fallen and the west has been destroyed by the forces of darkness. With this victory the tribes and Variags alike are much more complacent with our place in the world and the tribes crucially seem to be letting up on their general unrest. We may yet achieve internal peace."
khand.10.a: "A great victory for the Variags"
khand.11.t: "Southern Supplies Sabatoged!"
khand.11.d: "The Variags to our south have sent a raid into the interior of our country. It seems that their goal was to sabatoge our supply lines and maim our armed forces. This could well mean that they plan on launching a larger invasion in the near future, but for now, little is known."
khand.11.a: "Those southern PESTS!"
khand.12.t: "Meetings with the Bankers"
khand.12.d: "Representatives of the Unified Khandian Government have met today with several of the east's largest private bankers, we had hoped to come away with financial plans but all of the bankers seem to have different opinions on how we're spending our money and what we should do instead. There are a few leading choices of what to do if we were to take out a loan, we just need to decide between them."
khand.12.a: "Take out a loan to subsidize our economy."
khand.12.b: "Take out a loan to subsidize our production."
khand.12.c: "Take out a loan to subsidize the miners."
khand.12.e: "We will make do with our own economics."
khand.13.t: "Khand wishes for increased wages"
khand.13.d: "The eastern Variags have requested that we should pay them more for their support in our war effort, stating that their soldiers will be more motivated if working for higher wages."
khand.13.a: "They will have their money"
khand.13.b: "Fine, but only for a little while"
khand.13.c: "We will not afford to pay them"
khand.14.t: "Mercenary Forces return with failure"
khand.14.d: "Our mercenary forces we had sent to [From.GetName] have returned with the news that they could not find employment despite the war effort."
khand.14.a: "A useless excursion for mercenaries."
khand.15.t: "[From.GetName] has refused our offer"
khand.15.d: "Though we had offered [From.GetName] to fight for them in exchange for a price, our offer has been declined."
khand.15.a: "They are on their own."
khand.16.t: "[From.GetName] has accepted our offer"
khand.16.d: "Our offer of aiding [From.GetName] in their wars has been accepted, we have joined their faction and will continually be paid from their treasury for as long as we stay. This is a great victory for the pockets of the Variags of Khand."
khand.16.a: "They shall have our loyalty as long they have gold."
khand.17.t: "Rising Unrest from our war with the dwarves"
khand.17.d: "The tribes of Khand are against the idea of all out war with the west and are becoming more vocal with their anger at the Variag rule. (If Stability gets too low or Revolutionary support too high, the tribes will take over)"
khand.17.a: "Concerning."
khand.18.t: "Our Mercenaries have found Employment in [From.GetName]"
khand.18.d: "The band of mercenaries which we have recently sent out has now successfully found employment. They will stay and fight in the war which they have been employed into."
khand.18.a: "May they find Victory"
khand.19.t: "Tribal Unrest"
khand.19.d: "The Variags who rule Khand have not always done so. They come from the far east having settled in Khand and subjugated its people. This has historically created a divide among the people of Khand as the nomadic tribes continue to speak out against the Variags. As the people of Middle Earth grow restless, sensing great conflict brewing between powerful forces, the tribes of Khand have become increasingly troublesome as well. With our position at Sauron's back door most people in Khand are aware to some degree of the massing of orcs and the armies of death in Mordor and this has raised the nerves of the tribes to the point that they are now boiling over perhaps leading to impending civil war."
khand.19.a: "Troubling."
khand.20.t: "The Tribes are Revolting!"
khand.20.d: "The Khandian Tribes, proclaiming the Variags to be tyrants, have begun a full-scale civil war. They have taken up arms and are now gathering for war in the mountains to the east of Khand. The Variags are scrabbling to put together a formal army to confront them as well as drafting pleas of help to the Haradrim."
khand.20.a: "These rebels will be crushed"
khand.20.b: "They're not that bad"
khand.21.t: "The Tribes Rise Again"
khand.21.d: "Having continually faced the harsh governances of the Variags and now endured the hardships of a country at war, the tribes of Khand have once again taken up arms against the variag government, this time with a renewed vigor and a finality of decision. This will be the last time that the tribes rise against their oppressors, either they find victory here or are crushed, never to rise again."
khand.21.a: "We will crush the tribes once and for all"
khand.21.b: "The time has come to rise up against the Variags"
khand.22.t: "Khand Offers Us Horses"
khand.22.d: "Merchants from Khand have proposed that they should sell us some of the Horses that live in their land. They promise a sizeable number of Horses and this could well be a profitable exchange should we take them up on it."
khand.22.a: "Buy their Horses."
khand.22.b: "We will not spare the expense."
khand.23.t: "Khand Asks For Harad to Return Their Land"
khand.23.d: "Khand is requesting that we should demand that their land be returned to them from Harad who are currently occupying it. They state that Harad has no right to hold it from them and that the people who live their are Khandian."
khand.23.a: "Ask Harad to give up the land"
khand.23.b: "Tell Khand not to ask again"
khand.24.t: "Mordor Wants Us to Give Khand Their Land"
khand.24.d: "Khand has appealed to Sauron about their land that we are currently occupying and Sauron has subsequently asked us to return it to them. It is still our decision whether to do so or not, but refusing may draw the ire of Mordor."
khand.24.a: "We will not give it up"
khand.24.b: "Fine... but Khand must pay for it"
khand.24.c: "We serve Sauron's will"
khand.25.t: "Sauron Denies Our Appeal"
khand.25.d: "Messangers return from Barad Dur with failure, Sauron has refused to demand our land be returned from Harad."
khand.25.a: "Disheartening News"
khand.26.t: "Harad Has Returned Our Land"
khand.26.d: "Our appeal to Sauron was a success and Harad have agreed to give us back the land that we requested. Finally Khand can once again own the land which is ours by right."
khand.26.a: "A Great Day for Khand"
khand.27.t: "Harad Has Refused to Return Our Land"
khand.27.d: "Despite Mordor's agreement to ask for Harad to give us back the land which they were occupying, officials in the Haradrim government have been quoted as saying that we no longer should have claim to it."
khand.27.a: "A Disparaging Defeat"
khand.28.t: "Harad Demands Payment Before Returning Our Land"
khand.28.d: "Harad states that they are willing to return our former lands to us under the condition that we should pay them tribute for a short while. Though it is not quite everything we had hoped for, this deal may be the only way to get back our land."
khand.28.a: "Accept this new deal"
khand.28.b: "Decline"
khand.29.t: "Khand Will Not Pay for their Land"
khand.29.d: "Khand states that it is an insult to suggest that they should pay for the return of what is 'already theirs by right', instead it seems that they would rather keep their coffers full than see their precious land returned."
khand.29.a: "Strange"
khand.30.t: "Khand Agrees to pay us"
khand.30.d: "Though they seemed reluctant about the prospect, the Variags eventually relented and decided to pay our tribute in order to reclaim their land."
khand.30.a: "As Expected"
khand.31.t: "Elite Variags Arrive From Khand"
khand.31.d: "As part of Khand's subservience to our government, they have sent two bands of elite mercenaries to us. They will be a great addition to our army."
khand.31.a: "A Most Excellent Tribute"
khand.32.t: "Tribes Still Stirring Up Unrest"
khand.32.d: "Though defeated in their civil war, the Khandian tribes continue to persist and are still not satisfied with their status as the inferiors of the Variags. Having abandoned Harad's overlordship, we are now dealing with this problem on our own, though the tribes are still quite weakened."
khand.32.a: "They are difficult to be rid of"
