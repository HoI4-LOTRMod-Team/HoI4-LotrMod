l_english:
 VAL_river_trade:0 "River Trade"
 VAL_river_trade_desc:0 "The river carries not just water, but opportunity. By fostering trade along the Anduin, we can invite wealth and new ideas into our Vales, offering our own crafts to a wider world."
 VAL_self_reliance:0 "Self-Reliance"
 VAL_self_reliance_desc:0 "No foreign coin or distant market can guarantee our survival. Our future lies in the diligent toil of our folk and the untapped riches of our ancestral lands."
 VAL_life_along_the_anduin:0 "Life Along the Anduin"
 VAL_life_along_the_anduin_desc:0 "The Great River Anduin is the lifeblood of our scattered communities. Its currents define our borders, provide our sustenance, and unite our diverse peoples in a common existence."
 VAL_expand_river_settlements:0 "Expand River Settlements"
 VAL_expand_river_settlements_desc:0 "The Vales of the Anduin are wide and fertile, but our folk are few. By encouraging new river settlements, we can bolster our population and strengthen our hold on these vital territories."
 VAL_urban_focus:0 "Urban Focus"
 VAL_urban_focus_desc:0 "Our scattered settlements may be numerous, but true strength lies in concentrated industry. We must foster growth in our towns and secure our future with workshops and watchful walls."
 VAL_rural_focus:0 "Rural Focus"
 VAL_rural_focus_desc:0 "Our strength lies not in bustling cities, but in the countless homesteads and hardy folk spread across the Vales. By nurturing our rural heartlands, we ensure a stable and resilient future."
 VAL_traditional_crafts:0 "Traditional Crafts"
 VAL_traditional_crafts_desc:0 "The skills of the hand, passed down through generations, remain the backbone of our communities. It is time to refine these ancient methods for the challenges of today."
 VAL_guard_the_homelands:0 "Guard the Homelands"
 VAL_guard_the_homelands_desc:0 "The wild lands are ever-encroaching, and shadows stir on the mountains. Our peaceful existence can only endure if we stand ready to defend it with spear and shield."
 VAL_lore_of_the_wild:0 "Lore of the Wild"
 VAL_lore_of_the_wild_desc:0 "Beyond maps and written histories, the very earth holds secrets. By listening to the whispers of the woods and learning the ancient paths, we can gain invaluable knowledge."
 VAL_maintain_the_old_roads:0 "Maintain the Old Roads"
 VAL_maintain_the_old_roads_desc:0 "Connecting our settlements is not just for trade, but for defense. A well-maintained road can mean the difference between timely aid and being cut off from our kin."
 VAL_smiths_of_the_vales:0 "Smiths of the Vales"
 VAL_smiths_of_the_vales_desc:0 "No, they don't make magical swords here. But a good, solid axe or a well-forged shield can often be far more useful against an Orc than any high-elven fancy. And we need more of them."
 VAL_waterwheels:0 "Waterwheels"
 VAL_waterwheels_desc:0 "The ceaseless flow of the Anduin holds potential far beyond simple passage. With ingenuity, we can harness its power to turn great wheels, grinding grain and aiding our smiths."
 VAL_rural_workshops:0 "Rural Workshops"
 VAL_rural_workshops_desc:0 "No need for smoky behemoths of industry when every village can turn out its own goods. With honest sweat and local resources, we foster the growth of humble yet vital workshops."
 VAL_stockpiled_arms:0 "Stockpiled Arms"
 VAL_stockpiled_arms_desc:0 "Our smiths are busy, forging blades and fletching arrows, not for conquest, but for the unwavering defense of our homes and kin. Let our stockpiles swell in quiet readiness."
 VAL_hardened_settlements:0 "Hardened Settlements"
 VAL_hardened_settlements_desc:0 "The folk of the Vales have always been hardy, but hard times demand harder measures. Every village and homestead will become a point of defiance, capable of weathering any storm."
 VAL_defensive_preparations:0 "Defensive Preparations"
 VAL_defensive_preparations_desc:0 "A year of dedicated effort will see our lands more resilient. Though the task is arduous, the cost of inaction is far greater than any stone we might lay or palisade we might raise."
 VAL_local_musters:0 "Local Musters"
 VAL_local_musters_desc:0 "Our strength lies not in grand armies, but in the unity of our folk. The ancient traditions of local musters shall be rekindled, ensuring every village can answer the call."
 VAL_dredge_the_shallows:0 "Dredge the Shallows"
 VAL_dredge_the_shallows_desc:0 "To better connect our scattered settlements and facilitate the flow of goods, we must tame the wild heart of the Anduin. Clearing its choked passages will open new avenues for our people and their livelihoods."
 VAL_watchtpowers_at_the_fords:0 "Watchtowers at the Fords"
 VAL_watchtpowers_at_the_fords_desc:0 "Along the great river and its numerous crossings, watchful eyes are needed. New watchtowers will rise, ensuring no threat, great or small, can approach our lands unseen."
 VAL_local_fishing:0 "Local Fishing"
 VAL_local_fishing_desc:0 "In the Vales, a good catch is a sign of a good day. By enhancing our local fishing practices, we reinforce the simple, honest traditions that keep our folk fed and content, come what may."
 VAL_seasonal_labor_cycles:0 "Seasonal Labor Cycles"
 VAL_seasonal_labor_cycles_desc:0 "The rhythm of the Vales is dictated by the turning of the seasons."
 VAL_village_councils:0 "Village Councils"
 VAL_village_councils_desc:0 "The tradition of self-governance in each hamlet has served us long."
 VAL_clear_new_farmland:0 "Clear New Farmland"
 VAL_clear_new_farmland_desc:0 "The woods are vast and fertile, but they won't clear themselves. Though the work is hard and endless, the promise of a full harvest is worth every swing of the axe."
 VAL_local_markets:0 "Local Markets"
 VAL_local_markets_desc:0 "Our communities thrive on honest trade and shared prosperity. New markets will provide vital hubs for our farmers, crafters, and merchants, weaving a stronger social fabric."
 VAL_timber_and_tallow:0 "Timber and Tallow"
 VAL_timber_and_tallow_desc:0 "Our strength lies in the gifts of the land. We shall organize the lumber camps and tend to our livestock, securing a consistent flow of timber for construction and tallow for daily needs."
 VAL_hides_and_leather:0 "Hides and Leather"
 VAL_hides_and_leather_desc:0 "With more farmland comes more livestock, and with more livestock comes more hides. Refining our tanning and working practices will allow us to make the most of this valuable resource."
 VAL_prospecting_the_hills:0 "Prospecting the Hills"
 VAL_prospecting_the_hills_desc:0 "Our settlements have long thrived on the river and the fertile plains. Now, we turn our gaze to the higher ground, seeking the veins of ore, coal, and precious stone that could further strengthen our lands."
 VAL_winter_stores:0 "Winter Stores"
 VAL_winter_stores_desc:0 "The long, cold grip of winter can break even the stoutest hearts and armies. We must ensure our larders are full and our people well-fed to weather the coming chill."
 VAL_river_crossing_specialists:0 "River Crossing Specialists"
 VAL_river_crossing_specialists_desc:0 "Life along the Great River has taught us many lessons. Now, our people's inherent knowledge of currents, fords, and hidden paths will be formalized, turning a natural barrier into our own advantage."
 VAL_improve_weaponry:0 "Improve Weaponry"
 VAL_improve_weaponry_desc:0 "The shadow deepens, and the skirmishes grow harsher. Our simple tools of war must evolve, for a dull blade or a brittle spear will not suffice against the growing darkness."
 VAL_city_walls:0 "City Walls"
 VAL_city_walls_desc:0 "The time for open and unprotected settlements is coming to an end. To withstand the coming storm, our towns must become bastions, protected by stout walls and vigilant watchmen."
 VAL_specialized_knoweldge:0 "Specialized Knowledge"
 VAL_specialized_knoweldge_desc:0 "From the quiet whispers of the old ones to the honed instincts of our hunters, there are secrets known only to us. It is time to formally embrace this specialized understanding."
 VAL_improve_army_coherence:0 "Improve Army Coherence"
 VAL_improve_army_coherence_desc:0 "Enough with individual heroics! The time has come for practical military doctrine. Let's make sure everyone knows which end of the spear goes where, and preferably in unison."
 VAL_local_hemp_farms:0 "Local Hemp Farms"
 VAL_local_hemp_farms_desc:0 "From simple cloth to the strongest siege-ropes, the humble hemp plant yields an incredible bounty."
 VAL_construction_techniques:0 "Construction Techniques"
 VAL_construction_techniques_desc:0 "Our simple shelters and fortifications will gain new strength. Through careful study and practice, we shall build with greater speed and resilience."
 VAL_riders_of_the_anduin:0 "Riders of the Anduin"
 VAL_riders_of_the_anduin_desc:0 "From the Gladden Fields to the fringes of Mirkwood, our mounted warriors know every path and ford. No foe shall outrun the sons and daughters of the Anduin."
 VAL_machines_of_war:0 "Machines of War"
 VAL_machines_of_war_desc:0 "The time for simple skirmishes is over. Let us master the heavy arts of siege and construction, crafting great engines that will grind our enemies to dust."
 VAL_encourage_blacksmithing:0 "Encourage Blacksmithing"
 VAL_encourage_blacksmithing_desc:0 "As our urban centers grow, so too does the demand for durable tools and sturdy arms. We must encourage our most skilled smiths to expand their workshops and meet the vital needs of our people."
 VAL_infantry_support_gear:0 "Infantry Support Gear"
 VAL_infantry_support_gear_desc:0 "Our lands are our home, and we must ensure our defenders are as resilient as the ancient trees and as sturdy as the mountains. Better armaments and protective gear will see them through."
 VAL_acquire_new_knowledge:0 "Acquire New Knowledge"
 VAL_acquire_new_knowledge_desc:0 "Our communities have grown prosperous along the Anduin, but to truly thrive, we must look beyond traditional ways. Let us pool our collective wisdom and seek out new insights."

 VAL_city_infrastructure:0 "City Infrastructure"
 VAL_city_infrastructure_desc:0 "With our burgeoning towns now properly defended, we must look to their inner workings. Improved roads, better sanitation, and organized civic spaces will turn our settlements into true hearths of prosperity."