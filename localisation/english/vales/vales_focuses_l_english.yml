l_english:
 VAL_the_northern_frontiers:0 "The Northern Frontiers"
 VAL_the_northern_frontiers_desc:0 "The south remains tranquil and docile. It is north that we must turn our gaze, for the orcs of Gundabad are on the march."
 VAL_lord_of_the_upper_vales:0 "Lord of the Upper Vales"
 VAL_lord_of_the_upper_vales_desc:0 "By ancient right and proven strength, our chieftain's word shall hold sway throughout the Upper Vales. Let it be known that these lands are bound by a single, unwavering will."
 VAL_the_shadow_of_gundabad:0 "The Shadow of Gundabad"
 VAL_the_shadow_of_gundabad_desc:0 "A dark tide swells from Gundabad, threatening to pour forth from the mountains and drown our northern lands. The time to face this shadow has come."
 VAL_no_peace_with_the_enemy:0 "No Peace with the Enemy"
 VAL_no_peace_with_the_enemy_desc:0 "The foul taint of Gundabad knows no reason, nor offers any true respite. To speak of peace with such a foe is to invite our own ruin."
 VAL_oaths_of_mutual_defense:0 "Oaths of Mutual Defense"
 VAL_oaths_of_mutual_defense_desc:0 "A common enemy makes for strange bedfellows, or so the saying goes. But with the shadows encroaching, we must formalize our understanding with Gladden and Rhosgobel, forging a bulwark against the coming storm."
 VAL_grimbeorns_rule:0 "Grimbeorn's Rule"
 VAL_grimbeorns_rule_desc:0 "Grimbeorn, son of the great Beorn, assumes his rightful place as the leader of the Beornings. His steady hand and fierce spirit promise stability in these troubled times."
 VAL_alternative_leadership:0 "Alternative Leadership"
 VAL_alternative_leadership_desc:0 "The peace and bounty of the Vales are shattered by unforeseen disasters and bitter famine. Grimbeorn's leadership is no longer an option, forcing us to seek desperate alternatives."
 VAL_envoys_to_the_lonely_mountain:0 "Envoys to the Lonely Mountain"
 VAL_envoys_to_the_lonely_mountain_desc:0 "For too long, the paths between the Vales and Erebor have grown cold. Now, with ancient evils stirring, we must rekindle the fire of fellowship between our mountain and river kin."
 VAL_request_dwarven_support:0 "Request Dwarven Support"
 VAL_request_dwarven_support_desc:0 "The shadows from Gundabad lengthen, and our own strength may not suffice. We must appeal to our kin in the Lonely Mountain; their hammers and axes are needed now more than ever."
 VAL_the_north_stands_united:0 "The North Stands United"
 VAL_the_north_stands_united_desc:0 "The time for idle deliberation is over. By solemn agreement and shared purpose, the strength of the Anduin Vales is consolidated, rallying every banner to stand as one. Let them come."
 VAL_dwarven_mining_expertise:0 "Dwarven Mining Expertise"
 VAL_dwarven_mining_expertise_desc:0 "While our kin are accustomed to tilling the soil, the Dwarves' unmatched skill in delving deep promises to enrich us all. Time to get our hands dirty, literally."
 VAL_no_foreign_entanglements:0 "No Foreign Entanglements"
 VAL_no_foreign_entanglements_desc:0 "Why trade our hard-won internal peace for the endless, tiresome conflicts of distant realms? We have plenty of our own troubles to manage."
 VAL_the_bears_watch:0 "The Bear's Watch"
 VAL_the_bears_watch_desc:0 "The Vales of Anduin are precious, and the children of Beorn are their most steadfast guardians. Our patrols will be ever watchful, our defenses unyielding, as if the Great Bear stood sentinel."
 VAL_one_banner_one_law:0 "One Banner, One Law"
 VAL_one_banner_one_law_desc:0 "The fractured clans have spoken for too long. A single, unyielding voice shall now dictate the destiny of the Vales, whether they like it or not."
 VAL_unify_the_clans:0 "Unify the Clans"
 VAL_unify_the_clans_desc:0 "The spirit of unity is a potent weapon. By consolidating the many clans and communities of the Anduin into a cohesive realm, we shall present a formidable and unyielding front."
 VAL_strike_first:0 "Strike First"
 VAL_strike_first_desc:0 "Enough of mere watchfulness! The stench of Gundabad fills the air, and our patience is at an end. We shall send our own messengers of steel and claw into their mountains."
 VAL_call_the_banners:0 "Call the Banners"
 VAL_call_the_banners_desc:0 "With war at our doorstep, the time for hesitation is over. The ancient oaths of kinship are invoked, and the peoples of Rhosgobel and the Gladden Lands raise their banners alongside ours. Let them tremble!"
 VAL_copy_dwarven_battlewagons:0 "Copy Dwarven Battlewagons"
 VAL_copy_dwarven_battlewagons_desc:0 "Among their many marvels, the Dwarves possess chariots pulled by mighty boars – fearsome engines of destruction. If these 'boar chariots' can shatter enemy lines, then surely we can learn to harness such brute force for the defense of the Anduin."
 VAL_honeycake_traditions:0 "Honeycake Traditions"
 VAL_honeycake_traditions_desc:0 "The honey of the Anduin Vales is renowned throughout Middle-earth, and our honeycakes are its most cherished form. A full belly and a sweet treat can calm even the most restless spirit, strengthening the bonds of our people."
 VAL_skalor_the_usurper:0 "Skalor the Usurper"
 VAL_skalor_the_usurper_desc:0 "The Vales, it seems, prefer decisive leadership over tedious debate. Skalor 'the Usurper' has graciously relieved us of our choices, ensuring a singular, unwavering future."
 VAL_look_west:0 "Look West"
 VAL_look_west_desc:0 "The time for introspection is over. The rugged peaks and shadowed valleys of the western horizon demand our immediate and unwavering attention."
 VAL_unify_the_anduin_by_force:0 "Unify the Anduin by Force"
 VAL_unify_the_anduin_by_force_desc:0 "The time for idle deliberation has passed. The Vales must rise as a single, unbreakable power. If diplomacy falters, then the roar of the bear-men and the clang of their axes shall forge the future."
 VAL_send_envoys_to_gladden:0 "Send Envoys to Gladden"
 VAL_send_envoys_to_gladden_desc:0 "The Gladden Fields are close to our hearts and lands, their people kin of the river. A formal embassy will seek to rekindle ancient bonds and secure a common future for all who dwell here."
 VAL_send_envoys_to_rhosgobel:0 "Send Envoys to Rhosgobel"
 VAL_send_envoys_to_rhosgobel_desc:0 "The Anduin flows through all our lands, connecting us whether we wish it or not. It is time to send official word to Rhosgobel, to solidify the unspoken understanding between our peoples."
 VAL_diplomatic_benefits:0 "Diplomatic Benefits"
 VAL_diplomatic_benefits_desc:0 "Our envoys return with glad tidings, having secured favorable terms and strengthened bonds with those who share our borders and our fears."
 VAL_unite_the_cause:0 "Unite the Cause"
 VAL_unite_the_cause_desc:0 "The shadows lengthen over the Great River. For too long, the peoples of the Anduin Vales have stood isolated. Now, facing a common and encroaching darkness, we must forge a true assembly, or face ruin alone."
 VAL_invite_gladden:0 "Invite Gladden"
 VAL_invite_gladden_desc:0 "Our patient diplomacy has borne fruit. With the 'Anduin Assembly' now established, the time is ripe to extend a formal invitation to our friends in Gladden, solidifying our shared commitment."
 VAL_invite_rhosgobel:0 "Invite Rhosgobel"
 VAL_invite_rhosgobel_desc:0 "The whispers of the forest carry grim tidings from the east. We must convince the folk of Rhosgobel that the time has come to gather their wisdom and strength for the common defense of all free lands."
 VAL_steel_for_grain:0 "Steel for Grain"
 VAL_steel_for_grain_desc:0 "The Lonely Mountain holds vast treasures of the earth, while our vales offer the bounty of the soil. A mutual exchange of grain for steel will fortify both our peoples against common foes."
 VAL_fortify_the_western_front:0 "Fortify the Western Front"
 VAL_fortify_the_western_front_desc:0 "Our lands lie vulnerable to incursions from the north. We must commit to fortifying the passes and strategic points."
 VAL_secure_support_from_angmar:0 "Secure Support from Angmar"
 VAL_secure_support_from_angmar_desc:0 "The growls of Gundabad echo ever louder through the mountains. Our defenses may hold, but perhaps a mutual understanding with the powers of Angmar will offer a vital bulwark."
 VAL_join_erebor:0 "Join Erebor"
 VAL_join_erebor_desc:0 "The ancient friendship between Men and Dwarves, though long dormant, is rekindled by necessity. With Erebor's strength and our own, we can present a united front against the encroaching evils."
 VAL_shared_smithing_traditions:0 "Shared Smithing Traditions"
 VAL_shared_smithing_traditions_desc:0 "The clang of hammers grows louder in the Vales as Dwarven wisdom infuses our craft. New foundries are planned and existing ones expanded, ensuring our growing army is well-supplied."
 VAL_prioritize_northern_safety:0 "Prioritize Northern Safety"
 VAL_prioritize_northern_safety_desc:0 "The whispers of war grow louder from the north. We must ensure that our mountain passes and forest trails are secure, lest the horrors that stir there spill into our peaceful lands. Erebor's wisdom will be invaluable."
 VAL_winter_offensives:0 "Winter Offensives"
 VAL_winter_offensives_desc:0 "The mountain passes are treacherous and the rivers are choked with ice. Conditions are perfect for those who know how to thrive in the unforgiving cold."
 VAL_great_library_of_greylin:0 "Great Library of Greylin"
 VAL_great_library_of_greylin_desc:0 "In a world of shifting allegiances and rising darkness, the pursuit of knowledge remains a steadfast light. Greylin shall host a grand collection, a testament to our enduring spirit."
 VAL_extra_research_slot:0 "Extra Research Slot"
 VAL_extra_research_slot_desc:0 "While not a citadel of ancient learning like Minas Tirith, the wisdom of the Anduin flows deep. We shall establish another seat for our keenest minds to gather and discover."
 VAL_a_divided_moot:0 "A Divided Moot"
 VAL_a_divided_moot_desc:0 "The time has come for the elders and chieftains to convene. Yet, instead of unity, the great hall echoes with the clamor of clashing ideals and stark disagreements."
 VAL_reject_the_soft_spoken:0 "Reject the Soft-Spoken"
 VAL_reject_the_soft_spoken_desc:0 "The endless debates of the Moot have worn thin. There are those who believe that only a firm hand, not soft words, can guide the Vales through these dark times."
 VAL_suspend_old_agreements:0 "Suspend Old Agreements"
 VAL_suspend_old_agreements_desc:0 "Erebor has sent a gift of food, but no gift is truly free. The moot is deeply divided on how to reciprocate, or even if to honor, the traditional understandings that underpin our relations with the Mountain-folk."
 VAL_blood_and_honey:0 "Blood and Honey"
 VAL_blood_and_honey_desc:0 "The time for talking is over. As divisions harden into factions, the Vales of Anduin plunge into a desperate struggle, where only the strongest will taste the honey of victory and leave a trail of blood in their wake."
 VAL_autarky_of_the_wild:0 "Autarky of the Wild"
 VAL_autarky_of_the_wild_desc:0 "The wild heart of the Anduin beats with a fierce independence. We need no foreign gold or steel; our strength lies within the mountains and rivers, and the spirit of our people."
 VAL_the_solitary_life:0 "The Solitary Life"
 VAL_the_solitary_life_desc:0 "In these troubled times, many look for allies. We look to ourselves. True security is found not in pacts, but in a united people and a thriving homeland."
 VAL_greylin_fortress:0 "Greylin Fortress"
 VAL_greylin_fortress_desc:0 "The Vales of Anduin are a land of peace, but peace must be guarded. Greylin shall be our bulwark, a stone fist against any encroaching shadow."
 VAL_the_council_of_elders:0 "The Council of Elders"
 VAL_the_council_of_elders_desc:0 "The tumultuous chaos has finally subsided, and the venerable Council of Elders convenes to restore order and guide the Vales back to their ancient, peaceful traditions."
 VAL_frothkar_the_man_of_stone:0 "Frothkar, the Man of Stone"
 VAL_frothkar_the_man_of_stone_desc:0 "The time for soft words and compromise is over. The Vales need a leader forged in stone, and Frothkar embodies that unbending strength. Let all who stand in his way beware."
 VAL_empower_the_mountain_clans:0 "Empower the Mountain Clans"
 VAL_empower_the_mountain_clans_desc:0 "Frothkar turns his gaze to the rugged North, where the hardy mountain clans dwell. Their resolve shall become the bedrock of our strength."
 VAL_purge_dissidents:0 "Purge Dissidents"
 VAL_purge_dissidents_desc:0 "The time for endless debate and bickering is over. The Vales must speak with one voice, and those who refuse to join the chorus will find themselves silenced."
 VAL_scorch_resisting_villages:0 "Scorch Resisting Villages"
 VAL_scorch_resisting_villages_desc:0 "When the axe falls, it does not discriminate. Those who stand against the new order will find their homes as brittle as their defiance."
 VAL_subjugate_gladden:0 "Subjugate Gladden"
 VAL_subjugate_gladden_desc:0 "The isolated peoples of Gladden have enjoyed their quiet independence for too long. To truly unify the Anduin, their scattered settlements must be brought under our banner, by word or by sword."
 VAL_subjugate_rhosgobel:0 "Subjugate Rhosgobel"
 VAL_subjugate_rhosgobel_desc:0 "The consolidation of the Anduin's strength requires the cooperation of all its inhabitants. Rhosgobel will join us, willingly or otherwise, for the greater glory of the Vales."
 VAL_war_with_gladden:0 "War with Gladden"
 VAL_war_with_gladden_desc:0 "Our calls for unity have been met with defiance. Very well. Let Gladden learn the cost of opposing the tide of the Vales."
 VAL_war_with_rhosgobel:0 "War with Rhosgobel"
 VAL_war_with_rhosgobel_desc:0 "Our offer of unity was met with stubborn silence. The time for talk is over; the will of the Vales will be heard."
 VAL_pay_off_gundabad:0 "Pay off Gundabad"
 VAL_pay_off_gundabad_desc:0 "We cannot risk an open flank on our backs as we venture south on a quest of unifying the vales. Perhaps the orcs can be persuaded to keep the peace for a fair price?"
 VAL_invite_forodwaith_settlers:0 "Invite Forodwaith Settlers"
 VAL_invite_forodwaith_settlers_desc:0 "Our northern frontiers demand a hardier folk than most. Who better to settle these lands and withstand the bitter winds than the resilient people of Forodwaith?"
 VAL_antagonize_the_dwarves:0 "Antagonize the Dwarves"
 VAL_antagonize_the_dwarves_desc:0 "The treasures of the Lonely Mountain have long been guarded by the Bearded Folk. It is time for a renegotiation of who truly profits from the riches of the land. A gentle reminder of our strength might just do the trick."
 VAL_seize_the_cold_fortress:0 "Seize the Cold Fortress"
 VAL_seize_the_cold_fortress_desc:0 "For generations, Gundabad has endured as a monument to the enemy's cruel dominion. Now, the time has come to shatter its foundations and reclaim what was lost, no matter the cost in blood and ice."
 VAL_demand_territory:0 "Demand Territory"
 VAL_demand_territory_desc:0 "The lands bordering the Lonely Mountain have long been a point of contention. For the prosperity and security of our people, we demand Erebor cede these vital territories to the Vales."
 VAL_new_research_slot:0 "New Research Slot"
 VAL_new_research_slot_desc:0 "Our triumphs have ushered in an age of prosperity and purpose. With newfound resources and boundless ambition, we can now dedicate ourselves to the pursuit of greater knowledge."
 VAL_glorious_triumph:0 "Glorious Triumph"
 VAL_glorious_triumph_desc:0 "Victory! The last strongholds of our rivals have fallen, and their peoples now fall under our glorious rule. No longer will our borders be threatened, for the Vales stand as the undisputed power of the northern lands."
 VAL_the_northern_maesters:0 "The Northern Maesters"
 VAL_the_northern_maesters_desc:0 "Our libraries may be small, but the wisdom of the north is ancient. It is time to organize and expand this vital knowledge, to better understand our perilous world."
 VAL_improve_blacksmithing:0 "Improve Blacksmithing"
 VAL_improve_blacksmithing_desc:0 "Better steel makes for better tools, and better tools make for better defense. Let us hone our craft to sharpen our resolve."
 VAL_expand_workshops:0 "Expand Workshops"
 VAL_expand_workshops_desc:0 "While others look outward for alliances or conquest, we look inward, to the strength of our own hands. More workshops, more production, more self-reliance."
 VAL_relocate_scholars_north:0 "Relocate Scholars North"
 VAL_relocate_scholars_north_desc:0 "The learned folk of the southern vales are hereby 'invited' to relocate their vast collections of scrolls and ancient lore to the heartland. For the greater good, of course."
 VAL_mountain_warfare:0 "Mountain Warfare"
 VAL_mountain_warfare_desc:0 "The harsh beauty of the mountains demands a harsh kind of warfare. We will forge our fighters into masters of the heights."
