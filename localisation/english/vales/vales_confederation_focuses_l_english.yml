l_english:
 VAL_confederation_of_the_anduin:0 "Confederation of the Anduin"
 VAL_confederation_of_the_anduin_desc:0 "The ancient tribes of the Anduin Vales, long content in their distinct enclaves, now heed the call for unity. From the Gladden Fields to the Woodmen's halls, a new pact is forged."
 VAL_rhosgobels_contribution:0 "Rhosgobel's Contribution"
 VAL_rhosgobels_contribution_desc:0 "The Woodmen, with their unparalleled knowledge of the Vales' hidden nooks, uncover deposits of rare ores and rich, dark earth. Their contribution to our industrial capacity is surprising, yet welcome."
 VAL_gladdens_contribution:0 "Gladden's Contribution"
 VAL_gladdens_contribution_desc:0 "Often overlooked, the Gladden Chiefdoms provide the eyes and ears of our united front, ensuring no threat goes unseen and no message unheard."
 VAL_beorning_contribution:0 "Beorning Contribution"
 VAL_beorning_contribution_desc:0 "It is said that a Beorning can fell a tree with a single punch, or forge iron with their bare hands. We shall put this formidable hardiness to work, boosting our productive might."
 VAL_brown_wizards_blessing:0 "Brown Wizard's Blessing"
 VAL_brown_wizards_blessing_desc:0 "Radagast the Brown, keeper of Rhosgobel and friend to all creatures, offers his unique counsel. His profound understanding of the natural world and its subtle magics will prove invaluable to our confederation."
 VAL_eyes_of_the_eyrie:0 "Eyes of the Eyrie"
 VAL_eyes_of_the_eyrie_desc:0 "While our scouts do their best, nothing compares to the view from atop the peaks. With the Great Eagles as our allies, we shall have eyes in the sky that no enemy can hope to evade."
 VAL_riders_of_the_iris:0 "Riders of the Iris"
 VAL_riders_of_the_iris_desc:0 "While not the heavy lancers of other realms, the Gladden Chiefdoms provide vital light cavalry. Their experience in ranging the wild will now be standardized and shared across all members of the Vales Confederation."
 VAL_skin_changer_vanguards:0 "Skin-changer Vanguards"
 VAL_skin_changer_vanguards_desc:0 "The Beornings possess a gift unlike any other in Middle-earth. To wield their ursine fury as a vanguard is to send a chilling message to any foe."
 VAL_honeycakes_and_hardiness:0 "Honeycakes and Hardiness"
 VAL_honeycakes_and_hardiness_desc:0 "It turns out the secret to enduring the long marches and hard fights was not strict discipline, but a generous helping of Beorning honeycakes. Our men will be hearty indeed!"
 VAL_marsh_strider_tactics:0 "Marsh-strider Tactics"
 VAL_marsh_strider_tactics_desc:0 "No foe shall find easy passage through our watery domain. Our infantry will move like reeds in the wind, striking from unexpected angles in the mists of the Anduin."
 VAL_integrate_gladden:0 "Integrate Gladden"
 VAL_integrate_gladden_desc:0 "One by one, the distinct identities along the Anduin are merging. The Gladden Chiefdoms are but the next step towards a truly unified realm."
 VAL_integrate_the_beornings:0 "Integrate the Beornings"
 VAL_integrate_the_beornings_desc:0 "No longer merely allies, the hardy Beornings fully join our cause. Their unmatched resilience, fierce loyalty, and the secrets of their honey-cakes are now shared strengths for all the Vales."
 VAL_integrate_rhosgobel:0 "Integrate Rhosgobel"
 VAL_integrate_rhosgobel_desc:0 "No longer an isolated realm, Rhosgobel becomes a foundational pillar of the united Vales. The  Woodmen's resilience are now wholly dedicated to our common defense."
 VAL_unified_records:0 "Unified Records"
 VAL_unified_records_desc:0 "Every tribe has its own way of remembering, its own way of noting down what matters. Now, the challenge is to make those distinct ways speak a common tongue."
 VAL_coordinated_planning:0 "Coordinated Planning"
 VAL_coordinated_planning_desc:0 "United we stand, but where do we march? The threats on our borders demand a singular purpose, and the time has come to decide upon our collective destiny and the direction of our common strength."
 VAL_defensive_posture:0 "Defensive Posture"
 VAL_defensive_posture_desc:0 "Some might say 'the best defense is a good offense'. We say 'the best defense is a very, very good defense'. Let us build and train until no foe, great or small, dare set foot on our soil."
 VAL_deal_with_dol_guldur:0 "Deal with Dol Guldur"
 VAL_deal_with_dol_guldur_desc:0 "No more shall we cower before the fell fortress of Dol Guldur. The time for defence is past; the time for a decisive strike, to cleanse the very source of the creeping shadow, is at hand."
 VAL_deal_with_goblin_town:0 "Deal with Goblin-town"
 VAL_deal_with_goblin_town_desc:0 "The stench of Goblin-town has long fouled the air of the Misty Mountains. With our strength united, it is time to perform a thorough cleansing."
 VAL_contact_the_hill_men:0 "Contact the Hill-men"
 VAL_contact_the_hill_men_desc:0 "The mountain passes are treacherous, and the goblins within them even more so. Perhaps the fierce Hill-men, who also know the sting of the Goblins, can be convinced to join our cause."
 VAL_deal_with_gundabad:0 "Deal with Gundabad"
 VAL_deal_with_gundabad_desc:0 "Mount Gundabad, a stronghold of ancient evil and questionable hygiene, threatens to spill its wretched occupants into our peaceful lands. We must coordinate to decisively deal with this northern blight."
 VAL_free_river_trade:0 "Free River Trade"
 VAL_free_river_trade_desc:0 "No more haggling over border taxes or bribing river wardens. Our goods shall flow as freely as the waters of the Anduin, much to the delight of merchants."
 VAL_unified_tactics:0 "Unified Tactics"
 VAL_unified_tactics_desc:0 "Each people of the Vales fights in their own way, honed by their unique lands and challenges. Now, we must pool this knowledge, forging our disparate methods into a unified, formidable defense."
 VAL_migration_treaties:0 "Migration Treaties"
 VAL_migration_treaties_desc:0 "Whether it be Gladden-folk seeking new pastures, Woodmen lending their skills to remote clearings, or Beornings finding new homes, our shared future depends on the free movement of our diverse peoples."
 VAL_knowledge_sharing:0 "Knowledge Sharing"
 VAL_knowledge_sharing_desc:0 "The world changes, and new challenges arise daily. To meet them, our Vales must learn together."
