hq_support_company: "Headquarters Staff"
hq_support_company_desc: "A dedicated headquarters staff company that administrates and assists with the unit's activities."
hq_engineer: "Engineer Staff"
hq_engineer_desc: "Deals with matters regarding fortifications and mobility/counter-mobility measures."
hq_recon: "Scouting Staff"
hq_recon_desc: "Collects and analyzes reconnaissance data received from the field."
hq_military_police: "Guardsman Staff"
hq_military_police_desc: "Maintains local order and directs division traffic across the army's area of operations."
hq_maintenance: "Maintenance Planning Staff"
hq_maintenance_desc: "Plans and supports maintenance & repair efforts on the army level."
hq_field_hospital: "First Aid Staff"
hq_field_hospital_desc: "Responsible for medical administration and providing efficient casualty evacuation and treatment within the army area."
hq_logistics: "Logistics & Service Staff"
hq_logistics_desc: "Prioritizes and allocates the distribution of supplies and fuel within the army."
hq_signal: "Courier & Intelligence Staff"
hq_signal_desc: "Coordinates communication efforts within the army, while also collecting and keeping track of gathered intelligence."

hq_infantry: "Infantry Escort"
hq_infantry_desc: "A detachment of armed guards to protect the HQ and its leader."
hq_carriage: "Carriage Escort"
hq_carriage_desc: "Carriages to protect and transport leaders across the battlefield."

hq_heavy_infantry: "Heavy Infantry Escort"
hq_heavy_infantry_desc: "An escort of heavily armored men at arms to provide maximum protection to the HQ unit and its leader."

hq_light_cavalry: "Light Cavalry Escort"
hq_light_cavalry_desc: "An escort of light cavalry, capable of quickly responding to threats and providing reconnaissance."
hq_heavy_cavalry: "Heavy Cavalry Escort"
hq_heavy_cavalry_desc: "An escort of mounted knights in plate armor, providing a strong defense against enemy attacks and the ability to charge into battle when necessary."
hq_lancer_cavalry: "Lancer Cavalry Escort"
hq_lancer_cavalry_desc: "An escort of cavalry with heavy lances, trained at facing down enemy cavalry."
hq_chariot: "Chariot Escort"
hq_chariot_desc: "An escort of chariots, providing a mobile and heavily armed defense for the HQ unit and its leader."

hq_naval_liaison: "Naval Liaison"
hq_naval_liaison_desc: "Provides joint Army-Navy cooperation during amphibious landing operations."
hq_air_liaison: "Forward Air Controller"
hq_air_liaison_desc: "Air-Ground control parties and other units assigned with the task of ensuring close cooperation between air forces and the land units they support."
hq_specops: "Special Operations Coordination"
hq_specops_desc: "Staff office for the planning and coordination of Special Forces operations."
