STAT_COMMON_FUEL_CONSUMPTION: "Food Consumption: "
STAT_COMMON_FUEL_CONSUMPTION_DESC: "How much food this unit uses while it is operating. Air and Sea units will consume food while on active missions or during training. Land units with food consumption will consume food in idle as well, but the combat, movement or training will further increase the consumption."
STAT_COMMON_FUEL_CONSUMPTION_FACTOR: "Food Consumption: "
STAT_COMMON_FUEL_CONSUMPTION_FACTOR_DESC: "How much food this unit uses while it is operating. Air and Sea units will consume food while on active missions or during training. Land units with food consumption will consume food in idle as well, but the combat, movement or training will further increase the consumption."

STAT_ARMY_FUEL_CONSUMPTION: "Food Use: "
STAT_ARMY_FUEL_CONSUMPTION_DESC: "How much food this unit uses daily."
STAT_ARMY_FUEL_CAPACITY: "Food Capacity: "
STAT_ARMY_FUEL_CAPACITY_DESC: "How much food this unit can store. Higher food capacity means that the unit will be able to operate at full capacity longer when it lacks the food supply."

STAT_NAVY_TORPEDO_ATTACK: "Light Projectile Attack: "
STAT_NAVY_TORPEDO_ATTACK_DESC: "How much damage we can do when using light, direct-fire projectiles like arrows and ballistae."
STAT_NAVY_TORPEDO_HIT_CHANCE: "Light Projectile hit chance: "
STAT_NAVY_TORPEDO_HIT_CHANCE_DESC: "How likely our light projectiles are to hit."
STAT_NAVY_TORPEDO_DAMAGE_REDUCTION: "Light projectile damage reduction: "
STAT_NAVY_TORPEDO_DAMAGE_REDUCTION_DESC: "Scales incoming light projectile damage."
STAT_NAVY_TORPEDO_ENEMY_CRIT_CHANCE: "Incoming Light projectile critical chance: "
STAT_NAVY_TORPEDO_ENEMY_CRIT_CHANCE_DESC: "How likely enemy light projectiles are to strike critical hits."

STAT_NAVY_LG_ATTACK: "Boarding Attack: "
STAT_NAVY_LG_ATTACK_DESC: "Damage done by boarding and ramming. Close-range, ship-to-ship combat."
STAT_NAVY_LG_ARMOR_PIERCING: "Boarding Power: "
STAT_NAVY_LG_ARMOR_PIERCING_DESC: "Boarding power to overcome the enemy ship's armor and defenses."
STAT_NAVY_LIGHT_GUN_HIT_CHANCE: "Boarding Attack hit chance: "
STAT_NAVY_LIGHT_GUN_HIT_CHANCE_DESC: "How likely our Ramming and Boarding attacks are to hit."

STAT_NAVY_HG_ATTACK: "Heavy Projectile Attack: "
STAT_NAVY_HG_ATTACK_DESC: "Damage done by heavy projectiles, launched from catapults and mangonels."
STAT_NAVY_HG_ARMOR_PIERCING: "Heavy Projectile Power: "
STAT_NAVY_HG_ARMOR_PIERCING_DESC: "Heavy projectile power to overcome the enmy ship's armor."
STAT_NAVY_HEAVY_GUN_HIT_CHANCE: "Heavy Projectile hit chance: "
STAT_NAVY_HEAVY_GUN_HIT_CHANCE_DESC: "How likely our heavy projectiles are to hit."

