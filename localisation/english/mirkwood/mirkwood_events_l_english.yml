l_english:
##### Event 
mirkwood.1.t:0 "Dwarf attack on Dale"
mirkwood.1.d:0 "The dwarves of Erebor have declared war on our former ally, the city-state of Dale. What is to be done?"
mirkwood.1.a:0 "Stand with Dale"
mirkwood.1.b:0 "None of our business"

mirkwood.2.t:0 "Mirkwood demands we stand down"
mirkwood.2.d:0 "The Elves of the Mirkwood do not appreciate our quarrel with Dale. They demand we stand our army down and seize all hostilites or they invade."
mirkwood.2.a:0 "Stand down. We cannot risk war with the elves."
mirkwood.2.b:0 "We will not stand down before any elf!"

mirkwood.3.t:0 "Mirkwood asks for an alliance"
mirkwood.3.d:0 "The Elves of the Mirkwood have always been drawn to the beauties of nature. Now they seek to unite with the ents."
mirkwood.3.a:0 "Thranduil has always been a close ally and friend."
mirkwood.3.b:0 "The elf is too hasty. We must think on this."

mirkwood.4.t:0 "Spider attack on the Elven King's Halls!"
mirkwood.4.d:0 "The Great Spiders of the Mirkwood have launched an attack on out greatest Elven city. The spiders have been fended off, but many of our valiant warriors lost their lives. If the Spiders are not dealt with soon, they might start an all out war on us!"
mirkwood.4.a:0 "The Spiders must be dealt with."

mirkwood.5.t:0 "The Spiders declare war"
mirkwood.5.d:0 "The Great Spiders of the Mirkwood have gathered in the West and taken up arms against us! They have declared themselves a free and independent nation of Mirkwood and will not stop until put down violently."
mirkwood.5.a:0 "War it is then."

mirkwood.6.t:0 "Orcs of Dol Guldur overrun Emyn Lûm!"
mirkwood.6.d:0 "A Horde of orcs coming from the ruin of Dul Guldur have overrun the southern city of Emyn Lûm. Our soldiers have reclaimed the land and driven the orcs back to Dol Guldur, but many lost their lives. If Dol Guldur is not dealt with, Sauron and his disciples may launch an all out attack from the fortress!"
mirkwood.6.a:0 "Dol Guldur must be dealth with."

mirkwood.7.t:0 "Dol Guldur declares war"
mirkwood.7.d:0 "The Orcs of Dol Guldur, lead by the ringwarith Khamûl, have taken up arms against us and now control all of Dol Guldur's surroundings!"
mirkwood.7.a:0 "War it is then."

mirkwood.8.t:0 "Dol Guldur"
mirkwood.8.d:0 "We have recieved word that enemy troops are gathering at the fortress of Dol Guldur. Mordor's heavy-handed meddling in the region is becoming a rising cause for concern and must be dealt with urgently!"
mirkwood.8.a:0 "This is bad..."

mirkwood.9.t:0 "[From.GetName] demands Dol Guldur"
mirkwood.9.d:0 "[From.GetName] have made their demands clear. They will welcome us if we return Dol Guldur back to Mordor."
mirkwood.9.a:0 "We never wanted that cursed rock!"
mirkwood.9.b:0 "Sauron must think us weak! We will show him the temper of our blades."

mirkwood.10.t:0 "[From.GetName] demands Dol Guldur back"
mirkwood.10.d:0 "[From.GetName] has sent us a demand to immediately return the fortress of Dol Guldur and surrounding environs. They are willing to let us in there alliance if we oblige."
mirkwood.10.a:0 "We never wanted that cursed rock!"
mirkwood.10.b:0 "Sauron must think us weak! We will show him the temper of our blades."

mirkwood.11.t:0 "Dol Guldur rises up"
mirkwood.11.d:0 "After a series of ambushes and hit-and-run attacks on our fellow soldiers in the area, the fortress of Dol Guldur has now fully slipped from our grasp. Our enemies have declared an independent state of Dol Guldur and loyally stand at Sauron's side. Attacking them may bring down the full might of Mordor on our heads!"
mirkwood.11.a:0 "Between a rock and a hard place..."

mirkwood.12.t:0 "Assault on Dol Guldur"
mirkwood.12.d:0 "The deviant occupants of Dol Guldur are weaker than ever. The moment is right to seize vengeance and inflict a crushing blow on Mordor!"
mirkwood.12.a:0 "Onward, elves of Mirkwood!"

mirkwood.13.t:0 "[From.GetName] requests acces to our resources"
mirkwood.13.d:0 "[From.GetName] is requesting a part of our string production. Saying that they need it for there every growing industry. They would much appreciete if we would grant them this acces."
mirkwood.13.a:0 "Sharing is caring"
mirkwood.13.b:0 "We would never!"
mirkwood.100.t:0 "The Pledge of the Mirkwood Elves"

mirkwood.100.desc:0 "King Thranduil of Mirkwood has sent a message filled with both reassurance and resolve. His majesty, captivated by the notion of elven purity, now vows to safeguard the sovereignty and future of all elven realms, including ours. This pledge is supported by the formidable military strength of the Mirkwood elves."

mirkwood.100.a:0 "Very well."

mirkwood.101.t:0 "What Should We Expect of Rivendell?"

mirkwood.101.desc:0 "In our grand endeavor to ensure the enduring legacy of all elves, we have committed to safeguarding Rivendell's independence, offering our formidable forces to their cause. Is it not befitting for Rivendell to demonstrate their gratitude in some manner?"

mirkwood.101.a:0 "They should reciprocate and guarantee our independence."

mirkwood.101.b:0 "They owe us a tribute of gold."

mirkwood.101.c:0 "They should acknowledge our supremacy."

mirkwood.102.t:0 "Mirkwood Asks for Guarantees"

mirkwood.102.desc:0 "Mirkwood, a kindred elven realm now growing imperious, has pledged to defend our independence. In return, they demand that we extend the same assurance to them."

mirkwood.102.a:0 "We shall oblige."

mirkwood.103.t:0 "Mirkwood Demands Tribute"

mirkwood.103.desc:0 "Mirkwood, increasingly imperious, has pledged to defend our independence. They now claim dominion over all elvendom and demand we pay tribute for their protection."

mirkwood.103.a:0 "Render unto them the tribute."

mirkwood.104.t:0 "Mirkwood Demands Submission"

mirkwood.104.desc:0 "Mirkwood has pledged to safeguard us, yet they now insist that we swear fealty and become their vassal to ensure the endurance of our realm."

mirkwood.104.a:0 "Desperate times call for desperate measures."

mirkwood.102.b:0 "We will not comply."

mirkwood.105.t:0 "Rivendell Accepts"

mirkwood.105.desc:0 "Rivendell has agreed to mirror our assurance of independence."

mirkwood.105.a:0 "Very well."

mirkwood.106.t:0 "Rivendell Refuses"

mirkwood.106.desc:0 "Rivendell has declined to offer a reciprocal guarantee."

mirkwood.106.a:0 "The audacity! Withdraw our guarantee immediately."

mirkwood.107.t:0 "Rivendell Complies"

mirkwood.107.desc:0 "Rivendell has paid their tribute as demanded."

mirkwood.107.a:0 "So be it."

mirkwood.103.b:0 "Thranduil has lost his mind!"

mirkwood.104.b:0 "Such a demand is absurd!"

mirkwood.108.t:0 "Rivendell Declines"

mirkwood.108.desc:0 "Rivendell has refused our demand for tribute."

mirkwood.108.a:0 "The nerve! Withdraw our guarantee without delay!"

mirkwood.109.t:0 "Rivendell Submits"

mirkwood.109.desc:0 "Rivendell has yielded and become our vassal."

mirkwood.109.a:0 "As it should be."

mirkwood.110.t:0 "Rivendell Refuses"

mirkwood.110.desc:0 "Rivendell has rejected vassalage under us."

mirkwood.110.a:0 "A disgrace! Withdraw our guarantee."

mirkwood.106.b:0 "Bold, but we shall overlook it."

mirkwood.111.t:0 "Mirkwood Withdraws Its Guarantee"

mirkwood.111.desc:0 "In response to our rejection, Mirkwood has chosen to rescind their guarantee of independence."

mirkwood.111.a:0 "It cannot be helped."

mirkwood.108.b:0 "We shall overlook it."

mirkwood.108.c:0 "Do they truly dare to defy us?"

mirkwood.112.t:0 "Rivendell Concedes"

mirkwood.112.desc:0 "Rivendell, at last, agrees to pay the tribute demanded."

mirkwood.112.a:0 "As expected."

mirkwood.113.t:0 "Mirkwood Insists"

mirkwood.113.desc:0 "Mirkwood is displeased with our refusal to pay tribute, threatening dire consequences should we defy them again."

mirkwood.113.a:0 "Pay the tribute. We must avoid internal strife."

mirkwood.110.b:0 "Perhaps it was too much to ask. Let it pass."

mirkwood.110.c:0 "Propose a tribute instead."

mirkwood.114.t:0 "Rivendell Declines Again"

mirkwood.114.desc:0 "Rivendell stands firm in their refusal of our tribute demands."

mirkwood.114.a:0 "Force will be our answer."

mirkwood.115.t:0 "A Call for Lothlorien's Gratitude"
mirkwood.115.desc:0 "We have taken it upon ourselves to guarantee the independence of Elven realms, notably the nearby enclave of Lothlorien. Yet, Galadriel and her kin have shown little appreciation for our benevolent protection. Should we not expect some gesture of gratitude for our magnanimity?"
mirkwood.115.a:0 "Lady Galadriel is on our side. We should join our forces."
mirkwood.113.b:0 "We will uphold our dignity!"

mirkwood.115.b:0 "Lothlorien should bow to us like anyone else."

mirkwood.115.c:0 "They could at least reciprocate and guarantee us as well."

mirkwood.116.t:0 "Alliance with Mirkwood Proposed"

mirkwood.116.desc:0 "The Elves of Mirkwood, under the rule of Thranduil, share our vision of Elven Supremacy. They extend their hand in friendship and seek an alliance to strengthen our united front."

mirkwood.116.a:0 "Sure. May we stand together as Elves."

mirkwood.117.t:0 "Mirkwood Demands Our Submission"

mirkwood.117.desc:0 "In a bold move, Mirkwood has shifted to an aggressive stance, demanding that the Golden Wood submit and become a vassal. This notion challenges our independence and questions our strength."

mirkwood.117.a:0 "The Golden Wood could use their protection."

mirkwood.118.t:0 "Mirkwood Requests Our Guarantee"

mirkwood.118.desc:0 "In the spirit of mutual independence, Mirkwood, having already taken the step to guarantee ours, requests that we return the favor and do the same for them."

mirkwood.118.a:0 "Sure."

mirkwood.116.b:0 "Certainly not."

mirkwood.117.b:0 "Thranduil has gone mad!"

mirkwood.118.b:0 "No."

mirkwood.119.t:0 "Lothlorien Honors Our Request"

mirkwood.119.desc:0 "Our neighbors in Lothlorien, discerning the wisdom in our proposal, have aligned themselves with our intentions by accepting our request."

mirkwood.119.a:0 "Good."

mirkwood.120.t:0 "Lothlorien Stands Defiant"

mirkwood.120.desc:0 "Lothlorien has chosen the path of defiance, rejecting our demands and our vision of a united Elven front."

mirkwood.120.a:0 "We'll let it slide."

mirkwood.120.b:0 "If they can't see reason, we will have to force them."

mirkwood.120.c:0 "Withdraw our guarantee and let them stand alone then."

mirkwood.121.t:0 "Mirkwood Expels Our Envoys"

mirkwood.121.desc:0 "King Thranduil of Mirkwood, consumed by a zeal for elven purity, has cast out our dwarven envoys from his halls. The sacred bonds of diplomacy between our realms lie shattered, and the specter of war haunts our future."

mirkwood.121.a:0 "We must strive to avoid further provocation."

mirkwood.121.b:0 "Let us send their diplomats packing as well!"

mirkwood.122.t:0 "Dealing with the Spiders"

mirkwood.122.desc:0 "The Great Spiders dwell within the depths of the wood and are perilously close to our settlements. This situation is fraught with danger and unpredictability, and we must seek a resolution. How should we proceed?"

mirkwood.122.a:0 "We could attempt to negotiate a non-aggression pact with them."

mirkwood.122.b:0 "Dispatch foragers and guards to ensure our borders are well-defended against any incursions."

mirkwood.122.c:0 "Enough of this! Gather our forces and eradicate them once and for all."

mirkwood.123.t:0 "Mirkwood Proposes a Non-Aggression Pact"

mirkwood.123.desc:0 "An elven envoy from the halls of Thranduil has approached us, proposing a pact of non-aggression that would allow our peoples to thrive independently and without conflict. What shall we decide?"

mirkwood.123.a:0 "Eat the envoy."

mirkwood.124.t:0 "Elves Strengthen Their Defenses"

mirkwood.124.desc:0 "The Elves of Mirkwood have taken great pains to bolster their defenses, ensuring their territory is secure against incursions by our kin or the vile orcs of Dol Guldur."

mirkwood.124.a:0 "Let us test their resolve..."

mirkwood.125.t:0 "Mirkwood Elves Prepare for War"

mirkwood.125.desc:0 "Reports from our spiderlings indicate that the Elves of Mirkwood are amassing a sizable army, clearly intending to launch an attack against us!"

mirkwood.125.a:0 "*Screeching*"

mirkwood.123.b:0 "If the elves wanted peace, perhaps they should consider being less tasty?"

mirkwood.123.c:0 "Accept the two-legged's terms."

mirkwood.126.t:0 "Spiders 'Decline' Our Proposal"

mirkwood.126.desc:0 "Our envoy sent to negotiate with the spiders has not returned. It seems likely that the spiders have... consumed him. How should we respond to this affront?"

mirkwood.126.a:0 "Vile creatures! We shall retaliate for this offense."

mirkwood.127.t:0 "Spiders Refuse Our Proposal"

mirkwood.127.desc:0 "The Spiders of Mirkwood have turned down our offer for a non-aggression pact. It appears that the notion of peace with elves is entirely outside their consideration."

mirkwood.127.a:0 "Enemies everywhere."

mirkwood.128.t:0 "Spiders Agree to Non-Aggression Pact"

mirkwood.128.desc:0 "Against all odds, our envoy has mollified the broodmothers of Mirkwood, and the spawn of Ungoliant have agreed to rein in their brood and refrain from attacking our core territory. Nevertheless, this does not entirely prevent minor skirmishes or incidents."

mirkwood.128.a:0 "Our western flank is safe, for the time being."

mirkwood.126.b:0 "Such are the perils of attempting diplomacy with monsters..."

mirkwood.129.t:0 "Mirkwood Retaliates"

mirkwood.129.desc:0 "Incensed by our consumption of their envoy, the Elves have retaliated by assembling a small force and launching a raid into our domain, tearing down our webs and demolishing some of our tunnels."

mirkwood.129.a:0 "At least we got a good meal out of it."

mirkwood.130.t:0 "Mirkwood Promises Aid Against Dol Guldur"

mirkwood.130.desc:0 "The shadow over Dol Guldur grows ever darker, casting its malevolent gaze upon our cherished Golden Wood. Our people are uneasy, feeling the threat that looms ever closer to our borders.\n\nYet, hope arrives from the verdant realm of Mirkwood. King Thranduil, steadfast against the same ominous threat, has vowed to stand with us should the forces of darkness march upon Lothlórien. His promise is a beacon of support amid the encroaching shadows."

mirkwood.130.a:0 "Appreciated!"

mirkwood.131.t:0 "Lothlórien Besieged"

mirkwood.131.desc:0 "The vile orcs of Dol Guldur have emerged in force, assailing the fair realm of Lothlórien with their malevolent wrath. We, sworn allies to Lothlórien, must now fulfill the vow of aid we pledged in such an hour of need."

mirkwood.131.a:0 "Draw your swords! To battle, for Lothlórien!"

mirkwood.131.b:0 "Regrettably, we must forsake our promise this time."

mirkwood.132.t:0 "A Call for Aid from Mirkwood"

mirkwood.132.desc:0 "King Thranduil of Mirkwood, our kin and ally, finds his beloved realm under siege by the relentless orcs of Dol Guldur. He turns to us, seeking assistance in this dire hour. We must decide our course of action to aid Mirkwood in this conflict."

mirkwood.132.a:0 "Summon our forces and march to Mirkwood's defense!"

mirkwood.132.b:0 "Provide Mirkwood with weaponry and provisions."

mirkwood.132.c:0 "Alas, we are unable to offer assistance."

mirkwood.133.t:0 "A Call for Aid from Mirkwood"

mirkwood.133.desc:0 "The dark and ancient woods of Mirkwood are besieged by the sinister Great Spiders. King Thranduil sends forth a plea for aid across the realm of elves. Will we answer his call?"

mirkwood.133.a:0 "We shall gather our warriors and march to his aid!"

mirkwood.133.b:0 "We will send provisions and arms to bolster their defenses."

mirkwood.133.c:0 "Alas, we are unable to offer assistance at this time."

mirkwood.134.t:0 "Rhosgobel Tribes Request Radagast's Aid"

mirkwood.134.desc:0 "The Woodmen of Rhosgobel seek the wisdom of Radagast the Brown, hoping his counsel will aid them in their endeavors. As Radagast dwells within our realm, the decision falls upon us to allow or deny this request."

mirkwood.134.a:0 "Permit Radagast to journey west and assist the Woodmen."

mirkwood.135.t:0 "Radagast Granted Leave by Mirkwood Elves"

mirkwood.135.desc:0 "The Elves of Mirkwood have given their blessing, allowing Radagast the Brown to join us in Rhosgobel. His wisdom shall undoubtedly be a boon to our people."

mirkwood.135.a:0 "This is welcome news!"

mirkwood.136.t:0 "Mirkwood Elves Withhold Radagast"

mirkwood.136.desc:0 "The Elves of the Mirkwood have chosen to keep Radagast within their lands. Our request has been denied, leaving him to remain in his woodland abode."

mirkwood.136.a:0 "A regrettable outcome."

mirkwood.134.b:0 "Radagast should remain in our borders."

anduin.2.t:0 "Stirring the Fires of Conflict"

anduin.2.desc:0 "For many years, we have girded ourselves for battle, constructing defenses and ensuring our safety. Our fortifications are now so robust that it would be an affront to let them remain untested. With the right provocations, we could instigate war with one of our neighbors. But who shall we deem as a worthy foe?"

anduin.2.a:0 "The Elves of Lothlórien"

anduin.2.b:0 "The Orcs of Dol Guldur"

anduin.2.c:0 "The Elves of the Mirkwood"

anduin.2.e:0 "The Chiefdoms of Gladden"

anduin.2.f:0 "The Spiders of the Mirkwood"

anduin.3.t:0 "Rhosgobel's Bold Maneuvers"

anduin.3.desc:0 "The court of the Woodmen of Rhosgobel has been behaving very badly. Through a series of border skirmishes, diplomatic chicanery, and other brazen acts, tensions have escalated beyond restraint. How shall we proceed?"

anduin.3.a:0 "Put them in their place."

anduin.3.b:0 "We must avoid war at all costs."

anduin.4.t:0 "[FROM.GetName] Girds for Battle"

anduin.4.desc:0 "It seems our provocations have struck true. The forces of [FROM.GetName] gather at our border, poised and ready for swift reprisal."

anduin.4.a:0 "Let them come!"

anduin.5.t:0 "[FROM.GetName] Yields Concessions"

anduin.5.desc:0 "[FROM.GetName], seeking to avert bloodshed, has extended significant diplomatic concessions. We stand to gain much, yet bloodshed is averted."

anduin.5.a:0 "So be it."

mirkwood.137.t:0 "Mirkwood Offers Timber"

mirkwood.137.desc:0 "In an unexpected, pragmatic gesture, the Elves of Mirkwood have proposed to sell us vast quantities of their finest timber in return for treasures of equal value. Shall we accept their offer?"

mirkwood.137.a:0 "Accept the offer and trade riches for timber."

mirkwood.138.t:0 "[FROM.GetName] Accepts the Offer"

mirkwood.138.desc:0 "[FROM.GetName] has agreed to our proposal and shall receive a generous shipment of our timber. In return, they will send us the promised treasures, ensuring mutual benefit."

mirkwood.138.a:0 "Very well, it shall be done."

mirkwood.139.t:0 "[FROM.GetName] Refuses the Offer"

mirkwood.139.desc:0 "[FROM.GetName] has turned down our offer to purchase wood and timber. Our resources remain with us, as does their wealth."

mirkwood.139.a:0 "So be it, we shall keep our goods."

mirkwood.137.b:0 "We have no need for such resources."

mirkwood.140.t:0 "Mirkwood Offers Territorial Concessions for Peace"

mirkwood.140.desc:0 "The Elves of Mirkwood, recognizing the might we have amassed, approach us with a proposal. They will surrender control of all Mirkwood lands south of the Forest Narrows. In return, they seek assurance that we will halt our advances and vow not to assail them further."

mirkwood.140.a:0 "We accept their terms."

mirkwood.141.t:0 "Dol Guldur Accepts the Treaty"

mirkwood.141.desc:0 "The Orcs of Dol Guldur have agreed to our terms. We shall cede all lands south of the Forest Narrows to them, securing a promise that they will desist from invading further and will not launch attacks against us."

mirkwood.141.a:0 "It was a necessary sacrifice."

mirkwood.142.t:0 "Dol Guldur Rejects the Treaty"

mirkwood.142.desc:0 "The orcs of Dol Guldur have dismissed our proposal to exchange territory for peace. It seems they are confident that warfare will yield them greater rewards than our concessions."

mirkwood.142.a:0 "A troubling turn of events..."

mirkwood.140.b:0 "We do not negotiate; we conquer."

mirkwood.143.t:0 "Thranduil's Demand for Vilya"

mirkwood.143.desc:0 "In a bold move, our liege lord from Mirkwood, King Thranduil of Eryn Lasgalen, has issued a grave demand:\n\nHe seeks the magic ring Vilya, held by the esteemed Elrond, claiming it is essential to fortify the realm of the elves against the encroaching shadow of evil."

mirkwood.143.a:0 "We must submit to his will."

mirkwood.144.t:0 "Thranduil's Demand for Nenya"

mirkwood.144.desc:0 "Our lords in Mirkwood, under the leadership of King Thranduil of Eryn Lasgalen, have put forth a grave request. They demand that we relinquish Lady Galadriel's treasured ring, Nenya, claiming it is vital for the safeguarding of all elvendom against rising darkness."

mirkwood.144.a:0 "We shall comply with Thranduil's demand."

mirkwood.143.b:0 "We shall stand our ground and refuse."

mirkwood.144.b:0 "We refuse to heed his request."

mirkwood.145.t:0 "[FROM.GetName] Accepts"

mirkwood.145.desc:0 "[FROM.GetName] has acknowleded our demand, and [FROM.GetLeader.GetName]'s Ring will be given to King Thranduil."

mirkwood.145.a:0 "Excellent."

mirkwood.146.t:0 "Galadriel Flees Into Exile"

mirkwood.146.desc:0 "It appears Lothlórien has refused our demand to hand over Lady Galadriel's magic ring, Nenya. To avert our wrath, our reports indicate Lady Galadriel has left the city and fled into exile, taking the precious ring with her."

mirkwood.146.a:0 "She has betrayed us."

mirkwood.147.t:0 "Elrond Flees Into Exile"

mirkwood.147.desc:0 "It appears Rivendell has refused our demand to hand over Lord Elrond's magic ring, Vilya. To avert our wrath, our reports indicate Lord Elrond has left the city and fled into exile, taking the precious ring with him."

mirkwood.147.a:0 "Traitor!"

mirkwood.148.t:0 "Mirkwood Meddling"

mirkwood.148.desc:0 "Our spies have uncovered a nefarious scheme within our own halls. It appears that certain agents, masquerading as our kin, work tirelessly to incite discontent and rally support for the overthrow of our rightful rule.\n\nWe have reason to believe these insidious agents are funded by the Elves of Mirkwood, under the direction of Thranduil."

mirkwood.148.a:0 "We must uncover and expel these agents from our midst."

mirkwood.149.t:0 "Firebeard Rebellion"

mirkwood.149.desc:0 "Tensions have simmered long due to Elven interference, and now the pot has boiled over. The Firebeard clan has attempted a coup.\n\nWhat began as a clash quickly escalated into bloodshed as our guard intervened. A civil war looms over our realm."

mirkwood.149.a:0 "Mobilize our forces and quell this rebellion immediately!"

mirkwood.150.t:0 "Firebeard Coup"

mirkwood.150.desc:0 "In the shadows of Elven manipulation, tonight the Firebeards have seized their moment. The coup has unfolded rapidly, with their forces taking control of critical points in Erebor and placing our King under their custody."

mirkwood.150.a:0 "Our situation grows ever more perilous."

mirkwood.148.b:0 "We shall not stifle voices, even those of dissent."

mirkwood.151.t:0 "Thranduil Returns the Necklace of Girion"

mirkwood.151.desc:0 "We were approached by delegations of the Elves of Mirkwood. It appears King Thranduil of the Greenwood has sought fit to return the Necklace of Girion to us.\n\nAfter the Battle of the Five Armies, Bard of Lake-Town had unrightly given this dwarven gift away to the elves. Now it is, at last, back in our hands."

mirkwood.151.a:0 "A welcome gesture!"

mirkwood.152.t:0 "Seeking a Worthy Ally"

mirkwood.152.desc:0 "The world beyond our forest grows ever more dangerous, and we find ourselves in need of steadfast allies to weather the storms ahead. Alone, we shall falter, but united, we might endure.\n\nOur thoughts turn to those we might join in friendship and mutual defense. To whom shall we extend our hand?"

mirkwood.152.a:0 "The great kingdoms of men offer strength and numbers."

mirkwood.152.b:0 "The men of the Vales of the Anduin live closest to us."

mirkwood.152.c:0 "We must consider even the most unthinkable of options..."

mirkwood.152.e:0 "The Kingdom of Rhovanion is in a fragile state. Our support could ensure its survival."

mirkwood.153.t:0 "The Future of Elves and Orcs"

mirkwood.153.desc:0 "In times past, we have made the fateful choice to consider a new path forward, recognizing the coming tide of darkness heralded by the orcs and the looming power of Mordor.\n\nNow, we must deliberate on the fate of our people. Shall we strive for a cohabitation with these creatures of shadow, or do we accept the waning of our time in Middle Earth?"

mirkwood.153.a:0 "We must strive for coexistence with the orcs, despite the challenges this will bring."

mirkwood.153.b:0 "The era of the elves is ending; let the era of the orcs begin."

mirkwood.154.t:0 "Which Ways the Shadows Fall"

mirkwood.154.desc:0 "The era of men wanes, and the shadowy reign rises. We must decide where our loyalties will stand, for in this decision lies the fate of our realm.\n\nShall we submit to the will of the Dark Lord to ensure our survival, or shall we forge our path in defiance, strengthening our power in the shadows?"

mirkwood.154.a:0 "We must bow to Sauron. The alternative is extinction."

mirkwood.154.b:0 "We can resist Sauron. We must only form a stronger shadow!"

mirkwood.155.t:0 "Honeycakes and Lembas Exchange"

mirkwood.155.desc:0 "Despite the usual seclusion of the Elves of Mirkwood, our ties with them have grown stronger. The bonds of friendship have been kindled through a delightful exchange of provisions. Our treasured honey-cakes, a symbol of our culture, find their way to the Elven halls in return for their renowned Lembas Bread.\n\nSuch exchanges have enriched both our peoples, fostering goodwill and understanding."

mirkwood.155.a:0 "Very well."

mirkwood.156.t:0 "Mirkwood asks for help"

mirkwood.156.desc:0 "Mirkwood faces a grim predicament: The Greenwood is increasingly under assault by the Great Spiders and the Orcs of Dol Guldur. Thranduil fears loosing control over key territories, which could impact crossing through the Mirkwood. If this were to happen, trade and diplomacy could be impacted, and the menace could spread elsewhere.\nMirkwood asks us for what we can spare to help with this effort."

mirkwood.156.a:0 "Help them deal with these threats."

mirkwood.157.t:0 "Mirkwood asks for help"

mirkwood.157.desc:0 "Our kin in Mirkwood faces a grim predicament: The Greenwood is increasingly under assault by the Great Spiders and the Orcs of Dol Guldur. Thranduil fears loosing control over key territories, which could impact crossing through the Mirkwood. If this were to happen, trade and diplomacy could be impacted, and the menace could spread elsewhere.\nMirkwood asks us for what we can spare to help with this effort."

mirkwood.157.a:0 "Help them deal with these threats."

mirkwood.158.t:0 "[FROM.GetName] Offers Help"

mirkwood.158.desc:0 "[FROM.GetName] has seen our predicament and offered some assistance in containing the spreading menaces of the Spiders and Dol Guldur."

mirkwood.158.a:0 "Appreciated!"

mirkwood.157.b:0 "We can't spare anything right now."

mirkwood.156.b:0 "We can't spare anything right now."


