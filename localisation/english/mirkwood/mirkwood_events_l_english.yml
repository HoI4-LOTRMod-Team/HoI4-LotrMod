mirkwood.159.t:0 "[FROM.GetName] seizes [?event_target:target_state.GetName]"

mirkwood.159.desc:0 "[FROM.GetName]'s presence has been increasing as of late, and their forces have infested many areas of the sacred wood we call home. Today, this presence reached a breaking point, and our people were forced to flee and evacuate from the state of [?event_target:target_state.GetName], which the enemy now occupies."

mirkwood.159.a:0 "We will take it back... Eventually."

mirkwood.160.t:0 "Elves Lock Down the Forest"

mirkwood.160.desc:0 "After a long period during which our presence slowly crept and grew throughout the dark woods, it appears the Elves have finally gotten their act together. Any incursions into elven territory will likely be met with full hostility and treated as war."

mirkwood.160.a:0 "It was good while it lasted."

mirkwood.14.t:0 "Mirkwood's Knowledge Sharing"

mirkwood.14.d:0 "King Thranduil of the Greenwood has started an initiative, seeking closer cooperation with other elven peoples. He invites us to join a common council of scholars, so that we may share findings and knowledge among each other."

mirkwood.14.a:0 "A great idea!"

mirkwood.14.b:0 "We have no need of this."

mirkwood.15.t:0 "Thranduil's Halls Under Attack!"

mirkwood.15.d:0 "The enemy has breached our defenses and entered the Enchanted Vale, uncomfortably close to our capital. Luckily, King Thranduil took precautions exactly for such a calamity: The King's Guard stand ready to be deployed!"

mirkwood.15.a:0 "Deploy the Guard!"
