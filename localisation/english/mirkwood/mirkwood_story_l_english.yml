l_english:

 mirkwoodstory.1000.t:0 "Murder in the King's Halls!"
 mirkwoodstory.1000.desc:0 "Last night, beneath the gracious roof of King Thranduil, we gathered to celebrate the Festival of Starlight, marking the re-settlement of our kin from Amon Lanc to the Emyn Duir.\n\nHowever, the evening's joy was marred by a grave incident: The discovery of a murder during the festivities!\n\nLady Galadwen, a cherished figure in Sindar high society, was found lifeless in her private chamber. There were no signs of struggle, yet her face was frozen in terror. The doors were securely locked from within.\n\nThis troubling event has cast a shadow over the people of Mirkwood, filling the court with rumors, distrust, and unease. We must uncover the truth of this heinous act and bring the culprit to justice. The King has chosen three individuals to investigate this sorrowful affair: \n\nTravaran, a pure-blooded, no-nonsense commander, known for running intelligence like a military battalion. His relentless drive is matched by a tactless demeanor and a prejudice against non-elves.\n\nNyrvolas, a charming Noldor hailing from Lothlórien. His charisma and extensive contacts in high society are well-regarded, though he has been involved in scandals and possesses a tendency towards... unconventional methods.\n\nOr Tanithil, a venerable guard of Sindarin descent, whose centuries of loyal, if unspectacular, service to King Thranduil have made him a figure of trust. "

 mirkwoodstory.1000.a:0 "This matter calls for decisive action. Appoint Travaran."

 mirkwoodstory.1000.b:0 "We require someone with finesse. Appoint Nyrvolas."

 mirkwoodstory.1000.c:0 "Tanithil is the most trustworthy. Appoint him."

 mirkwoodstory.1001.t:0 "Travaran's Investigation"
 mirkwoodstory.1001.desc:0 "Travaran, our investigator in the case of Lady Galadwen's murder, has made significant strides through a series of arrests and rigorous interrogations. Though his methods are deemed intrusive and forceful, they have borne fruit. His initial report unveils crucial aspects of the matter:\n\nLady Galadwen met her end by a rare toxin, derived from the glands of a great spider. This venom, both precious and difficult to acquire, is stocked in considerable quantities by our chief alchemist, Delmuth.\n\nFurthermore, the night preceding the murder witnessed Lady Galadwen engaged in a heated dispute with Tauron, the commander of the City Guard, who alone held the privilege of accessing her chamber.\n\nNonetheless, Travaran's foremost suspect remains Nikulas, the mannish King's Ambassador to Dale. Allegedly, Lady Galadwen obstructed an essential trade agreement with Dale, and Nikulas, in return, attempted to sway her with a lavish offering of Dorwinion wine. Travaran suspects this was not a mere bribe, but a vengeful act of retribution, poison suffused into the wine.\n\nThus, we must decide the path upon which Travaran shall tread."
 mirkwoodstory.1001.a:0 "A compromised guard commander spells major toruble. Focus the investigation on Tauron."
 mirkwoodstory.1002.t:0 "Nyrvolas' Investigation"
 mirkwoodstory.1002.desc:0 "The sly Noldorin investigator, Nyrvolas, whom we've tasked with investiagting the truth behind Lady Galadwen's murder, has presented us with his initial findings.\n\nNyrvolas, having 'seduced' one of the late Galadwen's chambermaids, uncovered that Lady Galadwen had an intense altercation with Tauron, the formidable commander of the city guard, on the night she was killed. It has come to light that Lady Galadwen was secretly entangled in a romantic liaison with Tauron, whose wrath was ignited by her growing familiarity with Nikulas, the human Ambassador to Dale.\nIt is said that Nikulas bestowed upon Galadwen a rare bottle of Dorwinion wine, intended as a bribe for a trade agreement, though this gesture quickly evolved into something more personal.\n\nNyrvolas considers two scenarios plausible: Either Tauron, possessing exclusive access to her chambers, entered that fateful night and poisoned her, or Nikulas, for reasons yet unknown, used the wine to deliver the fatal toxin.\n\nOne certainty remains: Lady Galadwen was poisoned, and the rare toxin discovered traces back to Delmuth, our reclusive chief alchemist.\n\nNyrvolas finds little relish in consulting with someone 'as tedious as' Delmuth and suggests that the investigation should concentrate on Nikulas."
 mirkwoodstory.1002.a:0 "A compromised city guard spells trouble. Focus the investigation on Tauron."

 mirkwoodstory.1003.t:0 "Tanithil's Investigation"
 mirkwoodstory.1003.desc:0 "The seasoned Sindarin investigator, Tanithil, has made notable progress in uncovering the truth behind Lady Galadwen's murder:\n\nThe autopsy reveals that Lady Galadwen fell victim to poison. This venom, rare and formidable, is derived from the very glands of a Great Spider.\n\nTanithil's investigation has uncovered witnesses who claim that on the fateful night, Lady Galadwen had a bitter confrontation with Tauron, the commander of the city guard. Tauron alone could have accessed her quarters unnoticed.\n\nMoreover, Lady Galadwen had been obstructing a crucial trade negotiation with Dale, and intriguingly, she received a lavish gift of Dorwinion wine from the Dale ambassador, Nikulas. The investigator believes this particular wine may have been the poisoned vessel.\n\nWe must decide on our next course of action."
 mirkwoodstory.1003.a:0 "A compromised city guard spells trouble. Focus on Tauron."
 mirkwoodstory.1001.b:0 "Trust Travaran's judgement. Pursue the inquiry into Nikulas."
 mirkwoodstory.1001.c:0 "An ordinary diplomat lacks the means. Direct the investigation towards Delmuth."
 mirkwoodstory.1002.b:0 "Non-elves are always vain and scheming. Focus on Nikulas."

 mirkwoodstory.1002.c:0 "There is only one plausible source for the poison. Order Nyrvolas to look into Delmuth."

 mirkwoodstory.1003.b:0 "A poisoned bottle of wine? Look into Nikulas."
 mirkwoodstory.1003.c:0 "Where would one even get such rare poison? Trace back any possible sources."
 mirkwoodstory.1004.t:0 "Tauron's Supposed Innocence"
 mirkwoodstory.1004.desc:0 "Recent developments have arisen in the grim case of Lady Galadwen's murder. Nyrvolas, a charming yet dubious figure we entrusted with the investigation, has focused his efforts on Tauron, the commander of the city guard. \n\nIt is now confirmed that Tauron secretly courted Lady Galadwen and fell into a jealous rage upon discovering that she received a gift from Nikulas, the Dalish ambassador. \n\nDespite such revelations, Nyrvolas claims to be convinced of Tauron's innocence, relying solely on his intuition in absence of concrete evidence. He advises redirecting our inquiry towards other potential suspects."

 mirkwoodstory.1004.a:0 "Direct suspicion to Nikulas, for it was he who gifted Lady Galadwen with that wine."

 mirkwoodstory.1005.t:0 "Nyrvolas' Investigation"
 mirkwoodstory.1005.desc:0 "Nyrvolas, the charmer we entrusted with the investigation of Lady Galadwen's untimely demise, has taken a keen interest in the prime suspect, Nikulas, the ambassador from Dale.\n\nPurely based on his 'intuition', Nyrvolas has determined that the wine believed to be from Dorwinion, which was used to poison Galadwen, was in fact not from that region. It appears that Nikulas attempted to pass off a cheaper vintage obtained from a local source as genuine Dorwinion.\n\nNyrvolas now seeks permission to shift the inquiry towards the wine-maker to determine whether the bottle was tampered with prior to or following Nikulas' purchase.\n\nMeanwhile, representatives from Dale voice their apprehension over the continued detention of their envoy, Nikulas."

 mirkwoodstory.1005.a:0 "Proceed to investigate the wine-maker. Unravel this mystery."

 mirkwoodstory.1006.t:0 "Delmuth's Suspicious Behavior"
 mirkwoodstory.1006.desc:0 "Progress has been made in the case of Lady Galadwen's murder. Nyrvolas, the charismatic but unreliable Noldorin investigator, has focused his attention on Delmuth, our chief alchemist.\n\nThe poison responsible for Lady Galadwen's death appears to have almost certainly originated from Delmuth's stores, yet Nyrvolas' charm fails to sway the reclusive alchemist into divulging more information.\n\nMeanwhile, Nyrvolas has become distracted, spending his efforts on an unrelated dalliance with a winemaker’s daughter, all the while assuring us that he remains 'hard at work'. If we do not intervene, we risk the case being neglected and forgotten."

 mirkwoodstory.1006.a:0 "Let Nyrvolas cook."

 mirkwoodstory.1006.b:0 "The evidence is sufficient. Declare Delmuth guilty and let justice be served."

 mirkwoodstory.1007.t:0 "The Vintner's Confession"
 mirkwoodstory.1007.desc:0 "Nyrvolas has returned with a troubling discovery. Upon questioning the local wine-maker, he uncovered that the vintner not only sold a lesser vintage to Ambassador Nikulas, but also engaged in secret correspondence with our chief alchemist, Delmuth.\n\nIt appears Delmuth paid a handsome sum to have the vintner leave his barrels unattended for a night. Nyrvolas argues this proves Delmuth orchestrated the poisoning long before Nikulas ever acquired the bottle."
 mirkwoodstory.1007.a:0 "Delmuth's name keeps resurfacing..."

 mirkwoodstory.1008.t:0 "A Startling Accusation"
 mirkwoodstory.1008.desc:0 "Just as we prepared to move against Delmuth, Tanithil, the close advisor to the King, has stepped forward with a grave accusation. He claims to have personally witnessed Nyrvolas planting forged letters in the wine-maker's ledger to frame the alchemist.\n\nTanithil insists that the Noldorin investigator's dubious methods and arrogance have finally crossed into outright treachery, likely to protect the true culprit or simply close the case prematurely."
 mirkwoodstory.1008.a:0 "Trust the loyal Tanithil. Imprison Nyrvolas!"
 mirkwoodstory.1008.b:0 "Tanithil must be mistaken. Arrest Delmuth."

 mirkwoodstory.1009.t:0 "The King's Justice"
 mirkwoodstory.1009.desc:0 "With the investigation spiraling into a tangled web of lies, false accusations, and sudden deaths, it is clear that our appointed proxies have failed us. The shadows over Mirkwood grow deeper, and rumors in King Thranduil's court threaten our unity.\n\nIt is time to bypass these 'investigators' and look at the raw facts ourselves. We must gather the remaining evidence and uncover the true murderer before they escape justice entirely."
 mirkwoodstory.1009.a:0 "Leave no stone unturned. We will find the truth."

 mirkwoodstory.1010.t:0 "A Tragic End in the Dungeons"
 mirkwoodstory.1010.desc:0 "A dark turn of events plagues our halls. Chief Alchemist Delmuth, recently imprisoned on the evidence provided by Nyrvolas, has been found dead in his cell. The guards report it as a suicide, but the circumstances are highly suspicious.\n\nIt seems Delmuth was silenced before he could speak in his own defense."
 mirkwoodstory.1010.a:0 "This investigation is compromised. We must intervene directly."

 mirkwoodstory.1011.t:0 "The Mastermind Unveiled"
 mirkwoodstory.1011.desc:0 "By carefully retracing the steps of our failed investigators and analyzing the untouched evidence, the truth has come to light:\n\nThe false trails, planted evidence, and convenient deaths point not to a foreign diplomat or a jealous lover, but to the very heart of the King's guard. Tanithil, the veteran who has served us for centuries, is the true culprit. Driven by a twisted desire for glory, he orchestrated the murder, intending to 'solve' it and emerge as the realm's savior."
 mirkwoodstory.1011.a:0 "Seize the traitor before he can flee!"

 mirkwoodstory.1004.b:0 "Pursue the possibility that the poison originated from Chief Alchemist Delmuth's stores."

 mirkwoodstory.1004.c:0 "Justice demands more than intuition. We shall lay this matter to rest."

 mirkwoodstory.1005.b:0 "Avoid a diplomatic strain. Exile Nikulas and conclude the matter."

 mirkwoodstory.1012.t:0 "Tauron's Interrogation"
 mirkwoodstory.1012.desc:0 "Travaran has directed his scrutiny upon the prime suspect in the murder of Lady Galadwen: Tauron, the city guard commander. Through his usual, albeit harsh methods, Travaran apprehended Tauron, extracting information through rather severe means.\n\nTauron's admissions are riddled with inconsistency and contradiction, likely a result of the coercion he endured. He reveals having had a liaison with Lady Galadwen and admits to anger towards her for her closeness with the ambassador from Dale, Nikulas. He maintains he last saw her following a heated dispute on the night of her death, yet he later confessed to loitering outside her chambers, hoping to speak with her when she emerged.\n\nFortunately, a third party has testified in Tauron's favor, confirming his alibi and alleging that Delmuth, the reserved chief alchemist, attempted to meddle with Lady Galadwen's autopsy.\n\nTravaran is now convinced of Tauron's innocence and proposes that the investigation should proceed down another path.\n\nRegrettably, Tauron's ordeal has left him deeply disturbed, making it unlikely for him to resume his duties as city guard commander in the foreseeable future."

 mirkwoodstory.1012.a:0 "Delmuth is behaving suspiciously. Focus the investigation into him."

 mirkwoodstory.1013.t:0 "Travaran's Findings"
 mirkwoodstory.1013.desc:0 "Progress has at last been made in the investigation into the murder of Lady Galadwen.\n\nOur chief investigator, Travaran, has taken the Dalish ambassador, Nikulas, into custody. After enduring a rigorous interrogation and with further evidence gathered, the true picture begins to emerge:\n\nLady Galadwen had been a steadfast opponent of a significant trade agreement with Dale. Nikulas had presented her with a seemingly exquisite bottle of Dorwinion wine, secretly poisoned with a deadly toxin. While Nikulas claims innocence, insisting the wine was intended merely as a bribe, Travaran remains convinced, viewing this as an act of bitter revenge wrapped in 'a typical mannish deception'. King Thranduil's alchemist, Delmuth, supports this claim, testifying that Nikulas pilfered the poison from his stores.\n\nHow shall we proceed?"

 mirkwoodstory.1013.a:0 "Nikulas has committed murder under the King's roof. Justice must be served!"

 mirkwoodstory.1014.t:0 "Delmuth's Interrogation'"
 mirkwoodstory.1014.desc:0 "Travaran, the investigator we entrusted with uncovering the truth behind Lady Galadwen's murder, has made notable strides in the case:\n\nChief alchemist Delmuth was detained and subjected to a rigorous interrogation, during which he confessed to his involvement in the crime. He claimed to have secretly poisoned a bottle of wine, later sold to the Dalish ambassador, Nikulas, who unknowingly presented it to Lady Galadwen. Delmuth accepts full responsibility and is prepared to face a death sentence.\n\nDespite this confession, Travaran remains skeptical. He suspects that Delmuth, bearing no discernible motive, acted under duress and had accomplices... co-conspirators who may have threatened him or his family should he reveal their identities.\n\nTravaran proposes using some... advanced torture methods to get Delmuth to spill the entire truth."

 mirkwoodstory.1014.a:0 "Travaran's methods are crude but effective. Let him get to the bottom of this."

 mirkwoodstory.1013.b:0 "Executing him could spark a diplomatic incident. Expell him and sweep this under the rug."

 mirkwoodstory.1012.b:0 "Nikulas is an outsider and cannot be trusted. Target Travaran's efforts at him."

 mirkwoodstory.1014.b:0 "This has gone on for long enough. Execute Delmuth and let justice be served!"

 mirkwoodstory.1015.t:0 "Tanithil Implicated in Lady Galadwen's Murder"
 mirkwoodstory.1015.desc:0 "There have been startling developments in the grim case of Lady Galadwen's murder. Travaran, the stern and relentless investigator we appointed, has employed his most unforgiving techniques to pry the truth from Delmuth, the chief alchemist who already confessed his guilt.\n\nThough Travaran's methods are harsh, they have unveiled shocking revelations. It appears none other than Tanithil, long a trusted confidant of King Thranduil and not even a suspect, orchestrated this heinous plot.\n\nTanithil coerced Delmuth into poisoning Lady Galadwen's wine, intending to frame the Dalish ambassador, Nikulas, and seize glory as the savior. Sadly, we uncovered the truth too late. True to his threats, Tanithil has slain Delmuth's family and vanished from the city under the cover of night. His current whereabouts remain a mystery."

 mirkwoodstory.1015.a:0 "The truth is ours, but justice escapes us!"

 mirkwoodstory.1016.t:0 "Tauron Found Guilty"
 mirkwoodstory.1016.desc:0 "Following the recommendations of our trusted investigator Tanithil, the city guard commander, Tauron, has been formally charged with the murder of Lady Galadwen.\n\nTanithil presented a compelling narrative: driven mad by jealousy over the Dalish ambassador's gifts, Tauron used his exclusive access to Galadwen's chambers to slip the spider venom into her cup. Though Tauron protests his innocence and curses Tanithil's name."
 mirkwoodstory.1016.a:0 "Lock him in the dungeons. Justice is served."

 mirkwoodstory.1017.t:0 "Nikulas Found Guilty"
 mirkwoodstory.1017.desc:0 "The investigation led by Tanithil has reached its grim conclusion. The Dalish ambassador, Nikulas, has been found guilty of murdering Lady Galadwen.\n\nAccording to Tanithil's report, Nikulas, enraged by Galadwen's political obstruction, acquired spider venom and laced the Dorwinion wine he offered her.\n\nDespite Dale's outrage and threats of a diplomatic crisis, Nikulas has been stripped of his titles and imprisoned."
 mirkwoodstory.1017.a:0 "A grim necessity for the safety of our halls."

 mirkwoodstory.1018.t:0 "Delmuth Found Innocent"
 mirkwoodstory.1018.desc:0 "Tanithil has completed his inquiry into the reclusive alchemist, Delmuth. Surprisingly, the veteran guard has cleared Delmuth of all charges, reporting that the alchemist's stores were indeed breached, but by an outside party.\n\nTanithil now emphatically points the finger at the Dalish ambassador, Nikulas, claiming to have found traces of the rare spider venom near the ambassador's guest quarters. He urges us to arrest Nikulas immediately."
 mirkwoodstory.1018.a:0 "If Tanithil is certain, arrest Nikulas."
 mirkwoodstory.1018.b:0 "Take a second look at these 'traces'..."

 mirkwoodstory.1019.t:0 "Corruption On The Rise"
 mirkwoodstory.1019.desc:0 "The court of King Thranduil is quiet once more, yet it is a troubled peace. \n\nRumors have it that the blatant favoritism Thanrduil shows his long-time supporters and closest advisors has lead to significant corruption, with seniority superceding qualifications."
 mirkwoodstory.1019.a:0 "We shall address this concern in due time."

 mirkwoodstory.1020.t:0 "Inconsistencies in Tanithil's Findings"
 mirkwoodstory.1020.desc:0 "By taking a closer look at the evidence Tanithil provided against Nikulas, glaring inconsistencies have begun to emerge. The 'traces' of venom found near the ambassador's quarters were clumsily placed, and the timeline of the break-in at the alchemist's stores perfectly aligns with Tanithil's own patrol route.\n\nIt becomes horrifyingly clear that Tanithil is not solving a murder, but actively framing innocent men to cover up a darker truth."
 mirkwoodstory.1020.a:0 "We must take control of this investigation."


 mirkwoodstory.2000.t:0 "Suspicuous Behavior Reported"
 mirkwoodstory.2000.desc:0 "Reports have reached the King concerning a reclusive family of our kin residing in the deeper, darker parts of the forest. Lately, they have been seen venturing into the capital's markets, making highly unusual requests.\n\nThey purchase vast quantities of raw meat and seek out specialized alchemical binding agents, refusing to explain their needs to the merchants. Such secrecy in these troubled times breeds suspicion, and some within the court wonder if the Shadow has taken root in their hearts."
 mirkwoodstory.2000.a:0 "They are but eccentric. Let them be."
 mirkwoodstory.2000.b:0 "Send a patrol to look into their dealings."

 mirkwoodstory.2001.t:0 "A Monstrous Pet"
 mirkwoodstory.2001.desc:0 "The suspicious elven family living in the woods has been investigated, and what they discovered is troubling.\n\nThe reclusive family was not conspiring with the Enemy, but their secret is perhaps just as dangerous. They have been harboring a spiderling (an offspring of the Great Spiders) treating the creature as a domesticated pet!\n\nThe family begs for mercy, claiming this particular broodling is different from its vile kin. What is to be done with this creature?"
 mirkwoodstory.2001.a:0 "A Spider? KILL IT WITH FIRE!"
 mirkwoodstory.2001.b:0 "Seize it. Cage and study the creature."

 mirkwoodstory.2002.t:0 "The Beast is Slain"
 mirkwoodstory.2002.desc:0 "The spiderling has been put to the sword. Though it was young, its corpse remains a unique specimen. "
 mirkwoodstory.2002.a:0 "Harvest the corpse for study."
 mirkwoodstory.2002.b:0 "Burn the carcass. Good riddance."

 mirkwoodstory.2003.t:0 "Spiderling Study Complete"
 mirkwoodstory.2003.desc:0 "The spiderling has been secured in the capital's dungeons. As the king's advisors observe it, they note unique behavior: it does not thrash against its iron cage, nor does it snap its mandibles in the insatiable hunger typical of the Great Spiders.\n\nIt also lacks the foul, echoing speech of its larger kin. It appears to be a spider untouched by the malice of Ungoliant. Such an anomaly calls for more practiced hands."
 mirkwoodstory.2003.a:0 "Consult our own elven scholars and beastmasters."
 mirkwoodstory.2003.b:0 "Send word to Rhosgobel. Seek out Radagast the Brown."

 mirkwoodstory.2004.t:0 "Spiderling Studied"
 mirkwoodstory.2004.desc:0 "Our scholars and beastmasters have observed the caged spiderling for weeks. Though they cannot explain how such a creature could be free of its malice, they are confident in one conclusion: the beast is entirely docile.\n\nWhat is to be done with it?"
 mirkwoodstory.2004.a:0 "Domesticate it for silk production."
 mirkwoodstory.2004.b:0 "Study its physiology to find new weaknesses in its wild kin."

 mirkwoodstory.2005.t:0 "The Wizard's Counsel"
 mirkwoodstory.2005.desc:0 "Radagast the Brown has taken a keen, joyful interest in the young spider. After communing with the creature, he assures us that its spirit is untainted. Radagast believes that with time and natural growth, it could become a powerful, loyal companion on the battlefield.\n\nAlternatively, our alchemists suggest using potions to force its growth immediately. Although Radagast warns that meddling with its natural development may stunt its true potential."
 mirkwoodstory.2005.a:0 "Patience is an elven virtue. Let it grow naturally."
 mirkwoodstory.2005.b:0 "War is upon us. Force its growth with magic."

 mirkwoodstory.2006.t:0 "The Spiderling Has Grown"
 mirkwoodstory.2006.desc:0 "Under the careful watch of our beastmasters, the spiderling has grown into a formidable, yet loyal, creature. While it has not yet reached the towering size of it's brood-mothers, Radagast assures us it will only grow stronger with time. Encased in custom-forged elven armor, this unique beast is now ready to fight alongside our forces."
 mirkwoodstory.2006.a:0 "To battle, then!"

 mirkwoodstory.2007.t:0 "The Spiderling Has Grown"
 mirkwoodstory.2007.desc:0 "The potions worked with terrifying speed. The spiderling rapidly swelled to a monstrous size, but just as Radagast warned, the magic has warped its mind. The innate, vicious aggression of the Great Spiders has awakened within it. \n\nIt is a living weapon now, barely tethered to our will. We must decide what to do before it breaks free and turns on our own people."
 mirkwoodstory.2007.a:0 "Point it toward Dol Guldur and let it wreak havoc!"
 mirkwoodstory.2007.b:0 "We have created a monster. Put it down for good."
 mirkwoodstory.2007.c:0 "Double the chains. We will try to bend it to our will."



 mirkwoodstory.3000.t:0 "Tremors in the Deep Woods"
 mirkwoodstory.3000.desc:0 "Rangers returning from the rarely traversed depths of the forest report a strange anomaly. The very earth shakes with powerful tremors, and a heavy, ancient presence is felt."
 mirkwoodstory.3000.a:0 "It is but the settling of the earth. Ignore it."
 mirkwoodstory.3000.b:0 "These woods hold too many secrets. Investigate."

 mirkwoodstory.3001.t:0 "Our forces suffer a strange attack"
 mirkwoodstory.3001.desc:0 "Without warning, a localized earthquake shattered our encampments, followed by heavy rockfalls that seemed to defy the natural landscape. Several divisions have sustained severe casualties from this terrifying, unknown phenomenon."
 mirkwoodstory.3001.a:0 "A tragic loss. We must remain vigilant."

 mirkwoodstory.3002.t:0 "Anomaly Investigated"
 mirkwoodstory.3002.desc:0 "Our scouts have managed to close in on the source of the anomaly, but the surrounding woods are teeming with danger. The unnatural tremors have deeply agitated the local wildlife, stirring several nests of Great Spiders into a frenzy. Pressing further into this hostile territory will be exceedingly dangerous without proper military support."
 mirkwoodstory.3002.a:0 "Deploy a host of warriors to secure the perimeter."
 mirkwoodstory.3002.b:0 "We are the masters of this forest. Order the scouts to press on."

 mirkwoodstory.3003.t:0 "Stones Out of Place"
 mirkwoodstory.3003.desc:0 "Navigating the perilous woods, our scouts have discovered an unusual rock formation in a secluded glade. The stones are jagged, immense, and entirely foreign to the soil of Mirkwood; they bear a striking resemblance to the treacherous peaks of the Misty Mountains far across the Anduin. Lacking the necessary lore to understand this anomaly, the scouts request that a safe path be cleared so our scholars might examine the site."
 mirkwoodstory.3003.a:0 "Clear the path. Let the loremasters discern its nature."

 mirkwoodstory.3004.t:0 "Anomalous Rock Formation"
 mirkwoodstory.3004.desc:0 "The area has been secured, and our most learned scholars have begun their examination. They report that the mysterious rock formation extends deeply beneath the forest floor. More startlingly, the stones radiate a potent, ancient magic. The loremasters claim the rocks possess a slumbering 'life' of their own, unlike anything native to our woods."
 mirkwoodstory.3004.a:0 "Fracture the stone and harvest any magical relics within."
 mirkwoodstory.3004.b:0 "Stabilize the formation and establish a long-term study."
 mirkwoodstory.3004.c:0 "Bring shovels and pickaxes. Excavate the site fully."

 mirkwoodstory.3005.t:0 "The Sleeping Giant"
 mirkwoodstory.3005.desc:0 "As our laborers dug away the earth, they uncovered a truth far more harrowing than mere magic stones. Half-buried beneath the soil lies a dormant Stone Giant of old!\n\nHow a creature of the Misty Mountains came to rest in the heart of Mirkwood is a mystery lost to time. Our scholars are divided on how to proceed. Some suggest there are ancient methods to bind and command such a titan, while others warn that waking it could invite absolute devastation."
 mirkwoodstory.3005.a:0 "The Ents are of similar kin to the giants. They may know what to do."
 mirkwoodstory.3005.b:0 "It is too dangerous. Leave it buried and use the area as a trap for our foes."
 mirkwoodstory.3005.c:0 "A weapon of this magnitude cannot be ignored. Find a way to control it."

 mirkwoodstory.3006.t:0 "Council of the Trees"
 mirkwoodstory.3006.desc:0 "We have guided several Ents to the secluded glade to behold the half-buried giant. After a remarkably lengthy and deliberate moot, they have presented us with two paths:\n\nThey can sing an ancient lullaby of the deep earth, ensuring the giant remains in a deep slumber for ages to come.\n\nAlternatively, they offer to siphon the giant's raw, earthen magic to awaken the surrounding trees, birthing the first new Entfolk seen since the tragic loss of the Entwives."
 mirkwoodstory.3006.a:0 "Sing the lullaby. Let the sleeping giant lie."
 mirkwoodstory.3006.b:0 "Siphon its power. The forest shall march with new life!"

 mirkwoodstory.3007.t:0 "Control Rod Artifacts Required"
 mirkwoodstory.3007.desc:0 "Our loremasters have concluded that while the Stone Giant can theoretically be controlled, Elven magic alone is insufficient to bind it. Such a feat requires specialized runic artifacts forged by masters of stone and earth: the dwarves. To awaken this titan as an ally, we must swallow our pride and request access to these relics from a Dwarven realm."
 mirkwoodstory.3007.a:0 "Send an envoy to the Blue Mountains of Ered Luin."
 mirkwoodstory.3007.b:0 "Petition the deep-dwellers of Moria."
 mirkwoodstory.3007.c:0 "Ask our neighbors under the Lonely Mountain, Erebor."

 mirkwoodstory.3008.t:0 "A Cryptic Request from the Woodland Realm"
 mirkwoodstory.3008.desc:0 "An envoy from the Elves of Mirkwood has arrived in our halls with a highly unusual request. They seek access to some of our most ancient runic artifacts designed to bind and shape stone. Curiously, the diplomats refuse to specify their exact intended purpose, citing only vague 'matters of deep-wood security'. "
 mirkwoodstory.3008.a:0 "Very well. Let them have their baubles."
 mirkwoodstory.3008.b:0 "Never trust an Elf! Deny their request."

 mirkwoodstory.3009.t:0 "The Dwarven Relics Arrive"
 mirkwoodstory.3009.desc:0 "Despite our historical differences, the Dwarves have agreed to our request and delivered the necessary runic artifacts. With these heavy iron-and-stone contraptions in hand, our loremasters believe they can finally bind the Stone Giant's will to our own before it fully awakens."
 mirkwoodstory.3009.a:0 "Begin the ritual. Awaken the giant!"

 mirkwoodstory.3010.t:0 "Request Rejected"
 mirkwoodstory.3010.desc:0 "The Dwarves have flatly rejected our request for the runic artifacts. Citing our lack of transparency and their inherent distrust of Elven motives. Without their tools, our efforts to safely control the Stone Giant have met a dead end."
 mirkwoodstory.3010.a:0 "A predictable, yet unfortunate, display of stubbornness."

 mirkwoodstory.3011.t:0 "The Giant's Wrath"
 mirkwoodstory.3011.desc:0 "Our attempts to control the Stone Giant have ended in absolute disaster. As the titan awoke from its centuries-long slumber, it immediately broke free of our inadequate bindings. Enraged and confused, the giant went on a terrifying rampage, crushing several of our finest units beneath its massive, stony fists. After sustaining heavy casualties, our forces barely managed to drive the beast out of the woods, watching it lumber westward toward the Misty Mountains."
 mirkwoodstory.3011.a:0 "An utter debacle. We should have left it buried."

 mirkwoodstory.3012.t:0 "A Mountain Bows"
 mirkwoodstory.3012.desc:0 "The ancient Dwarven artifacts worked flawlessly. As the Stone Giant stirred from its long sleep, the heavy runic chains and binding spells flared with power, suppressing its feral rage. The titan now stands tall amidst the trees of Mirkwood, docile and waiting for our command. We have gained an engine of war unlike anything our enemies could anticipate."
 mirkwoodstory.3012.a:0 "Fascinating... Prepare it for the front lines."



 mirkwoodstory.4000.t:0 "A Discovery from Ancient Times"
 mirkwoodstory.4000.desc:0 "Our chief researcher has made a remarkable discovery. While looking into ancient parchments and tomes, he stumbled upon writings from the days of the Kingdom of Doriath.\n\nIt seems that the Sindar of old employed 'Way-stones' to create a trilateral protective ward. This ward was said to diminish any darkness or decay within Mirkwood and reinforce the power of nature.\n\nHe believes that, with further investigation, these way-stones may be uncovered and restored."

 mirkwoodstory.4000.a:0 "This is a worthy endeavor. Let him investigate!"

 mirkwoodstory.4000.b:0 "We have more pressing matters to address."

 mirkwoodstory.4001.t:0 "The Lore of the Way-stones"
 mirkwoodstory.4001.desc:0 "Our chief researcher has combed the ancient archives for knowledge regarding the Way-stones. The ancient texts reveal that these stones were not mere gems but substantial constructs spread over vast distances. They seem to be entire rock formations.\n\nFrom descriptions in the old texts, our chief researcher believes he has determined their locations: The hill of Amon Lanc, now known as Dol Guldur, in the south; the mountain of Gundabad in the north; and Erebor, the Lonely Mountain, to the northeast. Together, these sites form a triangle encompassing all of Mirkwood. If we can gain access to all three, the protective ward might be restored."

 mirkwoodstory.4001.a:0 "Intriguing. We must secure access."

 mirkwoodstory.4001.b:0 "Indeed. We must discern how to activate these stones."

 mirkwoodstory.4002.t:0 "The Activation of the Way-stones"
 mirkwoodstory.4002.desc:0 "Our chief researcher has uncovered the method by which the Way-stones at Dol Guldur, Gundabad, and Erebor can be activated. We require only a laboratory and access to these locations to proceed."

 mirkwoodstory.4002.a:0 "To work, then!"



 mirkwoodstory.5000.t:0 "Rediscovery of the Past"
 mirkwoodstory.5000.desc:0 "Amidst some minor renovations to the King's halls, our builders made a most curious discovery: Stowed away in a chest, they found shards of old elven steel.\n\nOur lore-keepers have discerned that these shards likely belonged to the blade wielded by Oropher, the father of King Thranduil, during the war of the Last Alliance. This historic artifact is not only highly precious, but the symbolism is not lost on the people: A sword that fought the forces of Sauron three thousand years ago, found anew just as Sauron is rising once more in Mordor."

 mirkwoodstory.5000.a:0 "Call up the royal smiths. We must reforge it!"

 mirkwoodstory.5000.b:0 "Put them in a museum as a token of past valiance."

 mirkwoodstory.5001.t:0 "The Craft of Restoration"
 mirkwoodstory.5001.desc:0 "Our finest blacksmiths have examined the shards of the blade of Oropher and concluded that the weapon may be restored, but not trivially. The shards are incomplete, and additional steel is required. Not just any steel, but the finest, most refined steel, necessitating a large quantity to filter out enough of the high-quality material."

 mirkwoodstory.5001.a:0 "We will locate enough steel for this endeavour."

 mirkwoodstory.5001.b:0 "We cannot afford to divert such amounts."

 mirkwoodstory.5002.t:0 "A Blade Reborn"
 mirkwoodstory.5002.desc:0 "Our blacksmiths have toiled many nights, and the Blade of Oropher has been restored! It is a truly magnificent weapon, and in the King's hand, it will serve as a great symbol to rally our people.\n\nHowever, it has been noted that there are sockets within the handle that once held precious gems of Mithril as great ornaments. To fully restore the blade, we will either have to secure new Mithril or alternatively scour the old battlefield where Oropher fell to see if the original gems can be located."

 mirkwoodstory.5002.a:0 "We will see what can be done."
 mirkwoodstory.5003.t:0 "The Blade of Oropher Restored"
 mirkwoodstory.5003.desc:0 "With the Mithril gems reinserted into the sockets, the Blade of Oropher has been fully restored to its old might, as it once was in the hand of the King of old."

 mirkwoodstory.5003.a:0 "Forth now, for Doriath!"
 mirkwoodstory.1020.b:0 "This is getting costly. Put it to rest."

 mirkwoodstory.1010.b:0 "This is getting costly. Put it to rest already."

 mirkwoodstory.100.t:0 "Spider attack!"

 mirkwoodstory.100.desc:0 "A giant Spider has attacked our forces in southern Mirkwood, causing significant damage and killing many of our warriors before eventually being felled.\n\nStrangely, it appears this Spider did not come from territory of the Great Spiders, but was instead set on us by the Elves..."

 mirkwoodstory.100.a:0 "What the...?"

 mirkwoodstory.3009.b:0 "Too dangerous. We've reconsidered."
