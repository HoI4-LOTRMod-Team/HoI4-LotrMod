l_english:
 MIR_the_kings_halls:0 "The King's Halls"
 MIR_the_kings_halls_desc:0 "Deep within the emerald embrace of the Greenwood lie the hallowed halls of our King. This ancient seat of power is the very heart of the Woodland Realm."
 MIR_purity_and_heritage:0 "Purity and Heritage"
 MIR_purity_and_heritage_desc:0 "No non-elven hand shall guide our fate. Our path is one of Elven purity, dictated by the ancient ways and the sacred heritage of our kingdom alone."
 MIR_outreach_and_pragmatism:0 "Outreach and Pragmatism"
 MIR_outreach_and_pragmatism_desc:0 "The ancient ways of isolation, though comforting, can no longer guarantee Mirkwood's survival. We must look beyond our borders, seeking common ground and practical alliances with the lesser races, however difficult that may be."
 MIR_the_woods_and_beyond:0 "The Woods and Beyond"
 MIR_the_woods_and_beyond_desc:0 "The true nature of Mirkwood's plight cannot be understood from within our walls alone. Our scouts must venture into the shadowy depths and the distant borders to gauge the full extent of the threats that gather."
 MIR_threat_containment:0 "Threat Containment"
 MIR_threat_containment_desc:0 "For countless ages, our kin have watched over these forests. The time has come to re-affirm our ancient rights to every glade and dale, challenging any who would deny the Elves their legacy."
 MIR_fortify_the_kings_halls:0 "Fortify the King's Halls"
 MIR_fortify_the_kings_halls_desc:0 "The shadows creep closer, but they will find no easy entry here."
 MIR_illuminate_the_forest_path:0 "Illuminate the Forest Path"
 MIR_illuminate_the_forest_path_desc:0 "The ancient paths of Greenwood the Great have long been shrouded in gloom. By lighting these vital arteries, we ensure the safety and unity of our people, dispelling the lingering shadows within our realm."
 MIR_refine_elven_craftsmanship:0 "Refine Elven Craftsmanship"
 MIR_refine_elven_craftsmanship_desc:0 "To merely craft is a mortal endeavor; to refine Elven craftsmanship is to elevate it to an art form. Our works shall stand as a quiet testament to the inherent superiority of Elven skill and vision."
 MIR_restore_the_northern_glades:0 "Restore the Northern Glades"
 MIR_restore_the_northern_glades_desc:0 "The ancient glades to our north have long felt the chill of neglect. It is time for the Elves of Mirkwood to restore their beauty."
 MIR_reignite_the_mountain_forges:0 "Reignite the Mountain Forges"
 MIR_reignite_the_mountain_forges_desc:0 "The whispers of war grow louder than the rustling leaves of our ancient forest. Our mountain strongholds, long dormant, must roar back to life, fueled by necessity and the grim resolve to meet the coming storm with steel."
 MIR_drive_back_the_great_spiders:0 "Drive Back the Great Spiders"
 MIR_drive_back_the_great_spiders_desc:0 "For too long, the ancient terror of the Great Spiders has nested within our sacred woods. Now, with righteous fury and reforged blades, we shall drive the foul arachnids back into the dark where they belong."
 MIR_open_the_old_forest_road:0 "Open the Old Forest Road"
 MIR_open_the_old_forest_road_desc:0 "A clear path through the Mirkwood will allow for swifter passage and improved connections, binding our east and west."
 MIR_lift_the_mercenary_rule:0 "Lift the Mercenary Rule"
 MIR_lift_the_mercenary_rule_desc:0 "Our pride once dictated that only Elven hands should defend the Woodland Realm. But the shadows grow long, and pragmatism demands we seek strength wherever it can be found, even among those who fight for gold."
 MIR_spy_on_our_neighbours:0 "Spy on Our Neighbours"
 MIR_spy_on_our_neighbours_desc:0 "A network of watchful eyes will ensure we are not caught unaware by the dealings of Erebor, Dale, or even our kin in Lothlórien."
 MIR_improve_trade_relations:0 "Improve Trade Relations"
 MIR_improve_trade_relations_desc:0 "The old forest road once more beckons, promising safe passage for goods and ideas. By fostering vibrant commerce with our neighbours, Mirkwood strengthens its prosperity and extends its influence."
 MIR_attract_foreign_scholars:0 "Attract Foreign Scholars"
 MIR_attract_foreign_scholars_desc:0 "From the halls of Gondor to the distant cities of Dale, and even from lands less benevolent, knowledge is power. We shall invite those who can contribute, regardless of their origin."
 MIR_empty_the_dungeons:0 "Empty the Dungeons"
 MIR_empty_the_dungeons_desc:0 "Our coffers may be low, but our dungeons are full. By pardoning and pressing those held within into service, we can reclaim valuable manpower and labor, though at a cost to the realm's tranquility."
 MIR_invite_the_woods_guests:0 "Invite the Wood's Guests"
 MIR_invite_the_woods_guests_desc:0 "Our isolation, once a strength, may now be a weakness. Let us invite the diverse peoples bordering our realm to council, and perhaps, to friendship."
 MIR_the_oropherion_laws:0 "The Oropherion Laws"
 MIR_the_oropherion_laws_desc:0 "Centuries ago, King Oropher established the independence of our realm. Now, his vision of order and Elven purity shall be enshrined in law, ensuring Mirkwood stands strong and unburdened by outside influences."
 MIR_restore_the_greenwood_watchtowers:0 "Restore the Greenwood Watchtowers"
 MIR_restore_the_greenwood_watchtowers_desc:0 "To defend our tranquil halls, we must see our enemies long before they arrive. From these newly restored watchtowers, the Elven gaze will sweep across Mirkwood, missing nothing."
 MIR_elven_cooperation:0 "Elven Cooperation"
 MIR_elven_cooperation_desc:0 "The ancient ties of blood and spirit still bind the Eldar. It is time to mend old estrangements and foster a renewed sense of unity among the Firstborn."
 MIR_dealings_with_the_shadow:0 "Dealings with the Shadow"
 MIR_dealings_with_the_shadow_desc:0 "Whispers from Mordor and Dol Guldur reach our ears, promising temporary respite or fleeting advantage. To entertain them is to dance with peril."
 MIR_ancient_glory:0 "Ancient Glory"
 MIR_ancient_glory_desc:0 "Compromise is weakness, and humility a forgotten virtue. Under the unwavering banner of the King, Mirkwood will forge a path of martial might and purity."
 MIR_bulwark_against_the_dark:0 "Bulwark Against the Dark"
 MIR_bulwark_against_the_dark_desc:0 "Against the creeping shadow and the vile creatures it spawns, we declare our purpose: Mirkwood shall be the bulwark, a beacon of defiance in the heart of the forest."
 MIR_the_northern_accord:0 "The Northern Accord"
 MIR_the_northern_accord_desc:0 "Past grievances must be set aside, for a greater threat looms over all. This accord will mark a new era of solidarity, a united front of the North's free realms, or a fool's errand to be ridiculed by history."
 MIR_accept_the_new_order:0 "Accept the New Order"
 MIR_accept_the_new_order_desc:0 "The ancient ways of Mirkwood have proven insufficient against the encroaching shadows. To ensure our survival, we must cast aside our pride and accept the grim realities of this new era, even if it means making deals with the very darkness we swore to oppose."
 MIR_by_our_own_light:0 "By Our Own Light"
 MIR_by_our_own_light_desc:0 "Let the world darken around us, for within Mirkwood, our own light shall suffice."
 MIR_ring_gambit:0 "Ring Gambit"
 MIR_ring_gambit_desc:0 "The whispers of a potent artifact have grown too loud to ignore. Our scouts report its uncertain path, and a rare window of opportunity presents itself to intercept it, perhaps turning its influence against our foes."
 MIR_assume_control_over_guilds:0 "Assume Control Over Guilds"
 MIR_assume_control_over_guilds_desc:0 "Our long-held traditions of decentralized craft must adapt. The specialized knowledge and output of Mirkwood's guilds will be carefully cataloged and directed."
 MIR_stockpile_the_harvests:0 "Stockpile the Harvests"
 MIR_stockpile_the_harvests_desc:0 "We must gather the bounty of our lands and fill our granaries, securing our self-sufficiency against any future hardship."
 MIR_the_order_of_silence:0 "The Order of Silence"
 MIR_the_order_of_silence_desc:0 "Our long lives have taught us the folly of outward boasts. True wisdom lies in discretion, and true power in the unseen hand."
 MIR_share_knowledge_among_elves:0 "Share Knowledge Among Elves"
 MIR_share_knowledge_among_elves_desc:0 "The wisdom of the Firstborn is a vast, scattered treasure. By establishing a formal exchange of knowledge with our Elven kin, we seek to unite these disparate insights and strengthen all Eldar against the gathering gloom."
 MIR_promise_support_against_dol_guldur:0 "Promise Support Against Dol Guldur"
 MIR_promise_support_against_dol_guldur_desc:0 "To allow Dol Guldur to conquer Lothlórien would be to invite the shadow to our very doorstep. Better to meet the threat afar, alongside our Elven brethren, than to face it alone within our own deep woods."
 MIR_support_elronds_council:0 "Support Elrond's Council"
 MIR_support_elronds_council_desc:0 "Lord Elrond’s summons cannot be ignored, even by those who prefer the solitude of our ancient woods. We offer our counsel, and more importantly, the sharpened resolve of our most trusted warriors to the discussions that will shape the coming war."
 MIR_feast_with_the_master_of_laketown:0 "Feast with the Master of Laketown"
 MIR_feast_with_the_master_of_laketown_desc:0 "By sharing a table and breaking bread with the Master of Laketown, we seek to mend any lingering qualms and pave the way for a richer future for both our realms."
 MIR_mend_qualms_with_erebor:0 "Mend Qualms with Erebor"
 MIR_mend_qualms_with_erebor_desc:0 "The memory of ancient slights is long, but the need for allies is longer still. We shall attempt to mend the centuries-old qualms with the Dwarves of Erebor, for the shadow threatens all."
 MIR_mutually_beneficial_trade:0 "Mutually Beneficial Trade"
 MIR_mutually_beneficial_trade_desc:0 "The art of commerce, once seen as a lesser concern, now yields surprising dividends. It seems that even the most ancient of peoples can learn a new trick or two about profitable exchange."
 MIR_sell_timber_to_the_east:0 "Sell Timber to the East"
 MIR_sell_timber_to_the_east_desc:0 "Our abundant forests hold a resource in high demand across the East. While it pains us to fell our ancient trees, the flow of rare metals in return is a pragmatic necessity that cannot be ignored in these trying times."
 MIR_study_the_orcs:0 "Study the Orcs"
 MIR_study_the_orcs_desc:0 "The stench of the Orcs has always been familiar, but their brutish tactics and crude formations hold lessons for those patient enough to observe."
 MIR_study_the_spiders:0 "Study the Spiders"
 MIR_study_the_spiders_desc:0 "Their paralytic venom, a foul secretion designed for slow, agonizing death, holds secrets. Secrets we intend to unravel and, perhaps, refine for our own purposes."
 MIR_employ_orcish_intermediaries:0 "Employ Orcish Intermediaries"
 MIR_employ_orcish_intermediaries_desc:0 "The strength of elven arms alone cannot stand against the encroaching shadow. Unsavory as it may be, the teeming hordes of lesser creatures can be directed against our foes, if we are willing to deal with those who command them."
 MIR_trade_territory_for_peace:0 "Trade Territory for Peace"
 MIR_trade_territory_for_peace_desc:0 "The dark fortress of Dol Guldur desires the lands south of the Narrows. To grant this concession is a blow to our pride, but may avert a greater, bloodier conflict."
 MIR_call_for_lineage_records:0 "Call for Lineage Records"
 MIR_call_for_lineage_records_desc:0 "Strength and wisdom are passed down through generations. By acknowledging the ancient bloodlines, we reaffirm the inherent right of our highborn to guide Mirkwood in these troubled times."
 MIR_enforce_the_sindarin_dialect:0 "Enforce the Sindarin Dialect"
 MIR_enforce_the_sindarin_dialect_desc:0 "While the shadows lengthen and dangers mount, certain matters of linguistic decorum simply cannot wait."
 MIR_restrict_command_to_highborn_captrains:0 "Restrict Command to Highborn Captains"
 MIR_restrict_command_to_highborn_captrains_desc:0 "One simply cannot expect refined tactical acumen from those whose family trees do not stretch back to the First Age. A cleansing of the command structure is long overdue."
 MIR_martial_trials:0 "Martial Trials"
 MIR_martial_trials_desc:0 "To ensure the purity of our command, the Highborn are called to prove their worth in feats of arms and strategy. Let the forest echo with the clash of steel, shaping our leaders into sharper instruments of war."
 MIR_the_kings_hidden_guard:0 "The King's Hidden Guard"
 MIR_the_kings_hidden_guard_desc:0 "Deep within the Enchanted Vale, a new order of elite, secret warriors is forged, their loyalty absolute, their purpose singular: to defend the heart of Mirkwood."
 MIR_return_the_emmeralds_of_girion:0 "Return the Emeralds of Girion"
 MIR_return_the_emmeralds_of_girion_desc:0 "Centuries of misunderstanding and coldness have divided Elves and Dwarves. To offer the Emeralds of Girion back to Erebor is an act of profound peace, one that promises shared strength and a united front."
 MIR_anyone_but_the_dwarves:0 "Anyone but the Dwarves"
 MIR_anyone_but_the_dwarves_desc:0 "A thousand years of grudges weigh heavier than any current threat. We shall seek friends among the other free peoples, for the Mountain-folk are not to be trusted."
 MIR_attempt_to_barter_with_the_spiders:0 "Attempt to Barter with the Spiders"
 MIR_attempt_to_barter_with_the_spiders_desc:0 "The thought of a Sindar Elf negotiating terms with a giant, venomous spider is absurd, bordering on mad. Yet, with war on the horizon, perhaps even the maddest gambits hold a sliver of hope."
 MIR_secure_dwarven_support:0 "Secure Dwarven Support"
 MIR_secure_dwarven_support_desc:0 "For the survival of all free peoples, let us forge an alliance stronger than any past animosity."
 MIR_seek_a_worthy_ally:0 "Seek a Worthy Ally"
 MIR_seek_a_worthy_ally_desc:0 "The gloom over Mirkwood grows ever deeper. It is clear we cannot face this alone, and must seek strength wherever it can be found, even if it means forging bonds beyond our ancient kin."
 MIR_join_the_great_realms_of_men:0 "Join the Great Realms of Men"
 MIR_join_the_great_realms_of_men_desc:0 "While most mannish 'kingdoms' are unearning of the name and thus unfit as allies, there are some that pass the bar... narrowly."
 MIR_approach_gondor:0 "Approach Gondor"
 MIR_approach_gondor_desc:0 "Gondor stands as the bastion of the West, and their strength is one we can no longer afford to merely observe. We must approach them, before it is too late."
 MIR_approach_rohan:0 "Approach Rohan"
 MIR_approach_rohan_desc:0 "From the green plains of Rohan to the depths of our ancient forest, the banners of Men and Elves must rise together. Our combined strength may yet hold back the encroaching night."
 MIR_shut_the_gates:0 "Shut the Gates"
 MIR_shut_the_gates_desc:0 "The outside world offers little but sorrow and strife. Mirkwood will become an impenetrable sanctuary, where the echoes of external conflicts fade to a whisper. Let them knock; none shall enter."
 MIR_approach_lady_galadriel:0 "Approach Lady Galadriel"
 MIR_approach_lady_galadriel_desc:0 "The time for individual realms is past. Mirkwood, seeking to consolidate Elven strength against the encroaching shadow, approaches the Lady of Light with an offer of unity, one that places Thranduil's leadership at its heart."
 MIR_wipe_out_the_spiders:0 "Wipe Out the Spiders"
 MIR_wipe_out_the_spiders_desc:0 "The webs of the Great Spiders choke the life from our northern glades. This ancient evil can no longer be contained; Mirkwood's strength shall now be turned to their utter annihilation."
 MIR_reclaim_the_gems_of_lasgalen:0 "Reclaim the Gems of Lasgalen"
 MIR_reclaim_the_gems_of_lasgalen_desc:0 "A king's patience is not endless, nor is the memory of his people short. The stolen treasures of our forest home will be reclaimed from Erebor, by negotiation or by force of arms."
 MIR_path_to_war:0 "Path to War"
 MIR_path_to_war_desc:0 "The ancient songs tell of ages of conflict, and it seems our own age shall add another verse. But this one... shall be a most glorious one!"
 MIR_purge_the_forest_of_strangers:0 "Purge the Forest of Strangers"
 MIR_purge_the_forest_of_strangers_desc:0 "The ancient woods of Greenwood the Great belong to the Eldar alone. Any who do not respect this sacred truth shall find themselves unwelcome, and swiftly removed."
 MIR_expell_the_dwarven_envoys:0 "Expel the Dwarven Envoys"
 MIR_expell_the_dwarven_envoys_desc:0 "The time for endless quibbling with the Mountain-folk has passed. Let their envoys return to their dark, dusty holes, for our patience has worn thin."
 MIR_adaptive_presence_strategy:0 "Adaptive Presence Strategy"
 MIR_adaptive_presence_strategy_desc:0 "As both the great Spiders and Dol Guldur press their claims on the Greenwood, we must see to giving up as little territory as possible."
 MIR_withdraw_to_safety:0 "Withdraw to Safety"
 MIR_withdraw_to_safety_desc:0 "Let the lesser lands be consumed by the crawling things. Our concern is the preservation of our kin, our culture, and the sanctuary of our halls."
 MIR_evacuate_population:0 "Evacuate Population"
 MIR_evacuate_population_desc:0 "The shadow encroaches, and our borders grow too vast to defend every hamlet. For the safety of our folk, we must guide them back to the protected heart of the forest."
 MIR_evacuate_industry:0 "Evacuate Industry"
 MIR_evacuate_industry_desc:0 "Relocating entire smithies and lumber mills is hardly the graceful work Elves are known for, but necessity dictates."
 MIR_focus_on_spiders:0 "Focus on Spiders"
 MIR_focus_on_spiders_desc:0 "We will not let the forests be woven into a tapestry of fear and despair. The Great Spiders have grown bold, but Mirkwood's Elves shall remind them that no web is strong enough to ensnare the Light."
 MIR_focus_on_dolgulddur:0 "Focus on Dol Guldur"
 MIR_focus_on_dolgulddur_desc:0 "While the webs of the Great Spiders ensnare many, the true heart of the encroaching Shadow beats strongest within Dol Guldur. Our strategy must prioritize stemming this greater threat."
 MIR_complete_the_evacuation:0 "Complete the Evacuation"
 MIR_complete_the_evacuation_desc:0 "The last refugees and the salvaged remnants of our industry have now found shelter within the fortified heart of Mirkwood. Though our domain is diminished, our resolve is unbroken."
 MIR_ask_lothlorien_for_help:0 "Ask Lothlórien for Help"
 MIR_ask_lothlorien_for_help_desc:0 "Though our paths have often diverged, we must appeal to the Lady and Lord of Lothlórien, whose wisdom and power are renowned, for aid in this dire hour."
 MIR_ask_erebor_for_help:0 "Ask Erebor for Help"
 MIR_ask_erebor_for_help_desc:0 "Though the Mountain-folk may seem concerned only with gold and stone, the creeping darkness in Mirkwood threatens all who dwell in the East."
 MIR_defensive_precautions:0 "Defensive Precautions"
 MIR_defensive_precautions_desc:0 "After the arduous task of withdrawal, our ancestral halls and hidden fortresses become the very shield of Mirkwood. We shall fortify every passage, strengthen every wall, and ensure that our sanctuary remains inviolate."
 MIR_research_and_misc:0 "Knowledge and Production"
 MIR_research_and_misc_desc:0 "Even in the quiet depths of Mirkwood, our minds do not rest. From ancient lore to unfolding phenomena, all must be cataloged and understood."
 MIR_knowledge_and_wisdom:0 "Knowledge and Wisdom"
 MIR_knowledge_and_wisdom_desc:0 "A thousand years hold a thousand tales, and each tale a lesson. It is through the careful study and preservation of our shared history that we may glimpse the future and prepare for it."
 MIR_towards_labor_and_production:0 "Towards Labor and Production"
 MIR_towards_labor_and_production_desc:0 "The elegant artistry of Elven craftsmanship must now be wedded to the practical demands of efficient production."
 MIR_intrigue:0 "Intrigue"
 MIR_intrigue_desc:0 "Even for the most noble of Elves, a well-placed rumor or a hidden truth can prove more effective than a thousand arrows. We shall ensure our foes' plans are no longer their own."
 MIR_farming:0 "Farming"
 MIR_farming_desc:0 "Even the most ancient and refined of peoples must tend to their sustenance. Let us improve our methods of cultivation to ensure the enduring prosperity of our woodland realm."
 MIR_library:0 "Library"
 MIR_library_desc:0 "To forget our past is to lose our future. We shall establish a grand library, a living archive to safeguard the ancient lore and heritage of the Woodland Realm for all time."
 MIR_spy_agency:0 "Spy Agency"
 MIR_spy_agency_desc:0 "Whispers of encroaching darkness fill the air. To stand vigilant, we must establish a network of eyes and ears beyond our borders."
 MIR_food_silos:0 "Food Silos"
 MIR_food_silos_desc:0 "One cannot simply 'live off the land' when that land is contested. We build these, for even an Elf's stomach has its limits."
 MIR_towards_specialization:0 "Towards Specialization"
 MIR_towards_specialization_desc:0 "In the quiet corners of our realm, true Elven genius still resides. This path is a commitment to nurturing those rare, specialized skills and arcane knowledge that only the Eldar possess."
 MIR_towards_self_sufficiency:0 "Towards Self-Sufficiency"
 MIR_towards_self_sufficiency_desc:0 "Mirkwood shall produce what it needs, crafting a secure foundation for our future."
 MIR_specialized_woodworking:0 "Specialized Woodworking"
 MIR_specialized_woodworking_desc:0 "From the elegant bows of our archers to the resilient frames of our homes, specialized woodworking is key to our continued prosperity."
 MIR_new_research_slot:0 "New Research Slot"
 MIR_new_research_slot_desc:0 "The world darkens, and new perils emerge from its depths. To face these ever-evolving threats, we must broaden our studies and seek wisdom in new, unconventional fields."
 MIR_seize_the_amon_lanc:0 "Seize the Amon Lanc"
 MIR_seize_the_amon_lanc_desc:0 "Amon Lanc, once a beacon of Elven light, now a festering scar known as Dol Guldur. We march to cleanse this ancient hill and reclaim it from the Shadow that has defiled its hallowed ground."
 MIR_successor_of_doriath:0 "Successor of Doriath"
 MIR_successor_of_doriath_desc:0 "By right of lineage and strength of arms, King Thranduil now lays claim to the Sindar Crown of Doriath. Let the other Elven realms acknowledge the true inheritors of the First Age's splendor."
 MIR_claim_all_forests:0 "Claim All Forests"
 MIR_claim_all_forests_desc:0 "A simple matter, truly. The maps merely require a slight revision to reflect the natural order of things. The forests, after all, simply feel more at home under our protection."
 MIR_approach_lord_elrond:0 "Approach Lord Elrond"
 MIR_approach_lord_elrond_desc:0 "King Thranduil's envoy will seek out Lord Elrond, to ensure the White Council's wisdom, and Rivendell's strength, aligns with the Woodland Realm's imperatives."
 MIR_safeguard_elvendom:0 "Safeguard Elvendom"
 MIR_safeguard_elvendom_desc:0 "Let it be known that Mirkwood, ever vigilant, will ensure the continued existence of Elven realms, even if it means guiding their futures with a firmer hand than some might wish."
 MIR_enforce_austerity:0 "Enforce Austerity"
 MIR_enforce_austerity_desc:0 "To preserve what remains, we must first learn to do without. The songs of plenty fade, replaced by the silent resolve of a people tightening their belts for a fight they can no longer avoid."
 MIR_exalt_the_one_elven_king:0 "Exalt the One Elven King"
 MIR_exalt_the_one_elven_king_desc:0 "King Thranduil, son of Oropher, is the rightful sovereign of the Woodland Realm. His will shall be law, his word unchallenged. Let all other Elves take heed of the true King."
 MIR_consolidate_the_crown:0 "Consolidate the Crown"
 MIR_consolidate_the_crown_desc:0 "The notion of a loose confederation or a king merely advising his subjects is cast aside. True Elven power demands a unified realm, with the Crown's authority radiating into every corner of the forest."
 MIR_approach_the_other_elves:0 "Approach the Other Elves"
 MIR_approach_the_other_elves_desc:0 "Let us renew the ancient ties that bind all Eldar. Emissaries are sent forth to Lothlórien and Rivendell, bearing messages of kinship and the dire need for unity."
 MIR_request_aid_against_dol_guldur:0 "Request Aid Against Dol Guldur"
 MIR_request_aid_against_dol_guldur_desc:0 "The battle against Dol Guldur drains our strength, and the darkness presses hard upon our borders. We must call upon every available Elven blade, for if the Necromancer triumphs here, none shall be safe."
 MIR_request_aid_against_the_spiders:0 "Request Aid Against the Spiders"
 MIR_request_aid_against_the_spiders_desc:0 "The vile creatures that infest the western reaches multiply with terrifying speed. We have fought valiantly, yet more hands are needed if we are to truly purge this evil before it consumes the entire forest."
 MIR_form_the_council_of_three_realms:0 "Form the Council of Three Realms"
 MIR_form_the_council_of_three_realms_desc:0 "King Thranduil, Lord Elrond, and Lady Galadriel, though each bearing the wisdom of ages, now see the wisdom in shared purpose."
 MIR_elven_shared_army_training:0 "Elven Shared Army Training"
 MIR_elven_shared_army_training_desc:0 "A unified front requires unified tactics. By standardizing our training and integrating our martial doctrines, we ensure that every elven warrior fights as part of a single, formidable host."
 MIR_elven_unity:0 "Elven Unity"
 MIR_elven_unity_desc:0 "With the Council of Three Realms firmly established, it is imperative that our internal fortitude matches our outward defiance."
 MIR_contain_the_menace:0 "Contain the Menace"
 MIR_contain_the_menace_desc:0 "Sauron once again seeks to stake claim upon the lands of Middle Earth. It is about time we show this 'Heir of Melkor' that this attempt will end no better than his first."
 MIR_withdraw_from_mortal_affairs:0 "Withdraw from Mortal Affairs"
 MIR_withdraw_from_mortal_affairs_desc:0 "Enough of entanglements and alliances with those who do not understand the true nature of time."
 MIR_prepare_for_the_worst:0 "Prepare for the Worst"
 MIR_prepare_for_the_worst_desc:0 "We have chosen our path of self-reliance, and now we must ensure that our strength alone is sufficient to face the coming darkness."
 MIR_focus_on_internal_stability:0 "Focus on Internal Stability"
 MIR_focus_on_internal_stability_desc:0 "A steady hand and a peaceful mind are Mirkwood's greatest strengths. We shall silence the whispers of discontent and restore inner harmony."
 MIR_kindle_the_forges:0 "Kindle the Forges"
 MIR_kindle_the_forges_desc:0 "Reluctantly, we turn our hands from artistry to the forging of weapons. Let the smoke rise, and our armories fill against the encroaching darkness."
 MIR_endure_the_darkness:0 "Endure the Darkness"
 MIR_endure_the_darkness_desc:0 "The Elvenking's Halls will become a beacon, however dim, against the growing darkness. We shall batten down the hatches and weather the storm from within our ancient fastness."
 MIR_empower_the_builders:0 "Empower the Builders"
 MIR_empower_the_builders_desc:0 "While the shadows lengthen, Mirkwood will not falter. Our ancient artistry will manifest in new structures."
 MIR_tooth_and_nail:0 "Tooth and Nail"
 MIR_tooth_and_nail_desc:0 "With our backs against the ancient trees, we are driven to a final, desperate struggle. They will find no easy victory here, only the fury of Mirkwood unleashed."
 MIR_share_specialized_knowledge:0 "Share Specialized Knowledge"
 MIR_share_specialized_knowledge_desc:0 "The Elves of Mirkwood and the Dwarves of Erebor now find common ground in the pursuit of knowledge. Necessity, it seems, can be a potent healer of ancient grudges."
 MIR_shared_army_exercises:0 "Shared Army Exercises"
 MIR_shared_army_exercises_desc:0 "Even a Dwarf can learn to tread softly, and an Elf, to stand firm. These exercises forge not just warriors, but bonds, as we prepare our armies for the challenges ahead."
 MIR_elven_mannish_cooperation:0 "Elven-Mannish Cooperation"
 MIR_elven_mannish_cooperation_desc:0 "An Elf and a Man, on the same drill field? The very thought would once have brought a chuckle. But with Orcs at our door, perhaps a bit of human bluntness is precisely what our elegant strategies require."
 MIR_the_roles_of_orcs_and_elves:0 "The Roles of Orcs and Elves"
 MIR_the_roles_of_orcs_and_elves_desc:0 "For too long, we have defined ourselves by our enemies. But in this age of encroaching darkness, perhaps the distinction between master and servant, or even ally, is simply a matter of who holds the reins of power."
 MIR_forsake_the_past:0 "Forsake the Past"
 MIR_forsake_the_past_desc:0 "The shadow has seeped too deeply into our lands and our very souls. To truly fight it, we must become something else entirely, leaving behind the essence that once defined us. The metamorphosis begins."
 MIR_hold_on_to_the_light:0 "Hold on to the Light"
 MIR_hold_on_to_the_light_desc:0 "A glint of hope, perhaps a moment of Elven stubbornness, prevents us from plunging entirely into the abyss. We will find strength not in the dark, but in the echoes of what we once were, and what we still are."
 MIR_twisted_corrupted_stronger:0 "Twisted, Corrupted, Stronger"
 MIR_twisted_corrupted_stronger_desc:0 "What use is ancient grace when faced with endless hordes? Let our forms be warped, our hearts hardened; for in this new guise, we find a strength to conquer, not merely to fade."
 MIR_raise_the_mixed_legions:0 "Raise the Mixed Legions"
 MIR_raise_the_mixed_legions_desc:0 "Though we choose not the twisted path of the Orcs, the world darkens, forcing grim choices. Our Elven might must be bolstered by the strength of others, forming legions where ancient grace meets mortal grit, a necessary compromise against utter ruin."
 MIR_trolls_of_mordor:0 "Trolls of Mordor"
 MIR_trolls_of_mordor_desc:0 "Sauron's generosity knows no bounds, or perhaps, no subtlety. He offers us 'reinforcements' in the form of his most fearsome, albeit dim-witted, shock troops. Our enemies will certainly be surprised."
 MIR_which_way_the_shadows_fall:0 "Which Way the Shadows Fall"
 MIR_which_way_the_shadows_fall_desc:0 "The darkness spreads, offering only two paths for our proud realm: to become a shadow in our own right, or to serve the Eye that sees all."
 MIR_a_new_dark_realm:0 "A New Dark Realm"
 MIR_a_new_dark_realm_desc:0 "Mordor may seek to dominate, but its shadow will find a rival in the East. Mirkwood shall cast its own gloom across Middle-earth, subservient to none."
 MIR_vassal_of_the_eye:0 "Vassal of the Eye"
 MIR_vassal_of_the_eye_desc:0 "The price of continued existence is often steep, and for the Elves of Mirkwood, it is their autonomy. We accept our place as a mere vassal, a minor ward of the burgeoning power in the East."
 MIR_receive_aid_from_mordor:0 "Receive Aid from Mordor"
 MIR_receive_aid_from_mordor_desc:0 "With our fealty pledged, Mordor sends convoys of arms and supplies. It is a calculated transaction, devoid of goodwill, but one that ensures our survival in these darkening times."
 MIR_pick_up_the_leftovers:0 "Pick Up the Leftovers"
 MIR_pick_up_the_leftovers_desc:0 "While the grand powers of Middle-earth squabble and scheme, we shall quietly gather the crumbs from their table. Soon, these neglected pieces will form the backbone of our growing dominion."
 MIR_the_spreading_shadows:0 "The Spreading Shadows"
 MIR_the_spreading_shadows_desc:0 "Our chosen path is clear: Mirkwood will not be caught unawares by the tides of war. Let our forces be sharpened, our defenses strengthened, and our resolve unwavering."
 MIR_strike_west:0 "Strike West"
 MIR_strike_west_desc:0 "The long shadow cast by our ambition now falls upon the western lands. They will either bend or break."
 MIR_vanquish_the_dwarves:0 "Vanquish the Dwarves"
 MIR_vanquish_the_dwarves_desc:0 "Their halls are deep, their beards are long, but their resistance? Not so much. Let us finally clear out these noisy little miners and secure their precious hoards for more deserving hands."
 MIR_kingdom_of_the_woods:0 "Kingdom of the Woods"
 MIR_kingdom_of_the_woods_desc:0 "A thousand years of scattered rule and encroaching shadows come to an end. The Elven-King's domain stretches as far as the whisper of leaves can carry, whether others wish it or not."
 MIR_insider_agent:0 "Insider Agent"
 MIR_insider_agent_desc:0 "The stakes of the Ring's journey are too high to leave to chance. Our agents, loyal though they may be to the wider cause, shall ensure that when the time comes, Mirkwood's hand is firmly on the scales of fate."
 MIR_secure_the_western_flank:0 "Secure the Western Flank"
 MIR_secure_the_western_flank_desc:0 "While some may advocate for parley with the foul spawn of Ungoliant, true peace can only be achieved through their eradication. The western borders of our realm demand such clarity."
 MIR_core_spider_territory:0 "Core Spider Territory"
 MIR_core_spider_territory_desc:0 "After centuries of infestation, the western Mirkwood finally breathes free. We claim these hard-won lands as our own, integrating them fully into the realm, though the echoes of their past linger."
 MIR_demand_vilya:0 "Demand Vilya"
 MIR_demand_vilya_desc:0 "Lord Elrond’s fealty is noted, but his hold on Vilya is tenuous. For the greater good of our realm, this artifact of immense power must be swiftly transferred to the Crown."
 MIR_demand_nenya:0 "Demand Nenya"
 MIR_demand_nenya_desc:0 "As the new masters of the forest, it is only fitting that the ancient Elven Rings fall into our hands. Lady Galadriel will be asked to surrender Nenya for the greater good of Mirkwood."
 MIR_remove_the_barrier:0 "Remove the Barrier"
 MIR_remove_the_barrier_desc:0 "With Rivendell and Lothlórien at our side, the strategic importance of the mountain barriers is clear. We need to unify our realm into one, cohesive territory."
 MIR_unite_with_the_men_of_the_vales:0 "Unite with the Men of the Vales"
 MIR_unite_with_the_men_of_the_vales_desc:0 "Our dominion must stretch beyond the forest's edge. The free Men living in the valleys and along the rivers are natural bulwarks. Their strength, if properly guided, will serve the cause of Mirkwood."
 MIR_deal_with_gundabad:0 "Deal with Gundabad"
 MIR_deal_with_gundabad_desc:0 "The war against Gundabad demands a concerted effort. We shall align our strategies with our allies."
 MIR_seek_the_support_of_dale:0 "Seek the Support of Dale"
 MIR_seek_the_support_of_dale_desc:0 "The growing threat demands a broad alliance, and Dale offers both stout hearts and vital resources. It is time for Mirkwood to extend a formal invitation for their swords and their loyalty."
 MIR_trade_with_dale:0 "Trade with Dale"
 MIR_trade_with_dale_desc:0 "The old forest road, once choked by fear and darkness, now bustles with the passage of goods. This trade with Dale is a hopeful bridge between our ancient realm and the world of Men."
 MIR_turn_the_dwarves:0 "Turn the Dwarves"
 MIR_turn_the_dwarves_desc:0 "The Mountain-folk are a proud and formidable people, if sometimes short-sighted. By inflaming their sense of grievance and opportunity, we can transform them from a potential foe into a potent, if volatile, instrument of our will."
 MIR_support_a_firebeard_rebellion:0 "Support a Firebeard Rebellion"
 MIR_support_a_firebeard_rebellion_desc:0 "The halls of Erebor rumble with discontent. Old grievances, long suppressed, are now fanned into open flame. A little Elvish encouragement, and the Firebeards might just set the mountain ablaze."
 MIR_plunder_the_mountain_jewels:0 "Plunder the Mountain Jewels"
 MIR_plunder_the_mountain_jewels_desc:0 "What was once locked away in Erebor's gloomy depths shall now see the light of day. And contribute to our own glorious future."
 MIR_turn_our_back_on_the_elves:0 "Turn Our Back on the Elves"
 MIR_turn_our_back_on_the_elves_desc:0 "Solidarity with our kin has bought us nothing but endless struggle and stagnant traditions. We cast off these shackles and declare Mirkwood's true destiny lies beyond their fading influence."
 MIR_orcs_of_the_mirkwood:0 "Orcs of the Mirkwood"
 MIR_orcs_of_the_mirkwood_desc:0 "No longer do the sylvan glades echo with Elven song, but with the guttural shouts of organised warbands. Our new brethren bring a brutal efficiency to the battlefield."
 MIR_war_against_rivendell:0 "War Against Rivendell"
 MIR_war_against_rivendell_desc:0 "With Lothlórien brought to heel, our gaze now falls upon the secluded valley of Rivendell. Their fading light must either join our rising power or be extinguished."
 MIR_war_against_lothlorien:0 "War Against Lothlórien"
 MIR_war_against_lothlorien_desc:0 "As Mirkwood embraces its true potential, the Galadhrim cling to fading glories. Their 'benevolent' rule is a facade, and their armies a mere obstacle."
 MIR_concealed_smithing_shops:0 "Concealed Smithing Shops"
 MIR_concealed_smithing_shops_desc:0 "The Shadow cares not for open displays of industry. If we are to arm ourselves effectively, our production must melt into the very fabric of the forest, unseen and unheard by hostile eyes and ears."
 MIR_concealed_workshops:0 "Concealed Workshops"
 MIR_concealed_workshops_desc:0 "Our vital production centers must be shielded from the prying eyes of the encroaching darkness. Deep within the Mirkwood, where ancient roots intertwine and shadows dance, our workshops shall be hidden."
 MIR_stop_the_spread:0 "Stop the Spread"
 MIR_stop_the_spread_desc:0 "The insidious tendrils of Dol Guldur and the Great Spiders creep deeper into our hallowed woods. We shall not cede another inch without a fight."
 MIR_reassert_control:0 "Reassert Control"
 MIR_reassert_control_desc:0 "Containment was merely a prelude. The hour has come to actively root out the corruption, state by state, until the Greenwood breathes free under our unchallenged dominion once more."
 MIR_tend_to_the_south:0 "Tend to the South"
 MIR_tend_to_the_south_desc:0 "Centuries of relative neglect have left our southern territories vulnerable. With the shadow deepening, it is high time we invested in their roads and defenses."
 MIR_prepare_an_ambush:0 "Prepare an Ambush"
 MIR_prepare_an_ambush_desc:0 "Lord Elrond will be disappointed, but we do what we must. We cannot allow some foolish halfling to deliver the One Ring right to the Dark Tower's doorstep!"
 MIR_southern_outposts:0 "Southern Outposts"
 MIR_southern_outposts_desc:0 "The growing shadow from Dol Guldur necessitates immediate and decisive action. New southern outposts, complete with barracks, will secure our vulnerable routes and guard against intrusion."
 MIR_southern_watchtowers:0 "Southern Watchtowers"
 MIR_southern_watchtowers_desc:0 "The southern reaches of our forest grow ever more perilous. To guard against unseen foes and encroaching darkness, we must raise vigilant eyes to the sky and forest floor."
 MIR_strengthen_the_core:0 "Strengthen the Core"
 MIR_strengthen_the_core_desc:0 "Having retreated from the encroaching gloom, we now turn our full might to the core. If we are to be a fortress, then let it be one forged by our hands and our spirit."
 MIR_dominion_over_the_mirkwood:0 "Dominion over the Mirkwood"
 MIR_dominion_over_the_mirkwood_desc:0 "The long toil to reclaim our ancestral lands has concluded. With every encroaching darkness repelled, the Elvenking’s benevolent rule now stretches unbroken across the entirety of the Mirkwood."
 MIR_reintegrate_the_lost_regions:0 "Reintegrate the Lost Regions"
 MIR_reintegrate_the_lost_regions_desc:0 "The blight upon the Greenwood is lifted. With the encroaching darkness pushed back, the forest breathes anew, and its scattered fragments are drawn back into the fold of the King's protection, ready to flourish once more."
 MIR_handle_the_spiders:0 "Handle the Spiders"
 MIR_handle_the_spiders_desc:0 "For too long have the foul offspring of Ungoliant spun their dark webs, ensnaring our kin and blighting our home. The time has come to tear down their nests and scour them from our forest."
 MIR_handle_dol_guldur:0 "Handle Dol Guldur"
 MIR_handle_dol_guldur_desc:0 "Our patience has worn thin. The denizens of Dol Guldur have encroached upon our lands for the last time. Let their dark fortress tremble, for the Elves of Mirkwood are coming to reclaim what is ours."
 MIR_peace_in_the_forest:0 "Peace in the Forest"
 MIR_peace_in_the_forest_desc:0 "Centuries of relentless struggle culminate in this precious moment: Mirkwood is free. The sacrifices of our kin were not in vain, for now, the Elves may walk in peace."
 MIR_tend_to_the_west:0 "Tend to the West"
 MIR_tend_to_the_west_desc:0 "The ancient paths to the west have grown dim and overgrown. It is time to extend our care and watchfulness to these often-forgotten regions."
 MIR_seek_out_the_northern_beornings:0 "Seek Out the Northern Beornings"
 MIR_seek_out_the_northern_beornings_desc:0 "A shadow falls over Mirkwood, and none are safe from its reach. Even the reclusive Beornings may find wisdom in unity, or at least in mutual understanding against the encroaching darkness."
 MIR_approach_the_woodmen_of_rhosgobel:0 "Approach the Woodmen of Rhosgobel"
 MIR_approach_the_woodmen_of_rhosgobel_desc:0 "The wild lands to our west are home to the Woodmen of Rhosgobel, simple folk who nonetheless share a border with us. It is time we extended a hand of friendship to these dwellers of the glades."
 MIR_advanced_engineering:0 "Advanced Engineering"
 MIR_advanced_engineering_desc:0 "We have observed the Woodmen's ingenious, if somewhat unrefined, construction techniques and rudimentary devices. It is time we apply elven precision and long-sightedness to these 'machines'."
 MIR_honeycakes_for_lembas_bread:0 "Honeycakes for Lembas Bread"
 MIR_honeycakes_for_lembas_bread_desc:0 "While their honeycakes are certainly hearty, the Beornings will surely appreciate the resilience Lembas bread bestows. A 'fair' trade, if one considers the practicalities of a long journey."
 MIR_invite_mannish_settlers:0 "Invite Mannish Settlers"
 MIR_invite_mannish_settlers_desc:0 "Centuries have seen us keep our hidden paths from the shorter-lived races. But with shadows lengthening, new alliances must be forged. The Woodmen and Beornings are welcome to settle."
 MIR_seek_out_radagast:0 "Seek Out Radagast"
 MIR_seek_out_radagast_desc:0 "The Brown Wizard, Radagast, has long dwelled in the southern reaches of our forest, observing the slow corruption with keen eyes. His unique understanding of the creatures and flora of Mirkwood could prove invaluable."
 MIR_reconcile_nature_and_industry:0 "Reconcile Nature and Industry"
 MIR_reconcile_nature_and_industry_desc:0 "We must find a way to forge progress without scarring the very nature we seek to protect."
 MIR_workshop_contruction:0 "Workshop Construction"
 MIR_workshop_contruction_desc:0 "From the quiet corners of our forest realm, new places of creation emerge. These workshops will serve to expand our industry and secure our future."
 MIR_workshop_contruction_2:0 "Workshop Construction II"
 MIR_workshop_contruction_2_desc:0 "Even as the forest thrives around us, the need for further production capacity becomes clear. More workshops are seamlessly integrated, their graceful forms belying the industry within."
 MIR_workshop_contruction_3:0 "Workshop Construction III"
 MIR_workshop_contruction_3_desc:0 "Three times the charm, they say."
 MIR_forge_construction:0 "Forge Construction"
 MIR_forge_construction_desc:0 "Let the fires of industry ignite within our ancient domain. Though our hearts yearn for peace, Mirkwood will forge its own destiny, one weapon at a time, until all threats are scattered."
 MIR_forge_construction_2:0 "Forge Construction II"
 MIR_forge_construction_2_desc:0 "The forest's ancient peace is threatened, and even the most skilled warrior needs a blade. These new forges will produce the arms necessary to protect our home."
 MIR_forge_construction_3:0 "Forge Construction III"
 MIR_forge_construction_3_desc:0 "Another foundry? One might almost mistake us for a dwarven kingdom at this rate. Still, the clanging hammers are a necessary evil when the alternative is to be overrun by... well, evil."
 MIR_deep_forest_architecture:0 "Deep Forest Architecture"
 MIR_deep_forest_architecture_desc:0 "Who needs wide open plains when you can build upwards, downwards, and sideways within the glorious tangle of the forest? Our engineers assure us these new designs will hold up."
 MIR_resource_exploitation:0 "Resource Exploitation"
 MIR_resource_exploitation_desc:0 "While the Naugrim delight in the delving of stone, even the Sindar must now apply their minds to the earth's stubborn bounty. New methods for extracting its gifts are needed, and quickly."
 MIR_forest_ranger_tactics:0 "Forest Ranger Tactics"
 MIR_forest_ranger_tactics_desc:0 "Only a fool fights the Mirkwood Elves in their own domain. Our rangers will perfect the arts of concealment and sudden assault, ensuring that every shadow hides a blade and every thicket conceals an arrow."
 MIR_great_eagles_of_manwe:0 "Great Eagles of Manwë"
 MIR_great_eagles_of_manwe_desc:0 "These are not mere beasts of burden, but proud, sentient beings. To gain the favour of the Great Eagles, we must offer more than just a plea for aid; we must offer respect and a worthy cause."
 MIR_the_elvenkings_halls:0 "The Elven-king's Halls"
 MIR_the_elvenkings_halls_desc:0 "Even the timeless halls of the Elvenking require diligent upkeep. Strengthening our vital infrastructure will ensure the enduring prosperity of our realm."
 MIR_elven_blacksmiths:0 "Elven Blacksmiths"
 MIR_elven_blacksmiths_desc:0 "Deep within the King's Halls, the ancient craft of the smith is revitalized not for adornment, but for defiance. Every forge now glows with the promise of more weapons to defend our sanctuary."
 MIR_the_elvenkings_gate:0 "The Elven-king's Gate"
 MIR_the_elvenkings_gate_desc:0 "The ancient halls of the Elvenking are protected by more than just stone and magic. This gate, a formidable guardian, ensures that only those deemed worthy may enter our secluded realm."
 MIR_elven_steel_blades:0 "Elven Steel Blades"
 MIR_elven_steel_blades_desc:0 "The shadows may lengthen, but our resolve remains unclouded. With every gleam of tempered steel, we fortify Mirkwood's defense, ensuring our warriors carry the finest blades into battle."
 MIR_capital_barracks:0 "Capital Barracks"
 MIR_capital_barracks_desc:0 "The ancient martial traditions of the Silvan Elves live on. Within these new barracks, fresh recruits will hone their skills and prepare for the trials that surely lie ahead."
 MIR_eagle_nests:0 "Eagle Nests"
 MIR_eagle_nests_desc:0 "High above the forest canopy, these nests will serve as vital watchtowers and launching points for our mighty allies, the Great Eagles."
 MIR_secure_scarce_resorces:0 "Secure Scarce Resources"
 MIR_secure_scarce_resorces_desc:0 "The deep woods of Mirkwood offer much, but some necessities remain scarce. Our ingenuity must find what nature has not provided in abundance."
 MIR_fortify_the_dol_guldur_border:0 "Fortify the Dol Guldur Border"
 MIR_fortify_the_dol_guldur_border_desc:0 "To protect the heart of our realm, we must strengthen our defenses facing the blighted hill of Dol Guldur."
 MIR_soft_power:0 "Soft Power"
 MIR_soft_power_desc:0 "Our network of alliances and friendships, built on trust and mutual respect, transforms into a wellspring of political capital, strengthening our standing without a single blade drawn."
