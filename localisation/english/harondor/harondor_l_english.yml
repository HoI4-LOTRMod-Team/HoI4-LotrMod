#Events

harondor.1.t: "[GON.GetName] Dominates [HDR.GetAdjective] Politics"
harondor.1.d.a: "[GON.GetNameDefCap] has expanded their influence over us to the point where we are forced to favor them in the current landscape of politics."
harondor.1.d.b: "[GON.GetNameDefCap] has expanded their influence over [HDR.GetNameDef] to the point where [HDR.GetNameDEF] has felt forced to favor them in the current landscape of politics."
harondor.1.a: "Concerning."
harondor.1.b: "We cannot allow them to drift into the [GON.GetAdjective] sphere of influence!"
harondor.2.t: "[HAR.GetName] Dominates [HDR.GetAdjective] Politics"
harondor.2.d.a: "[HAR.GetNameDefCap] has expanded their influence over us to the point where we are forced to favor them in the current landscape of politics."
harondor.2.d.b: "[HAR.GetNameDefCap] has expanded their influence over [HDR.GetNameDef] to the point where [HDR.GetNameDEF] has felt forced to favor them in the current landscape of politics."
harondor.2.b: "We cannot allow them to drift into the [HAR.GetAdjective] sphere of influence!"

harondor.3.t:0 "[FROM.GetName] Demands our Annexation"
harondor.3.d:0 "Today, emissaries [FROM.GetNameDEF] have arrived with a rather bold demand: our annexation. Although this was unfortunately to be expected due to our failure in upholding our neutrality, perhaps it is possible for us to go out in a blaze of glory."
harondor.3.a:0 "It's not worth yet another devastation."
harondor.3.b:0 "Let them come!"

