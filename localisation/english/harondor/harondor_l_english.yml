#Decisions

HDR_maintain_neutrality_hdr_category:0 "Upholding Neutrality"
HDR_maintain_neutrality_hdr_category_desc:0 "A war-torn region that lies between Gondor and Harad, Harondor has become a battlefield between the two powers throughout history. Following the latter's defeat at the Battle of the Crossings of Poros, Annath, a self-proclaimed Marquess from Barad Harn, has gathered the support of the remaining peoples of Harondor."
