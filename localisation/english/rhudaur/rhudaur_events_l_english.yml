rhudaur.5.t:0 "Rhudaur Seeks Advice"
rhudaur.5.d:0 "Our neighbor, the hill-men of Rhudaur, is becoming increasingly alarmed at late developments. The migrating elves, the growing darkness, the rumors of Sauron's return... Under these troubling circumstances, Rhudaur looks to us, wondering what measures they shall enact to face these new challenges."
rhudaur.5.a:0 "Discard the rolls and parchments. Only the sword matters today."
rhudaur.5.b:0 "It is the rich and powerful who lead us astray."
rhudaur.5.c:0 "They must not stray from the light!"
rhudaur.5.e:0 "All storms pass eventually. Entanglements only amplify the risk."

 rhudaur.6.t:0 "The Council of Rhudaur"

 rhudaur.6.desc:0 "The clan leaders and influential men of Rhudaur have been summoned to a grand council to deliberate on the path that our people must take.\n\nDark shadows gather on the horizon, and these are indeed troubling times. The realms of men find themselves in chaos, the elves are withdrawing into their forests, and ominous whispers speak of darkness rising in Mordor, Angmar, and beyond.\n\nWhat course shall we set for our future?"

 rhudaur.6.a:0 "Desperate times call for immediate and decisive political action!"

 rhudaur.6.b:0 "If war looms in the distance, then we must ready ourselves for battle!"

 rhudaur.6.c:0 "As long as our people remain united, we can withstand any adversary!"

 rhudaur.7.t:0 "Rhudaur-Fornost Road Opened"
 rhudaur.7.d:0 "In the spirit of improved relations and mutual benefit, the road connecting Rhudaur to Fornost has been opened. This development promises to enhance trade, communication, and cooperation between our realms."
 rhudaur.7.a:0 "Some good news at last!"

 rhudaur.8.t:0 "A Reward From Mordor"
 rhudaur.8.d:0 "The Lord of the Dark Tower has taken notice of our efforts and successes. He is greatly impressed with our victory against Rivendell and has dispatched a reward to strengthen our forces and further our cause."
 rhudaur.8.a:0 "The Dark Lord honors us!"
