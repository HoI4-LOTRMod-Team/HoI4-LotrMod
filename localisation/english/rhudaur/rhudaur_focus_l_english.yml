RHDNUMEN_belligerent:0 "Númenor's Legacy"

#From here down is focuses
RHD_gather_forces:0 "Gather Forces"
RHD_gather_forces_desc:0 "If war is to come to Rhudaur, we should at least have an army."
RHD_organize_military:0 "Military Reorganization"
RHD_organize_military_desc:0 "Our armed forces are in disarray and have to be organized if we are to survive"
RHD_indoctrinate:0 "Military Doctrine Effort"
RHD_indoctrinate_desc:0 "We should check what kind of books our generals are reading, they can't just live in a fantasy world, we have stratagies to follow."
RHD_doctrine_effort:0 "Study Old Battles"
RHD_doctrine_effort_desc:0 "Victorious warriors win first and then go to war, while defeated warriors go to war first and then seek to win. -Sun Tzu"
RHD_doctrine_effort_II:0 "Teachings of War"
RHD_doctrine_effort_II_desc:0 "It is imperative to master the principles of the art of war and learn to be unmoved in mind even in the heat of the battle. - Miyamoto Musashi"
RHD_mastery_of_warfare:0 "Mastery of Warfare"
RHD_mastery_of_warfare_desc:0 "Having chosen our doctrines and strategies, a mastery of warfare can be achieved by continuous practice and refinement of our methods."
RHD_progress_military:0 "Military Advancements"
RHD_progress_military_desc:0 "Rigorous drills and harsh training are the driving force behind any army's victory"
RHD_integrate_hillmen:0 "Integrate the Hill-Men"
RHD_integrate_hillmen_desc:0 "The hill-men make up the majority of our population but are less skillful than the Dunedain"
RHD_advance_rangers:0 "Expert Rangers"
RHD_advance_rangers_desc:0 "The Dunedain of Rhudaur are few, we must make them count"
RHD_recruit_more_hillmen:0 "Hill-Men Recruitment"
RHD_recruit_more_hillmen_desc:0 "The hill-men are plentiful but very few are in the military, we should encourage them to join so that we can have more numerous armed forces"
RHD_train_better_rangers:0 "Train better rangers"
RHD_train_better_rangers_desc:0 "We are the smallest of the Arnorian nations and have the fewest Dunedain, however, with enough training, we can make our Dunedain the most potent."
RHD_contact_the_eagles:0 "Contact the Eagles"
RHD_contact_the_eagles_desc:0 "The great eagles have long resided in the Misty Mountains along our eastern border. We should try to secure their support as it may prove useful in the event of a war."
RHD_bring_them_from_the_mountains:0 "Mountain Nests"
RHD_bring_them_from_the_mountains_desc:0 "Though they like the mountains best, the eagles may be persuaded to live elsewhere in Rhudaur if we are to construct proper nests for them. Certainly the Dunedain are reasonably qualified to interact with the eagles. And maybe it wouldn't hurt to offer them some food if they help us."
RHD_integrate_the_eagles_into_our_army:0 "Integrate the eagles into our army"
RHD_integrate_the_eagles_into_our_army_desc:0 "It turns out that the eagles are incredibly helpful in giving air support, bringing supplies to far afield armies, dropping anything from rocks to alchemical bombs on our enemies, and rescuing small bands of travellers from the tops of trees."
RHD_clear_trollshaws:0 "Clear the Trollshaws"
RHD_clear_trollshaws_desc:0 "The Trollshaws, as their name suggests are home to a large amount of trolls, we'll have to get rid of them before we can build anything."
RHD_ready_for_construction:0 "Prepare Construction Projects"
RHD_ready_for_construction_desc:0 "We should prepare to get the construction crews ready, now that the trolls are gone"
RHD_put_in_factories:0 "Put in factories"
RHD_put_in_factories_desc:0 "Now that the trolls are gone we can fit a lot more factories into this place"
RHD_build_new_infrastructure:0 "Improve Infrastructure"
RHD_build_new_infrastructure_desc:0 "Now we just need to improve the infrastructure through the Trollshaws, then they'll be usable."
RHD_begin_lumber_trade:0 "Begin Lumber Trade"
RHD_begin_lumber_trade_desc:0 "Without trolls wandering around it is much safer to use the trees from the Trollshaws as lumber."
RHD_further_infrastructure_improvement:0 "Hillside Roads"
RHD_further_infrastructure_improvement_desc:0 "While we have our construction crews ready we may as well take advantage of this and build some other infrastructure too."
RHD_expand_civilian_industry:0 "Expand Civilian Workshops"
RHD_expand_civilian_industry_desc:0 "We should produce more consumer goods to keep up with increasing demand"
RHD_expand_military_industry:0 "Expand Blacksmithing"
RHD_expand_military_industry_desc:0 "We should produce more armaments to keep up with our growing army."
RHD_ramp_civilian_production:0 "Hillside Windmills"
RHD_ramp_civilian_production_desc:0 "We're getting into the swing of this construction stuff"
RHD_industrialize_civilian_economy:0 "Civilian Production Efforts"
RHD_industrialize_civilian_economy_desc:0 "Our plan to renovate the civilian economy is now in full effect"
RHD_ramp_military_production:0 "Heavy Forge Construction"
RHD_ramp_military_production_desc:0 "We're getting into the swing of this construction stuff"
RHD_industrialize_military_manufacturing:0 "Military Production Efforts"
RHD_industrialize_military_manufacturing_desc:0 "Our plan to renovate the military manufacturing lines is now in full effect"
RHD_research_slot:0 "The Fruits of Labor"
RHD_research_slot_desc:0 "Much can be learned from putting in the work to get something done"
RHD_clear_ettenmoors:0 "Clear the Ettenmoors"
RHD_clear_ettenmoors_desc:0 "Hunting is one of the things that the Dunedain rangers are best at. Now that we are more organized and have full access to the Ettenmoors it is time to finally get rid of the trolls once and for all"
RHD_core_the_ettenmoors:0 "Core the Ettenmoors"
RHD_core_the_ettenmoors_desc:0 "After the trolls have left the ettenmoors they can be considered entirely ours."
RHD_mine_them_for_iron:0 "Establish Ironmines"
RHD_mine_them_for_iron_desc:0 "Turns out that the Ettenmoors are actually a great source of iron... just like spinach."
RHD_repurpose_ettenmoors:0 "Repurpose the Ettenmoors"
RHD_repurpose_ettenmoors_desc:0 "Without the interference of the goblins, we will be able to put more infrastructure into the Ettenmoors."
RHD_put_them_to_use:0 "Integrate Lost Villages"
RHD_put_them_to_use_desc:0 "The improved infrastructure means nothing if we are not to build factories here."
RHD_fate_of_rhudaur:0 "The Fate of Rhudaur"
RHD_fate_of_rhudaur_desc:0 "The third age is in its twilight and change is all around us. How shall we secure our future?"
RHD_consult_angmar:0 "Consult Angmar"
RHD_consult_angmar_desc:0 "Angmar have been our allies of the past, and whether they wish to take the same path as before or not, it may be at our advantage to ask them for their opinion."
RHD_consult_arthedain:0 "Consult Arthedain"
RHD_consult_arthedain_desc:0 "Arthedain have always been loyal to the ideals of Arnor, whether they wish to continue that loyalty or not, it may be at our advantage to ask them for their opinion."
RHD_hold_a_council:0 "Invoke the Council of Hillmen"
RHD_hold_a_council_desc:0 "The leaders of Rhudaur should be assembled to decide how we will proceed in governing."
RHD_reaffiliate_with_arnor:0 "Reaffiliate with Arnor"
RHD_reaffiliate_with_arnor_desc:0 "Arnor was a glorious and peaceful kingdom, we must seek to emulate those attributes to the best of our abilities."
RHD_not_choose_sides:0 "We must not choose sides"
RHD_not_choose_sides_desc:0 "Rhudaur is unfortunately not an example of a particularly powerful nation. Because of this we must be cautious, if we are caught up in external politics it could mean our end."
RHD_side_with_darkness:0 "Side with the darkness"
RHD_side_with_darkness_desc:0 "We have taken this path before but were defeated. Now the time has come to rise again in war, and conquer those who would stand before us."
RHD_isolate_and_defend:0 "Defensive Isolation"
RHD_isolate_and_defend_desc:0 "Rhudaur is safest in the hands of our own people, we should distance ourselves from their wars if possible"
RHD_favor_with_neighbors:0 "Gain Favor With Our Neighbors"
RHD_favor_with_neighbors_desc:0 "If everyone around us is neighborly, surely none will break the peace"
RHD_look_for_security:0 "Seek Out Security"
RHD_look_for_security_desc:0 "We need to know which of our neighbors can be trusted and which borders we should defend"
RHD_ask_for_aid:0 "Ask for Aid"
RHD_ask_for_aid_desc:0 "In the event that we are attacked, it would be nice to have someone who we could know for certain would help us."
RHD_defend_the_capital:0 "Defend the Capital"
RHD_defend_the_capital_desc:0 "We must protect our seat of power if our nation is to long prevail."
RHD_defend_the_north_borders:0 "Defend the northern borders"
RHD_defend_the_north_borders_desc:0 "Angmar and Arthedain may well prove dangerous to us, we must protect ourselves against this possible threat."
RHD_defend_the_south_borders:0 "Defend the southern borders"
RHD_defend_the_south_borders_desc:0 "The Angle has proven to be a vital part of the survival of the Rhudaurim Dunedain for the past centuries, it must be defended."
RHD_defend_the_east_borders:0 "Defend the eastern borders"
RHD_defend_the_east_borders_desc:0 "In times as dark as these, the tales of Feanor teach us, even elves may turn to conquest. We should be ready in case of this possibility."
RHD_study_in_solitude:0 "Solitary Studies"
RHD_study_in_solitude_desc:0 "With less worry of being attacked, we are safe to spend more of our time in research and study."
RHD_stabilize_the_ranger_force:0 "Stabilize the Ranger Force"
RHD_stabilize_the_ranger_force_desc:0 "The rangers have been waning away for too long now, we should consolidate them in defense of our country."
RHD_make_it_certain:0 "No Turning Back"
RHD_make_it_certain_desc:0 "We have no room for weakness or hesitation, when we act it must be with a certainty that our demands will be met and our goals achieved."
RHD_remove_political_opposition:0 "Expell the Opposition"
RHD_remove_political_opposition_desc:0 "For far too long have the minority stirred up trouble by speeking out against our ways, they must be silenced... by any means necessary"
RHD_rally_hillmen:0 "Rally the Hill-men"
RHD_rally_hillmen_desc:0 "The Hill-men of Rhudaur were the driving force with which we assailed Eriador under the banner of the Witch King, now it is time to rally them again so that our forces may be strengthened."
RHD_villify_the_rangers:0 "Villify the Rangers"
RHD_villify_the_rangers_desc:0 "The Dunedain want nothing for the people of Rhudaur other than to be perpetually oppressed by our past. They look too much into what was without thinking of what could be... what could be ours."
RHD_convince_the_rangers:0 "Sway the Rangers"
RHD_convince_the_rangers_desc:0 "Even though their views tend to be aligned with peacekeeping, the rangers are not beyond changing their views sometimes. Given the right motivators, threats, bribes, whatever is necessary, we should be able to convince most of them to our side; and those who we don't convince? we don't need that kind of people in our Rhudaur."
RHD_look_to_the_south:0 "Look to the South"
RHD_look_to_the_south_desc:0 "An old power is rising again in the world, we would have to be foolish not to take the opportunity to ally with them"
RHD_look_to_the_north:0 "Look to the North"
RHD_look_to_the_north_desc:0 "Angmar were our allies in the days of our last war, should we not seek now to join their cause again to reak vengeance on those who defeated us?"
RHD_our_own_way:0 "Sole Masters of Rhudaur"
RHD_our_own_way_desc:0 "Rhudaur has had enough of overlords and foreign kings. It is time to guide our country to a greater tomorrow under our own banners. We do not need allies, we are the masters now."
RHD_claim_weathertop:0 "Claim Weathertop"
RHD_claim_weathertop_desc:0 "Weathertop was always a contested region between the three Arnorian nations. Even if we did not end up with it then, there's no reason that we shouldn't have it."
RHD_demand_weathertop:0 "Demand Weathertop"
RHD_demand_weathertop_desc:0 "Weathertop is rightfully ours. If they do not hand it over, we will have no choice but to take up arms."
RHD_core_weathertop:0 "Core Weathertop"
RHD_core_weathertop_desc:0 "Now that we have taken back what is ours all that remains is to mark it as such."
RHD_ancient_knowledge_repurposed:0 "Ancient knowledge repurposed"
RHD_ancient_knowledge_repurposed_desc:0 "Amon Sul, also known as Weathertop was the seet of a Palantir in the days of Arnor. The Palantir is long gone but some essence of its magic remains."
RHD_invite_gundabad:0 "Invite Gundabad"
RHD_invite_gundabad_desc:0 "Another nation of orcs, only a few hundred miles from our northern border as the crow flies? We will have to ask them for an alliance."
RHD_denounce_angmar:0 "Denounce Angmar's cowardice"
RHD_denounce_angmar_desc:0 "Angmar is but a shell of their former power, they lost our respect when they displayed such cowardice instead of reclamation of power."
RHD_bring_darkness_angmar:0 "Bring darkness to Carn Dum"
RHD_bring_darkness_angmar_desc:0 "Carn Dum was built as the Witch King's castle, any of less power who would govern from there does a great dishonor that must be rectified."
RHD_new_rulers_of_the_north:0 "New rulers of the north"
RHD_new_rulers_of_the_north_desc:0 "The old government of Angmar was weak, their efforts for more peaceful life futile. Conquest is the only path that can be followed by those who truly desire power. These lands will be much better put to use by our own hands."
RHD_tip_cardolan:0 "Tip Cardolan"
RHD_tip_cardolan_desc:0 "Perhaps spreading some light propoganda might make our southern neighbors more receptive to our rhetoric."
RHD_cardolan_rhudarian_army_training:0 "Rhudarian-Cardolan army training"
RHD_cardolan_rhudarian_army_training_desc:0 "With our training regimes combined, the forces of Rhudaur and Cardolan will be together unstoppable"
RHD_do_angmar_will:0 "Do Angmar's will"
RHD_do_angmar_will_desc:0 "Though we do not necessarily swear absolute fealty to their ruler anymore, Angmar is still a worthy country who's wishes we would do best to make true."
RHD_vengeance_for_fornost:0 "Vengeance for Fornost"
RHD_vengeance_for_fornost_desc:0 "It was at the Battle of Fornost that we were defeated in the past by the armies of elves and men. Now the time has come for reckoning."
RHD_demand_cardolan_submission:0 "Demand Cardolan's submission"
RHD_demand_cardolan_submission_desc:0 "Cardolan has for too long existed outside of our dominion, they must bend to our will or be ready to die by our swords."
RHD_demand_arthedain_submission:0 "Demand Arthedain's submission"
RHD_demand_arthedain_submission_desc:0 "Arthedain has for too long existed outside of our dominion, they must bend to our will or be ready to die by our swords."
RHD_enslave_lesser_men:0 "Enslave lesser men"
RHD_enslave_lesser_men_desc:0 "The people of Enedwaith are not of Numenorean descent and are therefore weaker and of less importance than we who are their superiors."
RHD_deal_with_the_shire:0 "Deal with the Shire"
RHD_deal_with_the_shire_desc:0 "The hobbits should present no great threat to us, they will be easily subdued."
RHD_numenors_greatest_descendants:0 "Numenor's greatest descendants"
RHD_numenors_greatest_descendants_desc:0 "The island kingdom is long fallen and the world has changed since the days of Elros. But with the conquest of Arnor complete we may now declare ourselves the greatest among Numenor's descendants and sole inheritance of their everlasting glory."
RHD_make_it_final:0 "Make it final"
RHD_make_it_final_desc:0 "Gondor is the last Numenorean nation who yet live free of our influence, by conquering them we will realize our inheritance to the fullest."
RHD_commit_to_the_cause:0 "Commit to the Cause"
RHD_commit_to_the_cause_desc:0 "We must commit fullheartedly to the light and banish any thought of darkness from our minds."
RHD_settle_disputes:0 "Settle Disputes"
RHD_settle_disputes_desc:0 "We can no longer afford to argue about how whether we should stand up for a cause that is just."
RHD_rally_rangers:0 "Rally the Rangers"
RHD_rally_rangers_desc:0 "The Dunedain of Rhudaur were scattered during our last war and most that are left reside in The Angle, we must organize their return to and and distribution around our country."
RHD_strengthen_our_dunedain:0 "Strengthen our Dunedain"
RHD_strengthen_our_dunedain_desc:0 "The Dunedain of Rhudaur have been greatly diminishing since the last war. Their glory days behind them, many have thought that Rhudaur was a lost cause. But we will perservere and return stronger."
RHD_ready_the_hillmen:0 "Ready the Hill-Men"
RHD_ready_the_hillmen_desc:0 "The Hill-Men have historically been allied with the witch king during our last war. We will attempt to persuade them of our cause before we discount their support."
RHD_look_to_gondor:0 "Look to Gondor"
RHD_look_to_gondor_desc:0 "Gondor has for long been on the borders of the dark lands, we should be proud to follow their example."
RHD_unite_with_gondor:0 "Unite with Gondor"
RHD_unite_with_gondor_desc:0 "With the coronation of King Elessar, Gondor is seeking new allies, we should join them as soon as is possible."
RHD_access_libraries:0 "Request access to their libraries"
RHD_access_libraries_desc:0 "The libraries of Minas Tirith are renowned for the knowledge that they hold, in return for our own contributions Gondor may allow us access."
RHD_reunite_with_our_kindred:0 "Reunite With Our Kin"
RHD_reunite_with_our_kindred_desc:0 "As Arthedain seeks to recreate Arnor, what better opportunity will there be to show a strong support for the free people?"
RHD_follow_angmar:0 "Follow Angmar"
RHD_follow_angmar_desc:0 "Angmar were our allies of old, now that they have changed course and are supporting the free peoples we should rejoin their cause. For justice this time."
RHD_old_allies_new_goals:0 "Old Allies, New Goals"
RHD_old_allies_new_goals_desc:0 "Even now that we have both taken up the side of good, it will never be said that Angmar and Rhudaur were unfriendly."
RHD_sway_rivendell:0 "Sway Rivendell"
RHD_sway_rivendell_desc:0 "With our location at the east of Eriador we have the unusual situation of being neighbors with the elves, this is an opportunity for great alliances that should be taken."
RHD_invite_rivendell:0 "Invite Rivendell"
RHD_invite_rivendell_desc:0 "As they have not yet made connection with one of the alliances of the world we may yet convince them to side with us."
RHD_edify_our_ruler:0 "Edify Our Leadership"
RHD_edify_our_ruler_desc:0 "None of the humans of middle earth are without fault, but we may yet teach our leaders to follow closely to the paths of honor"
RHD_protect_arnor_inhabitants:0 "Protect the People of Arnor"
RHD_protect_arnor_inhabitants_desc:0 "It is the mission of the Dunedain to safeguard the free peoples of Middle Earth, this is a duty that we take to heart."
RHD_carve_out_rot:0 "Carve Out the Rot"
RHD_carve_out_rot_desc:0 "We cannot tolerate any evil to persist under our watch, Arnor is our charge and we must rid it of hatred."
RHD_bring_peace_to_the_west:0 "Bring Peace to the West"
RHD_bring_peace_to_the_west_desc:0 "By supporting the growth of those countries which we agree with, we can seek to turn Eriador to more peaceful ways."
RHD_artifacts_of_peace:0 "Artifacts of Unity"
RHD_artifacts_of_peace_desc:0 "Having achieved a more righteous Arnor, we may spend more time in libraries and classrooms instead of barracks and arms-factories."
RHD_peace_in_arnor:0 "Peace in Arnor"
RHD_peace_in_arnor_desc:0 "Though war may still rage elsewhere, at least the countries of Arnor have become more averse to evil."
RHD_share_dunedain_secrets:0 "Share Dunedain Secrets"
RHD_share_dunedain_secrets_desc:0 "The Dunedain have long been divided and secretive, by sharing our secrets, the rangers of both nations may learn more of the lore of the world."
RHD_joint_recruitment:0 "Joint Recruitment Efforts"
RHD_joint_recruitment_desc:0 "By combining our governments' efforts together, we will be more successful in recruiting the populace for our war effort."
RHD_learn_from_the_field:0 "Practical Training Lessons"

