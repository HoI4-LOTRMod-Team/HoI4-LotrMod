RHD_end_eldar_arrogance:0 "End Eldar Arrogance"
RHD_sack_rivendell:0 "The Sack of Rivendell"
RHD_repurpose_elven_workshops:0 "Repurpose Elven Workshops"
RHD_occupation_outposts:0 "Occupation Outposts"
RHD_join_the_dark_pact:0 "Join the Dark Pact"
RHD_supplies_from_Mordor:0 "Supplies from Mordor"
RHD_a_reward_from_mordor:0 "A Reward from Mordor"
RHD_numenorean_heritage_desc:0 "Though faded, the ancient laws and traditions of Númenor still resonate in the hearts of our Dúnedain. By reaffirming this heritage, we lay the foundation for a just and cooperative governance, worthy of our forebears."
RHD_watchful_isolation_desc:0 "A simple creed for complex times: mind our own business. The squabbles of outsiders are exactly that: theirs."
RHD_join_the_shadows_desc:0 "A new power rises in the East, and its shadow stretches even to the Misty Mountains. To resist is folly; to join, the path to our future. Let us cast our lot with the coming night."
RHD_defend_the_northern_borders_desc:0 "The ancient threat of Angmar is not easily forgotten. By strengthening our northern defenses, we aim to demonstrate that Rhudaur will not be a highway for any invading force, but rather a wall of resistance."
RHD_defend_the_southern_borders_desc:0 "While the Elves of Rivendell prefer diplomacy, the Angle has been a contested region for centuries. Wisdom dictates that we strengthen our defenses, leaving nothing to chance."
RHD_taming_the_hills_of_rhudaur_desc:0 "Our hills are a formidable shield, but also a barrier. To grow, we must civilize these wild reaches, building the infrastructure necessary for our people to thrive and our influence to spread."
RHD_rhudaur_arthedain_road_desc:0 "Centuries have passed since Arnor was united, but the ancient ties to our kin in Arthedain remain. Constructing a grand road to Fornost will be a testament to our shared heritage and a step towards renewed fellowship."
RHD_hill_ranger_training_desc:0 "No longer shall our defense rely solely on local knowledge. Formal instruction in guerrilla tactics and wilderness survival will transform our Hill-men into a truly formidable Ranger force."
RHD_protect_against_goblin_town_desc:0 "Our mountain passes are vulnerable points that the creatures of Goblin-Town exploit with wicked glee. We must fortify these borders, making any incursion a bloody and costly venture for them."
RHD_reach_out_across_the_mountains_desc:0 "The whispers of a distant, benevolent people across the mountains have reached our ears. A perilous journey, yes, but vital to establish contact and perhaps find allies in the secluded Gladden Vale."
RHD_send_tribute_to_the_eyrie_desc:0 "The majestic Great Eagles hold sway over the highest peaks and darkest valleys. To secure their aid, a worthy tribute must be sent to their lofty Eyrie."
RHD_learn_from_the_field_desc:0 "Forget dusty scrolls and theoretical maneuvers. Our warriors shall learn from the harsh realities of the Ettenmoors and the Trollshaws. The field itself will be their instructor."
RHD_oath_of_allegiance_desc:0 "A new pact is forged in the shadows of the North Downs. This oath binds us not to men, but to the whispers of ancient power that promise dominion."
RHD_facilitate_trade_desc:0 "The new road to Arthedain presents an opportunity we cannot ignore. Facilitating trade will not only bring much-needed goods and coin to our lands but also foster a sense of shared prosperity with our western kin."
RHD_mountain_settlements_desc:0 "For too long have the Goblins eyed our lands from their mountain strongholds. We shall settle the slopes and high passes, building resilient communities that stand as a bulwark against the darkness."
RHD_comission_new_trading_caravans_desc:0 "With our roads improved and trade ties strengthened, it is time to expand our reach. Commissioning more caravans will bring greater wealth and connect our markets to the wider world."
RHD_better_rangers_desc:0 "The ancient knowledge of the Dúnedain teaches not only survival, but dominance of the wild. It is time to recall these advanced techniques."
RHD_food_rationing_desc:0 "As the watchtowers stand guard, so too must our larders. A prolonged siege requires more than just stout defenses; it requires the prudent management of all sustenance, for man and machine alike."
RHD_calm_through_safety_desc:0 "Peace, it turns out, can be bought with ink and words, rather than blood and steel. Our diplomatic outreach has secured our position, bolstering both our treasury and the morale of our folk."
RHD_long_term_thinking_desc:0 "Our ancestors built kingdoms that lasted for ages. We too must cultivate a vision that extends beyond the immediate horizon, training those who can see and plan far ahead."
RHD_limited_interventions_desc:0 "The growing threat to our borders necessitates action, but not outright war. Small, surgical strikes and covert operations will ensure our survival without drawing us into every conflict."
RHD_ranger_expeditions_desc:0 "To secure our watchful isolation, we must expand our gaze. Our Rangers will embark on broader expeditions, establishing a wider network of observation and influence far from home."
RHD_welcome_war_refugees_desc:0 "The lands around us grow ever more perilous, driving many from their ancestral homes. Rhudaur shall extend its hand, offering sanctuary to those weary souls seeking peace and protection within our borders."
RHD_growing_workforce_desc:0 "Our lands now host a burgeoning population, swelled by those seeking refuge. With so many hands eager for work, we can now expand our industrial capacity like never before."
RHD_request_aid_from_gladden_desc:0 "The fires of war now rage across the lands, threatening even the tranquil Gladden Fields. We must appeal to our neighbours across the mountains to join us, lest all be consumed."
RHD_learn_from_the_field_2_desc:0 "The initial trials have tested our men, but the true crucible of war is never fully exhausted. We send more to learn its grim lessons."
RHD_attack_arnor_desc:0 "Across the Brandywine lies the heart of a broken kingdom. Its fragments vie for power, but none possess the strength to resist our righteous march. We will unite the North under our banner."
RHD_end_eldar_arrogance_desc:0 "Centuries of Elven condescension and aloofness ends now. Their hidden valleys hold resources and lands that are rightfully ours to claim, not for them to merely guard."
RHD_they_will_not_expect_this_desc:0 "A new stratagem has been devised, one so audacious and unorthodox that it borders on madness. But that is precisely why it will work; they will not anticipate a crossing of the Misty Mountains!"
RHD_self_sufficiency_focus_desc:0 "No coin or favour shall we beg from strangers. The mountains provide, the rivers sustain, and our will shall sharpen us into a weapon. Let others rely on decadent trade; we shall thrive in the wild."
RHD_raid_and_pillage_desc:0 "Neleorion has presented a rather... 'unconventional' fiscal policy. It involves our warriors, the lands of our neighbors, and a rather strong interpretation of 'asset reallocation'."
RHD_unite_with_angmar_desc:0 "With Angmar's might at our back, the weak kingdoms of Arthedain and Cardolan will tremble before us. Together, we shall sweep aside the remnants of Arnor and usher in a new, formidable order in the North."
RHD_join_the_dark_pact_desc:0 "The Eye watches, and the Hand reaches out. We grasp it, not in fear, but in recognition of true power. Our alliance with the Dark Lord will carve a new empire in the North."
RHD_a_reward_from_mordor_desc:0 "Our swift victory over the Elves of Rivendell has not gone unnoticed. The Dark Lord, in his wisdom, extends a hand of favour to his loyal servants, granting us a boon for our service."
RHD_supplies_from_Mordor_desc:0 "No longer will Rhudaur stand alone. Mordor's dark resources fortify our armies, providing the steel and sinew needed to achieve our destiny."
RHD_sack_rivendell_desc:0 "The time for quiet disdain is over. The last bastion of the High Elves in the North has stood for too long, a symbol of their fading glory and our enduring resentment. Let us cast down their halls and claim what they hoard."
RHD_repurpose_elven_workshops_desc:0 "What was once a place of delicate elven artistry, crafting trinkets and fineries, will now be a bastion of our industrial might. Hammers will ring to a different tune, shaping steel for war, not silver for song."
RHD_occupation_outposts_desc:0 "Where Elven halls once stood, our banners shall now fly. Permanent occupation outposts are needed to consolidate our hold over Imladris, bringing its lands firmly under our martial law."
RHD_settle_past_disputes_desc:0 "Though our histories hold moments of friction with the northern kingdom, such trifles are forgotten. A common cause, or a common master, demands a unified front."
RHD_make_a_deal_with_the_goblins_desc:0 "If we intend to cross the Misty Mountains without starving, sacrifices must be made. The goblins know these mountains, and control some of the most vital routes across. We must barter passage with them."
RHD_claim_the_weathertop_desc:0 "The ancient watchtower of Amon Sûl, a forgotten sentinel of a faded kingdom, shall once again hold sway over the plains. Its windswept heights will serve our vision, not theirs."
RHD_attack_arthedain_desc:0 "The old kings are dead, their heirs are weak. It is time for a new order in the North. Arthedain will serve as the first stone in the foundation of Rhudaur's dominion."
RHD_attack_cardolan_desc:0 "The petty lords of Cardolan have squandered their Numenorean heritage. It is the destiny of Rhudaur to reclaim the scattered lands of Arnor, beginning with their weak dominion."
RHD_integrate_arthedain_administration_desc:0 "Arthedain's inefficient rule has come to an end. It is time to dismantle their former government and weave their infrastructure into the fabric of a greater Rhudaur."
RHD_integrate_cardolan_administration_desc:0 "Our victory over Cardolan is a step towards reclaiming the rightful heritage of the North-kingdom. Their fragmented administration shall be replaced by the unified will of Rhudaur."
RHD_descend_from_the_mountains_desc:0 "Our grim pacts are sealed, and the mountain passes lie open. The Hill-men, emboldened by their new alliances, now pour forth from the heights to claim Gladden's lands as their own."
RHD_clear_the_angle_of_trolls_desc:0 "The Trolls of the Angle are, frankly, a nuisance. Their habit of eating travellers and breaking everything within reach is simply unacceptable. It's time for a firm, decisive eviction notice."
RHD_stoor_hobbit_legacy_desc:0 "The Stoor Hobbits, ancient inhabitants of the Angle, were masters of their riverine lands. Their intimate knowledge of these wetlands now reveals opportunities for resource extraction, vital for our future."
RHD_mount_patrols_desc:0 "These hills are harsh, and they take a toll. But by sending our men to ride them tirelessly, we ensure they exact a far greater toll on those who would oppose us."