l_english:
 RGL_a_people_under_threat:0 "A People Under Threat"
 RGL_a_people_under_threat_desc:0 "To our south-east: the dark fortress of Dol Guldur. To our north-east: the great Spiders of the Mirkwood. To our west: the bold riders of Gladden. To our south, the enigmatic Galadhrim... There is certainly no shortage of threats in Rhosgobel!"
 RGL_the_politics_of_survival:0 "The Politics of Survival"
 RGL_the_politics_of_survival_desc:0 "Our enemies multiply, our friends are distant. It's time to admit that the 'politics' of our existence are now solely about one thing: not becoming another forgotten footnote in Middle-earth's grim history."
 RGL_seek_a_protector:0 "Seek a Protector"
 RGL_seek_a_protector_desc:0 "Our smallfolk cannot stand alone against the rising tides of power in the Anduin Vales. We must find a shield, lest we be swept away."
 RGL_stand_alone:0 "Stand Alone"
 RGL_stand_alone_desc:0 "To seek alliance is to invite a new master, and to beg for protection is to become a pawn. We shall stand alone, relying only on the stout hearts and keen eyes of our folk."
 RGL_seek_guarantees:0 "Seek Guarantees"
 RGL_seek_guarantees_desc:0 "To survive, we need a powerful declaration, not a master. We will seek assurances from a formidable nation, hoping their word alone will deter any would-be invaders from the Vales of Anduin."
 RGL_seek_an_alliance:0 "Seek an Alliance"
 RGL_seek_an_alliance_desc:0 "The Woodmen cannot face the encroaching threats in solitude. We shall send envoys to those who share our dread, forging bonds of common cause against the spreading peril."
 RGL_seek_vassalage:0 "Seek Vassalage"
 RGL_seek_vassalage_desc:0 "We cannot stand alone against the rising shadows. By offering our loyalty to a greater power, we might yet secure our borders and our future."
 RGL_the_shroud_of_dol_guldur:0 "The Shroud of Dol Guldur"
 RGL_the_shroud_of_dol_guldur_desc:0 "Our choices are few, our enemies many. Let us turn to the fortress of the Necromancer, for a dark master's protection is still protection, even if it comes with shackles."
 RGL_protection_of_the_golden_wood:0 "Protection of the Golden Wood"
 RGL_protection_of_the_golden_wood_desc:0 "With enemies on all sides, the Woodmen are forced to seek shelter under the boughs of the mightiest forest in the region. Lothlórien stands as a bulwark against the East, a shield we desperately need."
 RGL_the_elven_kings_shield:0 "The Elven King's Shield"
 RGL_the_elven_kings_shield_desc:0 "The Elves of Mirkwood keep to their own, but the encroaching darkness threatens all free peoples. Surely, even their isolation cannot withstand the plea for a shared defense."
 RGL_the_gladden_chiefs:0 "The Gladden Chiefs"
 RGL_the_gladden_chiefs_desc:0 "Our kinsmen, the Chiefdoms of Gladden, share our struggles along the Anduin. Though fiercely independent, a common cause against greater evils may yet unite us."
 RGL_emergency_defense:0 "Emergency Defense"
 RGL_emergency_defense_desc:0 "The enemy is at our gates, and our strength wanes. We must call upon every able-bodied soul to take up arms, whatever their training, to defend our homes."
 RGL_the_emergency_fyrd:0 "The Emergency Fyrd"
 RGL_the_emergency_fyrd_desc:0 "Our reserves are depleted, and the enemy presses on all sides. We must call upon the entirety of our people, for the very survival of Rhosgobel now depends on every hand that can hold a spear."
 RGL_galadhrim_marchwardens:0 "Galadhrim Marchwardens"
 RGL_galadhrim_marchwardens_desc:0 "Lothlórien's finest are here, not just as allies, but as an integral part of our defense. These Marchwardens, with their unmatched knowledge of forest warfare, will turn our woodlands into an impassable bulwark."
 RGL_invite_radagast:0 "Invite Radagast"
 RGL_invite_radagast_desc:0 "While Radagast the Brown is a familiar figure in our lands, he rarely meddles in the affairs of Men. A more direct appeal, perhaps backed by the Elves, might finally persuade him to help protect his Woodmen neighbours."
 RGL_orcish_lieutenants:0 "Orcish Lieutenants"
 RGL_orcish_lieutenants_desc:0 "The gentle ways of the Woodmen must yield to the iron fist of necessity. These grim, battle-hardened Orcs, instruments of Dol Guldur's will, will instruct our warriors in a darker, more ruthless form of warfare. The Woods will remember our change."
 RGL_shared_army_exercises:0 "Shared Army Exercises"
 RGL_shared_army_exercises_desc:0 "Courage alone will not suffice. Our warriors, though brave, must sharpen their skills. Joint exercises with the hardy Gladden men will forge a more capable fighting force, learning from each other's strengths."
 RGL_let_the_wizard_lead:0 "Let the Wizard Lead"
 RGL_let_the_wizard_lead_desc:0 "The Istari were sent to Middle-earth to aid its peoples, and Radagast the Brown, though often solitary, answers the call. His leadership heralds an era where the ancient whispers of the woods will shape our future."
 RGL_stability_through_safety:0 "Stability Through Safety"
 RGL_stability_through_safety_desc:0 "It seems we are *not* surrounded by foes on every conceivable vector after all. A minor diplomatic breakthrough, or perhaps just a very big ditch, has granted us this profound revelation."
 RGL_provoke_an_attack:0 "Provoke an Attack"
 RGL_provoke_an_attack_desc:0 "We have spent much time and many resources preparing to defend ourselves. Our borders bristle with camps and redoubts. After all this... It would be a shame to *not* be attacked, wouldn't it?"
 RGL_economic_improvements:0 "Economic Improvements"
 RGL_economic_improvements_desc:0 "Our paranoia may have been misplaced, for we have not been attacked yet. While we are wise to remain weary, it may be time to turn our attention back to other things than survival."
 RGL_diplomatic_outreach:0 "Diplomatic Outreach"
 RGL_diplomatic_outreach_desc:0 "Let it be known to all our neighbors that the men of Rhosgobel are no belliegerent foe seeking conquests."
 RGL_defensive_paranoia:0 "Defensive Paranoia"
 RGL_defensive_paranoia_desc:0 "Oh no... Oh Illúvatar... They are all after us... Enemies on all sides... Must prepare..."
 RGL_fortification_focus:0 "Fortification Focus"
 RGL_fortification_focus_desc:0 "The shadows deepen, and our borders are vulnerable. We must turn our homes into bastions and our winding paths into a labyrinth of stone and timber."
 RGL_armed_resistance_focus:0 "Armed Resistance Focus"
 RGL_armed_resistance_focus_desc:0 "Stone and mortar will not save us. We must become a living, moving threat, capable of outflanking the enemy and seizing their arms and supplies to fuel our own desperate struggle."
 RGL_build_a_forge:0 "Build a Forge"
 RGL_build_a_forge_desc:0 "The wood is plentiful, and the ore can be found in the foothills. All that remains is to gather the skill and willpower to raise a forge, that our own hands may shape our destiny."
 RGL_provide_tribute:0 "Provide Tribute"
 RGL_provide_tribute_desc:0 "To ensure the continued vigilance of our powerful allies, we must contribute to their upkeep. A small fraction of our production now flows outward, securing the shield that protects Rhosgobel."
 RGL_brace_for_war:0 "Brace for War"
 RGL_brace_for_war_desc:0 "The men of Rhosgobel cannot escape the feeling of something huge and destructive hanging over us... An all-swalling shadow descending... It shall soon be upon us."
 RGL_defensive_measures:0 "Defensive Measures"
 RGL_defensive_measures_desc:0 "From the oldest elder to the youngest hunter, all must contribute to our defense. The time for deliberation is over; only a united and armed populace can hope to stand against the coming storm."
 RGL_military_production:0 "Military Production"
 RGL_military_production_desc:0 "The whispers of war grow louder than the rustling leaves. Our survival depends not just on our vigilance, but on our capacity to arm ourselves swiftly."
 RGL_expand_the_workshops:0 "Expand the Workshops"
 RGL_expand_the_workshops_desc:0 "The bounty of the woods provides, and with skilled hands, we can transform raw timber into the tools and shelters our people need."
 RGL_vigil_of_the_woods:0 "Vigil of the Woods"
 RGL_vigil_of_the_woods_desc:0 "No grand fortresses for us; the woods are our walls, and the birds our watchmen. We'll teach every Woodman to move like a fox and strike like a badger."
 RGL_expand_woodside_villages:0 "Expand Woodside Villages"
 RGL_expand_woodside_villages_desc:0 "While most of our men reside by the great river, expanding several settlements near the Mirkwood is a long overdue measure."
 RGL_charcoal_production:0 "Charcoal Production"
 RGL_charcoal_production_desc:0 "Our lands are rich in wood, but poor in ore and coal. Through ancient crafts, we can transform the forest's bounty into the concentrated fuel needed to smelt metals and arm our people."
 RGL_set_up_additional_lumberyards:0 "Set Up Additional Lumberyards"
 RGL_set_up_additional_lumberyards_desc:0 "The forest is our lifeblood, and from it, we draw our strength. Establishing more lumberyards will bolster our productivity."
 RGL_protect_administrative_centers:0 "Protect Administrative Centers"
 RGL_protect_administrative_centers_desc:0 "Even a scattered people must have strongholds where their spirit cannot be broken. We will fortify our administrative hearths, ensuring that the flame of Rhosgobel's will never be extinguished, no matter how dire the surrounding threats."
 RGL_refugee_levies:0 "Refugee Levies"
 RGL_refugee_levies_desc:0 "They come with nothing but the clothes on their backs and fire in their eyes. We may lose ground, but we gain fighters. Let our enemies push us, and they will only find themselves fighting against an army fueled by their own cruelties."
 RGL_conceal_production:0 "Conceal Production"
 RGL_conceal_production_desc:0 "Deep within the shadowed glades and winding river valleys, our workshops are moved to secret locations, far from the eyes of those who would see us ruined. What the enemy cannot find, they cannot destroy."
 RGL_freedom_fighters:0 "Freedom Fighters"
 RGL_freedom_fighters_desc:0 "We have prepared for the worst. Though outnumbered and outmatched, our hidden stores and our determined people will make every inch of our land a costly, agonizing conquest."
 RGL_the_great_wall:0 "The Great Wall"
 RGL_the_great_wall_desc:0 "Let the orcs of Dol Guldur, the spiders of Mirkwood, and any ambitious chiefs of Gladden gaze upon our fortified borders. A clear message: this land is defended, and our will is unbreakable."
 RGL_convert_farming_equipment:0 "Convert Farming Equipment"
 RGL_convert_farming_equipment_desc:0 "The wolf is at the door, and our fields can wait. What good is a full belly if we cannot defend our homes? Our ploughshares must now become sharpened tools of war."
 RGL_desperate_defense:0 "Desperate Defense"
 RGL_desperate_defense_desc:0 "The enemy is at our gates, our lands ablaze. There is no escape, only the will to stand firm and make this our final, desperate defence."
 RGL_increase_taxes:0 "Increase Taxes"
 RGL_increase_taxes_desc:0 "What can man do against such reckless hate, without money?"
 RGL_emergency_powers:0 "Emergency Powers"
 RGL_emergency_powers_desc:0 "Normal times permit gentle rule, but these are not normal times. For the sake of our survival, a singular will must guide the Woodmen through the encroaching darkness."
 RGL_try_to_barter_with_the_spiders:0 "Try to Barter with the Spiders"
 RGL_try_to_barter_with_the_spiders_desc:0 "A diplomatic mission to the Great Spiders is, admittedly, unconventional. Yet, if offerings of livestock or undisturbed hunting grounds can buy us peace, even briefly, it is a risk we must consider. What could possibly go wrong?"
 RGL_tend_to_the_woods:0 "Tend to the Woods"
 RGL_tend_to_the_woods_desc:0 "Our very name comes from the woods, and it is our sacred duty to nurture and protect them. The health of the forest is the health of our people."
 RGL_study_mirkwood_fauna:0 "Study Mirkwood Fauna"
 RGL_study_mirkwood_fauna_desc:0 "The creatures of Mirkwood are as varied as they are dangerous. To survive amidst the encroaching gloom, we must learn their habits, their weaknesses, and their hidden strengths."
 RGL_rhosgobel_rabbits:0 "Rhosgobel Rabbits"
 RGL_rhosgobel_rabbits_desc:0 "Our studies into the unique fauna of Mirkwood have unearthed an unlikely champion. These agile forest-dwellers, when properly harnessed, will transform our chariots into tireless scouts and swift raiders."
 RGL_grow_bolder:0 "Grow Bolder"
 RGL_grow_bolder_desc:0 "Our defenses are built, our alliances forged. The Woodmen have found their footing, and now, our gaze turns outward."
