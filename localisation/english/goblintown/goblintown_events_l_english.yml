l_english:
##### Event 

 goblintown.100.t:0 "Raid on the Great Spiders Successful"

 goblintown.100.desc:0 "Our audacious raid upon the lair of the Great Spiders of Mirkwood has come to a triumphant end.\n\nA cunning band of our own crept through the shadows of Anduin, penetrated the vast forests of Mirkwood, and tracked the Spiders to their very nest.\n\nAt the opportune moment, they struck and pillaged vast quantities of precious spider silk. With only minor losses, the spoils have been safely returned to Goblin Town, ripe to be sold to eager buyers!"

 goblintown.100.a:0 "Incredible! We shall grow rich from this!"

 goblintown.101.t:0 "Goblins Trespass upon Our Nest"

 goblintown.101.desc:0 "From the depths of the forest shadows, a daring band of Goblins has violated our nest! They sought not the blood of our kin nor the destruction of our eggs, but the theft of our prized silk!\n\nVast quantities were taken, and they vanished before we could strike."

 goblintown.101.a:0 "Curse the two-legged thieves! Hissss!"

 goblintown.102.t:0 "Raid on Spiders a disaster"

 goblintown.102.desc:0 "Our daring raid on the Spider's of Mirkwood has completed.\nOur brave goblin band crossed the Anduin and infiltrated the Mirkwood forest.\nUnfortunately, the Great Spiders tracked them down before they could accomplish their objective and steal the valuable spider silk.\n\nThe poor goblins are most likely being devoured at this moment..."

 goblintown.102.a:0 "What a stupid idea..."

 goblintown.103.t:0 "Goblin Raid on Our Nest"

 goblintown.103.desc:0 "A band of goblins has emerged from the shadows of the forest to launch an audacious raid upon our nest!\n\nHowever, their intention was not to destroy or harm our kin, but to pilfer the precious silk we had painstakingly spun. Fortunately, their scheme was thwarted, and our vigilant hunters quickly recaptured them.\n\nNow, these hapless goblins shall provide a banquet for our youngest brood."

 goblintown.103.a:0 "Delicious!"

 goblintown.104.t:0 "Breefolk's Wrath at Our Incursion"

 goblintown.104.desc:0 "The folk of Bree seethe with indignation at our audacious raid upon their tanneries. The memory of this night shall linger long in their hearts, and their tolerance for us diminishes evermore."

 goblintown.104.a:0 "Who cares?"

 goblintown.105.t:0 "Goblins Raid the Tanneries of Bree!"

 goblintown.105.desc:0 "Under the cloak of darkness, a bold band of Goblins descended from Goblin Town to pillage the farms and tanneries encircling the township of Bree.\n\nVast quantities of precious leather have been seized and spirited away to the shadowed depths of their lair."

 goblintown.105.a:0 "Unacceptable! We will not forgive this!"

 goblintown.106.t:0 "Goblins Raid the Tanneries of Bree"

 goblintown.106.desc:0 "In the dead of night, a mischievous band of Goblins from Goblin Town launched a daring raid upon the farms and tanneries surrounding Bree.\n\nChaos briefly ran rampant as the foul creatures sought to plunder and pillage our lands. However, fortune smiled upon us as the city guard acted swiftly and with precision, capturing most of the raiders and putting them to the sword."

 goblintown.106.a:0 "A close shave!"

 goblintown.109.t:0 "Goblin Mercenary Contract Expired"

 goblintown.109.desc:0 "Six months past, we enlisted the aid of mercenary Goblins hailing from Goblin Town. During this period, they have displayed unwavering loyalty to our banner.\n\nYet, their allegiance was purchased with gold, not conviction, and now the term of our contract draws to a close.\n\nWe must decide whether to renew their services for another half a year or allow them to return to their caverns."

 goblintown.109.a:0 "Extend the contract."

 goblintown.109.b:0 "Let the contract expire."

 goblintown.110.t:0 "[FROM.GetName] Extends Mercenary Contract"

 goblintown.110.desc:0 "Our mercenary contract with [FROM.GetName] has reached its conclusion, yet they have opted to prolong the agreement for another six months. Their need for our warriors appears pressing and persistent."

 goblintown.110.a:0 "As long as payment continues..."

 goblintown.111.t:0 "Contract with [FROM.GetName] Expires"

 goblintown.111.desc:0 "[FROM.GetName] has chosen not to renew our mercenaries' services after the completion of the six-month term, whether from a depletion of funds or diminished need for our assistance. Thus, our warriors return to their familiar abodes, ready to be contracted anew."

 goblintown.111.a:0 "Pleasure doing business."

 goblintown.112.t:0 "Goblin Town offers Mercenary Contract"

 goblintown.112.desc:0 "Having taken notice of our troubled times, Goblin Town offers us help in the form of mercenaries.\n\nThey offer five fully equipped divisions of their finest warriors that will fight alongside our army with unvawering loyalty. In return, we will pay [GOB.GetName] 20% of our civilian industry output.\n\nThe contract will last six months, after which we may choose to extend it for another six months.\n\nGoblin Town may recall their mercenaries only if they are at war, and only with a 70 day notice period.\n\nWe will be comitted to payment for the full 6 month duration, even if all mercenaries end up killed in battle."

 goblintown.112.a:0 "Accept the contract."

 goblintown.113.t:0 "[FROM.GetName] Accepts Mercenary Contract"

 goblintown.113.desc:0 "[FROM.GetName] has accepted our offer of a mercenary contract. For the next six months, our mercenaries will fight alongside them, and they will pay us 20% of their civilian industry output."

 goblintown.113.a:0 "Easy money."

 goblintown.114.t:0 "[FROM.GetName] Declines Mercenary Contract"

 goblintown.114.desc:0 "[FROM.GetName] has declined our offer of a mercenary contract."

 goblintown.114.a:0 "Maybe we can offer it to their enemies instead, then?"

 goblintown.112.b:0 "Decline."

 goblintown.115.t:0 "Goblin Town Recalls Mercenaries"

 goblintown.115.desc:0 "Goblin Town, having recently entered into war, has recalled their mercenaries. In 70 days, they will return home and stop fighting by our side.\n\nOur payment will be cancelled with immediate effect."

 goblintown.115.a:0 "Very well."

 goblintown.116.t:0 "Mercenaries Recalled"

 goblintown.116.desc:0 "Our mercenaries have been recalled and have returned home."

 goblintown.116.a:0 "Very well."

 goblintown.117.t:0 "Mercenary Band Formed"

 goblintown.117.desc:0 "We have mustered a band of five divisions of mercenaries. Yet, they stand eager but unequipped.\n\nOnce we arm them with weapons and armor, they shall be prepared to march into any conflict that fills our coffers with gold."

 goblintown.117.a:0 "Secure weapons and armor for the band."

 goblintown.118.t:0 "Mercenary Band Armed and Ready"

 goblintown.118.desc:0 "Our mercenary band now stands ready, fully armed and armored, eager to sell their might to the highest bidder. We shall send them forth to fight in distant wars, with payment as our motivation."

 goblintown.118.a:0 "Seek out those in need of mercenaries..."

 goblintown.119.t:0 "Goblin Raid upon Rivendell!"

 goblintown.119.desc:0 "In the dead of night, a horde of goblins from Goblin Town dared to assault our sacred realm of Imladris. These foul creatures breached our treasuries, making off with countless precious jewels and gold before retreating to their mountainous lairs.\n\nWhile some of these vile thieves were captured, the affront to our honor demands a response."

 goblintown.119.a:0 "We shall not suffer this insult. Prepare our forces for retribution."

 goblintown.120.t:0 "Goblin Raid on Imladris"

 goblintown.120.desc:0 "Under the shroud of night, a treacherous host of goblins from the dark halls of Goblin Town attempted to assail our beloved Imladris. Their vile intent was to plunder our sacred treasuries and seize our gold and treasures. Yet, fortune favored us as our vigilant guards swiftly reacted, and put almost all of these brigands to the sword!"

 goblintown.120.a:0 "A narrow escape, but greater threats loom ahead."

 goblintown.121.t:0 "Rivendell Vows Revenge"

 goblintown.121.desc:0 "News reaches us that the Elves of Rivendell are far from pleased with our daring raid. Our spies confirm that they assemble a formidable host, their course set for Goblin Town."

 goblintown.121.a:0 "Uh oh..."

 goblintown.122.t:0 "Rivendell's Outrage at Brazen Theft"

 goblintown.122.desc:0 "The Elves of Rivendell have reacted coldly to our  raid. In response, they have bolstered their defenses and halted all trade, cutting off relations with our kin."

 goblintown.122.a:0 "Worth it."

 goblintown.119.b:0 "Strengthen our defenses and sever all commerce with the Goblins."

 goblintown.120.b:0 "Strengthen our defenses and sever all trade with these miscreants."

 goblintown.123.t:0 "The Treachery of the Goblins"

 goblintown.123.desc:0 "In the midst of our valiant assault upon the dark depths of Goblin Town, the villainous Goblins have resorted to foul play. With a display of treachery, they have detonated explosives and brought down the very tunnels upon our brave warriors. The devastation is severe, and the toll on our forces is grievous."

 goblintown.123.a:0 "Perfidious scum!"

 goblintown.124.t:0 "Provoking a War"

 goblintown.124.desc:0 "As we lurk deep within our tunnels, the world beyond grows ever more chaotic and war-torn. With the right maneuvers, we can turn our defenses into a deadly trap for a far superior foe. To lure such an enemy into our lair, we must make the first move and incite them to pursue us.\n\nWhere shall we strike first?"

 goblintown.124.a:0 "Let us threaten the Fields of Gladden to the east!"

 goblintown.124.b:0 "We shall provoke the Hills of Rhudaur to the west!"

 goblintown.125.t:0 "Goblin Town Demands Tribute"

 goblintown.125.desc:0 "The Goblins of Goblin Town, a people infamous for their relentless raids and looting, have presented us with a dire proposition:\n\nIn exchange for a modest amount of gold, they promise to spare our lands from their plundering. Should we refuse, they vow to ravage our fields and settlements. Shall we exchange gold for peace?"

 goblintown.125.a:0 "We will not negotiate with bandits!"

 goblintown.126.t:0 "[FROM.GetName] Refuses to Pay Tribute"

 goblintown.126.desc:0 "[FROM.GetName] has boldly refused the tribute demand. It seems they either trust in their strength to thwart our raids or are willing to risk the wrath of our forces upon their lands."

 goblintown.126.a:0 "If they don't give tribute, we will take it."

 goblintown.127.t:0 "[FROM.GetName] Pays Tribute"

 goblintown.127.desc:0 "[FROM.GetName] has wisely chosen to provide us with tribute, ensuring peace and sparing their settlements from our raids. We shall restrain our forces... for the time being."

 goblintown.127.a:0 "Low risk, high reward!"

 goblintown.125.b:0 "The safety of our people is paramount. Accept the deal."

 goblintown.128.t:0 "High Pass Open For Business"

 goblintown.128.desc:0 "The High Pass is a crucial thoroughfare across the Misty Mountains, skirting near the treacherous realm of Goblin Town. The goblins dwelling within, driven by their insatiable lust for wealth, are prepared to broker passage and grant control over this route under the proper terms.\n\nShould we seek to traverse the Misty Mountains via the High Pass, we might consider negotiating a favorable agreement with the Goblins."

 goblintown.128.a:0 "This could open up some interesting possibilities..."

 goblintown.129.t:0 "[FROM.GetName] Seeks Passage Through the High Pass"

 goblintown.129.desc:0 "We have received a request from [FROM.GetName] to traverse the High Pass across the Misty Mountains. They seek our consent for safe passage and control over this crucial route. In exchange, they pledge a generous payment under an open-ended agreement."

 goblintown.129.a:0 "Let us profit from the tolls. Agree to the contract."

 goblintown.129.b:0 "We reject their proposal."

 goblintown.130.t:0 "Control of High Pass Granted by Goblin Town"

 goblintown.130.desc:0 "After deliberation, the goblins of Goblin Town have acceded to our proposal, granting us control over the High Pass for our journey through the Misty Mountains. This agreement comes with a commitment to pay considerable tolls for as long as the contract lasts. The goblins have pledged to leave the passage undisturbed, provided the payments continue."

 goblintown.130.a:0 "The way through the mountains is ours to take!"

 goblintown.131.t:0 "Request for Passage Denied by Goblin Town"

 goblintown.131.desc:0 "Our plea for safe passage through the High Pass has been met with refusal by the goblins of Goblin Town."

 goblintown.131.a:0 "A regrettable outcome."

 goblintown.132.t:0 "[245.controller.GetName] Secures Passage through the High Pass"

 goblintown.132.desc:0 "In a surprising turn of events, [245.controller.GetName] has forged an agreement with the Goblins of Goblin Town. By this accord, the Goblins have ceded control and granted passage through the High Pass, permitting [245.controller.GetName] to traverse the Misty Mountains and approach us by this route. This development may alter the balance of power in the region."

 goblintown.132.a:0 "A development worth noting..."

 goblintown.133.t:0 "Tolls Implemented for the High Pass"

 goblintown.133.desc:0 "We have gained dominion over the High Pass, a crucial route traversing the Misty Mountains. The previous overseer had an arrangement with Goblin Town, receiving substantial tolls for the assurance of safety along this path. With us as the new custodians of the pass, these tolls are now due to us.\n\nWe retain the option to cease these payments and restore control of the passage to the Goblins whenever we deem necessary."

 goblintown.133.a:0 "Proceed as agreed."

 goblintown.134.t:0 "Contract for the High Pass Reallocated"

 goblintown.134.desc:0 "The High Pass has recently fallen under the control of [245.controller.GetName]. Consequently, our existing agreement with the prior guardian has been reassigned to [245.controller.GetName], who must now decide whether to return stewardship of the pass to us or continue to remit tolls for their safe traversal."

 goblintown.134.a:0 "Acknowledge the change."

 goblintown.135.t:0 "High Pass Contract Cancelled"

 goblintown.135.desc:0 "For many moons, we goblins of Goblin Town have allowed [FROM.GetName] to cross the Misty Mountains through the High Pass, in exchange for a hearty toll. Now, [FROM.GetName] has declared that they no longer require passage and have relinquished control back to us, ceasing all payments."

 goblintown.135.a:0 "Pleasure doing business."

 goblintown.136.t:0 "Chiefdoms of Gladden Engage in Banditry"

 goblintown.136.desc:0 "The Vales-people dwelling across the Misty Mountains in the fields of Gladden have taken to banditry and thievery. Reports have reached us that these brigands have attacked and robbed our townsfolk, spreading fear and chaos among our people."

 goblintown.136.a:0 "This is an outrage!"

 goblintown.137.t:0 "Hill-men of Rhudaur Turn to Banditry"

 goblintown.137.desc:0 "The Hill-men of Rhudaur, normally neighbors with whom we hold fair relations, have taken a darker path of late. Our scouts report that they have begun to raid our lands, assailing our people, looting their goods, and setting their homes alight in ruthless acts of banditry. This cannot stand."

 goblintown.137.a:0 "How dare they commit such acts?"

 goblintown.138.t:0 "An Offer from the Goblins of Goblin Town"

 goblintown.138.desc:0 "With relations souring between us and the Gladden Chiefdoms due to incessant banditry, an unforeseen proposal has come forth from Goblin Town.\n\nRecognizing the strain with the Chiefdoms, they suggest to grant us secure passage through the High Pass. Thus, we might cross the Misty Mountains with strength and seek retribution against the Gladden Chiefdoms for their perceived offenses.\n\nHowever, the goblins' aid is not without a price, and payment will be expected in due course."

 goblintown.138.a:0 "They shall be caught unawares! Accept the deal."

 goblintown.138.b:0 "Place no faith in goblin-kind."

 goblintown.139.t:0 "An Unexpected Offer from Goblin Town"

 goblintown.139.desc:0 "Our relations with the Hillmen of Rhudaur have soured due to recent acts of banditry. Surprisingly, we have received an offer of assistance from the Goblins of Goblin Town.\n\nThey propose granting us safe passage through the High Pass, enabling us to cross the Misty Mountains with our forces and exact retribution upon Rhudaur for their brazen insolence.\n\nNaturally, the Goblins will require compensation for their aid."

 goblintown.139.a:0 "Our foes shall never see this coming. Accept the Goblins' offer."

 goblintown.139.b:0 "We shall place no trust in the words of goblins."

 goblintown.140.t:0 "Offer rejected"

 goblintown.140.desc:0 "[FROM.GetName] has rejected our suggestion of using passage through the High Pass for an attack."

 goblintown.140.a:0 "Unfortunate."

 goblintown.141.t:0 "Gladden Chiefdoms Gathering Forces"

 goblintown.141.desc:0 "[GLD.GetName] has safe passage through the High Pass to cross the Misty Mountains. Now they appear to be gathering forces for an attack!\n\nIt appears war is imminent."

 goblintown.141.a:0 "We will fight if we must."

 goblintown.142.t:0 "Offer accepted"

 goblintown.142.desc:0 "[FROM.GetName] has pondered on our offer and accepted. Henceforth, they shall pay us tolls in return for safe passage through the High Pass."

 goblintown.142.a:0 "[FROM.GetName] is on the path to war... Excellent!"

 goblintown.143.t:0 "War Against the Hillmen"

 goblintown.143.desc:0 "We have secured the High Pass for significant payments to the Goblins and assembled our forces.\nWe should delay no longer and attack Rhudaur!"

 goblintown.143.a:0 "To war!"

 goblintown.144.t:0 "War agains the Chiefdoms of Gladden"

 goblintown.144.desc:0 "We have secured the High Pass for significant payments to the Goblins and assembled our forces.\nWe should delay no longer and attack Gladden!"

 goblintown.144.a:0 "To war!"

 goblintown.145.t:0 "Rhudaur Gathering Forces"

 goblintown.145.desc:0 "[RHD.GetName] has safe passage through the High Pass to cross the Misty Mountains. Now they appear to be gathering forces for an attack!\n\nIt appears war is imminent."

 goblintown.145.a:0 "We will fight if we must."

 goblintown.146.t:0 "Deal Struck with [FROM.GetName]"

 goblintown.146.desc:0 "[FROM.GetName] has negotated a deal with us. They will pay us a significant sum, but in return we promise to refrain from ever raiding their country."

 goblintown.146.a:0 "Very well."

 goblintown.107.t:0 "Goblin Mercenaries Go Home"

 goblintown.107.desc:0 "With their own homeland under threat, the Goblin mercenaries we have employed have left our ranks and are returning home."

 goblintown.107.a:0 "Too bad."

 goblintown.108.t:0 "Mercenaries Recalled"

 goblintown.108.desc:0 "With our soil under threat, our Goblin mercenary squadron has been recalled and have returned."

 goblintown.108.a:0 "Welcome home!"

 goblintown.147.t:0 "Tunnel Lords  Launch a Coup!"

 goblintown.147.desc:0 "The Goblins of the underground are hard to please, and always vying for the top. Our (former) King, having failed to secure sufficient funds to please the most influential goblins - the Tunnel Lords - has been deposed. Chaos will reign for next weeks, until a new king emerges, who hopefully fares better than the last."

 goblintown.147.a:0 "What a mess."
