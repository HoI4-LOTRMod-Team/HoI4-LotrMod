l_english:
 GOB_raid_and_pillage:0 "Raid and Pillage"
 GOB_raid_and_pillage_desc:0 "Why bother with honest toil when the soft-skinned folk above ground have so much to offer? A quick raid, a few smashed skulls, and our bellies are full, our treasuries jingling."
 GOB_trade_and_profit:0 "Trade and Profit"
 GOB_trade_and_profit_desc:0 "Our 'negotiators' have been sent to assure our neighbors that we are, in fact, open for business. And by 'business,' we mean whatever lines our coffers."
 GOB_war_profiteering:0 "War Profiteering"
 GOB_war_profiteering_desc:0 "The whispers of war echoing from above are music to our ears. While fools fight for land and glory, we shall sell them the very tools of their destruction, growing rich on their folly."
 GOB_the_high_pass_tolls:0 "The High Pass Tolls"
 GOB_the_high_pass_tolls_desc:0 "What a splendid inconvenience for the surface-dwellers! The High Pass is ours, and its gates now open only for those willing to part with a substantial 'transit fee'."
 GOB_labor_of_the_deeps:0 "Labor of the Deeps"
 GOB_labor_of_the_deeps_desc:0 "The mountain's bounty does not simply present itself. It must be clawed and chiseled from the very rock, demanding the tireless (and often reluctant) efforts of our deep-dwelling workforce."
 GOB_above_and_between:0 "Above and Between"
 GOB_above_and_between_desc:0 "No goblin enjoys manual labor, but even we acknowledge that 'less likely to collapse' is a desirable feature for our vital thoroughfares. A few more props and some stern words will make these routes, 'above and between' the caverns, almost safe."
 GOB_wealth_driven_ventures:0 "Wealth Driven Ventures"
 GOB_wealth_driven_ventures_desc:0 "Ooooh! Look at the shiny...! Mhh... I need more shiny... Yes... More."
 GOB_secure_the_kings_hold:0 "Secure the King's Hold"
 GOB_secure_the_kings_hold_desc:0 "With the wealth-driven ventures now underway, it is time to formalize the King's control over the deeps. New factories shall rise from the rock, and all profits flow upwards."
 GOB_fix_politics:0 "Fix Politics"
 GOB_fix_politics_desc:0 "The endless squabbling of the Tunnel Lords impedes progress and profit. It is time to enforce a more 'streamlined' political structure, ensuring the King's vision of wealth is unimpeded."
 GOB_fix_research:0 "Fix Research"
 GOB_fix_research_desc:0 "Our 'scholars' mostly just poked shiny things with sticks. A more... organized approach to 'discovery' is now being implemented."
 GOB_fix_military:0 "Fix Military"
 GOB_fix_military_desc:0 "The horde is vast, but disorganized. A little discipline, some sharper rusty blades, and perhaps fewer goblins accidentally hitting themselves with clubs will go a long way."
 GOB_crack_down_on_the_clans:0 "Crack Down on the Clans"
 GOB_crack_down_on_the_clans_desc:0 "For too long, the various clans have hoarded their spoils and disregarded the central rule. It is time to make them understand that all wealth ultimately flows from the King."
 GOB_silence_the_tunnel_lords:0 "Control the Tunnel Lords"
 GOB_silence_the_tunnel_lords_desc:0 "A little 'reorganization' is in order. Some of the most influential Tunnel Lords have simply... misplaced their mouths. And their heads. Nothing to see here, just improved communication."
 GOB_defensive_measures:0 "Defensive Measures"
 GOB_defensive_measures_desc:0 "The mountain echoes with warnings of approaching foes. Our tunnels, our very homes, must be secured. It's an unpleasant task, but one that ensures the continued, albeit miserable, existence of our kin."
 GOB_prepare_the_choke_points:0 "Prepare the Choke Points"
 GOB_prepare_the_choke_points_desc:0 "They come from the light, clumsy and loud. We will show them the true meaning of a choke point, where rock meets their foolish heads."
 GOB_lay_the_stonework:0 "Lay the Stonework"
 GOB_lay_the_stonework_desc:0 "More walls? Ugh. Fine, but make them thick, not pretty. We'll simply pile enough rock to make any intruder wonder if their treasure is worth the effort of digging through."
 GOB_emergency_muster_protocols:0 "Emergency Muster Protocols"
 GOB_emergency_muster_protocols_desc:0 "When the threat grows undeniable, we have a simple system: kick the nearest goblin and tell them to find two more. Desperate times call for desperate measures, and plenty of warm bodies."
 GOB_food_stores:0 "Food Stores"
 GOB_food_stores_desc:0 "The mountain's heart can shelter us from many foes, but not from the gnawing pangs of hunger. Securing ample food stores is as crucial as forging weapons for the battles to come."
 GOB_stockpile_scrap_and_stone:0 "Stockpile Scrap and Stone"
 GOB_stockpile_scrap_and_stone_desc:0 "One goblin's trash is another goblin's future helmet. Our industrious workers scour the tunnels, salvaging anything that might serve. We may not have grand forges, but we have mountains of sharp, jagged, and heavy things ready to be thrown at intruders."
 GOB_survey_the_collapse_points:0 "Survey the Collapse Points"
 GOB_survey_the_collapse_points_desc:0 "Crunch, smash, boom! Every tunnel has a breaking point. Our finest tunnel-lords will apply themselves to finding the best places for making things fall down, very quickly, and on someone else's head."
 GOB_emergency_measures:0 "Emergency Measures"
 GOB_emergency_measures_desc:0 "More work? More fighting? Ugh. But if we don't, they'll take our stuff! Our precious, shiny stuff! Perhaps a small, *temporary* boost to morale and leadership might persuade the rabble to actually *do* something."
 GOB_undaunted_defense:0 "Undaunted Defense"
 GOB_undaunted_defense_desc:0 "Goblins! Will you let them take your tunnels?! Your Shinies?!"
 GOB_sound_the_horns_wake_the_guards:0 "Sound the Horns, Wake the Guards!"
 GOB_sound_the_horns_wake_the_guards_desc:0 "Intruders! Intruders! Wake up your lazy slugs and drive them out!"
 GOB_collapse_the_side_shafts:0 "Collapse the Side Shafts"
 GOB_collapse_the_side_shafts_desc:0 "The invaders have delved too deeply into our domain. The time has come to bring the very mountain down upon them, collapsing the side shafts to seal their fate."
 GOB_factory_conversion:0 "Factory Conversion"
 GOB_factory_conversion_desc:0 "You there! Stop wasting time sewing clothes! We need more sharp things!"
 GOB_bar_the_gate_tunnels:0 "Levy the People"
 GOB_bar_the_gate_tunnels_desc:0 "The enemy shall perish under a relentless wave of goblin flesh!"
 GOB_tunnel_ambushes:0 "Tunnel Ambushes"
 GOB_tunnel_ambushes_desc:0 "Why meet them in fair combat when the tunnels offer so many opportunities for... an 'unfair' advantage? Let them stumble, let them get lost, then we strike."
 GOB_let_them_starve:0 "Underground Forges"
 GOB_let_them_starve_desc:0 "Our enemies will find no sustenance in these deep places. Every passing day, their resolve will rot faster than their rations. The mountains claim all who are unprepared."
 GOB_strike_from_the_dark:0 "Strike from the Dark"
 GOB_strike_from_the_dark_desc:0 "They have invaded our home, but the true battle is yet to begin. We shall hound them, harass them, and wear them down until their will to fight is broken, and their supplies are naught but dust."
 GOB_rouse_the_rabble:0 "Rouse the Rabble"
 GOB_rouse_the_rabble_desc:0 "Our 'volunteers' from the lower depths are ready. Or, at least, they are being prodded in the right direction. Let the foe choke on the sheer, desperate tide of Goblin Town's common folk."
 GOB_break_the_first_wave:0 "Break the First Wave"
 GOB_break_the_first_wave_desc:0 "Let the invaders come! Our pikes are sharp, our teeth sharper, and the tunnels echo with the hungry snarls of our kin. They will learn that our home is not easily breached."
 GOB_fortress_under_the_mountains:0 "Fortress Under the Mountains"
 GOB_fortress_under_the_mountains_desc:0 "More picks! More sweat! More miserable, back-breaking labor! The King has declared every vital passage a fortress, and woe betide any goblin who doesn't pull their weight. We will make these walls so thick, even we couldn't tunnel out if we wanted to."
 GOB_snaga_work_gangs:0 "Snaga Work Gangs"
 GOB_snaga_work_gangs_desc:0 "Our more expendable kin make for excellent, cheap labor. A few lashes and a grimy crust of bread are all they need to keep the tunnels expanding and the workshops churning."
 GOB_squeeze_the_tunnels:0 "Squeeze the Tunnels"
 GOB_squeeze_the_tunnels_desc:0 "With our workforce now adequately 'motivated', it is time to turn their relentless efforts to the very rock beneath our feet. The mountain must be squeezed for every last ounce of its precious metals."
 GOB_strip_the_mountain_bare:0 "Strip the Mountain Bare"
 GOB_strip_the_mountain_bare_desc:0 "Resource scarcity is a myth whispered by weak surface-dwellers. We shall delve deeper, rip and tear through the very rock itself, until every last ounce of worth is brought to light."
 GOB_no_rest_in_the_dark:0 "No Rest in the Dark"
 GOB_no_rest_in_the_dark_desc:0 "The ceaseless clang of pickaxes and shovels reverberates through our domain. The tunnels never truly sleep, and it is time our laborers followed suit."
 GOB_wake_the_sluggards:0 "Wake the Sluggards"
 GOB_wake_the_sluggards_desc:0 "Some might call it 'forced labor.' We simply call it 'persuading the little runts to finally earn their keep.' Either way, the picks will swing faster now."
 GOB_nothing_goes_to_waste:0 "Nothing Goes to Waste"
 GOB_nothing_goes_to_waste_desc:0 "Every broken pickaxe, every gnawed-off bone, every fallen warrior have a use. Efficiency dictates that nothing, absolutely nothing, goes to waste in the Great Goblin's domain."
 GOB_from_rock_to_blade:0 "From Rock to Blade"
 GOB_from_rock_to_blade_desc:0 "It turns out that hitting things with a *sharp* rock is more effective than a dull one. Our smiths are finally catching on, learning to transform raw ore into proper tools for raiding and war."
 GOB_jagged_blades:0 "Jagged Blades"
 GOB_jagged_blades_desc:0 "Why waste time on intricate designs when a shard of metal tied to a stick works just as well? And faster!"
 GOB_repair_the_rickety_bridges:0 "Repair the Rickety Bridges"
 GOB_repair_the_rickety_bridges_desc:0 "The sound of snapping wood and plummeting goods is becoming too frequent. Patching up the most egregious hazards in our underground network is a necessary evil to keep the tunnels flowing."
 GOB_topside_hunting:0 "Topside Hunting"
 GOB_topside_hunting_desc:0 "Our subterranean stores dwindle, and the deep places offer little. We must brave the blinding light of the surface world to hunt for vital food and sustenance."
 GOB_hammer_and_chain:0 "Hammer and Chain"
 GOB_hammer_and_chain_desc:0 "More bangs and clangs mean more sharp bits and pointy sticks for our boys. Who needs finesse when you have quantity and sheer, unadulterated goblin fury? The King demands more, and the tunnels provide."
 GOB_relight_the_forges:0 "Relight the Forges"
 GOB_relight_the_forges_desc:0 "The ancient forges of our mountain home have gathered dust for too long. It is time to relight their fires and let the smoke billow anew."
 GOB_meat_for_the_warclans:0 "Meat for the Warclans"
 GOB_meat_for_the_warclans_desc:0 "Our hunters bring good news from the surface: meat is plentiful! The warclans shall dine heartily, ready to carve their own feasts from our enemies."
 GOB_supply_the_tunnels:0 "Supply the Tunnels"
 GOB_supply_the_tunnels_desc:0 "After years of lost shipments and 'accidental' cave-ins, the main tunnels are finally, properly supplied. The King's own goods will no longer vanish into the dark, presumably."
 GOB_cut_army_rations:0 "Cut Army Rations"
 GOB_cut_army_rations_desc:0 "Food is a luxury the deep tunnels cannot always afford. Our warriors are tough; a little hunger merely sharpens their resolve, or so we tell them."
 GOB_clear_the_deep_shafts:0 "Clear the Deep Shafts"
 GOB_clear_the_deep_shafts_desc:0 "Further into the dark we delve! Fresh air is overrated, but new building space is not."
 GOB_construction_crews:0 "Construction Crews"
 GOB_construction_crews_desc:0 "Foreman Boggrott's new 'motivational techniques' are certainly effective. The screams from the work crews are quite inspiring, and construction has never been faster!"
 GOB_charcoal_production:0 "Charcoal Production"
 GOB_charcoal_production_desc:0 "From the sparse forests clinging to the mountain slopes to forgotten tunnels of dead wood, every bit of combustible matter shall be turned into the fuel that drives our industry."
 GOB_fill_the_stores:0 "Fill the Stores"
 GOB_fill_the_stores_desc:0 "The gnawing emptiness of goblin bellies threatens the King's reign. Every scrap, every mushroom, every dubious morsel must be hoarded to keep the masses from unrest."
 GOB_enforced_austerity:0 "Enforced Austerity"
 GOB_enforced_austerity_desc:0 "Food is a precious commodity within our deep tunnels. To ensure our warriors are fed and our stores remain robust, our civilian population must learn to endure leaner times. A few grumbles are a small price to pay for security."
 GOB_population_growth:0 "Population Growth"
 GOB_population_growth_desc:0 "We can squeeze the army's rations dry, or we can choose to feed our populace and watch our numbers grow. A choice for the future, not just the present squabble."
 GOB_subterranean_workshops:0 "Subterranean Workshops"
 GOB_subterranean_workshops_desc:0 "The incessant scraping and hammering of picks and chisels echo through the newly widened caverns. New 'labor camps' (or as the Overseers call them, 'subterranean workshops') are established to meet the growing demands."
 GOB_increase_centralization:0 "Increase Centralization"
 GOB_increase_centralization_desc:0 "A single, iron-fisted authority is needed to tame the unruly Goblin-kin. The time for petty clan rivalries is over; the time for unified, unquestioning obedience is now."
 GOB_restore_the_high_pass:0 "Restore the High Pass"
 GOB_restore_the_high_pass_desc:0 "Our 'engineers' have assured us that a few more broken backs will greatly increase the flow of traffic above. Efficiency is key to maximizing profits from the surface dwellers."
 GOB_antagonize_rhudaur_and_gladden:0 "Antagonize Rhudaur and Gladden"
 GOB_antagonize_rhudaur_and_gladden_desc:0 "The men of Rhudaur and the men of Gladden have always eyed each other with suspicion. Now, we shall give them reason to act upon it, and watch the blood and gold flow."
 GOB_open_for_business:0 "Open for Business"
 GOB_open_for_business_desc:0 "The High Pass is a bottleneck of tremendous value. It is time we capitalize on its strategic importance by offering passage to all who can afford our 'reasonable' tolls."
 GOB_send_an_offer_to_rhudaur:0 "Send an Offer to Rhudaur"
 GOB_send_an_offer_to_rhudaur_desc:0 "The wild men of Rhudaur yearn for conquest, and the Gladdeners make for easy pickings. Our High Pass offers the shortest route, for a reasonable toll, of course."
 GOB_increase_the_tolls:0 "Increase the Tolls"
 GOB_increase_the_tolls_desc:0 "The upkeep of these magnificent tunnels is truly staggering! Naturally, those who benefit from our tireless efforts must contribute more."
 GOB_send_an_offer_to_gladden:0 "Send an Offer to Gladden"
 GOB_send_an_offer_to_gladden_desc:0 "A most advantageous business proposition for the Gladden men: passage through our mountains, directly into Rhudaur's lands. All it requires is a hefty fee and a promise to cause absolute mayhem on the other side."
 GOB_retain_control_over_the_high_pass:0 "Retain Control Over the High Pass"
 GOB_retain_control_over_the_high_pass_desc:0 "Outsiders have their uses, but not when it comes to *our* mountain passes. This vital artery remains under our vigilant, enriching control."
 GOB_improve_high_pass_economy:0 "Improve High Pass Economy"
 GOB_improve_high_pass_economy_desc:0 "From the deep tunnels beneath the High Pass, our industrious horde shall carve out new workshops and barracks."
 GOB_send_out_the_clans:0 "Prepare the Clans"
 GOB_send_out_the_clans_desc:0 "The mountain passes are rife with small, isolated settlements. Our clans will be dispatched to 'collect' the bounties they undoubtedly hold for the King."
 GOB_burn_and_take:0 "Burn and Take"
 GOB_burn_and_take_desc:0 "Our new Treasurer, Tuitolb, has a simple philosophy: if it glitters, take it. If it resists, burn it. If it burns, take what's left."
 GOB_daring_raid_on_imladris:0 "Daring Raid on Imladris"
 GOB_daring_raid_on_imladris_desc:0 "Those soft-skinned elves, lost in their songs and trees, will never suspect a swift, decisive strike from the depths. They'll be too busy admiring their own reflections."
 GOB_gold_for_peace:0 "Gold for Peace"
 GOB_gold_for_peace_desc:0 "Let it be known far and wide that the Goblins of the Misty Mountains are a peace-loving folk. So long as that peace is annually renewed with a generous 'gift' of shiny things."
 GOB_hostage_taking:0 "Hostage Taking"
 GOB_hostage_taking_desc:0 "The surface folk will learn to fear our shadow. We shall take their kin as easily as their coin, ensuring their compliance or their despair."
 GOB_open_the_black_markets:0 "Open the Black Markets"
 GOB_open_the_black_markets_desc:0 "The labyrinthine passages of Goblin Town are already a hub of illicit dealings. It's time to officially 'liberalize' our shadowy economy."
 GOB_anyone_with_coin_welcome:0 "Anyone With Coin Welcome"
 GOB_anyone_with_coin_welcome_desc:0 "From the darkest depths of Mordor to the secretive enclaves of Men, if they carry coin, they are welcome. What they trade, and for what purpose, is of little concern to the Goblin King."
 GOB_secure_high_demand_goods:0 "Secure High Demand Goods"
 GOB_secure_high_demand_goods_desc:0 "Our tunnels may be dark, but our eyes are keen. We must discover what the 'tall-folk' and 'stunties' truly covet."
 GOB_the_greenwood_expedition:0 "The Greenwood Expedition"
 GOB_the_greenwood_expedition_desc:0 "The whispers of valuable spider's silk from the Greenwood have reached even our deep tunnels. Whether for bows, instruments, or some arcane elven craft, such treasures will surely fetch a fine price in the right markets."
 GOB_the_bree_expedition:0 "The Bree Expedition"
 GOB_the_bree_expedition_desc:0 "Bree has leather. We need leather. The path is clear. Send the raiding parties."
 GOB_sabotage_the_competition:0 "Sabotage the Competition"
 GOB_sabotage_the_competition_desc:0 "A true merchant knows that the quickest way to the top is to make sure everyone else trips on the way up."
 GOB_arms_for_coin:0 "Arms for Coin"
 GOB_arms_for_coin_desc:0 "Our subterranean workshops are not just for our own defense. There is coin to be made in the wars of others, and we shall not let such opportunities pass us by."
 GOB_soldiers_for_hire:0 "Soldiers for Hire"
 GOB_soldiers_for_hire_desc:0 "Our tunnels echo with idle boasts and the clatter of rusty blades. Let those with deeper pockets pay for the privilege of our 'finest' warriors."
 GOB_feed_the_war:0 "Feed the War"
 GOB_feed_the_war_desc:0 "The surface world's endless squabbles are proving remarkably profitable. Let them fight their grand wars. We'll simply supply the jagged blades and rusty armor to whoever pays best."
 GOB_war_loot:0 "War Loot"
 GOB_war_loot_desc:0 "Our brave lads bring back more than just tales of glory; they bring back piles of shiny things, useful scrap, and anything else not nailed down."
 GOB_send_out_the_boys:0 "Send Out the Boys"
 GOB_send_out_the_boys_desc:0 "Why fight our own wars when others are so willing to pay for our particular brand of 'persuasion'? The boys are ready, let the contracts roll in!"
 GOB_fear_before_gold:0 "Fear Before Gold"
 GOB_fear_before_gold_desc:0 "Some say a goblin's loyalty can be enforced. We say it can be bought."
 GOB_the_king_takes_his_cut:0 "The King Takes His Cut"
 GOB_the_king_takes_his_cut_desc:0 "“For the continued prosperity and glory of Goblin Town,” announced the King, as a fresh wave of collectors were dispatched, “it is only fair that the crown receives its justly deserved recompense.”"
 GOB_cash_in_interest:0 "Cash in Interest"
 GOB_cash_in_interest_desc:0 "All those little workshops, all that incessant digging and clanging... it adds up! The Tunnel Lords have decided it's time to rip a fat slice right out of the mountain's belly for more useful endeavors."
 GOB_political_consolidation:0 "Political Consolidation"
 GOB_political_consolidation_desc:0 "For too long, internal divisions have splintered our strength and distracted from the real work of enrichment. With the major clans now firmly in line, our path forward is clear."
 GOB_foreign_policy:0 "Foreign Policy"
 GOB_foreign_policy_desc:0 "The rumblings from outside the mountain can no longer be ignored. Our isolation, once a shield, now feels like a cage. It is time to gaze upon the world, lest it fall upon us."
 GOB_neutral:0 "Neutral"
 GOB_neutral_desc:0 "Aligning ourselves with anyone seems like an awful lot of work, and we already have our hands full keeping the Grumbles and the Snarlfangs from murdering each other. Let us simply be."
 GOB_pro_sauron:0 "Pro-Sauron"
 GOB_pro_sauron_desc:0 "I mean... If we are to ally ourselves with someone... Wouldn't the big scary immortal eye with endless armies and ringwraiths be a pretty good bet?"
 GOB_unhinged:0 "Goblin Mode"
 GOB_unhinged_desc:0 "Fortune favors the bold!"
 GOB_goblin_scribes:0 "Goblin Scribes"
 GOB_goblin_scribes_desc:0 "Step 1: Write down anything important you may need to remember later. Step 2: Learn to read so you can remember what step 1 was again."
 GOB_explosive_excavation:0 "Explosive Excavation"
 GOB_explosive_excavation_desc:0 "Our engineers have embraced the glorious potential of blasting powder. More rock for the taking, fewer limbs for the keeping, probably."
 GOB_new_research_slot:0 "New Research Slot"
 GOB_new_research_slot_desc:0 "We've found a particularly intelligent goblin in our midst. Word has it he can write! And read! He shall be our newest 'researcher'."
 GOB_exercise_mandates:0 "Exercise Mandates"
 GOB_exercise_mandates_desc:0 "Only through ceaseless drills and the constant threat of being eaten by the next rank will our warriors gain the necessary grit to face the surface-dwellers."
 GOB_leader_selection:0 "Leader Selection"
 GOB_leader_selection_desc:0 "A new wave of 'talent' must rise to command our legions. This process invariably involves some shuffling of the dead, but the strong will always climb to the top."
 GOB_tunnel_warfare:0 "Tunnel Warfare"
 GOB_tunnel_warfare_desc:0 "Our sprawling, subterranean network is not merely our home, but our fortress. We will teach any surface-dweller foolish enough to invade the true horrors of cramped, close-quarters combat."
 GOB_purchase_new_knowledge:0 "Purchase New Knowledge"
 GOB_purchase_new_knowledge_desc:0 "Okay, enough of this 'reading' thing. Can't we just pay someone else to do this for us...?"
 GOB_continued_profit_flow:0 "Continued Profit Flow"
 GOB_continued_profit_flow_desc:0 "Maintaining a neutral path is simply good for business."
 GOB_non_aggression_pacts:0 "Non-Aggression Pacts"
 GOB_non_aggression_pacts_desc:0 "Formalizing our lack of immediate hostilities is a simple matter of paperwork. It is simply good business to ensure the surface-dwellers don't disturb our delving."
 GOB_war_provocations:0 "War Provocations"
 GOB_war_provocations_desc:0 "There is profit to be found in war. But if we are to fight the surface dwellers, woult it not be to wise to let them come to us?"
 GOB_receive_aid_from_mordor:0 "Receive Aid from Mordor"
 GOB_receive_aid_from_mordor_desc:0 "A long-overdue delivery from the East has arrived. It seems even Sauron recognizes the value of having allies deep within the mountains, especially allies who know how to keep their tunnels clear of troublesome folk."
 GOB_rally_mountain_stragglers:0 "Rally Mountain Stragglers"
 GOB_rally_mountain_stragglers_desc:0 "The Dark Lord's shadow falls long across the mountains. His whispers stir even the most isolated and savage tribes, drawing them from their hidden lairs to serve a greater, crueler purpose."
 GOB_war_against_rhudaur:0 "War Against Rhudaur"
 GOB_war_against_rhudaur_desc:0 "Sending skirmishers for a few trinkets? Childish! Why raid when we can take everything? Rhudaur's entire domain is ripe for the taking, and our hordes are hungry."
 GOB_war_against_gladden:0 "War Against Gladden"
 GOB_war_against_gladden_desc:0 "Enough with petty raids and tolls! The Gladden Fields hold far more than mere trinkets; they hold potential for an empire. Let the war-gongs sound!"
 GOB_mountain_empire:0 "Mountain Empire"
 GOB_mountain_empire_desc:0 "Our tunnels are merely the foundation. The whole of the Misty Mountains, from its deepest crags to its highest peaks, shall soon pay tribute to the Great Goblin!"
GOB_repurpose_old_equipment:0 "Repurpose Old Equipment"
 GOB_repurpose_old_equipment_desc:0 "Why waste good materials when there's plenty of scrap to be had? We'll salvage what we can, patch it up with grit and grime, and call it 'refurbished' for the next batch of unwilling recruits."

 GOB_mercs_capstone:0 "Mercenary Profits"
 GOB_mercs_capstone_desc:0 "Our mercenaries have been busy, and we are all the better for it!"

 GOB_trade_capstone:0 "Trade Profits"
 GOB_trade_capstone_desc:0 "Top-siders are buying our stuff, and we are all the better for it!"