l_english:
##### Event 
anduin.1.t:0 "[From.GetName] demands the north"
anduin.1.d:0 "[From.GetName] has been talking about our Northern territories for long. Saying that they wanted to expand towards east. They have made there demands today. Are we ready for war?"
anduin.1.a:0 "There is nothing we can do."
anduin.1.b:0 "War there will be!"
anduin.100.t:0 "Bartering with the Spiders"

anduin.100.desc:0 "The Spiders of the Mirkwood are a constant menace to our east, and our population cannot sleep soundly while this threat persists.\n\nThe Great Spiders are primarily after one thing alone: food. If we can offer them some of our livestock, perhaps we can come to some form of agreement. But what shall we ask in return?"

anduin.100.a:0 "Offer them food in return for peace."

anduin.101.t:0 "[FROM.GetName] Ask for a Deal"

anduin.101.desc:0 "A delicious-looking two-legged stumbled into our nest. Our broodmothers found enough restraint not to devour him immediately, for he brought a curious proposal from the west: [FROM.GetName] will offer us some of their livestock, if we, in turn, promise to keep our brood under control and not encroach on their territory."

anduin.101.a:0 "Accept"

anduin.102.t:0 "[FROM.GetName] Ask for a Deal"
anduin.102.desc:0 "A delicious-looking two-legged stumbled into our nest. Our broodmothers found enough restraint not to devour him immediately, for he brought a curious proposal from the west: [FROM.GetName] will offer us some of their livestock if we provide them some of our precious silk in return."

anduin.102.a:0 "Accept"
anduin.103.t:0 "Spiders Accept Our Proposal"

anduin.103.desc:0 "The Spiders of the Mirkwood have accepted our proposal. They have promised to keep a tight leash on their brood and not encroach on our territory."

anduin.103.a:0 "Who knew that diplomacy with spiders was possible?"

anduin.104.t:0 "The Spiders Refuse"

anduin.104.desc:0 "The Spiders of the Mirkwood have rebuffed our proposal."

anduin.104.a:0 "Alas, the sleepless nights continue..."

anduin.105.t:0 "Spiders Accept Our Proposal"

anduin.105.desc:0 "The Spiders of the Mirkwood have accepted our proposal. They will henceforth provide us with some of their valuable silk, which can be used for fabrics, bowstrings, and more."

anduin.105.a:0 "Excellent."

anduin.106.t:0 "The Spiders Refuse"
anduin.106.desc:0 "The Spiders of the Mirkwood have rebuffed our proposal."

anduin.106.a:0 "Alas, the sleepless nights continue..."

anduin.100.b:0 "We could use some of their precious silk. Offer them livestock for it."

anduin.101.b:0 "Refuse"

anduin.102.b:0 "Refuse"

anduin.107.t:0 "Growing Bolder"

anduin.107.desc:0 "In recent years, we have strengthened our defenses and bolstered our forces. With our realm now secure from the threats that once besieged us, the time has come to address past wrongs and reclaim lands that were once ours.\n\nWhich territory shall we lay claim to?"

anduin.107.a:0 "The western parts of the Mirkwood are rightfully our homes."

anduin.107.b:0 "The Gladden Fields are a vital extension of our land."

anduin.107.c:0 "The mountain of Amon Lanc is crucial for our long-term defense."

anduin.108.t:0 "Riders from the Chiefdoms of Gladden arrive"

anduin.108.desc:0 "From the vales of the Great River Anduin, where the land of Éothéod once lay and our ancestors made their home, we receive messengers from the Chiefdoms of Gladden.\n\nIn recognition of our enduring kinship and shared heritage, they have dispatched a band of skilled riders to bolster our war effort."

anduin.108.a:0 "Their support is most welcome!"

anduin.109.t:0 "Chiefdoms of Gladden Request an Heir"

anduin.109.desc:0 "The Chiefdoms of Gladden, located around the northern shores of the mighty Anduin, the Éothéod, where the ancestors of the Rohirrim once dwelt, seek to establish a united kingdom.\n\nTo strengthen their claim, they desire an heir of Eorl's bloodline to become their monarch. How shall we respond to their plea?"

anduin.109.a:0 "We support this noble cause. Send Éowyn, the King's own niece, to ascend the throne."

anduin.110.t:0 "Rohan Sends Éowyn"

anduin.110.desc:0 "Rohan stands with us in our quest for a new kingdom and has sent King Théoden's own niece, Éowyn, to claim our throne. Her presence not only legitimizes our rule but also forges a strong bond between our peoples."

anduin.110.a:0 "Long live the Queen!"

anduin.111.t:0 "Rohan Refuses"

anduin.111.desc:0 "The Kingdom of Rohan has declined our request to provide an heir of Eorl descent. In the absence of their support, we are compelled to establish a new line of kings, born from our own people."

anduin.111.a:0 "So be it!"

anduin.109.b:0 "Select a distant relative of the King and send him forthwith..."

anduin.109.c:0 "Eorl's blood will remain in Rohan."

anduin.112.t:0 "Rohan Sends Dernfa"

anduin.112.desc:0 "King Théoden of Rohan, acknowledging our ambition to form a kingdom founded on the Eorl lineage, has dispatched Dernfa, a member of the royal kin by blood. While not of direct lineage, his presence cements a symbolic union with the Rohirrim."

anduin.112.a:0 "Long live the King?"

anduin.113.t:0 "Chiefdoms of Gladden Request Elven Bows"

anduin.113.desc:0 "The Chiefdoms of Gladden, dwellers of the vales by the mighty Anduin, have humbly asked if we might share the art of crafting the superior longbows of the Elves with them."

anduin.113.a:0 "Very well. Send some bowcrafters to teach them."

anduin.114.t:0 "Mirkwood Elves Accept"

anduin.114.desc:0 "The noble Elves of the Mirkwood have graciously agreed to our entreaty, dispatching a cadre of skilled bowcrafters to teach us to fashion their renowned longbows."

anduin.114.a:0 "These will prove most valuable..."

anduin.115.t:0 "Mirkwood Elves Refuse"

anduin.115.desc:0 "In these uncertain times, the Mirkwood Elves, wary of future threats, have declined to share the secrets of their Elven longbows with us."

anduin.115.a:0 "What a disappointment."

anduin.113.b:0 "And what if they decide to use them against us?!"

anduin.116.t:0 "The Chiefdoms of Gladden Seek a War Loan"

anduin.116.desc:0 "The Chiefdoms of Gladden, our neighbors to the east of the Misty Mountains, are preparing for war. In their ambitious quest to unite the Vales of Anduin under their banner, they have turned to us, seeking a loan to fund their costly military endeavors. Shall we grant them the wealth they seek?"

anduin.116.a:0 "Yes, let us extend them the loan."

anduin.117.t:0 "Goblin Town Provides the Loan"

anduin.117.desc:0 "The goblins of Goblin Town have agreed to extend the loan, providing a substantial sum to finance our war efforts. We are to repay the debt with spoils gained from our conquests."

anduin.117.a:0 "Very well, let the war begin."

anduin.118.t:0 "Goblin Town Refuses the Request"

anduin.118.desc:0 "The goblins of Goblin Town have refused to provide the requested funds to us, leaving us to find other means of support."

anduin.118.a:0 "Indeed, a disappointment."

anduin.116.b:0 "Too great a risk!"

anduin.119.t:0 "Beornings Propose a Trade of Steel for Grain"

anduin.119.desc:0 "The Beornings, residing in the Vales of the Anduin, have come forth with a proposition. They wish to exchange their abundant grain for our precious steel. This trade could strengthen bonds between our peoples."

anduin.119.a:0 "A mutually beneficial arrangement."

anduin.120.t:0 "Dwarves Accept the Trade"

anduin.120.desc:0 "The Dwarves of Erebor have graciously agreed to our trade proposal. Soon, their sturdy carts will arrive laden with steel, and in return, they shall receive regular supplies of our abundant grain."

anduin.120.a:0 "Excellent."

anduin.121.t:0 "Dwarves Decline the Trade"

anduin.121.desc:0 "The Dwarves of Erebor have regrettably turned down our offer to trade grain for their steel."

anduin.121.a:0 "Unfortunate."

anduin.122.t:0 "Vales of Anduin Request Support!"

anduin.122.desc:0 "The Beornings, who dwell in the Vales of the Anduin, are locked in fierce battle with the orcs of Gundabad. They turn to us now, seeking our aid in their dire struggle."

anduin.122.a:0 "Dispatch a host of our warriors to their aid!"

anduin.123.t:0 "Erebor Sends Aid"

anduin.123.desc:0 "The Dwarves of Erebor have heeded our plea for aid and have sent a stout-hearted contingent of their warriors to bolster our forces in this perilous war."

anduin.123.a:0 "Their assistance is greatly appreciated!"

anduin.124.t:0 "Erebor Sends Supplies"

anduin.124.desc:0 "The Dwarves of Erebor, responding to our call, have dispatched a vital shipment of weapons and armor to strengthen our efforts against the orcish threat."

anduin.124.a:0 "It's better than nothing."

anduin.125.t:0 "A Divided Moot"

anduin.125.desc:0 "To address the severe food shortages and looming famine caused by the disastrous harvest, a Great Moot has been summoned. All the major clan leaders have traveled to the capital to discuss the future of the Vales.\n\nWith the recent troubles, the tribes have never been more divided. Grimbeorn's leadership is openly questioned, and his hesitation is seen by many as senility. This internal weakness comes at a perilous time: on our frontiers, the Orcs of Gundabad and the Spiders of Mirkwood are stirring. They will surely seize any opportunity to strike if they sense our resolve wavering."

anduin.125.a:0 "The foremost priority is to make food available again."
anduin.122.b:0 "Provide them with arms and armor."

anduin.122.c:0 "We cannot spare any resources for them."

anduin.119.b:0 "We have need of all the steel we possess."

anduin.125.b:0 "The Gundabad orcs are our most urgent threat. Bolster the defenses."

anduin.125.c:0 "We must ensure we do not look weak. Silence the rumors."

anduin.126.t:0 "The Erebor Relief"

anduin.126.desc:0 "A massive caravan from the Lonely Mountain has arrived at the Old Ford. Hearing of our plight, the Dwarves have brought wagons laden with grain and salted meats. However, in these lean times, charity is rare; the Dwarven merchants demand immediate payment in silver or timber at inflated "crisis" rates before they will unload a single sack.\n\nThe Vales' Elders insists we honor the ancient laws of commerce and guest-right, even if it empties the treasury. But the hungry crowds gathering around the wagons are eyeing the guards with dangerous intent."

anduin.126.a:0 "The pacts of old cannot feed the starving. Take it all by force."

anduin.127.t:0 "Peasant Riots"

anduin.127.desc:0 "The construction of the new border forts continues, but the cost has been high. To man these remote outposts facing Gundabad, local magistrates have begun forced conscription of farmers and herders.\n\nThis has sparked outrage in the central Vales. A mob of angry fathers and sons has gathered, refusing to march north. They cite the ancient rights of the free, claiming that Beornings fight only when they choose, not when ordered. The military leadership demands these rioters be broken and sent to the wall, while the traditionalists argue that a forced army is no army at all."

anduin.127.a:0 "Enforce Martial Law. The Wall must be manned."

anduin.128.t:0 "Imminent coup"

anduin.128.desc:0 "Over the last months our realm has suffered terrible division and the situation has gradually deteriorated. Trust in our leadership is at an all time low, and the rumors of plots and coups have never been louder.\n\nWhat color tomorrow's dawn shall have will be decided by whose side's knives are longer."

anduin.128.a:0 "It is out of our hands now."

anduin.126.b:0 "We are Beornings, not bandits. Pay them."

anduin.126.c:0 "Promise to pay them back later."

anduin.127.b:0 "We cannot force them."

anduin.129.t:0 "Nature Fails"

anduin.129.desc:0 "The year begins with an ominous silence. The great bees of the Vales are dying. A strange, black mold has overtaken the hives, and the cattle are birthing stillborn calves.\n\nGrimbeorn the Old, usually seen as the master of the land, attempts the old rituals to heal the earth, but they fail. The people begin to whisper that his bear spirit has grown too old and weak to protect the Vales. \n\nA disasterous harvest yields little to eat, and famine looms on the horizon."

anduin.129.a:0 "Call a moot immediately! We must decide how to deal with this crisis."

anduin.130.t:0 "Orc Raid on Greylin"

anduin.130.desc:0 "A small Orc incursion has raided across the border, testing our defenses and finding them wanting. While the damage was minimal, the humiliation was great. Grimbeorn's leadership is once again called into question, and the Moot is more divided than ever.\n\nTwo voices rise above the clamor. Skalor, representing the southern tribes, argues that the Woodmen on the Gladden Fields possess plenty of food, and that we should simply seize it. Frothkar, leader of the mountain clans, finds this proposition absurd and weak. He urges a preemptive strike on Gundabad, boasting of how his people have survived worse in the peaks.\n\nWords turn to insults, and a violent brawl breaks out between the two men in the center of the hall."

anduin.130.a:0 "Skalor is a rabid dog. Chain him."

anduin.130.b:0 "Frothkar's warmongering will doom us. Silene him."

anduin.130.c:0 "Enough! We are Beornings!"

anduin.131.t:0 "Granaries Run Empty"

anduin.131.desc:0 "Our borders are secure and the new fortifications stand strong against the Orcs, but stone walls cannot fill bellies. The harvest has failed completely, and the granaries are bare.\n\nThe Council of Elders urges strict rationing and spiritual patience, but hunger makes men desperate. Skalor stands before the Moot, violently interrupting the Elders. He points south to the Woodmen settlements along the river, claiming they grow fat while Beornings starve. He calls the Elders "corpses waiting to die" and demands we take what we need by force."

anduin.131.a:0 "Skalor is right. Weakness is death."

anduin.131.b:0 "The Elders speak wisdom. We endure."

anduin.131.c:0 "Exile Skalor for his insolence."

anduin.132.t:0 "Whispers of Betrayal"

anduin.132.desc:0 "The strict crackdown on information has secured our reputation abroad, but at home, it has bred paranoia. The Vales have become a place of spies and hushed conversations.\n\nFrothkar of the Mountain Clans has seized upon this atmosphere of suspicion. He stands before the Moot and openly accuses the Council of Elders of treason. He claims that the "gray-beards" have been secretly communicating with the Elves of Mirkwood, begging for aid and offering the independence of the Vales in exchange for food.\n\nHe demands the Moot be purged of these traitors immediately to ensure our security."

anduin.132.a:0 "The Elders are traitors. Purge them."

anduin.132.b:0 "Frothkar sees shadows where there are none."

anduin.132.c:0 "Let them fight it out."

anduin.133.t:0 "Envoys From Gladden"

anduin.133.desc:0 "Our silence has been noticed. A delegation from the Chiefdoms of Gladden has arrived at our borders. They are confused by the closed roads and the lack of trade. \n\nIn this atmosphere of paranoia, their arrival is viewed with deep suspicion. Are they truly friends, or are they spies sent to gauge our weakness?"

anduin.133.a:0 "Imprison them as spies"

anduin.133.b:0 "Turn them back. We stand alone."

anduin.133.c:0 "Let them know about the food shortages."

anduin.134.t:0 "Raid from the North"

anduin.134.desc:0 "The Beornings of the northern vales of the Anduin, our historic allies and neighbors, find themselves in dire straits following a disastrous harvest.\n\nOn the brink of famine, they have resorted to desperate measures. Today, a band of their kin crossed into our lands, pillaging our granaries and making off with much-needed provisions."

anduin.134.a:0 "This transgression cannot be tolerated!"

anduin.135.t:0 "The Beornings of the Anduin Request Relief"

anduin.135.desc:0 "The Beornings, who inhabit the northern vales of the Anduin, have endured a poor harvest and find themselves teetering on the edge of starvation.\n\nIn their hour of need, they turn to us for aid, imploring us to send a shipment of food with a promise of eventual reimbursement."

anduin.135.a:0 "Dispatch a wagon laden with grain and salted meat."

anduin.136.t:0 "Beornings Go Silent"

anduin.136.desc:0 "The Beornings of the vales, our northern neighbors, have recently fallen eerily silent. Diplomatic exchanges have ceased, and merchants find their paths blocked at the border.\n\nWhispers among our people suggest the Beornings are facing dire food shortages and conceal their plight to mask vulnerability, thus deterring any unwelcome aggressors."

anduin.136.a:0 "Dispatch scouts to uncover the truth of their silence."

anduin.137.t:0 "Seizure of Our Provisions by the Beornings"

anduin.137.desc:0 "We have recently extended a hand of friendship by sending a shipment of food to assist the Beornings of the northern vales of the Anduin in their time of need.\n\nYet, instead of gratitude, they have taken our provisions by force and now refuse to render payment!"

anduin.137.a:0 "Unacceptable! Cease all trade with these scoundrels!"

anduin.138.t:0 "Gratitude from the Beornings"

anduin.138.desc:0 "The Beornings, dwellers of the northern vales of the Anduin, have gratefully repaid the kindness we extended to them.\n\nAfter sending them much-needed sustenance amidst their dire shortages, they have honored their word and compensated us in full for the assistance given."

anduin.138.a:0 "Happy to help."

anduin.139.t:0 "Delays in Payment from the Beornings"

anduin.139.desc:0 "The Beornings of the northern vales of Anduin, recently beneficiaries of our generous food aid during their time of scarcity, have now informed us of their inability to send the agreed-upon payment at this time.\n\nThey pledge to fulfill their obligation at a later date."

anduin.139.a:0 "How ungrateful they prove to be."

anduin.134.b:0 "Their plight is grave. Let us overlook this misdeed."

anduin.140.t:0 "Scouts Held Captive by the Beornings"

anduin.140.desc:0 "It is with great dismay that we learn our scouts, dispatched to uncover the reasons behind the eerie silence from the Beornings of the northern vales, have been captured.\n\nRather than finding answers, they have been accused of espionage by the suspicious Beornings."

anduin.140.a:0 "We had no ill intent. How dare they?"

anduin.141.t:0 "Suspicion in the Northern Vales"

anduin.141.desc:0 "The scouts we dispatched to the north, tasked with understanding the curious silence of the Beornings, have returned with reports of being intercepted and turned away by vigilant Beorning patrols.\n\nTheir reaction hints at a growing mistrust or fearfulness that has taken root among them."

anduin.141.a:0 "It seems the Beornings have become paranoid."

anduin.142.t:0 "The Beornings' Plight"

anduin.142.desc:0 "Our scouts, sent to uncover the reasons behind the Beornings' unusual silence, have returned with dire news. Their lands have been stricken by a disastrous harvest, leaving them in the grip of a severe famine. The Beornings, known for their strength and valor, now face a trial of survival."

anduin.142.a:0 "Oh... Too bad!"

anduin.137.b:0 "Their desperation is great. We shall overlook this transgression."

anduin.140.b:0 "In such perilous times, their caution is understandable."

anduin.142.b:0 "We can spare some food for them..."

anduin.144.t:0 "Civil War Strikes!"

anduin.144.desc:0 "Our lands are beset by treachery and upheaval. Grimbeorn the Old, our esteemed leader, has been brutally assassinated alongside several other venerable elders, leaving a void in our leadership.\n\nNow, two contenders rise to claim the mantle: Skalor, the southern clan leader, and Frothkar, the resolute mountain man from the icy reaches of Forodwaith. In this time of division, we must choose our allegiance. Which leader shall we follow into the uncertain future?"

anduin.144.a:0 "Pledge our loyalty to Skalor!"

anduin.145.t:0 "Elders Force Grimbeorn into Retirement"

anduin.145.desc:0 "Tensions within our realm have reached a breaking point, with whispers of plots and coups troubling even the most steadfast of hearts. In hopes of restoring balance and calm, the esteemed leaders of several clans have convened a council, compelling Grimbeorn to step down and relinquish his leadership."

anduin.145.a:0 "May the council lead us wisely."

anduin.146.t:0 "The Usurpation of Skalor"

anduin.146.desc:0 "The winds of change have swept through our lands. In a tumult of betrayal and ambition, Skalor, the warlord from the southern reaches, has seized power, unseating Grimbeorn from his rightful place.\n\nNow, Skalor reigns supreme over the northern vales, intent on imposing his will with an iron fist. What lies ahead for the people of the Vales under his rule remains uncertain."

anduin.146.a:0 "Let us hope for the best."

anduin.147.t:0 "Frothkar Seizes Control"

anduin.147.desc:0 "In the midst of a tumultuous night, as shadows of betrayal and ambition loomed over our realm, one figure rose from the chaos and asserted dominance.\n\nFrothkar, a man rumored to be as unyielding as the stones of the northern mountains, has rallied his clans to establish rule over the northern vales. He has eliminated his chief adversaries, including Grimbeorn and Skalor, solidifying his grasp on power."

anduin.147.a:0 "May his rule be one of strength and wisdom."

anduin.144.b:0 "Stand with Frothkar, the man of stone!"

anduin.148.t:0 "[VAL.GetName] Seeks a Pact"

anduin.148.desc:0 "The Beornings of the northern Anduin come forth with a proposition: a substantial payment shall be ours, should we vow to leave them unscathed. It seems they harbor designs to expand southward..."

anduin.148.a:0 "Agree to the non-aggression pact."

anduin.149.t:0 "Terms Accepted by Gundabad"

anduin.149.desc:0 "The Orcs of Gundabad have acceded to our terms, accepting payment in exchange for peace."

anduin.149.a:0 "This shall grant us a respite."

anduin.150.t:0 "Pact Rejected by Gundabad"

anduin.150.desc:0 "The Orcs of Gundabad have turned away our offer of recompense for peace."

anduin.150.a:0 "Alas, our western flank remains vulnerable."

anduin.148.b:0 "We have no interest in peace with them."
