l_english:
 ######################################
 lotr_generic.1.t:0 "[FROM.GetName] claims our state of [?event_target:target_claimed_state.GetName]"
 lotr_generic.1.d:0 "In an audacious declaration, [FROM.GetName] has claimed sovereignty over the state of [?event_target:target_claimed_state.GetName]. Whether if their claim is rooted in historical ties, strategic interests, or mere opportunism, it is clear that they have no intention of backing down from this assertion."
 lotr_generic.1.a:0 "Outrageous!"
 lotr_generic.1.b:0 "Perhaps we can work out a deal?"
 lotr_generic.1.b_tooltip:0 "Propose to give [FROM.GetName] full resource rights in [?event_target:target_claimed_state.GetName]. In return [FROM.GetName] will withdraw their claim and enact a non-aggression pact with us."
 lotr_generic.1.c:0 "Give it up. This is not worth fighting over."
 ######################################
 lotr_generic.2.t:0 "[FROM.GetName] seeks to work out a compromise regarding [?event_target:target_claimed_state.GetName]"
 lotr_generic.2.d:0 "[FROM.GetName] has taken notice of our claimed territory and propose a diplomatic solution.\n They will grant us full access to all resources in [?event_target:target_claimed_state.GetName], but keep the state itself under their control.\n\nIn return they want us to withdraw our territorial claim and sign a pact of non-aggression with them."
 lotr_generic.2.a:0 "This is acceptable."
 lotr_generic.2.b:0 "What an absurd proposition!"
 ######################################
 lotr_generic.3.t:0 "[FROM.GetName] accepts our deal"
 lotr_generic.3.d:0 "[FROM.GetName] accepts our deal and withdraws their claim on our territory."
 lotr_generic.3.a:0 "Crisis averted."
 ######################################
 lotr_generic.4.t:0 "[FROM.GetName] declines our deal"
 lotr_generic.4.d:0 "[FROM.GetName] rejects our proposition and insists that [?event_target:target_claimed_state.GetName] belongs to them."
 lotr_generic.4.a:0 "If they can't be reasoned with, let's do it the hard way..."
 ######################################
 lotr_generic.5.t:0 "[FROM.GetName] hands over [?event_target:target_claimed_state.GetName]"
 lotr_generic.5.d:0 "[FROM.GetName] acknowledges our claim to their territory and, hoping to avoid conflict, hand it over in return for a pact of non-aggression."
 lotr_generic.5.a:0 "They reek of fear."
 ######################################
 lotr_gambler.1.t:0 "Our treasurer makes a masterful investment"
 lotr_gambler.1.d:0 "Our treasurer has made a wise investment on behalf of the state. The funds have been secured in a profitable venture and it is expected to yield a substantial return. \n\nIn total, we will receive an estimated [?THIS.investment_gambler_factor|%] consumer goods for 120 days."
 lotr_gambler.1.a:0 "Excellent."
 lotr_gambler.1.b:0 "Give this man a raise!"
 ######################################
 lotr_gambler.2.t:0 "Our treasurer makes a catastrophic mistake"
 lotr_gambler.2.d:0 "Our Treasurer's most recent investment has proven to be a catastrophic failure. Despite being assured of its potential for substantial returns, the venture has resulted in a significant loss of the kingdom's funds. \n\nIn total, it is estimated this mismanagement will cost us [?THIS.investment_gambler_factor|%] consumer goods for 120 days."
 lotr_gambler.2.a:0 "This blunder will cost us dearly..."
 lotr_gambler.2.b:0 "Attempt to mitigate the situation immediately!"
 lotr_gambler.2.b.tooltip:0 "Reduces the consumer goods debuff by §Y2%§!."
 lotr_gambler.2.c:0 "That fool! Off with his head!"
 ######################################
 lotr_generic.6.t:0 "Diplomatic delegation arrives from [FROM.GetName]"
 lotr_generic.6.d:0 "A delegation of diplomats has arrived from [FROM.GetName]. Their presence at our court provides a moment of potential alliance and diplomacy. With formal greetings exchanged, it is up to us to decide how to respond."
 lotr_generic.6.a:0 "Shower them with gifts and banquets."
 lotr_generic.6.b:0 "Provide them the common courtesies."
 lotr_generic.6.c:0 "They're not welcome here."
 ######################################
 lotr_generic.7.t:0 "[FROM.GetName] seeks exile"
 lotr_generic.7.d:0 "Our ally, [FROM.GetName], has recently fallen to the enemy. Their leadership now turns to us, hoping to continue the fight from the safety of our realm."
 lotr_generic.7.a:0 "We will harbour them in these dark times."
 lotr_generic.7.b:0 "Turn them away."
 ######################################
 lotr_generic.8.t:0 "[From.GetName] seeks to join the [Root.GetFactionName]"
 lotr_generic.8.d.a:0 "In the face of increasing threats to liberty and cooperative values, the [alliance_applicant.GetAdjective] look to us as the defenders of freedom. They now wish to be admitted into our alliance, both to enjoy our protection and to stand with us against the forces that would threaten freedom."
 lotr_generic.8.d.b:0 "Our plight to overturn the current world order has not escaped the notice of like-minded nations. The [alliance_applicant.GetAdjective] recognize that their best chance to carve out a prosperous future for themselves is to align with us in the coming conflict, and they have therefore offered to formally join us against our enemies."
 lotr_generic.8.d.c:0 "[alliance_applicant.GetName] has recognized that she must band together with fellow-minded people to strengthen the place of the common people in the world. Accepting our leading role in the international plight of the worker, the [alliance_applicant.GetAdjective] now request to formally enter into an alliance with us."
 lotr_generic.8.d.e:0 "As the current upheavals in international politics continue to reverberate through the world, the [alliance_applicant.GetAdjective] have deemed us to be their greatest chance of surviving these tumultuous times. They therefore request to be admitted into our alliance, so that we may weather the coming storm together."
 lotr_generic.8.a:0 "All who stand for liberty may stand with us."
 lotr_generic.8.b:0 "The world belongs to all who are strong!"
 lotr_generic.8.c:0 "We stand together."
 lotr_generic.8.e:0 "And weather it, we shall!"
 lotr_generic.8.f:0 "We are better off without them."
 lotr_generic.8.g:0 "We already have the allies we need."
 ######################################
 lotr_generic.9.t:0 "[alliance_inviter.GetName] welcomes us to the [alliance_inviter.GetFactionName]"
 lotr_generic.9.d:0 "[alliance_inviter.GetName] has decided to accept our request to join the [alliance_inviter.GetFactionName]. Henceforth we shall stand or fall together."
 lotr_generic.9.a:0 "Together we shall defend liberty."
 lotr_generic.9.b:0 "None can stand against us!"
 lotr_generic.9.c:0 "The workers' plight could not ask for finer champions!"
 lotr_generic.9.e:0 "We shall set our differences aside, for now."
 ######################################
 lotr_generic.10.t:0 "[alliance_inviter.GetName] denies request to join the [alliance_inviter.GetFactionName]"
 lotr_generic.10.d:0 "[alliance_inviter.GetName] has decided to reject our request to join the [alliance_inviter.GetFactionName]. We will have to make do without their help."
 lotr_generic.10.a:0 "They call themselves defenders of liberty?"
 lotr_generic.10.b:0 "Then we will crush them, too!"
 lotr_generic.10.c:0 "Unfortunate!"
 lotr_generic.10.e:0 "Our differences were too great."
 ######################################
 lotr_generic.11.t:0 "[From.GetName] invites [Root.GetName] to the [From.GetFactionName]"
 lotr_generic.11.d.a:0 "With a suspicious eye on recent developments in world politics, [alliance_inviter.GetName] extends us their hand of friendship, offering us their protection and urging us to stand with them in defence of the principles of liberty and democracy. As a member of the [alliance_inviter.GetFactionName], our people's freedom may well be safeguarded."
 lotr_generic.11.d.b:0 "Recognizing that sometimes even the strong need allies, the [alliance_inviter.GetAdjective] have invited us to join the [alliance_inviter.GetFactionName]. If we choose to accept, this may well provide ample opportunity for us to find our place in the sun."
 lotr_generic.11.d.c:0 "Our ideological allies in [alliance_inviter.GetName] have made note of our valuable contributions to the workers' cause, and this morning we received an invitation us to join the [alliance_inviter.GetFactionName]. Standing together with other socialist republics, we could spread the revolution with renewed strength."
 lotr_generic.11.d.e:0 "It appears the [alliance_inviter.GetAdjective] consider us to be of strategic interest to them, and that they deem it more profitable that we work together than that we should let ourselves be divided by our ideological differences. This morning, the [alliance_inviter.GetAdjective] Ambassador delivered an invitation for us to become a member state of the [alliance_inviter.GetFactionName]."
 lotr_generic.11.a:0 "We will make our stand with them."
 lotr_generic.11.b:0 "We only need a few thousand dead..."
 lotr_generic.11.c:0 "We will fight alongside our comrades!"
 lotr_generic.11.e:0 "It is the profitable choice."
 ######################################
 lotr_generic.12.t:0 "[alliance_applicant.GetName] accepts invitation to the [alliance_inviter.GetFactionName]"
 lotr_generic.12.d:0 "[alliance_applicant.GetName] has decided to accept our offer to join the [alliance_inviter.GetFactionName]. Henceforth we shall stand or fall together."
 ######################################
 lotr_generic.13.t:0 "[alliance_applicant.GetName] rejects offer to join the [alliance_inviter.GetFactionName]"
 lotr_generic.13.d:0 "[alliance_applicant.GetName] has decided to reject our offer to join the [alliance_inviter.GetFactionName]. We will have to make do without their help."
 lotr_generic.13.a:0 "Our help is not wanted."
 ######################################
 lotr_generic.13.t:0 "[FROM.GetName] asks for a non-aggression pact"
 lotr_generic.13.d:0 "[FROM.GetName] has requested a non-aggression pact with us. They claim that such an agreement would be beneficial for both our nations, as it would ensure peace and stability in the region."
lotr_generic.13.d_bell:0 "[FROM.GetName] has requested a non-aggression pact with us. Mutual peace could ensure strategic flanks and free up troops to fight on other fronts."
 lotr_generic.13.a:0 "Peace will benefit us both."
 lotr_generic.13.b:0 "They can't be trusted."
 ######################################
 lotr_generic.14.t:0 "[FROM.GetName] accepts our non-aggression pact"
 lotr_generic.14.d:0 "[FROM.GetName] has accepted our offer of a non-aggression pact. This agreement will ensure peace and stability in the region."
lotr_generic.14.d_bell:0 "[FROM.GetName] has accepted our offer of a non-aggression pact. This agreement will ensure strategic flanks and free up troops to fight on other fronts."
 lotr_generic.14.a:0 "Very well."
 ######################################
 lotr_generic.15.t:0 "[FROM.GetName] rejects our non-aggression pact"
 lotr_generic.15.d:0 "[FROM.GetName] has rejected our offer of a non-aggression pact. It seems they are not interested in peace and stability in the region."
 lotr_generic.15.d_bell:0 "[FROM.GetName] has rejected our offer of a non-aggression pact. It seems they are not interested in strategic flanks or freeing up troops to fight on other fronts."
 lotr_generic.15.a:0 "Suspicious."
 lotr_generic.100.t:0 "[FROM.GetName] Seeks Guarantees"

 lotr_generic.100.desc:0 "A messenger from [FROM.GetName] has arrived bearing a solemn plea. Concerned for their sovereignty in these turbulent times, they implore us for assurances of protection. They hope we shall grant them peace of mind with our pledge."

lotr_generic.100.desc_bell:0 "A messenger from [FROM.GetName] has arrived with a pragmatic request. Acknowleding our supremacy, they seek our protection in these turbulent times. They hope we shall grant them security with our pledge."

 lotr_generic.100.a:0 "We will offer our protection."

 lotr_generic.101.t:0 "[FROM.GetName] Pledges Protection"

 lotr_generic.101.desc:0 "Our envoys have returned with triumphant news. [FROM.GetName] stands ready to ensure our independence, backed by the formidable force of their armies."

 lotr_generic.101.a:0 "Let us hope they stick by their commitments!"

 lotr_generic.102.t:0 "[FROM.GetName] Denies Our Entreatment"

 lotr_generic.102.desc:0 "Our emissaries bring disheartening news. [FROM.GetName] has declined our appeal for protection. Solitude marks our path as we must now fend for ourselves."

 lotr_generic.102.a:0 "Alas, it was not to be."

 lotr_generic.100.b:0 "We must turn them away."

 lotr_generic.103.t:0 "[FROM.GetName] Seeks to Become Our Vassal"

 lotr_generic.103.desc:0 "A missive has arrived from [FROM.GetName]. In the shadow of looming threats from their belligerent neighbors, they plead for our guardianship. They propose to become a tributary, under the condition of maintaining control over their own foreign dealings."
lotr_generic.103.desc_bell:0 "[FROM.GetName] recongizes our potential and supremacy. They hope to benefit from our protection by becoming a tributary, while retaining control over their own foreign dealings."

 lotr_generic.103.a:0 "Take them under our wing."

 lotr_generic.104.t:0 "Alliance with [FROM.GetName] Forged"

 lotr_generic.104.desc:0 "[FROM.GetName] has graciously accepted our terms of vassalage. We now rest under their protection as an autonomous tributary, pledging tribute in exchange for their protection, yet retaining their own diplomatic rights."

 lotr_generic.104.a:0 "Good news!"

 lotr_generic.105.t:0 "[FROM.GetName] Denies Our Offer"

 lotr_generic.105.desc:0 "[FROM.GetName] has chosen a path separate from ours, refusing our overture of a tributary alliance."

 lotr_generic.105.a:0 "We must stand strong on our own!"

 lotr_generic.103.b:0 "Let them fend on their own."

 lotr_generic.106.t:0 "[FROM.GetName] Seeks Alliance"

 lotr_generic.106.desc:0 "Alone in a world filled with dangers, [FROM.GetName] reaches out with a proposal to unite our forces. Together, as allies of equal standing, we could face any threats that may arise."
lotr_generic.106.desc_bell:0 "[FROM.GetName] has recognized our hunger for glory and conquest. They share our vision of a world dominated by the strong, and they propose to join forces with us as an equal ally. Together, we could crush any who stand in our way."

 lotr_generic.106.a:0 "Such a union shall strengthen us."

 lotr_generic.107.t:0 "[FROM.GetName] Joins Our Cause"

 lotr_generic.107.desc:0 "Our proposition has been warmly received by [FROM.GetName]. Now, under a shared banner, we march forward as one."

 lotr_generic.107.a:0 "To our new alliance!"

 lotr_generic.108.t:0 "[FROM.GetName] Refuses Our Offer"

 lotr_generic.108.desc:0 "The plea for shared strength was turned away by [FROM.GetName]. Our paths shall diverge for now."

 lotr_generic.108.a:0 "A missed opportunity."

 lotr_generic.106.b:0 "We shall seek alliances elsewhere."

 lotr_generic.109.t:0 "[FROM.GetName] Proposes Mutual Guarantees"

 lotr_generic.109.desc:0 "[FROM.GetName] comes forth with a proposition: They shall ensure the security of our realm, provided we extend the same assurance to them.\n\nShall we accept this pact of mutual protection?"

 lotr_generic.109.a:0 "This benefits both of us."

 lotr_generic.110.t:0 "[FROM.GetName] Accepts Our Offer"

 lotr_generic.110.desc:0 "[FROM.GetName] has agreed to our proposal of mutual guarantees of independence. Henceforth, should either of us face aggression, the other shall lend their full military support."

 lotr_generic.110.a:0 "Very well."

 lotr_generic.111.t:0 "[FROM.GetName] Rejects Our Proposal"

 lotr_generic.111.desc:0 "[FROM.GetName] has declined our offer of a shared commitment to mutual defense. In times of strife, we shall stand alone."

 lotr_generic.111.a:0 "Uh oh."

 lotr_generic.109.b:0 "We don't require their backing."

 lotr_generic.112.t:0 "[FROM.GetName] Offers 'Protection'"

 lotr_generic.112.desc:0 "[FROM.GetName] approaches us with a proposition veiled as an offer of protection.\n\nObserving our precarious military standing, they propose to shield us from any looming threats. However, this so-called protection comes at a great cost: the surrendering of significant authority over our internal matters, a heavy tribute, and the stationing of their forces within our borders.\n\nIn essence, they seek to make us their vassal state. How shall we respond to this audacious proposal?"

 lotr_generic.112.a:0 "Accept their terms."

 lotr_generic.113.t:0 "[FROM.GetName] Accepts"

 lotr_generic.113.desc:0 "[FROM.GetName] has wisely chosen to kneel and accept the status of vassalage. They shall now be under our dominion and protection."

 lotr_generic.113.a:0 "Very good."

 lotr_generic.114.t:0 "[FROM.GetName] Refuses"

 lotr_generic.114.desc:0 "[FROM.GetName] has rejected our offer to become a vassal under our protection and authority."

 lotr_generic.114.a:0 "Their loss."

 lotr_generic.112.b:0 "This is an absurd proposition!"

 lotr_generic.115.t:0 "[FROM.GetName] Demands Our Subjugation"

 lotr_generic.115.desc:0 "The emissaries of [FROM.GetName] have arrived with a grave demand: they seek our submission, wishing for us to kneel and accept their dominion as their vassal state.\n\nTo refuse these terms is to court peril. Shall we forsake our freedom for peace, or stand resolute in defiance?"

 lotr_generic.115.a:0 "We will bow down to [FROM.GetName]."

 lotr_generic.116.t:0 "[FROM.GetName] Submits to Our Rule"

 lotr_generic.116.desc:0 "[FROM.GetName] has come to terms with the reality they face and, recognizing our power, have chosen the path of wisdom by accepting our overlordship. \n\nFrom this day forth, they shall serve under our banner as a loyal vassal."

 lotr_generic.116.a:0 "A wise choice"

 lotr_generic.117.t:0 "[FROM.GetName] Stands Defiant"

 lotr_generic.117.desc:0 "In a bold gesture of defiance, [FROM.GetName] has rejected our demand for vassalage, choosing instead to uphold their independence.\n\nTheir resolve is admirable, yet foolish."

 lotr_generic.117.a:0 "Fools!"

 lotr_generic.115.b:0 "We will not bow to them!"

 lotr_generic.118.t:0 "[FROM.GetName] Demands Our Subjugation"

 lotr_generic.118.desc:0 "The emissaries of [FROM.GetName] have arrived with a grave demand: they seek our submission, wishing for us to kneel and accept their dominion as their vassal state.\n\nTo refuse these terms is to court peril. Shall we forsake our freedom for peace, or stand resolute in defiance?"

 lotr_generic.118.a:0 "We will bow down to [FROM.GetName]."

 lotr_generic.119.t:0 "[FROM.GetName] Stands Defiant"

 lotr_generic.119.desc:0 "In a bold gesture of defiance, [FROM.GetName] has rejected our demand for vassalage, choosing instead to uphold their independence.\n\nTheir resolve is admirable, yet foolish."

 lotr_generic.119.a:0 "Fools!"

 lotr_generic.118.b:0 "We will not bow to them!"

 lotr_generic.120.t:0 "[FROM.GetName] Demands [target_state.GetName]"

 lotr_generic.120.desc:0 "[FROM.GetName] has approached us with a steadfast demand for the control of the land known as [target_state.GetName].\n\nTo refuse may bring about dire repercussions, yet the decision to relinquish our territory is not to be made lightly. Shall we yield to their claim, or shall we stand firm?"

 lotr_generic.120.a:0 "Relinquish the territory."

 lotr_generic.121.t:0 "[FROM.GetName] Concedes [target_state.GetName]"

 lotr_generic.121.desc:0 "With a discerning eye on the shifting winds of fate, [FROM.GetName] has chosen to concede to our claim and has granted us control over [target_state.GetName]."

 lotr_generic.121.a:0 "A wise decision."

 lotr_generic.122.t:0 "[FROM.GetName] Stands Defiant"

 lotr_generic.122.desc:0 "In an act of defiance, [FROM.GetName] has resolutely refused to yield control over the land of [target_state.GetName]."

 lotr_generic.122.a:0 "Such folly!"

 lotr_generic.120.b:0 "We shall not yield."

 lotr_generic.123.t:0 "[FROM.GetName] Demands [target_state.GetName]"

 lotr_generic.123.desc:0 "[FROM.GetName] has approached us with a steadfast demand for the control of the land known as [target_state.GetName].\n\nTo refuse may bring about dire repercussions, yet the decision to relinquish our territory is not to be made lightly. Shall we yield to their claim, or shall we stand firm?"

 lotr_generic.123.a:0 "Relinquish the territory."

 lotr_generic.124.t:0 "[FROM.GetName] Stands Defiant"

 lotr_generic.124.desc:0 "In an act of defiance, [FROM.GetName] has resolutely refused to yield control over the land of [target_state.GetName]."

 lotr_generic.124.a:0 "Such folly!"

 lotr_generic.123.b:0 "We shall not yield."

 lotr_generic.125.t:0 "[FROM.GetName] Seeks Our Aid"

 lotr_generic.125.desc:0 "A missive has arrived from [FROM.GetName], beseeching us for aid in their time of war. They request any resources we can muster to aid their struggle."

 lotr_generic.125.a:0 "Supply them with weapons and gear!"

 lotr_generic.126.t:0 "[FROM.GetName] send supplies"

 lotr_generic.126.desc:0 "[FROM.GetName] has sent us a shipment of supplies, including food, weapons and armor."

 lotr_generic.126.a:0 "Appreciated!"

 lotr_generic.127.t:0 "[FROM.GetName] Offers Aid Through Counsel"

 lotr_generic.127.desc:0 "A missive from [FROM.GetName] has reached us, bearing words of encouragement and solidarity. While their means are limited and tangible aid is scarce, they extend their knowledge of warfare and heartfelt wishes for our triumph."

 lotr_generic.127.a:0 "Thoughts and prayers?"

 lotr_generic.128.t:0 "Border Dispute With [FROM.GetName]"

 lotr_generic.128.desc:0 "A grievous skirmish has erupted on our border with [FROM.GetName]. Our scouts inform us that [FROM.GetName] perpetrated an audacious raid upon our civilian settlements, prompting a swift and fierce response from our defenders. The encounter has spiraled out of control, resulting in extensive damage.\n\nFurthermore, [FROM.GetName]'s response is laced with hostility and veiled threats. It appears that they may seek to draw us into open conflict, yet standing down would entail a heavy toll on our pride and honor."

 lotr_generic.128.a:0 "Order the guard to stand down. We cannot afford a war."
 lotr_generic.125.b:0 "Offer our best wishes and dispatch seasoned military advisors."

 lotr_generic.125.c:0 "Alas, we can spare nothing from our own stores."

 lotr_generic.129.t:0 "Attempted War Provocation Fails"

 lotr_generic.129.desc:0 "The agitation caused by our orchestrated incident on [FROM.GetName]'s border has indeed stirred unrest. Alas, [FROM.GetName] has not risen to the bait, and thus, conflict remains averted."

 lotr_generic.129.a:0 "Their failure to respond will impair their standing among their folk."

 lotr_generic.130.t:0 "Attempted War Provocation Succeeds"

 lotr_generic.130.desc:0 "The uproar ensuing from our carefully devised incident on [FROM.GetName]'s border has not gone unnoticed. Reports suggest [FROM.GetName] is gathering a considerable host, evidently intent on seeking retribution."

 lotr_generic.130.a:0 "Let them bring forth their wrath!"

 lotr_generic.128.b:0 "This affront shall not stand! Muster the banners. We must safeguard our people."

 lotr_generic.131.t:0 "[FROM.GetName] suggests inviting [invite_target.GetName]"

 lotr_generic.131.desc:0 "Our ally, [FROM.GetName] believes that [invite_target.GetName] could be a worthy ally to our cause, and suggests inviting them to our faction."

 lotr_generic.131.a:0 "A good idea."

 lotr_generic.131.b:0 "We don't need them."

 lotr_generic.132.t:0 "[FROM.GetName] Mobilizes for War"
 lotr_generic.132.desc:0 "The scouts report that [FROM.GetName] is mobilizing their forces in preparation for war. It seems they are preparing to strike at us, and we must be ready to defend ourselves."
 lotr_generic.132.a:0 "To arms!"

lotr_generic.133.t:0 "Diplomatic Relations With [FROM.GetName] Collapse"

lotr_generic.133.desc:0 "Our ties with [FROM.GetName] have strained to the point of breaking. Their envoys have made repeated, outrageous demands, frequently bordering on the edge of an insult. It has become clear that they are not engaging in good faith, and have taken to purposely antagonize us."

lotr_generic.133.a:0 "Our list of enemies grows..."
 lotr_generic.15.a:0 "Suspicious."


 lotr_generic_tooltip_they_will_receive:0 "\n§OIf they accept, they will receive the following§!"
 lotr_generic_tooltip_we_will_receive:0 "\n§OIf they accept, we will receive the following§!"
 lotr_generic_tooltip_they_will_gain:0 "They will §Ggain§! the following:"
