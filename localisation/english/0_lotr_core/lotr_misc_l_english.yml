SUBDOCTRINE_precision_longbowmen_DESC:0 "Elite longbowmen trained for accuracy and deadly volleys at range."
SUBDOCTRINE_crossbow_levies_DESC:0 "Easily trained crossbowmen, cheap to equip and simple to replenish."
SUBDOCTRINE_mass_volley_fire_DESC:0 "Overwhelm the enemy with coordinated volleys rather than individual precision."
SUBDOCTRINE_elusive_skirmishers_DESC:0 "Light, mobile archers skilled at harassing and disrupting enemy formations."
SUBDOCTRINE_archer_lines_integration_DESC:0 "Archers fighting alongside infantry, supporting melee units directly."
SUBDOCTRINE_mobile_archers_DESC:0 "Mounted archers capable of rapid movement and hit-and-run attacks."
SUBDOCTRINE_hybrid_infantry_sidearms_DESC:0 "Archers equipped with sidearms, ready to fight as infantry if needed."

SUBDOCTRINE_shock_chargers_DESC:0 "Hold cavalry in reserve for decisive charges, breaking enemy lines with devastating force."
SUBDOCTRINE_flanking_maneuvers_DESC:0 "Employ cavalry for swift flanking maneuvers, encircling foes and sowing panic."
SUBDOCTRINE_infantry_support_DESC:0 "Deploy cavalry alongside infantry to provide direct, tactical battlefield support."
SUBDOCTRINE_knightly_orders_DESC:0 "Elite armored horsemen trained for decisive combat and battlefield dominance."
SUBDOCTRINE_mobile_infantry_DESC:0 "Use light cavalry and carriages for rapid deployment and flexible battlefield movement."
SUBDOCTRINE_flex_chariot_skir_DESC:0 "Employ nimble chariots to exploit both mobility and tactical flexibility on the battlefield."
SUBDOCTRINE_weight_and_power_DESC:0 "Use heavily armored units to smash through enemy lines with brute force and momentum."

SUBDOCTRINE_battlefield_artillery_DESC:0 "Employ catapults and other siege engines to bombard enemy formations from a distance."
SUBDOCTRINE_big_machines_DESC:0 "Rely on massive siege towers, fortifications, and other war machines to dominate the battlefield."
SUBDOCTRINE_army_support_DESC:0 "Enhance the army with ballistas and other support equipment to aid frontline troops."
SUBDOCTRINE_basic_infarmy_support_DESC:0 "Focus on logistics, communications, and craftsmanship to keep the army supplied and coordinated."
SUBDOCTRINE_special_forces_DESC:0 "Deploy elite units trained for specialized roles in challenging terrain or missions."
SUBDOCTRINE_stealth_and_sabotage_DESC:0 "Conduct infiltration and sabotage operations to disrupt the enemy behind their lines."
SUBDOCTRINE_strange_creatures_DESC:0 "Utilize fantastical creatures to exploit their unique strengths in battle."
SUBDOCTRINE_heavy_infantry_focus_DESC:0 "Field elite, heavily armored infantry to break enemy lines and hold the frontline."
SUBDOCTRINE_expeditionary_warfare_DESC:0 "Organize forces for campaigns abroad, projecting power far from home territory."

SUBDOCTRINE_militia_mobilization_DESC:0 "Raise large numbers of peasants into basic troops to overwhelm the enemy through sheer numbers."
SUBDOCTRINE_meat_wall_DESC:0 "Pack soldiers tightly into narrow frontlines, trading mobility for raw manpower and defensive depth."
SUBDOCTRINE_guerilla_warfare_DESC:0 "Harass and disrupt the enemy with hit-and-run attacks, ambushes, and unpredictable maneuvers."
SUBDOCTRINE_relentless_assault_DESC:0 "Push troops into constant offensive pressure, wearing down the enemy through sheer persistence."
SUBDOCTRINE_shield_wall_DESC:0 "Form disciplined defensive lines that absorb attacks while remaining flexible on the battlefield."
SUBDOCTRINE_pikemen_phallanx_DESC:0 "Advance in slow, dense formations that are resistant to frontal attacks but vulnerable to flanking."
SUBDOCTRINE_flexible_and_cheap_DESC:0 "Use simple, cost-effective troops and tactics to conserve resources for critical operations."
SUBDOCTRINE_combined_arms_core_DESC:0 "Coordinate infantry, cavalry, archers, and siege engines into a harmonious, versatile fighting force."
SUBDOCTRINE_light_skirmishers_DESC:0 "Deploy mobile, lightly equipped troops to exploit terrain and engage in flexible harassment tactics."
SUBDOCTRINE_men_at_arms_DESC:0 "Rely on well-trained, highly capable warriors skilled in multiple forms of combat."

SUBDOCTRINE_sea_doctrine_coastal_defense_DESC:0 "Fortify and defend our shores against enemy attacks and amphibious landings."
SUBDOCTRINE_sea_doctrine_boarding_and_ramming_DESC:0 "Engage enemy vessels in close combat using boarding parties and ramming tactics."
SUBDOCTRINE_sea_doctrine_deep_sea_galleys_DESC:0 "Adapt galleys for long-range operations in open seas, extending their traditional coastal role."
SUBDOCTRINE_sea_doctrine_swarm_tactics_DESC:0 "Overwhelm enemies by deploying large numbers of small, fast, and expendable ships."
SUBDOCTRINE_sea_doctrine_unsinkable_fortresses_DESC:0 "Build massive, heavily armed ships that dominate through sheer size and firepower."
SUBDOCTRINE_sea_doctrine_operational_flexibility_DESC:0 "Maintain a versatile fleet capable of responding to any naval challenge."
SUBDOCTRINE_sea_doctrine_naval_invasions_DESC:0 "Project power ashore by landing troops and securing enemy coasts."
SUBDOCTRINE_sea_doctrine_naval_air_defense_DESC:0 "Equip ships to defend against enemy air attacks and protect fleet integrity."
SUBDOCTRINE_sea_doctrine_naval_command_hierarchy_DESC:0 "Ensure disciplined crews and efficient command structures for maximum fleet effectiveness."
SUBDOCTRINE_sea_doctrine_naval_escorts_DESC:0 "Protect trade and supply lines from enemy raids and piracy."
SUBDOCTRINE_sea_doctrine_deep_sea_hunters_DESC:0 "Send small, elite squadrons on long-range raids to strike where enemies cannot respond."
SUBDOCTRINE_sea_doctrine_pirate_raiders_DESC:0 "Focus on elusive, fast ships to raid, plunder, and disrupt enemy commerce."

SUBDOCTRINE_air_subdoctrine_deep_bombing_DESC:0 "Use eagles and fell beasts to strike enemy strongholds and disrupt production from above."
SUBDOCTRINE_air_subdoctrine_battlefield_assistance_DESC:0 "Deploy air units to support our troops directly, harrying enemies and tipping battles in our favor."
SUBDOCTRINE_air_subdoctrine_flexible_support_DESC:0 "Keep our flying forces versatile, ready to engage in multiple roles as the battle demands."
SUBDOCTRINE_air_subdoctrine_naval_strike_tactics_DESC:0 "Attack enemy ships from the air, using speed and aerial agility to disrupt fleets."
SUBDOCTRINE_homeland_defense_DESC:0 "Patrol and defend our lands from enemy aerial threats, keeping the homeland safe."
SUBDOCTRINE_group_missions_DESC:0 "Have air units protect each other on dangerous missions to ensure mutual survival."
SUBDOCTRINE_coastal_patrol_DESC:0 "Use flying units to safeguard our ships and trade routes from enemy attacks."
SUBDOCTRINE_bomber_intercept_DESC:0 "Intercept enemy aerial raids to prevent destruction and maintain control of the skies."
SUBDOCTRINE_air_recon_DESC:0 "Scout enemy positions and movements from above to gain strategic intelligence."
SUBDOCTRINE_air_subdoctrine_aerial_defense_DESC:0 "Defend against enemy flying units using specialized weapons and aerial countermeasures."
SUBDOCTRINE_air_subdoctrine_force_preservation_DESC:0 "Value every flying unit and minimize losses to maintain air superiority."
SUBDOCTRINE_air_subdoctrine_tactical_flexibility_DESC:0 "Ensure aerial forces can adapt to any battlefield role without over-specializing."
SUBDOCTRINE_air_subdoctrine_utmost_ferocity_DESC:0 "Focus on elite, ferocious air units capable of maximum offensive power."
SUBDOCTRINE_air_subdoctrine_max_range_DESC:0 "Extend the reach of our aerial units to strike targets far from home."
SUBDOCTRINE_air_subdoctrine_strength_in_numbers_DESC:0 "Rely on swarms of flying units to overwhelm enemies rather than individual prowess."


