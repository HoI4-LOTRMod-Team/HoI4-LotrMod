artifact_saurons_mace_desc:0 "§LThe weapon of choice for the Lord of the Dark Tower, and a sight of terror for his enemies. At the Plains of Dagorlad, it was said that a single swing could wipe out an entire battalion of soldiers."

artifact_the_one_ring_desc:0 "§LOne ring to rule them all, one ring to find them, One ring to bring them all, and in the darkness bind them; In the Land of Mordor where the shadows lie.§!"

artifact_the_one_ring_upgraded_desc:0 "§LOne ring to rule them all, one ring to find them, One ring to bring them all, and in the darkness bind them; In the Land of Mordor where the shadows lie.§!"

artifact_gandalfs_staff_desc:0 "§LA conduit of the Secret Fire and a symbol of the Grey Pilgrim's power. In times of darkness, it shines with a light that pierces through despair and emboldens the hearts of the Free Peoples.§!"

artifact_narya_desc:0 "§LThe Elven Ring of Fire, set with a ruby that burns like a captive star. It bears the power to kindle hearts in a world growing cold, bringing courage and endurance where there is fear.§!"

artifact_nenya_desc:0 "§LThe Elven Ring of Water, forged of mithril and bearing a stone of white adamant. Its magic preserves and conceals, keeping the realm of Lothlórien pristine and shielded from the watchful eye of the East.§!"

artifact_vilya_desc:0 "§LThe Elven Ring of Air, the mightiest of the Three. Adorned with a great blue sapphire, it hums with ancient power, healing the weariness of time and preserving the hidden valley of Imladris.§!"

artifact_necklace_of_girion_desc:0 "§LA breathtaking heirloom of Dale, fashioned of five hundred emeralds. It stands as a symbol of the city's ancient wealth and the unbroken lineage of its lords.§!"

artifact_herugrim_desc:0 "§LThe ancient sword of the Kings of Rohan. A noble blade that has tasted the blood of many Dunlendings and Orcs, it brings clarity and strength to the hand of a true King of the Mark.§!"

artifact_shards_of_narsil_desc:0 "§LThe broken fragments of Elendil's great sword, which severed the Ring from Sauron's hand. Though its light is extinguished, the shards remain a potent symbol of hope and the Return of the King.§!"

artifact_blade_of_narsil_desc:0 "§LReforged from the shards of the past, the Flame of the West burns anew. The blade of Elendil has returned to cast a deadly, radiant light among the shadows of Mordor.§!"

artifact_palantir_desc:0 "§LA Seeing Stone of ancient Númenor. Though its gaze can pierce time and distance, peering into its dark depths is perilous, for one never truly knows who might be looking back.§!"

artifact_galadriels_mirror_desc:0 "§LA silver basin of water that commands the magic of the Lady of the Wood. To those brave enough to look, it shows things that were, things that are, and things that yet may be.§!"

artifact_sarumans_staff_desc:0 "§LA formidable tool of power, wielded by the head of the Istari. It commands the elements and the minds of the weak, yet its core has been tainted by industrial malice and treachery.§!"

artifact_blade_of_oropher_desc:0 "§LAn elegant, lethal weapon wielded by the fallen Elvenking of the Woodland Realm. It carries the bitter memory of the Last Alliance and the fierce, isolationist independence of the Sindar.§!"

artifact_blade_of_oropher_upgraded_desc:0 "§LAn elegant, lethal weapon wielded by the fallen Elvenking of the Woodland Realm. It carries the bitter memory of the Last Alliance and the fierce, isolationist independence of the Sindar.§!"

artifact_scepter_of_mistrand_desc:0 "§LA symbol of supreme authority among the Easterlings. Forged in the East, it unites fiercely independent tribes and commands the unwavering loyalty of Rhûn's greatest warlords.§!"

get_artifact_cooldown:0 "Cooldown: §Y[?temp_t] days§!"

