DGU_sabotage_supplies_tt:0 "When we completing the §Y$DGU_invasion$§! focus, all enemy states will suffer §Rsupply shortages§! for §Y90§! days."
DGU_coordinate_with_gundabad_tt:0 "We will be given a choice between asking §Y[GUN.GetNameWithFlag]§! for equipment, or coordinating an attack against the men of the Anduin."
