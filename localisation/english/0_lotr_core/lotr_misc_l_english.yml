give_intel_on_country_tt:0 "§Y[ROOT.GetNameWithFlag]§! gains §Y20%§! civilian army navy and air intel over §Y[THIS.GetNameWithFlag]§!"
DGU_saurons_schedule_effect_tt:0 "\nWithin §Y30 days§!, [MOR.GetName] will choose our branch under the §Y$DGU_the_grand_strategy$§! focus and impose a §Rschedule§! upon us. If we fail to meet the schedule's deadlines, [MOR.GetName] will §Oget the option to puppet us§!.\nCompleting the schedule on time will grant us additional rewards."
DGU_start_schedule_tt:0 "§Y[DGU.GetNameWithFlag]§! will receive a §Oschedule§! from §Y[MOR.GetName]§!. If any of the schedule's tasks are failed, §Y[MOR.GetNameWithFlag]§! will get the option to §Rpuppet§! §Y[DGU.GetName]§!. Completing the tasks on time will earn additional rewards."
DGU_start_schedule_east_tt:0 "\n\n§YImposed Schedule:§! §O$DGU_threaten_the_east$§! with tasks:\n   - Within §Y1 year§!: Reach the border with §Y[RHO.GetNameWithFlag]§!\n   - Within §Y2 years§!: Go to war with §Y[RHO.GetNameWithFlag]§!\n   - Within §Y3 years§!: Capitulate §Y[RHO.GetNameWithFlag]§!\n"
DGU_start_schedule_disclaimer_tt:0 "\nYou can view the current progress on schedule tasks under decisions."
DGU_start_schedule_anduin_tt:0 "\n\n§YImposed Schedule:§! §O$DGU_terror_of_the_anduin$§! with tasks:\n   - Within §Y2 years§!: Build an army of at least §Y15k§! men\n   - Within §Y2 years§!: Go to war with §Y[RGL.GetNameWithFlag]§!, §Y[GLD.GetNameWithFlag]§! or §Y[VAL.GetNameWithFlag]§!\n   - Within §Y4 years§!: Capitulate §Y[RGL.GetNameWithFlag]§!, §Y[GLD.GetNameWithFlag]§! or §Y[VAL.GetNameWithFlag]§!\n"
DGU_start_schedule_elves_tt:0 "\n\n§YImposed Schedule:§! §O$DGU_enxtinguish_elven_light$§! with tasks:\n   - Within §Y2 years§!: Control at least §Y3§! states\n   - Within §Y3 years§!: Go to war with §Y[LTH.GetNameWithFlag]§! or §Y[MIR.GetNameWithFlag]§!\n   - Within §Y4 years§!: Capitulate §Y[LTH.GetNameWithFlag]§! or §Y[MIR.GetNameWithFlag]§!\n   - Within §Y5 years§!: Bring both §YCaras Galadhon§! and §YThranduil's Halls§! under your or Mordor's control\n"
DGU_start_schedule_rohan_tt:0 "\n\n§YImposed Schedule:§! §O$DGU_attack_rohan$§! with tasks:\n   - Within §Y2 years§!: Reach the border with §Y[ROH.GetNameWithFlag]§!\n   - Within §Y6 months§! of Isengard or Mordor attacking Rohan: Go to war with §Y[ROH.GetNameWithFlag]§!\n   - Within §Y1 year§! of attacking Rohan: Capitulate §Y[ROH.GetNameWithFlag]§!\n"
DGU_start_schedule_distraction_tt:0 "\n\n§YImposed Schedule:§! §O$DGU_a_well_timed_distraction$§! with tasks:\n   - Within §Y2 years§!: Complete the §Y$DGU_build_up_our_forces$§! focus\n   - Within §Y2 years§! Build an army of at least §Y20k§! men\n   - Within §Y6 months§! of Mordor attacking Gondor: Complete the §Y$DGU_in_all_directions$§! focus\n"
DGU_mordor_chooses_tt:0 "§Y[MOR.GetName]§! has determined our role in their war strategy."
DGU_fortify_the_naked_hill_tt:0 "Add a level 3 §YCastle§! to §YDol Guldur§!\nAdd a level 2 §YEncampment§! to every province on the border"
DGU_masters_of_the_mirkwood_tt:0 "Gain §G+35%§! §Ycompliance§! on all Mirkwood states."
DGU_dark_constructs_effect_tt:0 "§Y$DGU_dark_constructs$§! will be removed upon completing the §Y$DGU_necromantic_forge$§! focus."
DGU_the_necromantic_forge_unlock_tt:0 "\nUnlock the §O$necromantic_forge$§!, a powerful building that acts as both a §Ycivilian§! and §Ymilitary§! factory, while also generating §Yweekly manpower§!.\n\nIncrease the cost of §Y$industrial_complex$§! and §Y$arms_factory$§! buildings by §R+25%§!."
