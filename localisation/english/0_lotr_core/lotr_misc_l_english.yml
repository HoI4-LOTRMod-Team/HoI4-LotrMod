GRAND_DOCTRINE_discipline_and_valor_doctrine:0 "Valor and Discipline"
GRAND_DOCTRINE_horde_tactics_doctrine:0 "Horde Tactics"
GRAND_DOCTRINE_swift_strike_doctrine:0 "Swift Strike"
GRAND_DOCTRINE_masterful_warfare_doctrine:0 "Masterful Warfare"

GRAND_DOCTRINE_discipline_and_valor_doctrine_DESC:0 "Lives are not to be squandered on reckless charges or fleeting triumphs. Through steady ranks and unwavering discipline, our soldiers hold firm where others falter. Victory is not seized in haste, but earned through resolve, order, and the trust forged between commander and host."
GRAND_DOCTRINE_horde_tactics_doctrine_DESC:0 "Numbers are our strength, and fear our weapon. Let the enemy form their lines and build their walls... they will drown beneath the tide. Victory needs no elegance, only the will to grind the foe to dust beneath countless feet."
GRAND_DOCTRINE_swift_strike_doctrine_DESC:0 "Let the foe brace for a siege that never comes. Our riders move like lightning, striking where they are weakest, vanishing before the dust has settled. While the footmen hold the line, the horsemen break the enemy's spirit with speed and fury."
GRAND_DOCTRINE_masterful_warfare_doctrine_DESC:0 "Mastery and skill, not numbers, decide the field. Our warriors know their weapons as they know their own hands. They do not rush, nor falter, and our enemies are undone before they comprehend the design. For to us... war is not chaos, but craft."

GRAND_DOCTRINE_beasts_of_war_doctrine:0 "Beasts of War"
GRAND_DOCTRINE_guardians_of_the_wind_doctrine:0 "Guardians of the Sky"
GRAND_DOCTRINE_eyes_in_the_sky_doctrine:0 "Air Auxiliaries"

GRAND_DOCTRINE_beasts_of_war_doctrine_DESC:0 "The skies belong to those who dare to claim them. Wings and claws strike without mercy, and no foe may rise against us. From above, we bend the battlefield to our will."
GRAND_DOCTRINE_guardians_of_the_wind_doctrine_DESC:0 "Above the lands we watch, ever vigilant. No shadow may pass unnoticed, no threat strike from the clouds. Our wings shield the realms below, and the skies themselves answer to our watch."
GRAND_DOCTRINE_eyes_in_the_sky_doctrine_DESC:0 "Eyes in the sky guide defenders below, and towers and ballistas guard every pass and ridge. Even without the fury of flight, the realm remains secure."

GRAND_DOCTRINE_seaborne_supremacy_doctrine:0 "Seaborne Supremacy"
GRAND_DOCTRINE_raiding_and_reaving_doctrine:0 "Raiding and Reaving"
GRAND_DOCTRINE_coastal_defense_doctrine:0 "Coastal Defense"

GRAND_DOCTRINE_seaborne_supremacy_doctrine_DESC:0 "The sea belongs to those who dare to seize it. Our ships ride the waves in overwhelming strength, each deck bristling with fire and steel. None may challenge us without being dashed against the hulls of our fleet."
GRAND_DOCTRINE_raiding_and_reaving_doctrine_DESC:0 "Salt and blood mark our wake. We hunt the slow and the laden, wreaking ruin on coastal wealth and leaving no safe anchorage. Swift, savage, and unseen until our hands are already in the enemy's chest."
GRAND_DOCTRINE_coastal_defense_doctrine_DESC:0 "Grand fleets may seek battle on open waters, but we guard what is ours. Each vessel knows its patrol, each crew its duty. By holding the coast and securing trade, we ensure that home and commerce alike endure."


