DGU_river_poison_tt:0 "All divisions in a random state (with at least 3 divisions) receive §R15%§! damage to strength and §R50%§! damage to organization."
elven_enslavement_occupation_unlock_tt:0 "Unlock the §Y$elven_enslavement_occupation$§! occupation policy, available for core states of elven countries."
