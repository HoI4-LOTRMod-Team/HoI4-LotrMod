RHO_kingdoms_remnant:0 "Kingdom's Remnant"
RHO_kingdoms_remnant_desc:0 "After a crushing defeat at the Battle of the Plains, the Kingdom of Rhovanion has fallen into a state of disrepair and fragility. Consisting of scattered communities, loosely affiliated to a central crown, it is but a faint shadow of it's noble past and hangs by thread of what it means to be a 'kingdom'."

RHO_kingdoms_remnant_2:0 "Kingdom's Remnant"
RHO_kingdoms_remnant_2_desc:0 "The Kingdom of Rhovanion has been weakened by past defeats and a long history of decay, but nevertheless stands resolute in the face of danger."

lift_neutral_policy:0 "Lift Neutral Foreign Policy"
lift_neutral_policy_desc:0 "The world is in turmoil, and neutrality no longer suits our political needs."

restore_the_kingdom:0 "Restore the Kingdom"
restore_the_kingdom_desc:0 "No matter how hard our enemies strike, we endure."


