DGU_presence_tt:0 "§Y[DGU.GetNameWithFlag]§! has §Y[?DGU.cfm_presence|%%.1] Presence§!.\n\t - Base Gain: §Y[?DGU.modifier@cfm_presence_gain|+]§!\n\t - Gain Factor: §Y[?DGU.modifier@cfm_presence_gain_factor|+%.1]§!\n\nAt §Y100 Presence§!, they will be able to §Rannex§! a state in Mirkwood. Presence gain can be affected through focuses, decisions and events."

