morm_level_5_desc:0 "'O Valar, if you still watch over this broken world, grant us the strength to see one last sunrise. The darkness is absolute, and the earth weeps under the endless tread of his armies. If there is no hope left for Middle-earth, we pray only that the end is swift.'"
morm_level_4_desc:0 "'The river-crossings are lost, and the sky is choked with unnatural ash. The sun has forsaken us. We are pushed back behind our final walls, fighting no longer for victory, but to buy our families enough time to flee. The age of Men is drowning in blood.'"
morm_level_3_desc:0 "'Hear me, Men of the West! The Black Gate has opened, and the Great Eye turns its wrath upon our homes! They march to bring us fire and ruin, but they shall find only steel and unbroken resolve! Stand fast, hold your ground, and let the shadow break upon our shields!'"
morm_level_2_desc:0 "'The roads are no longer safe. Our scouts do not return from Ithilien, and the Corsairs grow bolder upon the southern coasts. This is no mere banditry... there is a cruel, singular will guiding them. We must double the guard.'"
morm_level_1_desc:0 "'There is a strange, bitter chill on the eastern wind, and the Rangers speak of foul things multiplying in the dark corners of the world. It is likely just stray bands of Orcs, but the shadows in the mountains seem... deeper, lately.'"
morm_level_0_desc:0 "'Sauron? The shadow of a bygone age, a fireside tale to frighten children into their beds. The Watch on the Morannon is but a dusty formality now. The Dark Lord fell millennia ago, and his bones are dust on the wind.'"

