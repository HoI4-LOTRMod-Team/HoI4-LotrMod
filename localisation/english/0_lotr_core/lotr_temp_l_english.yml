VAL_self_reliance_focus:0 "Self Reliance Focus"
VAL_self_reliance_focus_desc:0 "The people of this country are focusing on self-reliance, seeking to reduce dependence on external resources and support."
VAL_shadow_of_gundabad:0 "Shadow Of Gundabad"
VAL_shadow_of_gundabad_desc:0 "The shadow of Gundabad looms large over the lands of the north. The orcs of Gundabad are a constant threat, and their presence is a source of fear and anxiety for the people living in the surrounding regions."
VAL_no_peace_with_gundabad:0 "No Peace With Gundabad"
VAL_no_peace_with_gundabad_desc:0 "The Beornings of the Vales of Anduin have long been at odds with the orcs of Gundabad, and there is no hope for peace between them. The Beornings see the orcs as a blight on the land, and they are determined to eradicate them from their lands by any means necessary."
VAL_failed_harvest:0 "Failed Harvest"
VAL_failed_harvest_desc:0 "A mixture of mismanagement and natural disaster have brought about a failed harvest, leading to food shortages and the looming threat of famine. The people are discontented and the leadership has been called into question."
VAL_failed_harvest_2:0 "Failed Harvest"
VAL_failed_harvest_2_desc:0 "A mixture of mismanagement and natural disaster have brought about a failed harvest, leading to food shortages and the looming threat of famine. The people are discontented and the leadership has been called into question."
VAL_enforced_secrecy:0 "Enforced Secrecy"
VAL_enforced_secrecy_desc:0 "Vales' leadership has minimized outside communications and diplomatic efforts in an attempt to cover up internal strife and troubles."
VAL_stabilizing_regime:0 "Stabilizing Regime"
VAL_stabilizing_regime_desc:0 "After a period of instability and tumult, the leadership of the Vales has managed to stabilize the regime and restore a sense of order and normalcy."
VAL_unification_crusade:0 "Unification Crusade"
VAL_unification_crusade_desc:0 "Under new leadership, the northern Boerning have taken up the cause to unite the people of the Vales under one banner, by force if necessary."
