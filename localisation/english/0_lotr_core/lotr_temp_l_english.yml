RGL_converting_farming_equipment:0 "Converting Farming Equipment"
RGL_converting_farming_equipment_desc:0 "The men of Rhosgobel have been forced to convert their farming equipment into makeshift weapons and armor in order to defend themselves. This has led to a significant decrease in agricultural productivity, but it is a necessary sacrifice in order to ensure the survival of the people."
RGL_mirkwood_fauna_research:0 "Mirkwood Fauna Research"
RGL_mirkwood_fauna_research_desc:0 "The men of Rhosgobel are observing and studying the various creatures that inhabit Mirkwood, in an effort to better understand their behavior and habits."
RGL_enemies_on_all_sides:0 "Enemies On All Sides"
RGL_enemies_on_all_sides_desc:0 "Mistrust and anxieties are high among the people of Rhosgobel. Surrounded by warlords, orcs, great spiders and enigmatic elves, the sparsely populated villages of the southern vales are keenly aware of their precarious position, and the people are on edge."
RGL_defensive_paranoia_idea:0 "Defensive Paranoia"
RGL_defensive_paranoia_idea_desc:0 "Threats encroach from all sides, and there is only one solution: Build forts. Mobilize the masses. Set traps. Dig trenches. The people of Rhosgobel are taking extreme measures to fortify their lands and prepare for the worst."
RGL_defensive_paranoia_idea_forts:0 "Defensive Paranoia"
RGL_defensive_paranoia_idea_forts_desc:0 "Threats encroach from all sides, and there is only one solution: Build forts. Mobilize the masses. Set traps. Dig trenches. The people of Rhosgobel are taking extreme measures to fortify their lands and prepare for the worst."
RGL_defensive_paranoia_idea_forts2:0 "Defensive Paranoia"
RGL_defensive_paranoia_idea_forts2_desc:0 "Threats encroach from all sides, and there is only one solution: Build forts. Mobilize the masses. Set traps. Dig trenches. The people of Rhosgobel are taking extreme measures to fortify their lands and prepare for the worst."
RGL_defensive_paranoia_idea_resistance:0 "Defensive Paranoia"
RGL_defensive_paranoia_idea_resistance_desc:0 "Threats encroach from all sides, and there is only one solution: Build forts. Mobilize the masses. Set traps. Dig trenches. The people of Rhosgobel are taking extreme measures to fortify their lands and prepare for the worst."
RGL_overlord_support:0 "Overlord Support"
RGL_overlord_support_desc:0 "The realm of Rhosgobel has found a patron to keep them safe from the various threats that surround them. This patron provides military support and protection in exchange for loyalty and tribute."
RHU_army_of_the_east:0 "Army of the East"
RHU_army_of_the_east_desc:0 "Few armies in the west are as finely honed and disciplined as the army of Rhûn. A long history of martial traditions and a culture that values strength and combat prowess has produced a formidable fighting force that is feared and respected by its enemies."
RHU_melkorite_teachings:0 "Melkorite Teachings"
RHU_melkorite_teachings_desc:0 "The teachings of Melkor, the first Dark Lord, have been passed down through generations of Rhûn's people. These teachings emphasize the importance of power, domination, and the pursuit of one's own interests above all else. The influence of Melkor's teachings can be seen in the ruthless and ambitious nature of Rhûn's leaders and their willingness to do whatever it takes to achieve their goals."
RHUN_internal_corruption:0 "Internal Corruption"
RHUN_internal_corruption_desc:0 "The intricacies of Mistrand's palace politics are ripe with corrupt officials that care little about the well-being of the people or the glory of the realm, but would rather pursue the enrichment of their own families and allies. The only laws the governors fear are those of daggers and coin."
RHU_the_new_dark_lord:0 "The New Dark Lord"
RHU_rebuild_the_country:0 "Rebuild the Country"
generic_immigration_pull:0 "Immigration Pull"
generic_immigration_pull_desc:0 "This country is benefiting from an influx of immigrants, which is boosting its population and workforce."
generic_population_growth:0 "Population Growth"
generic_population_growth_desc:0 "The population of this country is increasing, leading to a larger workforce and potential for economic growth."
generic_mining_disruption:0 "Mining Disruption"
generic_mining_disruption_desc:0 "Mining operations in this country are facing disruptions, affecting resource production and economic stability."
DRH_war_of_revenge:0 "War Of Revenge"
DRH_war_of_revenge_desc:0 "After their first uprising ended in limited success, the free people of Rhûn have been inspired to take up arms once more and launch a full-scale war of revenge against their oppressors. This time, they are determined to see it through to the end, and they are willing to make any sacrifice necessary to achieve victory."
RHUN_invasion_deterrence_desc:0 "Fearful of the threat growing beyond the Mountains of Ash, Rhûn has taken measures to deter invasions and protect its borders."
