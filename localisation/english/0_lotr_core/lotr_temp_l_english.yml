l_english:

GLD_great_eagle_gwaihir:0 "Great Eagle Gwaihir"
GLD_great_eagle_gwaihir_desc:0 "The support of Gwaihir the Windlord comes with great benefits. While other birds and fell beasts also circle the sky, Gwaihir's Great Eagles, hailing from the Eyrie, are the most powerful and loyal."
GLD_forming_a_kingdom:0 "Forming A Kingdom"
GLD_forming_a_kingdom_desc:0 "After millenia of being little more than a scattered bunch of chiefdoms, the people of Gladden look back at their Éotheod ancestry and seek to consolidate their territories into a new kingdom. The political and bureaucratic structures of the new kingdom are still in their infancy, and there is much work to be done."
GLD_kingdom_of_gladden:0 "Kingdom Of Gladden"
GLD_kingdom_of_gladden_desc:0 "After millenia of being little more than a scattered bunch of chiefdoms, the people of Gladden have finally united under a single banner. This newfound unity has allowed them to pool their resources and knowledge, leading to significant advancements in various fields."
GLD_crossing_of_the_misty_mountains:0 "Crossing Of The Misty Mountains"
GLD_crossing_of_the_misty_mountains_desc:0 "In a most daring and audacious move, the Gladden Chiefdoms have embarked on a grand, ambitious expedition to cross the treacherous Misty Mountains. Their target are the fertile hills of Rhudaur, which they intend to take by force."

spi_restless_hunger_decision_category:0 "Restless Hunger"
SPI_emergency_hatching:0 "Emergency Hatching"
SPI_maturing_eggs:0 "Maturing Eggs"
SPI_unleash_the_brood_select:0 "Unleash The Brood"
SPI_unleash_the_brood:0 "Unleash The Brood"
SPI_hierarchy_of_authority:0 "Hierarchy Of Authority"
SPI_hierarchy_of_authority_desc:0 "While the Spiders of the Mirkwood frequently act unpredictably and erratically, one would do well not to confuse them with mindless animals. The Spiders of the Mirkwood are a highly intelligent and organized species, with a complex social structure and a clear hierarchy of authority. From the great Broodmothers to the smallest spiderling, all members of the spider society have a specific role to play, and they work together in a coordinated manner to achieve their goals."
SPI_warriors_clan:0 "Warriors' Clan"
SPI_warriors_clan_desc:0 "Shrazul, often called the 'Warmother', is among the fiercest and most skilled of the Spider Broodmothers. Her immediate offspring, the Warriors' Clan, are among the most feared beasts in all of Mirkwood. Even Thranduil himself would rather turn back his host than face Shrazul's brood in battle."
SPI_mind_of_the_hive:0 "Mind Of The Hive"
SPI_mind_of_the_hive_desc:0 "Khazherze, the 'Dream Weaver', is the most intelligent and cunning of the Spider Broodmothers. Unlike most Great Spiders, who are primarily concerned with food, Khazherze has several of her many eyes set on the longer-term future and the passing on of information and knowledge to future generations."
SPI_repugnant:0 "Repugnant"
SPI_repugnant_desc:0 "The Great Spiders have neither the elegance of an Elf, nor the cheerful charisma of a dwarf. Their disturbing customs, animalistic ways and uncontrolled thirst for blood make them, in the eyes of other creatures, unapproachable, hideous and terrifying. This severely limits their capacity for diplomacy or trade."
SPI_limited_diplomatic_capabilities:0 "Limited Diplomatic Capabilities"
SPI_limited_diplomatic_capabilities_desc:0 "The Great Spiders have neither the elegance of an Elf, nor the cheerful charisma of a dwarf. Their disturbing customs, animalistic ways and uncontrolled thirst for blood make them, in the eyes of other creatures, unapproachable, hideous and terrifying. This severely limits their capacity for diplomacy or trade."
spi_next_advisor_cheaper_small_council:0 "Next Advisor Cheaper (Small Council)"
spi_next_advisor_cheaper_war_council:0 "Next Advisor Cheaper (War Council)"
spi_next_advisor_cheaper_research_council:0 "Next Advisor Cheaper (Research Council)"

web_traps:0 "Web Traps"
web_traps_desc:0 "Spiderwebs infest this area. They are hard to traverse, and even harder to cut down. Marching an army through this area will be a slow and arduous process, and the soldiers will be vulnerable to attacks from the spiders lurking in the shadows."
spider_infestation:0 "Spider Infestation"
spider_infestation_desc:0 "Large numbers of spiderlings infest this area. Not only are they severly harmful to the local wildlife, but any efforts at construction, recruitment or resource extraction will be impaired until the infestation is dealt with."
spider_devour_bonuses:0 "Devouring Assimilation"
spider_devour_bonuses_desc:0 "When the Great Spiders consume their prey, they don't just gain nourishment. They also assimilate the knowledge and skills of their victims, which they can then pass on to their offspring. This allows the Great Spiders to rapidly evolve and adapt to new threats and challenges, making them even more dangerous as they continue to consume more and more prey."
unceasing_hunger:0 "Unceasing Hunger"
unceasing_hunger_fake_idea:0 "Unceasing Hunger"
unceasing_hunger_desc:0 "The Great Spiders, despite their intelligence, are still driven by a primal and insatiable hunger. They are constantly on the hunt for food, and they will stop at nothing to satisfy their cravings. So powerful is this craving that even the great Gloomweaver, Ungoliant herself, was said to have consumed her own self in her uttermost famine. This insatiable hunger lives on in her descendants, thousands of years after her demise."
unceasing_hunger_fake_idea_desc:0 "The Great Spiders, despite their intelligence, are still driven by a primal and insatiable hunger. They are constantly on the hunt for food, and they will stop at nothing to satisfy their cravings. So powerful is this craving that even the great Gloomweaver, Ungoliant herself, was said to have consumed her own self in her uttermost famine. This insatiable hunger lives on in her descendants, thousands of years after her demise."
unceasing_hunger_vs_orcs:0 "Unceasing Hunger"
unceasing_hunger_vs_orcs_desc:0 "The Great Spiders, despite their intelligence, are still driven by a primal and insatiable hunger. They are constantly on the hunt for food, and they will stop at nothing to satisfy their cravings. So powerful is this craving that even the great Gloomweaver, Ungoliant herself, was said to have consumed her own self in her uttermost famine. This insatiable hunger lives on in her descendants, thousands of years after her demise."
unceasing_hunger_vs_elves:0 "Unceasing Hunger"
unceasing_hunger_vs_elves_desc:0 "The Great Spiders, despite their intelligence, are still driven by a primal and insatiable hunger. They are constantly on the hunt for food, and they will stop at nothing to satisfy their cravings. So powerful is this craving that even the great Gloomweaver, Ungoliant herself, was said to have consumed her own self in her uttermost famine. This insatiable hunger lives on in her descendants, thousands of years after her demise."
deathless_broodmind:0 "Deathless Broodmind"
weaver_of_discipline:0 "Weaver of Discipline"
last_child_of_ungoliant:0 "Last Child of Ungoliant"
her_ladyship:0 "Her Ladyship"

raid_type_GLD_burning_of_the_webs_raid:0 "Burning of the Webs Raid"
raid_type_GLD_burning_of_the_webs_raid_desc:0 "The Spiders of the Mirkwood are a menace that infests our eastern flank. We will launch a raid on their lairs, burning down their webs and killing as many of them as we can. This will not only reduce the threat they pose to us, but it will also send a message to any other would-be invaders that we are not to be trifled with."
raid_type_DGU_raid_countryside:0 "Raid Countryside"
raid_type_DGU_raid_countryside_desc:0 "The lands of [FROM.GetName] are rich and open to attack. We would be fools to let such an opportunity pass."
raid_type_DGU_raid_thranduils_halls:0 "Raid Thranduil's Halls"
raid_type_DGU_raid_thranduils_halls_desc:0 "The halls of the Elven King are likely among the most well-guarded places in Mirkwood. But the elves are, as always, arrogant and complacent. They will not expect orcs to be as bold as to raid their precious halls, and they will be caught off guard when we do."
raid_type_GOB_raid_steal_spider_silk:0 "Steal Spider Silk"
raid_type_GOB_raid_steal_spider_silk_desc:0 "The silk of the Great Spiders is a rare commodity and highly sought after by the various factions of Middle-earth. It is incredibly strong and durable, making it ideal for use in armor and other protective gear. By raiding the lairs of the Great Spiders and stealing their silk, we can acquire one of the most sought-after materials which will fetch a high price on the market."
raid_type_GOB_raid_steal_bree_leather:0 "Steal Bree Leather"
raid_type_GOB_raid_steal_bree_leather_desc:0 "The tanneries of Bree produce some of the finest leather in all of Middle-earth. By raiding these tanneries and stealing their leather, we can acquire a valuable resource that is highly sought after by the various factions of Middle-earth. This will not only provide us with a valuable commodity to sell on the market, but it will also weaken our enemies by depriving them of a key resource."
raid_type_GOB_raid_rivendell_heist:0 "Rivendell Heist"
raid_type_GOB_raid_rivendell_heist_desc:0 "We have been so bunkered up in our tunnels that few even regard as a true threat anymore. The elven lords of Rivendell have their slanted eyes set on the clouds gathering over Mordor and Rhûn. They will not expect us to be bold enough to raid their precious city, and they will be caught off guard when we do."
raid_type_GOB_raid_punitive_pillage:0 "Punitive Pillage"
raid_type_GOB_raid_punitive_pillage_desc:0 "[FROM.GetName] has refused to pay us our due tribute. We must inflict great damage upon them to ensure they understand the consequences of defying us."

dark_veil:0 "Dark Veil"
dark_veil_desc:0 "The fortress of Dol Guldur is shrouded in a dark veil of shadow and mist. The palpable darkness hinders the effectiveness of combat, and makes it one of the last places in Middle earth one would want to fight a battle."
supply_depots:0 "Supply Depots"
supply_depots_desc:0 "The necromantic forges in this area contain secret supply depots, ensuring Dol Guldur's armies remain well-supplied even in the case of encirclement or siege."
sabotaged_supplies:0 "Sabotaged Supplies"
sabotaged_supplies_desc:0 "The supply depots in this area have been sabotaged by the enemy, causing significant disruptions to logistics and supply lines. This has led to shortages of essential resources and has hindered our ability to effectively support our troops in the field."
fortress_ruins:0 "Fortress Ruins"
fortress_ruins_desc:0 "Much evil has occurred in Dol Guldur over the centuries, and the once mighty elven fortress has been reduced to ruins. The crumbling walls and decaying structures hinder any serious efforts at fortification or construction, and the area is infested with vermin and other pests that make it difficult to maintain a healthy and productive workforce."
lotr_food_consumption_from_population:0 "Food Consumption From Population"
lotr_state_armed_resistance:0 "State Armed Resistance"
lotr_state_armed_resistance_desc:0 "The inhabitants of this area have taken up arms against us, forming a resistance movement that actively sabotages the efforts of their occupiers."
lotr_roaming_trolls:0 "Roaming Trolls"
lotr_roaming_trolls_desc:0 "The area is infested with roaming trolls, who attack and kill any unfortunate enough to cross their path."
gob_rickety_infrastructure:0 "Rickety Infrastructure"
gob_rickety_infrastructure_desc:0 "The great underground chasms and cliffs are traversable only through a series of hanging bridges, rope ladders and rickety wooden platforms. These structures are old and poorly maintained, and they are prone to collapse."
gob_rickety_infrastructure_2:0 "Rickety Infrastructure"
gob_rickety_infrastructure_2_desc:0 "The great underground chasms and cliffs are traversable only through a series of hanging bridges, rope ladders and rickety wooden platforms. These structures are old and poorly maintained, and they are prone to collapse."
gob_rickety_infrastructure_3:0 "Rickety Infrastructure"
gob_rickety_infrastructure_3_desc:0 "The great underground chasms and cliffs are traversable only through a series of hanging bridges, rope ladders and rickety wooden platforms. These structures are old and poorly maintained, and they are prone to collapse."
lotr_goblin_resistance:0 "Goblin Resistance"
lotr_goblin_resistance_desc:0 "The goblins of the Misty Mountains are a fierce and stubborn people, and they will not take kindly to being occupied by an outside force."
lotr_reinforced_defenses:0 "Reinforced Defenses"
lotr_reinforced_defenses_desc:0 "The defenses in this area have been reinforced and strengthened, making it more difficult for enemy forces to breach."
lotr_capital_infrastructure:0 "Capital Infrastructure"
lotr_capital_infrastructure_desc:0 "The infrastructure in this area is of the highest quality, with well-maintained roads, bridges and buildings that facilitate efficient movement and logistics."
