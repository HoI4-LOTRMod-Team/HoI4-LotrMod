cfm_attack_state_decision_desc:0 "[FROM.GetName] lies open and vulnerable for the taking. The time has come to strike, and seize the opportunity to deal a crippling blow to the Elves."
cfm_ambush_the_garrison_decision:0 "Ambush The Garrison Decision"
cfm_ambush_the_garrison_decision_desc:0 "The Mirkwood Elves patrol the roads in [FROM.GetName], but they are unaware of our presence in the region. Rather than trying to drive them out, let us circle and ambush them, dealing as much damage as possible!"
cfm_lock_state_decision_desc:0 "[FROM.GetName] is a critical location. Let us mount patrols and lock it down to ensure it does not fall to the enemy."
cfm_reassert_control_desc:0 "The forest of the Mirkwood belongs to the elves. Let us drive out the invaders, sure up our borders and reassert our control over the region."
cfm_dgu_sudden_assault:0 "Sudden Assault"
cfm_dgu_sudden_assault_desc:0 "Let us attack the enemy with a sudden and unexpected assault, catching them off guard and dealing a decisive blow to their forces."
cfm_dgu_dark_rituals_desc:0 "By the power of the necromancer, let us cultivate the deep rot and decay of the land, sapping the strength and vitality of our enemies and bolstering our own forces with the dark energies."
cfm_convert_presence_into_industry:0 "Convert Presence Into Industry"
cfm_convert_presence_into_industry_desc:0 "We have garnered significant presence in the region. But rather than expand our borders, let us focus on consolidating our hold and converting that presence into industrial capacity."
cfm_convert_presence_into_pp:0 "Convert Presence Into Political Power"
cfm_convert_presence_into_pp_desc:0 "We have garnered significant presence in the region. But rather than expand our borders, let us celebrate our growing strength and gain political influence."
cfm_convert_presence_into_manpower:0 "Convert Presence Into Manpower"
cfm_convert_presence_into_manpower_desc:0 "We have garnered significant presence in the region. But rather than expand our borders, let us focus on consolidating our hold and converting that presence into manpower."
cfm_spi_stoke_the_brood:0 "Stoke The Brood"
cfm_spi_stoke_the_brood_desc:0 "The hatchlings hunger for new prey... Let them roam free and expand our influence within the woods."
cfm_the_kings_hunt_desc:0 "The sacred forest teems with rot and evil. The time has come for the King himself to ride out and hunt down the foul creatures that infest his lands."
cfm_legolas_hunt_desc:0 "The sacred forest teems with rot and evil. Let us send forth Prince Legolas with a host of hunters to track down and eliminate the foul creatures that infest our lands."
cfm_tauriel_hunt_desc:0 "The sacred forest teems with rot and evil. Let us send forth Tauriel with a host of hunters to track down and eliminate the foul creatures that infest our lands."
cfm_secure_the_forest_narrows:0 "Secure The Forest Narrows"
cfm_secure_the_forest_narrows_desc:0 "The Forest Narrows are a vital piece of land that bridges the southern woods with the north. We must ensure it does not fall into enemy hands at all costs."
cfm_bolster_defenses_against:0 "Bolster Defenses Against [FROM.GetName]"
cfm_bolster_defenses_against_desc:0 "The forces of [FROM.GetName] are a constant threat to our lands. We must bolster our defenses against them, fortifying our borders and preparing for any potential attacks."
cfm_lay_trap_against:0 "Lay Trap Against [FROM.GetName]"
cfm_lay_trap_against_desc:0 "The forces of [FROM.GetName] are getting greedy and overconfident. Let us lay a trap for them, and deal a devastating blow to their forces when they least expect it."
cfm_increase_patrols:0 "Increase Patrols"
cfm_increase_patrols_desc:0 "The Mirkwood is not safe to traverse anymore. Let us increase our patrols and ensure the safety of our people and lands."
cfm_airborne_patrols:0 "Airborne Patrols"
cfm_airborne_patrols_desc:0 "Let us leverage the power of the great Eagles to patrol the skies and keep watch for any threats that may be approaching our lands."
GOB_overthrow_timer_desc:0 "The Tunnel-Lords are constantly infighting and vying for the top. They are unpredictable and difficult to control, with the power dynamics shifting once a year."
purchase_new_knowledge_desc:0 "The surface dwellers possess large libraries and laboratories. Let us acquire some of their knowledge and expertise to bolster our own capabilities."
request_high_pass_deal_desc:0 "The High Pass is one of the few remaining routes across the Misty Mountains. Rather than try to fight the goblins, let us pay them off and secure safe passage."
return_high_pass_desc:0 "The High Pass has served it's purpose and we have crossed the perilous route. Let us return it to the goblins and avoid having to pay them further fees."
gob_demand_tribute_from_desc:0 "[FROM.GetName] is priviledged to not be raided by our goblin hordes. But if they want to keep it that way, they will have to pay us tribute."
offer_merc_contract_desc:0 "[FROM.GetName] is in a precarious position. Let us offer our mercenary services to them, and in exchange, they will pay us handsomely."
gob_recall_mercenaries_desc:0 "Our mercenaries are required home. Recall them at once!"
GOB_mercenary_contract_desc:0 "Swords for gold. This country has hired mercenaries from goblin town. These Goblin mercenaries will fight loyally at their side, so long as they receive their due payments."
gob_mercenaries_being_recalled_desc:0 "The Goblin mercenaries are being recalled back to Goblin Town."
work_the_forges_desc:0 "Back to work you sluggards! The forges of Gundabad are burning, and we have weapons to produce and repairs to make!"
work_the_builders_desc:0 "If I catch you sleeping on the job one more time, then we will pave the halls with your tombstone."
work_the_miners_desc:0 "Oh, your pickaxe broke? So what! Use damned fingernails if you have to!"
convert_scrap_into_infantry_equipment_desc:0 "What is a spear if not a rock tied to a stick?"
convert_scrap_into_support_equipment_desc:0 "You can use bandages more than once, right?"
convert_scrap_into_archery_equipment_desc:0 "There are other, cheaper ways to throw stuff at the enemy than a bow. A slingshot, an atlatl... We have the materials, right?"
convert_scrap_into_steel_equipment_desc:0 "One goblin's trash is another goblin's treasure. Pick up anything that looks like metal and throw it back into the forge!"
scrap_old_siege_equipment:0 "Scrap Old Siege Equipment"
scrap_old_siege_equipment_desc:0 "These siege towers use an awful lot of wood and steel that could have other uses..."
scrap_support_equipment:0 "Scrap Support Equipment"
scrap_support_equipment_desc:0 "We have anough support equipment to last us a lifetime. Scrap the old stuff and convert it into something more useful!"

invest_in_our_politics_desc:0 "The Battle of the Five Armies lies far in the past. It is time to move on, and focus on the future."
invest_in_our_production_desc:0 "Twelve hours of working the forges will get the spirits up, right?"
ambush_orc_hunting_parties_desc:0 ""
raid_orc_infrastructure_desc:0 ""

clear_spider_infestation_desc:0 "[FROM.GetName] is crawling with spiders. Let us send out hunting parties to clear them out and make the roads safe again."
MIR_promote_elven_purity_desc:0 "Millenia of living in the Mirkwood have taught us that outsiders are a blight on our lands. They bring with them their diseases, their corruption, and their weakness. We must promote elven purity and keep the outsiders at bay if we want to survive."
MIR_promote_fear_politics_desc:0 "The shadow of Mordor looms large over the lands of the north. The people are afraid, and they are looking for someone to blame. Let us use this fear to our advantage, and rally the people against a common enemy."
MIR_promote_elven_unity_desc:0 "From the shores of Lindon to the Mountains where the Averni dwell, let use find unity as the people that once crossed from Valinor to Middle Earth."
MIR_promote_cross_race_unity_desc:0 "Yes, the dwarf may be a bit... odious, and the man a bit... dumb. But they are our neighbors, and we share this land with them. Let us find common ground and work together to defend our home."
MIR_promote_mirkwood_traditions_desc:0 "Since the days of Doriath and Oropher have the elves of Mirkwood lived by their own traditions and customs. Let us promote these traditions and ensure that they are passed down to future generations."
MIR_demand_action_desc:0 "The hordes of Mordor are growing stronger by the day, and the people are looking for someone to take action."
MIR_promote_martial_traditions_desc:0 "Centuries of fighting beasts and orcs in the deep woods have honed the blades of Mirkwood to be more lethal than even those of the Golden Wood."
MIR_promote_shared_history_desc:0 "The elves of Mirkwood have a rich history that spans millennia. Let us promote this shared history and ensure that it is remembered and honored by all."
MIR_ease_tensions_desc:0 "Tensions between the different races and factions in Mirkwood have been rising. Let us take steps to ease these tensions and promote harmony."
MIR_withdraw_southern_troops_desc:0 "Our men south of the Narrows are cut off and surrounded by enemies. Let us withdraw them to safer grounds and consolidate our forces."

prospect_for_oil:0 "Prospect New Farming Grounds"
prospect_for_oil_desc:0 "The fields of [FROM.GetName] are fertile and ripe for cultivation. By setting up new farms and prospecting for new farming grounds, we can increase our food production."
prospect_for_rubber:0 "Prospect New Hunting Grounds"
prospect_for_rubber_desc:0 "The lands of [FROM.GetName] are teeming with wildlife. By setting up new hunting lodges and prospecting for new hunting grounds, we can increase our leather production."
prospect_for_mithril:0 "Prospect for Mithril"
prospect_for_mithril_desc:0 "The depths of [FROM.GetName] are rumored to be rich with veins of mithril. By sending out prospecting parties to search for this precious metal, we can increase our mithril reserves."
prospect_for_tungsten:0 "Prospect for Silk Sources"
prospect_for_tungsten_desc:0 "The scouts report that the lands of [FROM.GetName] are ideal for growing hemp or producing silk."
prospect_for_steel:0 "Prospect for Iron Deposits"
prospect_for_steel_desc:0 "The lands of [FROM.GetName] are rich in iron deposits. By sending out prospecting parties to locate and extract these resources, we can increase our iron production."
prospect_for_chromium:0 "Prospect New Lumber Resources"
prospect_for_chromium_desc:0 "There are vast forests in [FROM.GetName] that could be harvested for lumber. By setting up logging operations and prospecting for new lumber resources, we can increase our wood production."
prospect_for_coal:0 "Prospect for Coal"
prospect_for_coal_desc:0 "The lands of [FROM.GetName] are rich in coal deposits. By sending out prospecting parties to locate and extract these resources, we can increase our coal production."

plunder_erebor_desc:0 "The Lonely Mountain is a treasure trove of riches, and now it's all ours. Let us plunder the halls of Erebor and take what we can to bolster our own coffers and resources."
plunder_thranduils_halls_desc:0 "The halls of Thranduil are filled with treasures and resources that we can use to strengthen our own position. Let us plunder the halls of Thranduil and take what we can to bolster our own coffers and resources."
plunder_dale_desc:0 "The city of Dale is a prosperous and wealthy place, and now it's all ours. Let us plunder the city of Dale and take what we can to bolster our own coffers and resources."
plunder_barad_dur_desc:0 "The dark tower of Barad-dûr is a symbol of the power and might of Mordor. Let us plunder the tower and take what we can to bolster our own coffers and resources."

launch_winter_offensive_desc:0 "The cold is biting and the roads are treacherous. Let us take advantage of these conditions and launch a winter offensive against our enemies, catching them off guard and dealing a decisive blow to their forces."
launch_summer_offensive_desc:0 "The warm weather is upon us, and the roads are clear. Let us take advantage of these conditions and launch a summer offensive against our enemies, catching them off guard and dealing a decisive blow to their forces."

SPI_emergency_hatching_desc:0 "We have no time to spare! Let the small ones hatch, and unlesh the brood!"
SPI_maturing_eggs_desc:0 "Time is on our side. Let the eggs mature and hatch on their own schedule, ensuring the strongest and most viable offspring."
SPI_unleash_the_brood_select_desc:0 "The young ones are restless and hungry. It is time to let them hunt and feast."
SPI_unleash_the_brood_desc:0 "The young ones are restless and hungry. It is time to let them hunt and feast."
SPI_repurpose_spent_carpaces_desc:0 "Chitin doesn't grow on trees, you know! Let us repurpose the spent carpaces of our fallen brood to create new equipment."
hatch_the_great_eggs_desc:0 "The great eggs are ready to hatch. Let us witness the birth of new life and the continuation of our brood."
worker_brood_hatching_desc:0 "The worker brood is hatching. Let us ensure their safe emergence and integration into our society."

food_shortages_upcoming:0 "Imminent Food Shortages"
food_shortages_upcoming_desc:0 "Our food stockpiles have run out, and our population and army will suffer food shortages if we do not take action soon."
food_scarcity_upcoming:0 "Imminent Food Scarcity"
food_scarcity_upcoming_desc:0 "Our food stockpiles have remained empty for some time, and our population and army will suffer from food scarcity if we do not take action soon."
famine_upcoming:0 "Imminent Famine"
famine_upcoming_desc:0 "After months of food shortages and scarcity, our people are on the brink of famine. If we do not take action soon, widespread suffering and death will be inevitable."
food_rationing:0 "Food Rationing"
food_rationing_desc:0 "In times of war, we must make sacrifices to ensure the survival of our people. Food rationing is a necessary measure to ensure that everyone has access to the nourishment they need, even if it means cutting back on our usual consumption."
farm_subsidies:0 "Farm Subsidies"
farm_subsidies_desc:0 "The farmers of our lands are the backbone of our food production. By providing them with subsidies and support, we can ensure that they have the resources they need to produce enough food to feed our population and army."
emergency_weapons_stockpile:0 "Emergency Weapons Stockpile"
emergency_weapons_stockpile_desc:0 "We have stockpiled a reserve of weapons and equipment to be used in times of emergency. Now is the time to levy these stockpiles and bolster our forces with these reservese."
emergency_musters:0 "Emergency Musters"
emergency_musters_desc:0 "We have prepared a number of men who can quickly be levied in times of emergency. Now is the time to muster these."
delayed_war_declaration:0 "War Declaration"
delayed_war_declaration_desc:0 "Soldiers! Face to the enemy! We march to war."

mir_investigate_waystones:0 "Investigate Waystones"
mir_investigate_waystones_desc:0 "Our chief researcher has discovered the existence of so-called waystones, an ancient protective magic used by the elves of old from the time of the First Age. Let us investigate these waystones and see if we can harness their power to protect our lands and people."
mir_reforge_blade_of_oropher:0 "Reforge Blade Of Oropher"
mir_reforge_blade_of_oropher_desc:0 "We have found the shattered pieces of the legendary Blade of Oropher, a weapon of great power and significance. Let us reforge this blade and restore it to its former glory, so that it may serve as a symbol of our strength and resilience."
mir_complete_blade_of_oropher:0 "Complete Blade Of Oropher"
mir_complete_blade_of_oropher_desc:0 "We have secured the Mithril stones needed to complete the reforging of the Blade of Oropher. Let us finish this task and wield the blade once more in defense of our lands."
mir_investigate_the_suspicious_family:0 "Investigate The Suspicious Family"
mir_investigate_the_suspicious_family_desc:0 "An elven family living in the outskirts of the forest has been acting suspiciously. Let us investigate this family and see if they pose any threat to our people or lands."
mir_study_the_spiderling_caracass:0 "Study The Spiderling Caracass"
mir_study_the_spiderling_caracass_desc:0 "The spiderling we killed has a caracass that is unlike any other creature we've seen before. Let us study it and see if we can learn anything about its biology, behavior, or weaknesses."
mir_let_radagast_study_the_spiderling:0 "Let Radagast Study The Spiderling"
mir_let_radagast_study_the_spiderling_desc:0 "The spiderling we discovered on the fringes of the forest is a creature unlike any we've seen before. Let us bring it to Radagast and let him study it, so that we can learn more about its nature and how to deal with it."
mir_let_beastmaster_study_the_spiderling:0 "Let Beastmaster Study The Spiderling"
mir_let_beastmaster_study_the_spiderling_desc:0 "The spiderling we discovered on the fringes of the forest is a creature unlike any we've seen before. Let us bring it to the Beastmaster and let him study it, so that we can learn more about its nature and how to deal with it."
mir_investigate_the_anomaly:0 "Investigate The Anomaly"
mir_investigate_the_anomaly_desc:0 "A strange anomaly has taken root in the depths of the woods. Let us investigate this anomaly and see if it poses any threat to our lands and people, or if it holds any secrets that we can uncover."
mir_investigate_the_anomaly_2:0 "Investigate The Anomaly"
mir_investigate_the_anomaly_2_desc:0 "A strange anomaly has taken root in the depths of the woods. Let us investigate this anomaly and see if it poses any threat to our lands and people, or if it holds any secrets that we can uncover."
mir_excavate_the_anomaly:0 "Excavate The Anomaly"
mir_excavate_the_anomaly_desc:0 "The anomaly in the deep woods is an unusual rock formation that lies half-burried beneath the soil. Let us excavate this anomaly and see if there is anything hidden within it that could be of use to us."
mir_consult_the_ents:0 "Consult The Ents"
mir_consult_the_ents_desc:0 "The discovered anomaly has turned out to be half-buried stone giant from the Misty Mountains. The giants are precursors to the ents. Let us consult with the ents and see if they can shed any light on this discovery."
mir_wake_the_giant:0 "Wake The Giant"
mir_wake_the_giant_desc:0 "We have figured out a way that can (hopefully) bring the giant out of its slumber and under our control. Let us wake the giant and see if it can be an asset to us in our struggles against the forces of darkness."
mir_investigate_the_murder:0 "Investigate The Murder"
mir_investigate_the_murder_desc:0 "Lady Galadwen has been found dead under mysterious circumstances. Our initial investiagtions have brought only confusion and contradictory findings. It is clear that a deep rot has taken root in our court. Me must assume direct control over this investigation and get to the bottom of this."
food.1.t:0 "Bad Harvest"

food.1.d:0 "This summer has struck our fields with a bout of ill luck. A combination of weather and pests have destroyed much of our crops, severely hurting this year's yield."

food.1.a:0 "Let us hope our stores are enough to survive the winter."

food.3.t:0 "Food Riots"

food.3.d:0 "The population is starving and a wide-spread famine has gripped our country. The peasants have taken to the streets, rioting and burning. Several strongholds have been attacked and many soldiers, also starving, have joined their cause. We must address the lack of food, or risk further unrest."

food.3.a:0 "Not good."

RHUN_invasion_deterrence:0 "Invasion Deterrence"
MIR_domesticated_spiderling:0 "Domesticated Spiderling"
MIR_domesticated_spiderling_desc:0 "The elves have captured and domesticated an anomalous spiderling, making use of its unique properties to produce valuable spider silk."
MIR_sudied_spider_movements:0 "Spider Movements Studied"
MIR_sudied_spider_movements_desc:0 "The elves have been observing and studying the movements of the spiders in the Mirkwood, gaining valuable insights into their behavior and habits."
MIR_unresolved_murder:0 "Unresolved Murder"
MIR_unresolved_murder_desc:0 "A mysterious murder inside Thranduil's Halls has shaken the elves and the killer remains at large."
MIR_murder_resolved:0 "Murder Resolved"
MIR_murder_resolved_desc:0 "The murder of Lady Galadwen has been resolved and the killer brought to justice, restoring the people's faith in their governance."
generic_corruption:0 "Corruption"
generic_corruption_desc:0 "Corruption festers among the governing class of this country, hindering proper allocation of resources."
SPI_arachnid_adaptations_eq:0 "Arachnid Adaptations"
SPI_arachnid_adaptations_eq_desc:0 "The spiders have developed unique adaptations, enhancing their survival and predatory capabilities."
SPI_arachnid_adaptations_res:0 "Arachnid Adaptations"
SPI_arachnid_adaptations_res_desc:0 "The spiders have developed unique adaptations, enhancing their survival and predatory capabilities."
SPI_arachnid_adaptations_res_eq:0 "Arachnid Adaptations"
SPI_arachnid_adaptations_res_eq_desc:0 "The spiders have developed unique adaptations, enhancing their survival and predatory capabilities."
improved_fellowship_detection:0 "Improved Fellowship Detection"


GLD_eotheod_remnant:0 "Éothéod Remnant"
GLD_eotheod_remnant_desc:0 "Éothéod was once the land of the horse-lords, and the place of origin of the Rohirrim. While the latter have long since migrated south and established the kingdom in Rohan, there are still remnants of the Éothéod that remain in the Gladden fields. Like their Rohirrim descendants, these horse-lords are skilled riders and fierce warriors, and they have a deep connection to the land and the horses that roam it."
GLD_guardians_of_the_eyrie:0 "Guardians of the Eyrie"
GLD_guardians_of_the_eyrie_desc:0 "The Eyrie is a towering rock formation that rises up from the Gladden fields, and it is said to be the home of Gwaihir, the Lord of the Eagles, and his chieftains. The Great Eagles of the Eyrie are on good terms with the chiefdoms of the Gladden fields, who tend to them and offer them tribute in exchange for their protection and favor."
GLD_riders_of_the_vale:0 "Riders of the Vale"
GLD_riders_of_the_vale_desc:0 "Being descendants from the Rohirrim, Gladden men have gathered with enthusiasm at the prospect of helping out our brothers and volunteering in the defend of the motherland."
MIR_sindarin_court_silvan_realm:0 "Sindarin Court, Silvan Realm"
MIR_sindarin_court_silvan_realm_desc:0 "King Thranduil and his son Legolas are of a lineage of Sindarin high elves, but rule over a realm of predominantly Silvan elves. While their subjects are fiercely loyal, the Sindarin court sometimes struggles to fully mobilize the rustic woodland folk to their ambitions."
MIR_masters_of_the_mirkwood:0 "Masters of the Mirkwood"
MIR_masters_of_the_mirkwood_desc:0 "The Silvan Elves know every root, branch, and shadow of the great forest. Intruders who march under the canopy of Mirkwood rarely march out."
RGL_forest_vigils:0 "Forest Vigils"
RGL_forest_vigils_desc:0 "The men who inhabit the southern vales of the Anduin possess a deep connection with the Mirkwood forest. The Mirkwood is a wonderous and dangerous place, and the people of the vales have learned to respect and coexist with it."
VAL_skin_changers:0 "Skin Changers"
VAL_skin_changers_desc:0 "The Beornings of the northern vales are known for their unique ability to take on the form of a bear. This ability has been passed down through generations, and it is a source of pride and identity for the Beornings."
VAL_hardened_northmen:0 "Hardened Northmen"
VAL_hardened_northmen_desc:0 "While the Gladden fields and southern vales enjoy a more temperate climate, the lands north of the Greylin are harsh and unforgiving. The Beornings who inhabit these lands have adapted to the cold and rugged environment, becoming hardened and resilient people similar to the Forodwaithi."


