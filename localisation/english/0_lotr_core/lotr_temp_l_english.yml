recruit_more_hillmen_desc:0 "Rhudaur is relying on the hillmen to bolster its forces. In contrast to the Dunedain, the hillmen are less skilled in battle, but more numerous and are a hardy and resilient people, accustomed to the harsh conditions of the northern wilderness."
recruit_more_hillmen_2:0 "Recruit More Hillmen"
recruit_more_hillmen_2_desc:0 "Rhudaur is relying on the hillmen to bolster its forces. In contrast to the Dunedain, the hillmen are less skilled in battle, but more numerous and are a hardy and resilient people, accustomed to the harsh conditions of the northern wilderness."
political_discourse_desc:0 "This country is currently embroiled in a heated political discourse, with various factions and interest groups vying for influence and power."
by_our_own_hand_desc:0 "The men of Rhudaur have decided to rely on none but themselves to defend their lands. Unity binds them, and spirits are high. With the combined might of the Hillmen and the Dunedain, what need is there for allies?"
RHD_alone_we_fight_desc:0 "The world may not know it yet, but the true power of Middle Earth lies not with the glade-dwelling elves, or the forge-toiling orcs, but in the forests and hills of the north. Soon enough, even the great bastions of the south will acknowledge this reality, and bow before the might of the northern Dunedain and their hillmen allies."
RHD_new_purpose_desc:0 "Having fought side-by-side in ages past, the Dunedain of Rhudaur and northmen of Angmar have united once more under one banner. This time, their goals are not ones of belligerent conquest, but of mutual defense and prosperity."
RHD_peace_at_last_desc:0 "The shadows have been driven back from the plains of Arnor, and the people can finally breathe a sigh of relief. The threat of invasion and occupation has been lifted, and hopes are high for a new period of peace and stability."
RHD_arnor_rhudaur_recruitment_desc:0 "The men of Arthedain and Rhudaur have pooled their resources to extend their influence into isolated villages, searching for any capable of taking up arms and joining the fight against the encroaching darkness."
RHD_rallying_rangers_desc:0 "Rhudaur is rallying its rangers to the cause, calling on them to take up arms and defend their homeland against the encroaching darkness. The rangers, skilled in guerrilla warfare and adept at navigating the rugged terrain of the north."
RHD_dispersing_dunedain_desc:0 "Although the Dunedain still control and guard the lands of Rhudaur, their numbers have dwindled since the fall of Arnor, and they are spread thin across the vast wilderness. The remaining Dunedain are focused on protecting the core of their territory, and are less able to project power and influence into the outlying regions of Rhudaur."
RHD_rangers_villified_desc:0 "The Hillmen of Rhudaur have concluded that, obviously, one party is responsible for all of Rhudaur's hardships over the last centuries: the Dunedain. The rangers, with their aloof and secretive nature, have become the scapegoats for all of Rhudaur's problems, and are now widely vilified and distrusted by the general population."
RHD_the_dark_dunedain_desc:0 "The Hillmen of Rhudaur are on the path to war. The remaining Dunedain have either been exiled, or 'persuaded' of the righteousness of this new path."
RHD_stable_rangers_desc:0 "The Dunedain rangers of Rhudaur have consolidated their forces and reorganized their command structure, ensuring that they are better prepared to face the challenges ahead. The rangers are now more disciplined and efficient, and they are ready to take on any threats that may arise."
RHD_limited_intervention_idea:0 "Limited Intervention Idea"
RHD_limited_intervention_idea_desc:0 "The men of Rhudaur have long been wary of getting involved in the affairs of the outside world, but they are beginning to realize that in times of great peril, it is a fool's errand to remain idle."
RHD_limited_intervention_idea_2:0 "Limited Intervention Idea"
RHD_limited_intervention_idea_2_desc:0 "The men of Rhudaur have long been wary of getting involved in the affairs of the outside world, but they are beginning to realize that in times of great peril, it is a fool's errand to remain idle."
RHD_autarky_of_the_wild:0 "Autarky of the Wild"
RHD_autarky_of_the_wild_desc:0 "Rhudaur has long been a land of self-sufficient, hardy folk, and they have no intention of changing that. They will continue to rely on their own resources and ingenuity to survive and thrive in the harsh wilderness of the north."
RHD_improved_rangers:0 "Improved Rangers"
RHD_improved_rangers_desc:0 "The rangers of Rhudaur are among the best in Arnor. The rugged hills and dense forests of Rhudaur have honed their skills, making them formidable defenders of their homeland."
RHD_war_of_unification:0 "War of Unification"
RHD_war_of_unification_desc:0 "Rhudaur has embarked on a campaign to unify the lands of Arnor under one banner. This campaign is driven by a desire to restore the glory of Arnor and to create a strong, united front against the encroaching darkness. The war of unification is expected to be long and difficult, but the people of Rhudaur are determined to see it through to the end."
RHD_war_on_elves:0 "War on Elves"
RHD_war_on_elves_desc:0 "The men of Rhudaur are fed up with the arrogance and lack of support from the elves dwelling in Rivendell. So celebrated and revered Lord Elrond is among his people, but has he ever given to men that isn't contempt and dismissal? The time has come to put an end to this one-sided relationship."
generic_diplomacy_focus_desc:0 "This country is focusing on diplomacy, seeking to build alliances and improve relations with other nations."
food_shortages:0 "Food Shortages"
food_shortages_desc:0 "This country is suffering food shortages. If unaddressed, this could lead to famine and widespread suffering among the population."
food_scarcity:0 "Food Scarcity"
food_scarcity_desc:0 "This country is suffering from food scarcity. The limited availability of food is causing prices to rise and making it difficult for people to access the nourishment they need."
famine:0 "Famine"
famine_desc:0 "This country is experiencing a severe famine. The lack of food is causing widespread suffering and death among the population."
bad_harvest:0 "Bad Harvest"
bad_harvest_desc:0 "This country has experienced a bad harvest. The reduced agricultural output is leading to food shortages and economic difficulties."
generic_military_reorganization:0 "Military Reorganization"
generic_military_reorganization_desc:0 "This country is undergoing a military reorganization, aiming to improve efficiency and effectiveness in its armed forces."
generic_military_planning:0 "Military Planning"
generic_military_planning_desc:0 "This country is focusing on military planning, improving strategic capabilities and command efficiency."
generic_disrupted_leadership:0 "Disrupted Leadership"
generic_disrupted_leadership_desc:0 "This country is experiencing disrupted leadership, causing instability and uncertainty in governance."
generic_preparing_for_war:0 "Preparing For War"
generic_preparing_for_war_desc:0 "This country is preparing for war, mobilizing resources and strategizing for potential conflicts."
generic_prepared_defenses_active:0 "Prepared Defenses Active"
generic_prepared_defenses_active_desc:0 "This country has activated its prepared defenses, strengthening fortifications and defensive positions."
generic_military_mobilization:0 "Military Mobilization"
generic_military_mobilization_desc:0 "This country is undergoing military mobilization, calling up reserves and increasing readiness for conflict."
generic_military_mobilization_2:0 "Military Mobilization"
generic_military_mobilization_2_desc:0 "This country is undergoing military mobilization, calling up reserves and increasing readiness for conflict."
generic_military_buildup:0 "Military Buildup"
generic_military_buildup_desc:0 "This country is building up its military forces, increasing the size and capability of its armed forces."
generic_infrastructure_effort:0 "Infrastructure Effort"
generic_infrastructure_effort_desc:0 "This country is focusing on infrastructure development, improving road quality, bridges, and other critical facilities."
generic_construction_boost:0 "Construction Boost"
generic_construction_boost_desc:0 "This country is boosting its construction efforts, accelerating the development of buildings and infrastructure."
generic_industry_boost:0 "Industry Boost"
generic_industry_boost_desc:0 "This country is boosting its industrial capacity, increasing production efficiency and output."
generic_research_effort:0 "Research Effort"
generic_research_effort_desc:0 "This country is focusing on research and development, aiming to advance technology and knowledge."
