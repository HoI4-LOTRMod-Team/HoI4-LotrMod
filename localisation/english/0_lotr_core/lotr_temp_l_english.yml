GOB_lazy_workforce:0 "Lazy Workforce"
GOB_lazy_workforce_desc:0 "The goblins of the Misty Mountains lack the motivation or drive to toil away endlessly for their masters. They are content to do the bare minimum required of them, and they will often shirk their duties or find ways to avoid work whenever possible."
GOB_forced_labour:0 "Forced Labour"
GOB_forced_labour_desc:0 "The goblins have adopted a rather unkind solution to their lackluster labor force. A cracking whip, a spiked chain or the threat of starvation has stung the goblins into working harder, but not better."
GOB_overworked_laborforce:0 "Overworked Laborforce"
GOB_overworked_laborforce_desc:0 "The goblins of the Misty Mountains are overworked and exhausted, with little time for rest or leisure. While productivity is on the rise, so is discontent."
GOB_food_management_toarmy:0 "Food Management"
GOB_food_management_toarmy_desc:0 "With few sources of food in the underground, the goblins have had to become adept at managing their limited resources."
GOB_food_management_fromarmy:0 "Food Management"
GOB_food_management_fromarmy_desc:0 "With few sources of food in the underground, the goblins have had to become adept at managing their limited resources. The army, being the largest consumer of food, has been deprived of rations and forced to scavenge for food in the tunnels and caves of the Misty Mountains."
GOB_food_management_toarmy_fromciv:0 "Food Management"
GOB_food_management_toarmy_fromciv_desc:0 "With few sources of food in the underground, the goblins have had to become adept at managing their limited resources. The civilian population has been deprived of rations and forced to scavenge for food in the tunnels and caves of the Misty Mountains, while the army has been given priority access to the limited food supplies."
GOB_food_management_toarmy_tociv:0 "Food Management"
GOB_food_management_toarmy_tociv_desc:0 "With few sources of food in the underground, the goblins have had to become adept at managing their limited resources. Nevertheless, promises have been made to both the civilian and army populations that they will receive their fair share of the limited food supplies, and efforts have been made to ensure that both groups are adequately fed."
GOB_food_management_fromarmy_fromciv:0 "Food Management"
GOB_food_management_fromarmy_fromciv_desc:0 "With few sources of food in the underground, the goblins have had to become adept at managing their limited resources. Both the civilian and army populations have been deprived of rations and forced to scavenge for food in the tunnels and caves of the Misty Mountains."
GOB_food_management_fromarmy_tociv:0 "Food Management"
GOB_food_management_fromarmy_tociv_desc:0 "With few sources of food in the underground, the goblins have had to become adept at managing their limited resources. The army, being the largest consumer of food, has been deprived of rations in favor of the civilian population."
GOB_food_management_DUMMY_tociv:0 "Food Management"
GOB_food_management_DUMMY_tociv_desc:0 ""
GOB_food_management_DUMMY_fromciv:0 "Food Management"
GOB_food_management_DUMMY_fromciv_desc:0 ""
GOB_high_pass_contract:0 "High Pass Contract"
GOB_high_pass_contract_desc:0 "This country has been granted passage through the High Pass by the goblins of Goblin Town in exchange for a hefty tribute. This contract allows for the free movement of goods and people through the High Pass."
GOB_underground_isolation:0 "Underground Isolation"
GOB_underground_isolation_desc:0 "The goblins of the Misty Mountains live deep underground, in a network of tunnels and caves. The developments occuring in the outside world have little to no impact on their lives, and they are largely cut off from the affairs of the surface world."
GOB_tunnel_lord_division:0 "Tunnel Lord Division"
GOB_tunnel_lord_division_desc:0 "The tunnel lords are the most powerful and influential members of goblin society. All of them want to be king, and none of them likes whoever is currently the king. This turbulent arrangement of power has led to a constant state of infighting and intrigue among the tunnel lords, as they plot and scheme against each other in an attempt to gain the throne. Only a king capable of paying them off and keeping them in line can hope to maintain any semblance of stability in Goblin Town."
GOB_tunnel_lord_division_2:0 "Tunnel Lord Division"
GOB_tunnel_lord_division_2_desc:0 "The tunnel lords are the most powerful and influential members of goblin society. All of them want to be king, and none of them likes whoever is currently the king. This turbulent arrangement of power has led to a constant state of infighting and intrigue among the tunnel lords, as they plot and scheme against each other in an attempt to gain the throne. Only a king capable of paying them off and keeping them in line can hope to maintain any semblance of stability in Goblin Town."
GOB_tunnel_lord_division_3:0 "Tunnel Lord Division"
GOB_tunnel_lord_division_3_desc:0 "The tunnel lords are the most powerful and influential members of goblin society. All of them want to be king, and none of them likes whoever is currently the king. This turbulent arrangement of power has led to a constant state of infighting and intrigue among the tunnel lords, as they plot and scheme against each other in an attempt to gain the throne. Only a king capable of paying them off and keeping them in line can hope to maintain any semblance of stability in Goblin Town."
GOB_the_last_stand:0 "The Last Stand"
GOB_the_last_stand_desc:0 "The goblins of the Misty Mountains are a fierce and stubborn people, and they will not take kindly to being occupied by an outside force. If the goblins feel that their way of life is under threat, they will fight to the death."
GOB_power_vacuum:0 "Power Vacuum"
GOB_war_loans_provider:0 "War Loans Provider"
GOB_sabotaged_trade:0 "Sabotaged Trade"

GUN_wounded_pride_1_desc:0 "One hundred years ago, the orcs of Gundabad, under Azog, were soundly defeated at the Battle of the Five Armies. The wounds of that defeat still fester and a deep sense of resentment and defeatism has taken root. Only vengeance or a new victory can heal the wounded pride of Gundabad."
GUN_wounded_pride_2_desc:0 "One hundred years ago, the orcs of Gundabad, under Azog, were soundly defeated at the Battle of the Five Armies. The wounds of that defeat still fester and a deep sense of resentment and defeatism has taken root. Only vengeance or a new victory can heal the wounded pride of Gundabad."
GUN_wounded_pride_3_desc:0 "One hundred years ago, the orcs of Gundabad, under Azog, were soundly defeated at the Battle of the Five Armies. The wounds of that defeat still fester and a deep sense of resentment and defeatism has taken root. Only vengeance or a new victory can heal the wounded pride of Gundabad."
GUN_hopes_of_a_new_kingdom:0 "Hopes Of A New Kingdom"
GUN_hopes_of_a_new_kingdom_desc:0 "After having been reduced to a disorganized, demoralized horde of stragglers, the orcs of Gundabad have been inspired by the recent resurgence of their kin in Mordor. They hope that they too can rise up and reclaim their former glory, and they look to a new leader to guide them on this path."
GUN_army_of_vengeance_desc:0 "The armies of Gundabad advance with a single focus: Revenge. When the dust has settled, they must be victorious or all be killed."
GUN_gundabad_expedition_desc:0 "As the orcs languish in the dark recesses of the ancient stronghold and fight among each other, a brave band of locals seeks to gather support for a decisive attack to reclaim the fortress and drive the it's occupiers out for good."
GUN_orc_stragglers_desc:0 "The orcs have been driven out of the old fortress, but many groups of stragglers still infest the surrounding countryside."
GUN_hardy_people_desc:0 "The people of Gundabad are accustomed to harsh winters and difficult living conditions."
GUN_no_boldogs_desc:0 "It is said that Azog may have been a Maiar who took the form of an orc, becoming a creature sometimes referred to as a Boldog. The defeat and ruin Azog brought about has invoked a consensus of never again to fall for such messianic reputation."
GUN_moving_supplies_desc:0 "As the armies of Gundabad fight in near and distant lands, the orcs have organized supply depots and carts to ensure a steady flow of resources and reinforcements."
GUN_azog_legacy_desc:0 "The legacy of Azog, the White Orc, still looms large over Gundabad. His name is both feared and revered among the orcs, and his deeds are often cited as a source of inspiration and motivation for the orcs of Gundabad."
GUN_propaganda_campaign_desc:0 "Gundabad leadership has opted for an approach of slowly but steadily instill a sense of pride and hope in the orcs of Gundabad."
GUN_power_vacuum_1_desc:0 "After the deaths of Azog and Bolg, Gundabad leadership has been hard-pressed to find a new figurehead to rally the orcs around. The resulting power vacuum has led to a state of disarray and infighting among the orcs, as no orc has proven to be as strong and inspirational as their fallen leaders."
GUN_power_vacuum_revo:0 "Incoherent Leadership"
GUN_power_vacuum_revo_desc:0 "Unable to replace the charismatic and powerful figures of Azog and Bolg, Gundabad's orcs follow no one leader, and instead are divided into various factions and warbands. Whoever wields the largest club or the sharpest blade is the one who gets to call the shots."
GUN_power_vacuum_revo_2:0 "Power Vacuum"
GUN_power_vacuum_revo_2_desc:0 "Unable to replace the charismatic and powerful figures of Azog and Bolg, Gundabad's orcs follow no one leader, and instead are divided into various factions and warbands. Whoever wields the largest club or the sharpest blade is the one who gets to call the shots."
GUN_power_vacuum_2_desc:0 "After the deaths of Azog and Bolg, Gundabad leadership has been hard-pressed to find a new figurehead to rally the orcs around. The resulting power vacuum has led to a state of disarray and infighting among the orcs, as no orc has proven to be as strong and inspirational as their fallen leaders."
GUN_a_kingdom_of_orcs_desc:0 "After a long period of disarray and infighting, the orcs of Gundabad have recovered and formed a new, orcish kingdom to rival that of old."
GUN_prepare_against_the_necromancer_desc:0 "After having been expelled from Mordor, Sauron the Necromancer, has taken up residence in nearby Angmar, intent on subjugating the lands of the north and eventually reclaiming his former realm. The orcs of Gundabad, having cast off the yoke of previous tyrants, are now preparing to face this new threat and defend themselves against the Necromancer's ambitions."
GUN_orc_infighting:0 "Orc Infighting"
GUN_orc_infighting_desc:0 "Exasperated by foreign expeditionaries, the orcs of Gundabad are fighting heavily among themselves over every last scrap. The resulting infighting has led to a state of disarray and weakness, making them vulnerable to external threats and invasions."
GUN_new_army_of_the_mountain_desc:0 "The new inhabitants of Gundabad have done much to rebuild this ancient realm. But only a new, well provisioned army will ensure this endeavor will last."
GUN_new_army_of_the_mountain_2:0 "New Army Of The Mountain"
GUN_new_army_of_the_mountain_2_desc:0 "The new inhabitants of Gundabad have done much to rebuild this ancient realm. But only a new, well provisioned army will ensure this endeavor will last."
GUN_symbol_of_hope_desc:0 "The old fortress stands liberated of orc occupiers, and the people of Gundabad have reclaimed their ancestral home. The old fortress, once a symbol of defeat and despair, now stands as a symbol of hope and resilience for the orcs of Gundabad."
GUN_old_forges_desc:0 "The ancient forges of Gundabad, long dormant, have been rekindled, providing the inhabitants with the means to craft weapons and armor once more."
GUN_old_mines_desc:0 "The old mines of Gundabad, rich with valuable minerals, have been reopened, ensuring a steady supply of resources for the kingdom."


