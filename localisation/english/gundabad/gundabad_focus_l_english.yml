#Focuses
GUN_the_fate_of_gundabad:0 "The Fate of Gundabad"
GUN_the_fate_of_gundabad_desc:0 "Will Gundabad remain a festering stronghold of Orcish savagery, or will the ancient mountain be reclaimed by those who seek to restore its lost glory?"
GUN_army_effort:0 "Army Effort"
GUN_army_effort_desc:0 "Our war-bands are many, but disorganized. We must impose a brutal discipline, teaching our warriors not just how to fight, but how to fight as a cohesive, fearsome host."
GUN_equipment_effort:0 "Equipment Effort"
GUN_equipment_effort_desc:0 "Our weapons are simple, but their numbers will overwhelm. Let the forges produce endless spears, shields, and the great engines of war."
GUN_cavalry_effort:0 "Cavalry Effort"
GUN_cavalry_effort_desc:0 "Though the mountains are our fortress, the lands beyond demand swift deployment. A stronger mounted force will allow us to strike hard and fast, where our enemies least expect."
GUN_doctrine_effort:0 "Doctrine Effort"
GUN_doctrine_effort_desc:0 "Raw strength must be guided by shrewd thought. This initiative aims to codify our most effective tactics, ensuring our warriors fight not just with might, but with cunning."
GUN_equipment_effort_2:0 "Equipment Effort II"
GUN_equipment_effort_2_desc:0 "Our smiths have learned from their crude beginnings. Now, the axes are sharper, the shields thicker."
GUN_cavalry_effort_2:0 "Cavalry Effort II"
GUN_cavalry_effort_2_desc:0 "Horses are pretty cool, so we should use cavalry."
GUN_doctrine_effort_2:0 "Doctrine Effort II"
GUN_doctrine_effort_2_desc:0 "More doctrines yay!"
GUN_equipment_effort_3:0 "Equipment Effort III"
GUN_equipment_effort_3_desc:0 "Yeah, okay, just research better infantry equipment or something."
GUN_armor_effort:0 "Armor Effort"
GUN_armor_effort_desc:0 "No it's not called Cavalry Effort III. I didn't want it to be. So there."
GUN_special_forces:0 "Special Forces"
GUN_special_forces_desc:0 "These guys are good at everything."
GUN_to_improve_our_production:0 "To improve our production"
GUN_to_improve_our_production_desc:0 "Our factories are slow and their output lacking, we need new ideas and innovation if we are to keep up with the needs of our country."
GUN_infrastructure_investment:0 "Infrastructure Investment"
GUN_infrastructure_investment_desc:0 "To move our warbands swiftly across the passes and to ensure our supplies reach the front, the mountain paths must be tamed."
GUN_more_production_research:0 "More production research"
GUN_more_production_research_desc:0 "Quantity is our might. Our taskmasters and engineers are tasked with a simple goal: find new methods, however crude, to churn out more tools and arms than ever before."
GUN_civilian_production:0 "Civilian Production"
GUN_civilian_production_desc:0 "A brief respite from conquest to ensure the flow of essential, if crude, materials. Our forces must be fed and equipped, somehow."
GUN_more_civilian_production:0 "More Civilian Production"
GUN_more_civilian_production_desc:0 "We can hardly stop at only a few civilian factories, after all, we need as many of these as possible to produce more very necessary things."
GUN_military_production:0 "Military Production"
GUN_military_production_desc:0 "Military factories are necessary if we aim to produce enough weapons and armor to fill the needs of our armies."
GUN_more_military_production:0 "More Military Production"
GUN_more_military_production_desc:0 "It is necessary to have more production of weapons in Gundabad, as it is we can hardly produce more than 3 different kinds of weapons at time but with more forgeries our capabilities will be further streamlined."
GUN_focus_on_civilian_industry:0 "Prioritize Civilian Industry"
GUN_focus_on_civilian_industry_desc:0 "The civilian industry should take precedence over the military, our people are more important than the army's production."
GUN_focus_on_military_industry:0 "Prioritize Military Industry"
GUN_focus_on_military_industry_desc:0 "The military industry should take precedence over the civilian, our army is more important than the people's production."
GUN_make_room_in_the_mountain:0 "Make room in the Mountain"
GUN_make_room_in_the_mountain_desc:0 "Our industries demand more than what is readily available. We must delve deeper into the mountain's core, making room for expanded workshops, armories, and habitations."
GUN_settle_our_internal_economy:0 "Settle our Internal Economy"
GUN_settle_our_internal_economy_desc:0 "We will establish a great and prosperous market in the depths of Mount Gundabad. Our capital will become a great beacon of trade vitality."
GUN_the_orcs_of_the_north:0 "The Orcs of the North"
GUN_the_orcs_of_the_north_desc:0 "The northern orcs are a brutal breed. Weathered and tempered to living in the mountains and snow, used to hunting animals and dwarves alike through the cold."
GUN_follow_the_strong:0 "Rule of Strength"
GUN_follow_the_strong_desc:0 "Strength and power of the individuals will lead Gundabad to a powerful tommorrow. The strong leaders of Gundabad's past brought us to our heights and those of the future will do so again."
GUN_the_largest_and_strongest:0 "The Largest and the Strongest"
GUN_the_largest_and_strongest_desc:0 "New breeds of trolls have been spotted in the north, hulking brutes who can break walls and tear down trees with their hands."
GUN_reinvigorate_the_broken_kingdom:0 "Reinvigorate the broken Kingdom"
GUN_reinvigorate_the_broken_kingdom_desc:0 "Gundabad needs a purpose, a drive that will once again light the flames of war under our armies."
GUN_spread_gradual_propaganda:0 "Slow Burning Flame"
GUN_spread_gradual_propaganda_desc:0 "The masses are fickle, easily swayed by the loudest roar. But true loyalty, the kind that burns deep and long, is forged in whispers and promises, not just threats."
GUN_hate_and_violence:0 "Rage and Contempt"
GUN_hate_and_violence_desc:0 "Whispers won't win wars; only raw, unbridled hatred will. Let every Orc embrace the rage and contempt that defines us, and unleash it upon the world."
GUN_strengthen_our_leadership:0 "Empower Army Leaders"
GUN_strengthen_our_leadership_desc:0 "From the depths of Gundabad rise those destined to lead our armies. By elevating the most proven and ferocious of our warlords, we shall bring order to our ranks and terror to our foes."
GUN_the_reawakened_kingdom:0 "The Reawakened Kingdom"
GUN_the_reawakened_kingdom_desc:0 "No longer a scattered host, a new banner unfurls over the peaks. A disciplined and formidable Orc kingdom is born, ready to cast its shadow far and wide."
GUN_exert_the_wrath_of_the_orcs:0 "Exert the Wrath of the Orcs"
GUN_exert_the_wrath_of_the_orcs_desc:0 "Rise! Orcs of the north. Rise! bring fear and death to our enemies. Rise! take middle earth with vengeance and force. Rise Gundabad and destroy!"
GUN_declare_a_new_king_of_orcs:0 "Declare a new King of Orcs"
GUN_declare_a_new_king_of_orcs_desc:0 "The time for squabbling chieftains is over. The northern orcs demand a strong hand, a true leader to command their wrath and carve out a new dominion."
GUN_legacy_of_azog:0 "The Legacy of Azog"
GUN_legacy_of_azog_desc:0 "Azog, though he ruled from Khazad-dûm was strong in size and will, he brought great unity to the orcs. His son Bolg, ruled Gundabad in our last age of power. These symbols will represent our strength as we drive Gundabad to a glorious tommorrow."
GUN_we_need_not_follow_others:0 "We Break Before We Bend"
GUN_we_need_not_follow_others_desc:0 "Orcs of the North! Will you be dogs for the Southron masters, or wolves of your own pack? Our fangs are sharp, our claws keen. We will break, but never bend to another's will."
GUN_the_strength_of_others:0 "Strength in Allies"
GUN_the_strength_of_others_desc:0 "We know that Gundabad has never been the strongest force in Middle Earth. We are nothing without Morgoth before us and he has greater followers than we among the the rulers of the world."
GUN_follow_angmar:0 "Follow Angmar"
GUN_follow_angmar_desc:0 "Just to the west of us is the realm of Angmar, who, led by the Witch-King conquered much of Eriador with the power of their armies."
GUN_bow_to_saruman:0 "Bow to the White Wizard"
GUN_bow_to_saruman_desc:0 "The White Wizard Saruman, has power and cunning, he controls others and domineers them to do his will. Saruman is strong and we would do well to bend the knee to him."
GUN_join_sauron:0 "Submit to the Dark Lord"
GUN_join_sauron_desc:0 "The Dark Lord Sauron, Lord of the Rings, has once again declared himself in the south in Mordor. His power threatens all of Middle Earth who do not fight with him, we will take up his fight."
GUN_invite_the_men_of_the_anduin:0 "Invite the men of the Anduin"
GUN_invite_the_men_of_the_anduin_desc:0 "Those woodsmen who live between the Misty Mountains and the Mirkwood are of great resolve and have proved themselves to be capable of following the dark lord's teachings. They will be a great ally in wars to come."
GUN_follow_the_many:0 "Follow the Many"
GUN_follow_the_many_desc:0 "The masses of Gundabad orcs hunger for their own freedom and an end of sovreign orc lords."
GUN_strength_in_numbers:0 "Strength in Numbers"
GUN_strength_in_numbers_desc:0 "The strength in an army or nation always comes from the number of individuals in it. A hundred men would have no easily defeat a gorilla, and men have but a fraction of the instinct for battle of an orc."
GUN_no_more_boldogs:0 "No more Boldogs"
GUN_no_more_boldogs_desc:0 "It is said that Azog may have been a Maiar who took the form of an orc, becoming a creature sometimes reffered to as a Boldog. It is certain that Azog and Bolg after him did not accomplish much for the good of Gundabad, bringing war and defeat. It would be unthinkable to travel that road again and trust another overzealous orc with too much power."
GUN_the_orc_revolution_abroad:0 "Support Orc Insurrections"
GUN_the_orc_revolution_abroad_desc:0 "Orc. Together. Strong."
GUN_depose_the_old_government:0 "Depose the old government"
GUN_depose_the_old_government_desc:0 "The old ways of ruling orcs and subservient mobs are over. Orc kings have never amounted to great victories in the past and therefore we should get rid of them. The free orcs of Gundabad shall form a government of our own and lead our nation to greatness."
GUN_a_force_of_the_revolution:0 "A force of the revolution"
GUN_a_force_of_the_revolution_desc:0 "The strength of the orc revolution is not to be downplayed. We have overthrown our own previous government and now turn our attention to the monarchs and rulers of those countries on the borders of our nation."
GUN_join_mordors_revolution:0 "Join the Orcs of Mordor"
GUN_join_mordors_revolution_desc:0 "The Mordor orcs have united and thrust Sauron from his tower. They have formed a government of their own with the good of the revolutionary orcs at its center. We should recognize their strength and seek to ally ourselves with it."
GUN_form_a_union_of_orcs:0 "Form a Union of orcs"
GUN_form_a_union_of_orcs_desc:0 "We need an international body, something capable of organizing the orc revolution internationally."
GUN_invite_moria_orcs:0 "Invite the Orcs of Moria"
GUN_invite_moria_orcs_desc:0 "The Orcs of Moria, having cast off their old chains, are ripe for a grand alliance. Their countless numbers will make our mountains tremble with a new, unified purpose."
GUN_invite_the_woodsmen:0 "Invite the Woodsmen"
GUN_invite_the_woodsmen_desc:0 "Having declared their revolutionary ideology, the woodsmen of the great river have earned our respect and we would do well to suggest an alliance with them."
GUN_wary_of_the_necromancer:0 "Be Wary of the Necromancer"
GUN_wary_of_the_necromancer_desc:0 "Reports talk of the recent arrival of a necromancer in Carn Dum to our west, we are unsure of this necromancer's exact identity but the timing of his arrival in Angmar is suspicious at best."
GUN_he_must_be_defeated:0 "Resist Sauron's Will"
GUN_he_must_be_defeated_desc:0 "The Necromancer in question does indeed seem increasingly likely to be the dark lord Sauron, returned after his defeat by the orcs of Mordor."
GUN_sauron_will_fall:0 "Topple the Dark Lord"
GUN_sauron_will_fall_desc:0 "He has been defeated by the orcs of Mordor in the past, now it is time for us to prove our mettle and remove Sauron from the equation once and for all."
GUN_quarrel_with_the_beornings:0 "Quarrel with the Beornings"
GUN_quarrel_with_the_beornings_desc:0 "The people of the vales of Anduin have on many occations interferred with the expansion of the territory of the norther orcs. They took issue with us first, we just mean to finish it."
GUN_reach_to_the_mountains:0 "Reach to the mountains"
GUN_reach_to_the_mountains_desc:0 "The Misty Mountains are to belong to the orcs of the north. Gundabad shall again be the central point from which the armies of orcs march over the mountains from north to south."
GUN_ready_a_force:0 "Ready a force"
GUN_ready_a_force_desc:0 "If we are to take the Misty Mountains from those occupiers who currently inhabit them, we need to first be prepared to strike with the force necessary to take them."
GUN_seize_the_misty_mountains:0 "Seize the Misty Mountains"
GUN_seize_the_misty_mountains_desc:0 "We are the rightful owners of the Misty Mountains. Those who would stand between us and our rightful claim will be slaughtered and driven away."
GUN_integrate_the_northern_mountains:0 "Integrate the northern mountains"
GUN_integrate_the_northern_mountains_desc:0 "The first step in securing the Misty Mountains has been achieved, with this foothold in the mountains we are well on the way to securing our goals."
GUN_integrate_the_southern_mountains:0 "Integrate the southern mountains"
GUN_integrate_the_southern_mountains_desc:0 "Finally we have succeeded in gaining those parts of the mountains which we set out to take, from here we can prepare a greater army to secure our future in Middle Earth."
GUN_supply_the_moving_front:0 "Supply the Moving Front"
GUN_supply_the_moving_front_desc:0 "To keep them moving, we must ensure the tunnels are clear and the convoys rumble forward, laden with fresh arms and rations."
GUN_remember_the_battle:0 "Remember the Defeat"
GUN_remember_the_battle_desc:0 "The stench of defeat still hangs heavy in the mountain air. Though decades have passed, the humiliation of that day burns in every Orc's memory. We will not forget who spilled our blood."
GUN_what_could_have_been_ours:0 "What could have been ours"
GUN_what_could_have_been_ours_desc:0 "If the Battle of the Five armies had gone differently, Gundabad could well now rule over the entire north of Middle Earth."
GUN_regather_strength:0 "Regather strength"
GUN_regather_strength_desc:0 "We have yet to recover from our defeat at the Battle of the Five Armies, our strength is waned and must be heightened before we can again wage war across the north."
GUN_an_army_of_vengeance:0 "An army of vengeance"
GUN_an_army_of_vengeance_desc:0 "The musters of Gundabad seek only to reek havoc on those who defeated them in the past, our conquest will be inexorable and our revenge absolute."
GUN_no_more_eagles:0 "No more Eagles"
GUN_no_more_eagles_desc:0 "The great eagles joined our enemies during our defeat, we will not suffer them to continue their aerial dominance."
GUN_the_army_of_the_wargs:0 "The army of the Wargs"
GUN_the_army_of_the_wargs_desc:0 "Our allies during the Battle of the Five Armies, the Wargs joined the Orcs to make up two of the five. Orcs have long rode into battle on the backs of wargs and our two races have been allies in many past battles."
GUN_knowledge_and_conquest:0 "Knowledge and Conquest"
GUN_knowledge_and_conquest_desc:0 "Warfare leads in many ways to technological advancements. For the orcs, warfare means conquest which in turn means taking technology from those who are conquered."
GUN_kill_the_shapechanger:0 "Kill the Shapechanger"
GUN_kill_the_shapechanger_desc:0 "Beorn's impudence in joining the Battle of the Five armies shall not be forgotten. He will fall to our power and forever regret his decision."
GUN_vengeance_on_erebor:0 "Attack the Lonely Mountain"
GUN_vengeance_on_erebor_desc:0 "Let us prove once and for all which of the two mountains is stronger."
GUN_core_erebor:0 "Core Erebor"
GUN_core_erebor_desc:0 "The Lonely Mountain should be ours and we alone should rule from erebor's halls."
GUN_death_to_the_dwarves:0 "Death to the Dwarves"
GUN_death_to_the_dwarves_desc:0 "The race of Dwarves have wronged the orcs in ways beyond measure. Aule should have destroyed them with his hammer rather than set them in the mountains. They are a curse and a blight on Middle Earth who do not deserve to persist."
GUN_target_thranduil:0 "Assault the Elven King's Halls"
GUN_target_thranduil_desc:0 "The halls of Mirkwood stand as a challenge. We accept. Soon, Thranduil will learn that even the keenest elven eyes cannot see past the might of a charging orc horde."
GUN_core_northern_mirkwood:0 "Core northern Mirkwood"
GUN_core_northern_mirkwood_desc:0 "The north of Mirkwood, near by the Lonely Mountain and lake town will make an addition to Gundabad's other gains through war."
GUN_destroy_the_bardings:0 "Destroy the Bardings"
GUN_destroy_the_bardings_desc:0 "Bard and his people drove the great Smaug out of The Lonely Mountain, then their force as one of the five armies fought the orcs of Gundabad on the slopes in front of the gates of Erebor. They must die."
GUN_core_dale:0 "Core Dale"
GUN_core_dale_desc:0 "We will take Esgaroth as a repayment for having been sent back to our own mountain and being kept away by the people of Dale."
GUN_the_gundabad_expedition:0 "The Gundabad Expedition"
GUN_the_gundabad_expedition_desc:0 "In the wake of the Battle of the Five Armies, the orcs of Gundabad were weakened severely. Since then, though they have regathered some base levels of organization, they remain weak and unable to properly raise armies or be a large threat. If there has ever been a time to get rid of the orcs forever, that time is now."
GUN_a_message_to_angmar:0 "Seek Angmar's Support"
GUN_a_message_to_angmar_desc:0 "As the men of Angmar build their nation, scarred by wars of their past, a band of expeditionaries approach them with a proposal."
GUN_a_message_to_beorn:0 "Seek Beorning Support"
GUN_a_message_to_beorn_desc:0 "As Beorn sits in his great home, chops wood in the forest and defends his borders from orcish invasions, a small party approaches him with an interesting question."
GUN_a_message_to_erebor:0 "Secure Support from Erebor"
GUN_a_message_to_erebor_desc:0 "Dain Ironfoot sits in the great halls of the Lonely Mountain, his great kingdom drawing dwarves from across Middle Earth to gather here in Erebor. The great doors of his hall are opened and a travel worn band is allowed to approach him with their proposition."
GUN_stage_a_major_distraction:0 "Stage a major distraction"
GUN_stage_a_major_distraction_desc:0 "We will stage a large raid on the main orc encampment from the north and try to draw their forces out."
GUN_study_the_enemy:0 "Study the enemy"
GUN_study_the_enemy_desc:0 "To learn to defeat the orcs, we must understand their ways and study their habits."
GUN_infiltrate_the_orcs:0 "Infiltrate the Orcs"
GUN_infiltrate_the_orcs_desc:0 "We will send a spy to infiltrate the orcish government and work against them from the inside."
GUN_raid_orc_infrastructure:0 "Raid Orcish Supplylines"
GUN_raid_orc_infrastructure_desc:0 "By destroying their roads and taking out their infrastructure systems, we will significantly weaken the orcs' ability to fight back against us."
GUN_the_impossible_task:0 "The impossible task"
GUN_the_impossible_task_desc:0 "Without the aid of any of the larger nations, the expedition's goals seem impossible, but that will not stop us from continuing our efforts to remove the orcs from Gundabad."
GUN_the_new_inhabitants:0 "Reclaim the Fortress"
GUN_the_new_inhabitants_desc:0 "The final push was successful, and Gundabad is ours! The stench of orcs will surely linger, but now we can finally begin the monumental task of sweeping out the filth and establishing a proper home. The mountain is ours, truly."
GUN_the_dwarves_of_gundabad:0 "The Dwarves of Gundabad"
GUN_the_dwarves_of_gundabad_desc:0 "After long centuries of exile and torment, the halls of Gundabad echo once more with the voices of their true masters. The mountain has been reclaimed, and our kin have returned."
GUN_home_of_the_dwarves:0 "Home of the Dwarves"
GUN_home_of_the_dwarves_desc:0 "It was in Gundabad that Durin first awoke from his sleep, Gundabad has for long ages been a stronghold of the dwarves. Overthrown it was cast into the shadow of the orcs; but now it is given back at last to the dwarves"
GUN_mine_for_mithril:0 "Mine for Mithril"
GUN_mine_for_mithril_desc:0 "The old tunnels echo with new sounds: the ringing of picks, the rumble of rock. After centuries, the gleaming veins of Mithril are once more exposed to Dwarven eyes."
GUN_reignite_the_old_forges:0 "Reignite the Old Forges"
GUN_reignite_the_old_forges_desc:0 "Deep in the bowels of the old Gundabad ruins still lie the ancient dwarven forges, huge anvils and great furnaces built to smelt the weapons and tools of old."
GUN_reopen_the_old_mines:0 "Reopen the Old Mines"
GUN_reopen_the_old_mines_desc:0 "The hardest part of reopening the old mines is just finding them, searching behind every cave-in that has happened over the years of neglect to find if they hide the long tunnels of a mine."
GUN_search_for_mithril:0 "Search for Mithril"
GUN_search_for_mithril_desc:0 "We know for sure that Mithril lies under the misty mountains, it is simply a matter of finding it in the depths of the Gundabad mines."
GUN_further_iron_mining:0 "Expand Iron Mining"
GUN_further_iron_mining_desc:0 "With the mines reopened we will be able to dig out more iron to make up for the economical cost of waging war on the orcs."
GUN_join_erebor:0 "Join Erebor"
GUN_join_erebor_desc:0 "Erebor helped us to drive the orcs from the mountain. Even now a great portion of our armies come from the halls of the Lonely Mountain. By allying ourselves with Erebor, we greatly strengthen the dwarven realms through unity."
GUN_befriend_durin:0 "Befriend Durin"
GUN_befriend_durin_desc:0 "Gundabad was the place where Durin awoke long ago. Greatest of dwarven kind, Gundabad's legacy as a dwarven home is entirely due to Durin. Gundabad's friendship with Durin is a show of our legitimacy as a dwarvan dwelling."
GUN_invite_him_to_our_faction:0 "Join Causes with Ered Luin"
GUN_invite_him_to_our_faction_desc:0 "Perhaps we can persuade Durin VII to join forces with us again and ally himself with Gundabad."
GUN_the_men_of_gundabad:0 "The Men of Gundabad"
GUN_the_men_of_gundabad_desc:0 "The echoes of the Eotheod resonate through the mountain once more. Though Gundabad has been scarred by generations of Orcish defilement, the spirit of Men shall reclaim it for their own."
GUN_human_lead_industry:0 "Mannish Industry"
GUN_human_lead_industry_desc:0 "Human ingenuity is our greatest resource. From simple logging camps to burgeoning smithies, Mannish industry will rise, carving out a new economic future in the very heart of the Misty Mountains."
GUN_welcome_more_people:0 "Invite More Settlers"
GUN_welcome_more_people_desc:0 "Centuries of desolation have left Gundabad barren of honest folk. A great effort is required to re-people these forgotten lands, transforming them from a war-torn stronghold into a vibrant, living realm."
GUN_join_angmar:0 "Join Angmar"
GUN_join_angmar_desc:0 "Angmar, though they have acted against the greater good in the past, have now declared their renouncement of the Witch King and have created their own alliance in the north."
GUN_the_victorious_expedition:0 "A Victorious Expedition"
GUN_the_victorious_expedition_desc:0 "The banners of our folk now fly high above the peak. The expedition has been arduous, but our victory is undeniable and absolute."
GUN_a_hardy_people:0 "A Hardy People"
GUN_a_hardy_people_desc:0 "The continuous skirmishes with the orcs have made the people of the Gundabad expedition into a strong and powerful culture. Dependent on nothing but themselves, the expedition members are capable and used to a hard life."
GUN_a_strong_new_government:0 "Inspirational Leadership"
GUN_a_strong_new_government_desc:0 "The strong new nation that we hope to build requires a strong new government to create and rule over it."
GUN_the_expeditions_knowledge:0 "The Expedition's Knowledge"
GUN_the_expeditions_knowledge_desc:0 "They say that necessity is the mother of invention. The expedition needed many things throughout the war, and their ingenuity in finding creative solutions to their problems is what finally let them be victorious."
GUN_hunt_down_the_orcs:0 "Hunt Down Orc Stragglers"
GUN_hunt_down_the_orcs_desc:0 "The remaining stragglers of the old orcish regime still persist in the mountainside. Our hunting parties should be sent out to search for and destroy them."
GUN_restore_the_old_fortress:0 "Restore the Fortress"
GUN_restore_the_old_fortress_desc:0 "The old Gundabad fortress was built strong and sturdy by the dwarves. There is no need to redesign what is already so masterfully created and it will serve as a symbol to our people."
GUN_build_a_new_fortress:0 "Build a new fortress"
GUN_build_a_new_fortress_desc:0 "The old fortress of Gundabad is too decrepit and ancient to be safely inhabited anymore. We need a new symbol, a new defense, a new fortress."
GUN_new_hope_in_the_north:0 "New hope in the north"
GUN_new_hope_in_the_north_desc:0 "The twilight of the third age is a time of gathering dusk and collecting shadows. But it is also a time of great deeds and bright defiance. The dawn of the fourth age approaches with the light of hope."
GUN_join_gondor:0 "Join Gondor"
GUN_join_gondor_desc:0 "The White City stands as a beacon of hope against the encroaching shadow. Our newly reclaimed lands, once a stronghold of evil, now look to Gondor for alliance and strength."
GUN_lead_the_way:0 "Lead the way"
GUN_lead_the_way_desc:0 "Gundabad has seen the light of victory over the darkness. Our people are ready and prepared to strike back against the evil that threatens middle earth. We will light the beacon that will draw others from darkness into light."
GUN_another_message_to_beorn:0 "Another message to Beorn"
GUN_another_message_to_beorn_desc:0 "The Gundabad Expedition, now the rulers of Gundabad have arrived with a second question for Beorn, will he join them in their defense against the darkness."
GUN_the_mountain_research_institute:0 "The Mountain Library"
GUN_the_mountain_research_institute_desc:0 "Isolated in the north, magic lies in the mountain of Gundabad. Through research and study, we can harness it to our own greater power."
GUN_products_of_research:0 "Products of Research"
GUN_products_of_research_desc:0 "Our research has come far and we are now able to look back and see what we have gained in knowledge along the way."
GUN_build_new_homes:0 "Build new homes"
GUN_build_new_homes_desc:0 "With more homes for people to reside in we can expand our populace beyond those members of the Gundabad expedition who have been here since we first took over from the orcs."
GUN_repopulate_the_mountain:0 "Resettle the mountain"
GUN_repopulate_the_mountain_desc:0 "We will focus on bringing more settlers into Gundabad so as to strengthen our population and improve commerce."
GUN_build_a_new_army:0 "Build a new Army"
GUN_build_a_new_army_desc:0 "The Gundabad Expedition is a good core of our army but if we are to have to go to war with a larger country we will undoubtedly require a much greater army in order to stand any chance."
GUN_get_rid_of_all_the_orcs:0 "Preemptive Strikes"
GUN_get_rid_of_all_the_orcs_desc:0 "The race of orcs is a blight upon the surface of Middle Earth. The spawn of Melkor, they must be driven from the world if we are ever to have total peace."
GUN_train_mountaineers:0 "Train Mountaineers"
GUN_train_mountaineers_desc:0 "War is fought differently in Mount Gundabad then it is in more flat landscapes, mountaineers must be able to navigate the rougher terrain and keep their footing while fighting over loose rocks and snow."
GUN_dwarven_human_cooperation:0 "Dwarven-Mannish Cooperation"
GUN_dwarven_human_cooperation_desc:0 "The Gundabad Expedition is made up of both dwarves and men, and their cooperation is what has made our success possible."
GUN_the_skies_above:0 "The Skies Above"
GUN_the_skies_above_desc:0 "Mount Gundabad sits at the north of the Misty Mountains, if we wish to find the eagles we need only go south and up."
GUN_a_friendship_with_the_eagles:0 "Friendship With the Eagles"
GUN_a_friendship_with_the_eagles_desc:0 "The Eagles help in the battle of the five armies is a major part of what weakened the orcs enough for them to be defeated by our expeditionaries."
GUN_magical_bombardment:0 "Magical Bombardment"
GUN_magical_bombardment_desc:0 "It seems like the eagles are quite apt at dropping things on their enemies. What would happen if we gave them a particularly large alcemichal bomb."
GUN_mastery_of_the_air:0 "Mastery of the air"
GUN_mastery_of_the_air_desc:0 "The Eagles are indeed the greatest source of air superiority in all of middle earth."
GUN_the_earth_below:0 "The earth below"
GUN_the_earth_below_desc:0 "The dwarves tend to be exceptionally good at discovering the earth, mining, entrenching, and building."
GUN_brothers_of_the_mine_rejoice:0 "Brothers of the mine rejoice!"
GUN_brothers_of_the_mine_rejoice_desc:0 "To dig and dig makes us free, come on brothers sing with me, I am a dwarf and I'm digging a hole, diggy diggy hole, digging a hole."
GUN_send_aid_to_moria:0 "Send Aid to Moria"
GUN_send_aid_to_moria_desc:0 "If I had a nickle for every expedition of dwarves who went out to free an ancient home of the dwarves from the orcs who had taken it over in the end of the third age, I would have two nickles, which isn't a lot but it's wierd that it happened twice."
GUN_we_can_never_dig_too_deep:0 "We can never dig too deep"
GUN_we_can_never_dig_too_deep_desc:0 "The sunlight will not reach this low, deep deep in the mine, never seen the blue moon glow, dwarves won't fly so high."
GUN_the_dwarves_are_coming_home:0 "The dwarves are coming home"
GUN_the_dwarves_are_coming_home_desc:0 "Back to the mountain the earth and the stone, we're coming home to diamonds and to gold, diggy diggy hole, diggy diggy hole."
GUN_trade_with_the_woodsmen:0 "Trade with the Woodmen"
GUN_trade_with_the_woodsmen_desc:0 "Turns out there aren't many trees on Mount Gundabad, but luckily, I know a guy."
