GUN_restore_border_outposts_desc:0 "Our mountain fastness must be secured. Stone and iron will fortify the passes, guarding against the incursions of the Woodsmen and the shifting ambitions of other Orc-lords alike."
GUN_reinvigorate_the_broken_realm_desc:0 "Too long have we wallowed in our defeats, allowing rivalries and despair to fester. The time has come to mend our fractured will, to find a common purpose in hatred and blood, and to rise from the depths."
GUN_mutiny_desc:0 "Is it truly a 'mutiny' when every Orc believes himself a king? Perhaps it's just another Tuesday in Gundabad, but the old guard is about to learn a harsh lesson."
GUN_restart_the_forges_desc:0 "Smoke chokes the mountain, and the roar of the furnaces drowns out the groans of the enslaved. From this inferno, a tide of iron and death will rise, as our war-machine grinds to life once more."
GUN_distant_campaigns_desc:0 "Our vision extends beyond the peaks of Gundabad. We shall send forth our legions to lands far afield, where softer races dwell, and bring the war machine of the North to their unsuspecting doors."
GUN_victory_or_death_desc:0 "With our grudges sharpened and our forces gathered, the time has come for the final reckoning. Every claw, every fang, every orc will fight until nothing remains but our triumph, or our demise."
GUN_locate_weakspots_desc:0 "Our scouts must penetrate deep into the mountain, mapping their crude defenses and identifying any neglected passages or crumbling stonework. Every crack is a potential entry point for our forces."
GUN_spy_on_the_orcs_desc:0 "The orcs hold our ancestral home, but they are not invincible. Our keenest scouts are sent to ferret out their numbers, their patrols, and the forgotten ways into their strongholds."
GUN_the_gold_trade_desc:0 "Deep within the mountains, veins of glittering gold await rediscovery. Our ancestors carved their legacy in stone and metal, and we shall do the same."
GUN_form_a_militia_battalion_desc:0 "To properly defend our initial gains and secure a foothold, a structured militia battalion is essential. It may be small, but it represents our commitment."
GUN_restore_gundabad_industry_desc:0 "With the Orcs purged, the halls of Gundabad lay ready for a new purpose. Our industrious spirit shall transform derelict pits into productive factories, ensuring our people are well-armed and provisioned."
GUN_repay_our_supporters_desc:0 "The reclamation of Gundabad was not a solitary feat. We honor the aid and sacrifices of our allies, laying the groundwork for enduring friendships and future prosperity in the mountains."
GUN_farming_efforts_desc:0 "Centuries of orcish 'management' has left the land utterly barren. It's time to teach this mountain what a proper harvest looks like, even if it means getting our hands a little dirty."
GUN_leather_tanneries_desc:0 "Establishing efficient industries is key to reclaiming Gundabad. Our tanneries will become a cornerstone of production, ensuring a steady supply of processed hides for civilian and military needs alike."
GUN_workers_and_soldiers_desc:0 "Times are unstable and menaces are upon us. We must make the best of our muscle if we are to survive the coming storm."
GUN_restore_diplomatic_efforts_desc:0 "With Gundabad restored to righteous hands, we may take up contact with some old allies, and be brought back into the fold."
GUN_restore_dwarven_architecture_desc:0 "The halls of Gundabad may shine once more with the polished stone of dwarven pillars."

GUN_dwarven_miners_guilds_desc:0 "Centuries of orcish tunneling have only scratched the surface. Now, disciplined guilds of master miners will carve out the true heart of Gundabad's bounty."
GUN_secure_foreign_support_desc:0 "To reclaim Gundabad is no small feat. Our scouts and spies have done their part, but a larger effort will require the strength of many. We send forth envoys, seeking allies and resources from abroad."
GUN_convene_a_secret_council_desc:0 "Hidden from the Orcish hordes, key figures gather to deliberate the most challenging question: how to reclaim the ancient mountain stronghold without alerting its foul inhabitants."
GUN_rally_the_scattered_longbeards_desc:0 "Though driven from our mountain home, the spirit of Durin's folk endures. Messengers are sent to every corner where a Longbeard might dwell, rekindling the embers of a long-held hope to reclaim what was lost."
GUN_gather_eotheod_descendants_desc:0 "The mountain winds whisper the names of the Éotheod, brave Riders whose lineage stretches through the North. Let us unite their scattered progeny and make Gundabad a domain for Men."
GUN_survey_the_old_tunnels_desc:0 "Beneath the surface, the mountain remembers. We delve into the old dwarven workings, seeking not just pathways but the echoes of ancient ingenuity to guide our reconstruction efforts."
GUN_invoke_the_memory_of_fram_desc:0 "We are the inheritors of Fram's spirit, who once drove back the terrors of the North. Now, we invoke his memory to inspire our people and assert our claim over these mountains."
GUN_rally_nearby_support_desc:0 "The lands surrounding Gundabad are not empty; they merely hide those who refuse to bend knee to the Orcs. We must seek them out, rally their spirits, and turn their long-simmering resentment into an effective fighting force."
GUN_exasperate_orc_infighting_desc:0 "The Orcs of Gundabad are a fractious lot, ever eager to turn on their rivals. A few well-placed agitators and false rumors are all that is needed to stoke the fires of internal strife."
GUN_mountain_specialists:0 "Mountain Specialists"
GUN_mountain_specialists_desc:0 "Forget the sprawling plains; here, every rock and crevice is a battlefield. We shall ensure our troops know every secret path and ambush point, making them formidable mountain fighters."
GUN_mass_deployments:0 "Mass Deployments"
GUN_mass_deployments_desc:0 "The mountains rumble not with stone, but with the endless tramp of countless boots. Gundabad’s true might is not its walls, but the sheer, unyielding mass of its armies."
GUN_elite_formations:0 "Elite Formations"
GUN_elite_formations_desc:0 "Let the orcs rely on their crude numbers and unthinking ferocity. We shall answer with the sharpened blade of superior training and unyielding will."
GUN_large_army_efforts:0 "Large Army Efforts"
GUN_large_army_efforts_desc:0 "Quality is for the soft-skins. We breed legions, a tide of dark to overwhelm our foes!"
GUN_light_cavalry:0 "Light Cavalry"
GUN_light_cavalry_desc:0 "The plains call for swiftness. Our light cavalry will act as the vanguard."
GUN_heavy_cavalry:0 "Heavy Cavalry"
GUN_heavy_cavalry_desc:0 "The path to victory is often paved with broken bones and shattered formations. Our heavy cavalry, a wall of steel and muscle, will ensure that path is cleared with devastating efficiency."
GUN_establish_an_administration_desc:0 "The mountain stronghold now rests in our hands, but a power vacuum is a dangerous thing. We must swiftly establish a clear administration to unite our people and secure our future in Gundabad."
GUN_siege_machinery:0 "Siege Machinery"
GUN_siege_machinery_desc:0 "Walls are merely inconvenient obstacles. With sufficient ingenuity and raw power, no rampart will long withstand our assault."
GUN_support_equipment:0 "Support Equipment"
GUN_support_equipment_desc:0 "Battles are not won by swords alone, but by the endless toil of those who keep the warriors fed, armored, and healed. Investing in support equipment ensures our forces remain a relentless tide."
GUN_move_on_desc:0 "Why waste our strength on foes who have long forgotten the sting of our wrath? Let their complacency be their downfall, while we seek glory elsewhere."
GUN_reorgnaize_military_facilities_desc:0 "The scattered war-camps and crude workshops of old no longer suffice. We must reshape the very heart of Gundabad to churn out weapons and warriors with brutal efficiency."
GUN_local_ambitions_desc:0 "Why waste effort on a long march when there are softer targets and rich pickings right beneath our very noses? Let us consolidate our local power."
GUN_raise_a_new_army_desc:0 "No longer will our kind cower in the shadows. From every dark crevice and tunnel, fresh legions of Uruks, Goblins, and Snagas are mustered."
GUN_seek_out_new_spoils_desc:0 "What good is a mighty army if it merely stands idle? Send forth the warbands! Let the world tremble and yield its riches to the might of Gundabad."
GUN_quest_for_vengeance_desc:0 "The Dwarves cling to their mountain, the Elves hide in their woods, and the Men huddle in their city. They forget the wolves that watch from the north. Vengeance will find them all."
GUN_contact_collaborators_desc:0 "Not all within the gilded halls of our enemies are loyal. We shall seek out those whose hearts are filled with grievance, greed, or fear, and turn their discontent into a blade pointed at their own backs."
GUN_subjugate_the_beornings_desc:0 "The northern Beornings stand in our way to the east. They will submit or die."
GUN_align_the_beornings_desc:0 "The northern Beornings stand in our way to the east. They must stand aside or be crushed under our heels."
GUN_vengeance_at_last_desc:0 "For centuries, the names Erebor, Mirkwood, and Dale have been curses upon our lips. Now, their halls are silent, their forests burn, and their cities lie in ruin. The long night of our vengeance has finally come."
GUN_turn_west_desc:0 "Our hunger for conquest is not sated by the eastern territories. The mountains and plains to the west call out, ripe for the taking, promising fresh spoils for the warbands of Gundabad."
GUN_turn_south_desc:0 "The grim wastes of the north offer little new to plunder. Our scouts whisper of fertile lands and undefended valleys to the south, ripe for the taking."
GUN_war_with_angmar_desc:0 "Why waste our fury on distant foes when Angmar, ripe for plunder, lies to our west? Their fortresses will fall, their slaves will be ours, and their lands will fuel our growing might."
GUN_war_with_the_beornings_desc:0 "Their ancestors once stood against our kind. Now, the Children of Beorn shall finally pay the ancient blood debt, with the might of Gundabad behind us."
GUN_claim_rhudaur_territory_desc:0 "They call it Rhudaur, we call it 'more territory.' It's an easy choice, especially with a few axes and a horde of screaming orcs."
GUN_align_the_goblins_desc:0 "With the Beornings pushed back, the Mountain Goblins recognize the rising tide of Gundabad. It is wiser to join the predator than to be its prey."
GUN_forceful_integration_desc:0 "Pacification comes swiftly to those who resist. With fresh barracks and constant patrols, we will ensure that every corner of our expanded domain trembles under the shadow of Gundabad."
GUN_consolidate_our_hold_desc:0 "The ground we stand on is ours. Now, we make sure it *stays* ours. Dig deep, build high, and keep watch for any soft-skins trying to take it back."
GUN_secret_knowledge_acquisition_desc:0 "Knowledge gets around. Why waste resources building a library when we can simply listen to the whispers?"
GUN_political_alignment_desc:0 "With our power consolidated, it is time to formalize the chains of command. Every grunt must know their place, and every chieftain his oath, or suffer the consequences."
GUN_consolidate_leadership_desc:0 "A power vacuum no longer plagues our halls. Obedience, swift and absolute, shall be the bedrock of our renewed strength."
GUN_speed_up_industry_desc:0 "Orcs are notoriously lazy creatures. Only through relentless toil, driven by the lash and fear of the chieftains, can our production truly accelerate."
GUN_speed_up_mobilization_desc:0 "With a whip and a snarl, our war-leaders drive the reluctant into the ranks. There is no time for hesitation, only for the muster."
GUN_deface_azogs_legacy_desc:0 "The cult of the Pale Orc must be shattered. Every statue, every banner bearing Azog's foul image, shall be torn down and defiled. A new era begins, free from his gruesome legacy."
GUN_ransack_the_depots_desc:0 "The former regime's supply depots are ours for the taking. What was once hoarded by the oppressors now fuels the revolution and rallies the masses."
GUN_decentralized_army_leadership_desc:0 "The age of singular, distant masters has ended. From the ranks, true strength and strategic cunning will now rise, leading our warbands with newfound, decentralized savagery."
GUN_no_laws_or_gods_desc:0 "The chains of old masters are broken, and with them, the very notion of 'law' or 'king'. Here, only strength dictates, and every orc is their own brutal sovereign."
GUN_repurpose_workshops_desc:0 "The revolution demands a new kind of production. Every grinder and furnace, once dedicated to destruction, shall now contribute to the material needs of the collective."
GUN_no_kings_desc:0 "Crowns are for weaklings and soft-skinned pretenders who fear the true strength of the horde. In the new Gundabad, only might holds sway, not gilded iron."
GUN_mobilize_the_masses_desc:0 "The mountains of Gundabad teem with our kin, yet too many remain idle. Let every able-bodied orc be thrust into the fray, for the horde demands numbers."
GUN_contribution_systems_desc:0 "No orc is above labor, nor below the duty of contributing. Our new systems ensure every hand serves the collective, or serves as a warning to others."
GUN_raid_the_surroundings_desc:0 "Every raid into the fertile lands of Men and Dwarves serves a dual purpose: filling our bellies and striking fear into the hearts of our enemies. Let the message of our freedom spread with fire and steel!"
GUN_mob_rule_desc:0 "No longer are we bound by the decrees of a single Warchief or the whispers of a Shaman. The strength of the mob, raw and unbridled, dictates our every brutal action."
GUN_fortify_the_border_desc:0 "Let the orcs try again! Every pass, every gate, every hidden path will be reinforced with stone and steel."
GUN_trolls_from_mordor_desc:0 "Sauron sends his mightiest servants to aid his allies in the north. Our foes will soon learn the true meaning of fear as these colossal beasts join the fray."
GUN_local_recruitment_desc:0 "The ceaseless hunger for more bodies is upon us. Our recruiters scour the local territories, ensuring that every available hand, claw, or club-wielder joins the inevitable march to war."
GUN_wizards_sorcery_desc:0 "The White Wizard, a master of cunning and ancient lore, has offered his formidable intellect and dark arts to our cause. His sorcery will grant us insights into forbidden knowledge, strengthening our forces."
GUN_self_sufficiency_focus_desc:0 "The mountains hold what we need, and what they do not, we will take."
GUN_fellbeast_supremacy_desc:0 "From the dark crags of Gundabad, our Fellbeasts will darken the skies."
GUN_request_mithril_mining_experts_desc:0 "Centuries of neglect and Orcish malice have left Gundabad's deep places dangerous. To reclaim the mountain's ancient bounty, especially the fabled Mithril, we must enlist the aid of master miners from our kin."
GUN_mithril_metalwork_desc:0 "The secrets of Mithril metalwork are not easily mastered, but our determined artisans delve deep into the craft, combining ancient lore with renewed ingenuity to unlock its full potential."
GUN_countryside_markets_desc:0 "Where Orcs once plundered, we shall trade. Establishing markets in the valleys and foothills will allow our people to exchange goods and weave the fabric of a new society."
GUN_pride_restored_desc:0 "The echoes of past defeats have faded, replaced by the triumphant roars of a revitalized Gundabad. Our banners fly high over reclaimed lands, and our strength is undeniable."
GUN_secure_support_from_gladden_desc:0 "The Men of Gladden, descendants of the same ancient folk, heed our call. Their warriors shall join our expedition, bolstering our numbers against the filth of Gundabad."
GUN_forodwaithi_support_desc:0 "To brave the northern wastes is to know true hardship. To fight the Orcs of Gundabad is merely to extend that struggle. The Forodwaith, accustomed to both, may lend their cold fury to our cause."
GUN_prepare_to_seize_orc_armories_desc:0 "Before the main thrust, we must cripple the enemy's ability to arm itself. Detailed plans are now laid to raid and empty the foul creatures' weapon stores."
GUN_plan_a_swift_assault_desc:0 "No indiscriminate chaos, only calculated force. We shall move with speed and cunning, ensuring that the halls we reclaim remain standing for our future."
GUN_a_symbol_of_hope_desc:0 "The grim, shadowed peaks of Gundabad, once a testament to malice, shall now stand as a beacon of renewed life and purpose. A new age dawns where darkness once reigned."
GUN_food_silos_desc:0 "The fields around Gundabad may be newly tilled, but without proper storage, our efforts are for naught. Let us build sturdy silos to secure our future harvests."
GUN_honeycakes_and_hardiness_desc:0 "The Beornings’ legendary honeycakes are more than just a sweet treat; they are a symbol of the rugged, enduring strength we seek to instill in our own people."
GUN_expand_recruitment_desc:0 "Orcs still lurk in the shadows, and the wild lands beyond our walls remain untamed. To truly secure our new home, we must raise a host capable of facing any threat."
GUN_military_research_focus_desc:0 "With the mountain reclaimed, attention turns to its defense. Investment in military science will improve our infantry, cavalry, and siege capabilities against future threats."
GUN_civilian_research_focus_desc:0 "The dark years have left much to be rebuilt. We prioritize the intellectual and practical arts, for it is through enlightened labour and shared wisdom that true prosperity will be found."