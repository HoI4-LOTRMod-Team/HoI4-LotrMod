l_english:
gundabad.1.t:0 "[From.GetName] critizes our political situation"
gundabad.1.d:0 "[From.GetLeader] annouced today in a speech that they do not agree with our goverment. Saying that we should listen more to the people and that if nothing changes. They might not to take action."
gundabad.1.a:0 "Change there will be"
gundabad.1.b:0 "Its non of ther business"

gundabad.2.t:0 "[From.GetName] demands us to join their side"
gundabad.2.d:0 "We have heard rumors of them wanting to expend for a while now. This might be our chance to keep our independence. However, joining there side is a big decision and will shape the future of our nation."
gundabad.2.a:0 "Independence is what we want"
gundabad.2.b:0 "We are not afraid for them"

gundabad.100.t:0 "The Choice of Lineages"

gundabad.100.desc:0 "As the valiant leaders of the Gundabad Expedition convene, a momentous decision lies before them: What should be done once the hordes of orcs are ousted from the sacred mountain?\n\nGundabad was a revered, ancient home to the Longbeard Dwarves. Yet, their ancestral claim is distant, with few of their kind now dwelling nearby and their golden age firmly in the past.\n\nConversely, within the surrounding lands reside the descendants of Éothéod, whose numbers are less scarce."

gundabad.100.a:0 "Gundabad rightfully belongs to the Longbeards."

gundabad.100.b:0 "Let us forge a new kingdom, honoring Fram's lineage."

gundabad.101.t:0 "Request for Mithril Miners from Gundabad"

gundabad.101.desc:0 "The mountain of Gundabad has been reclaimed by a bold expedition of our dwarven kin. Beneath this ancient bastion lies an abandoned mine, rumored to contain a significant vein of Mithril.\n\nHowever, the dwarves of Gundabad lack the skill and expertise required to extract such precious ore from the depths. They have turned to us, seeking the aid of our finest miners."

gundabad.101.a:0 "Send forth our best mining experts."
gundabad_mithril_miners_sent:0 "Ered Luin has sent Mithril miners to Gundabad."

gundabad.102.t:0 "Ered Luin Sends Aid"

gundabad.102.desc:0 "Our kin from Ered Luin have answered our call for aid, sending a contingent of their most skilled miners, well-versed in the delicate art of Mithril extraction."

gundabad.102.a:0 "Let us start the mining!"

gundabad.103.t:0 "Ered Luin Keeps its Miners"

gundabad.103.desc:0 "Alas, our brethren in Ered Luin have declined our plea for assistance, choosing instead to retain their miners for their own needs. The uncertainties that linger over Gundabad have left us without their skilled aid."

gundabad.103.a:0 "We face the mountain's depths alone."

gundabad.101.b:0 "We must keep our miners for our own ventures."

gundabad.104.t:0 "Gratitude from Gundabad"

gundabad.104.desc:0 "In days past, we lent our aid to the courageous souls of the 'Gundabad Expedition,' whose mission was to rid Gundabad of the orcish menace and to reclaim the ancient fortress.\n\nTheir valiant efforts have borne fruit, and the orcs have been vanquished. Many of those who now dwell in Gundabad are the very men who embarked on this perilous venture with our support.\n\nThey have not forgotten our generosity and now express their heartfelt gratitude with a gesture of repayment for the aid we provided."

gundabad.104.a:0 "We gladly accept their thanks."

gundabad.3.t:0 "The Gundabad Expedition"
gundabad.3.d:0 "With infighting weakening the orcs who infest the ancient dwarven fortress of Gundabad, a clandestine movement stirs among the villages and enclaves scattered across the land.\n\nThese people, tormented and wearied under the orcish yoke, dare to dream of freedom. Their plan is bold: a 'Gundabad Expedition', a modest yet determined force, united with a singular aim: to reclaim the mountain and banish the vile orcs forever.\n\nHowever, such an audacious endeavor will require substantial support to transform their vision into victory."
gundabad.3.a:0 "Peculiar."
gundabad.4.t:0 "Request for Aid from the Gundabad Expedition"
gundabad.4.d:0 "The ancient fortress of Gundabad lies under the oppressive grip of orcs. In a bold gesture of hope, a valiant band known as the 'Gundabad Expedition' has arisen, determined to reclaim this place and rid it of its dark occupiers. Their success could carve out a new haven for our people.\n\nThis brave coalition seeks our assistance, requesting a sizable deployment of our warriors to bolster their strength.\n\nAssisting them might forge a powerful alliance with the kingdom they seek to establish."
gundabad.4.a:0 "We will send a contingent at once."
gundabad.4.b:0 "What use is that mountain to us?"
gundabad.5.t:0 "[From.GetName] Commits Forces"
gundabad.5.d:0 "[From.GetName] has nobly pledged their aid to the Gundabad Expedition. Their forces have journeyed far and now stand ready beside us, prepared to strike against the orcs and reclaim the fortress."
gundabad.5.a:0 "This may be the end of the orcs."
gundabad.6.t:0 "[From.GetName] Refuses"
gundabad.6.d:0 "In a turn of events, [From.GetName] has declined the call of the Gundabad Expedition, choosing not to dispatch their forces to contest the orc-held Mount Gundabad."
gundabad.6.a:0 "Perhaps others will send aid."
gundabad.7.t:0 "The Assault on Gundabad"
gundabad.7.d:0 "For many months the brave souls of the Gundabad Expedition have planned, organized and prepared to drive the orcs out of the fortress once and for all.\n\nTonight, the assault took place and orcs were caught completely by surprise. \n\nThe Expedition's forces sustained some losses, and several orc stragglers remain scattered in the surrounding countryside, but their seat of power has fallen back into friendly hands."
gundabad.7.a:0 "Victory!"

gundabad.105.t:0 "Gundabad Expedition Discovered"
gundabad.105.desc:0 "Our Expedition's efforts have made great strides and secured much support. Unfortunately, these efforts have not gone unnoticed by the orcs. This discovery forces our hand, and our schedule has moved up. For better or worse, the assault must be launched... now."
gundabad.105.a:0 "Ready the troops!"

