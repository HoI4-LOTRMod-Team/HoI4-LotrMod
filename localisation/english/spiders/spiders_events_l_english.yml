l_english:


 spiders.100.t:0 "Appeal from the Spiders of Mirkwood"

 spiders.100.desc:0 "The Spiders of Mirkwood, those sinister weavers of darkness, have sent forth a petition to us, the lords of Minas Morgul. They claim that their kin, the great Shelob, dwells within our borders. They humbly request we grant her safe passage home, that she may once again lead them in the depths of the forest."

 spiders.100.a:0 "Grant Shelob safe passage."

 spiders.100.b:0 "Deny their request."

 spiders.101.t:0 "Shelob's Return to Mirkwood"

 spiders.101.desc:0 "A missive from [?FROM.GetName] confirms that our petition has been accepted, and the great Shelob, the last daughter of Ungoliant, shall return to her abode in the shadowed trees of Mirkwood."

 spiders.101.a:0 "She has returned!"

 spiders.102.t:0 "Appeal Denied"

 spiders.102.desc:0 "Our request to ensure safe passage for Shelob has been dismissed. Word from [?FROM.GetName] brings the displeasing tidings that our matriarch shall not find a path back to Mirkwood under their watch."

 spiders.102.a:0 "Grrrr!"

 spiders.103.t:0 "Nest Guardians Created"

 spiders.103.desc:0 "The Nest Guardians, fierce protectors of our egg-laden sanctuaries, now stand ready. Their might shields our progeny from harm, yet let them not wander from their purpose. Should they abandon the nest, their strength will be lost to us."

 spiders.103.a:0 "May they keep our young and unhatched from harm!"

 spiders.104.t:0 "Nest Guardians Empowered"

 spiders.104.desc:0 "Our hold on the Mirkwood strengthens, and by this power, the Nest Guardians have gained newfound might.\n\nThey can now roam the entire shaded expanse of the forest and destroy all those who trespass. But beware, for the light is their bane. Should they venture beyond the embrace of the trees, annihilation awaits them."

 spiders.104.a:0 "M... mommy?"

 spiders.105.t:0 "Nest Guardians destroyed"
 spiders.105.desc:0 "Hisssss! A disaster has befallen us. Against their better judgement, our beloved protectors, the Nest Guardians, have ventured beyond the safety of the forest and strayed into the light. After a lifetime in the shadows, the light burned their carpaces, blinded their eyes and left nothing but a pile of legs and ashes."
 spiders.105.a:0 "The offspring will have to fend for itself now."
 spiders.106.t:0 "Sending a Request to Mordor"

 spiders.106.desc:0 "The might of Mordor grows ever more formidable, and it could be prudent to forge a pact with Sauron. We must decide whether to submit entirely, propose a simple and straightforward alliance, or negotiate for aid and resources in return for our allegiance."

 spiders.106.a:0 "Prostrate ourselves and offer all they demand."

 spiders.106.b:0 "Let's be pragmatic about this..."

 spiders.106.c:0 "Attempt to barter for additional favors"

 spiders.107.t:0 "Mirkwood Spiders Submit"

 spiders.107.desc:0 "The Spiders of Mirkwood, recognizing the formidable power of Mordor, have submitted willingly to our dominion. Their allegiance is now ours to command."

 spiders.107.a:0 "As in the days of Ungoliant and Morgoth."

 spiders.108.t:0 "Spiders Seek Alliance"

 spiders.108.desc:0 "The Spiders of Mirkwood have approached us with a desire to join our cause. Although they are creatures of great strength, their loyalty is not firmly guaranteed."

 spiders.108.a:0 "As in the days of Ungoliant and Morgoth."

 spiders.109.t:0 "Spiders Demand Reciprocity"

 spiders.109.desc:0 "The Spiders have put forth the notion of alliance, but with conditions. They seek our protection and resources. They ask us to cough up loads of men and steel in exchange for their support."

 spiders.109.a:0 "Agree to their terms."
 spiders.108.b:0 "We have no need for them."

 spiders.109.b:0 "Their demands hold no sway over us."

 spiders.109.c:0 "Offer them half of what they asked for."

 spiders.110.t:0 "Mordor Accepts Our Barter"

 spiders.110.desc:0 "Mordor has accepted our counter-offer, agreeing to provide the requested support in exchange for our allegiance."

 spiders.110.a:0 "Accept"
 spiders.111.t:0 "Spiders Withdraw"

 spiders.111.desc:0 "The Spiders have declined our counter-offer, dissatisfied with our terms. They leave without forging an alliance."

 spiders.111.a:0 "Their folly will be their undoing."

 spiders.112.t:0 "Spiders Yield"

 spiders.112.desc:0 "The Spiders of Mirkwood have accepted our counter-offer, acknowledging the wisdom in aligning with Mordor, albeit at a reduced price."

 spiders.112.a:0 "Very well."

 spiders.113.t:0 "Mordor's Counter-Offer"

 spiders.113.desc:0 "Mordor acknowledges our proposal but considers our price too steep. They present an alternative, agreeing only to a portion of our demands."

 spiders.113.a:0 "Fine..."
 spiders.114.t:0 "Mordor Accepts"

 spiders.114.desc:0 "Mordor has acquiesced to our entreaty. Henceforth, we bind ourselves to their cause in a shared allegiance."

 spiders.114.a:0 "Let us see what this alliance yields."

 spiders.115.t:0 "Mordor Declines"

 spiders.115.desc:0 "Our proposition has been spurned by the dark lords of Mordor."

 spiders.115.a:0 "This bodes ill for us."

 spiders.113.b:0 "Pathetic! We will not ally with someone who thinks us this cheap."

 spiders.116.t:0 "Alliance with the Mirkwood Spiders"

 spiders.116.desc:0 "The spiders of the Mirkwood have approached us with an intriguing offer to form an alliance. While the Great Spiders possess formidable might, their unpredictable nature makes them difficult to trust and control. Shall we accept their proposal?"

 spiders.116.a:0 "Form the alliance."

 spiders.116.b:0 "Refuse their offer."

 spiders.116.c:0 "Agree, but demand leadership of the faction."

 spiders.117.t:0 "Alliance Accepted"

 spiders.117.desc:0 "The offer from the spiders has been accepted, and a pact has been forged between us. From this day forth, we shall stand united."

 spiders.117.a:0 "An unexpected alliance."

 spiders.118.t:0 "Alliance Rejected"

 spiders.118.desc:0 "We have chosen to decline the spiders' proposal, opting to walk our path alone rather than risk the entanglements of their webs."

 spiders.118.a:0 "Hissss"

 spiders.119.t:0 "[FROM.GetName] insist on leadership"

 spiders.119.desc:0 "[FROM.GetName] agrees to form an alliance but, citing concerns over our unpredictability, only on the condition that they be the faction leaders. Do we agree to these terms?"

 spiders.119.a:0 "Fine... So be it!"

 spiders.120.t:0 "Mirkwood Spiders Accept Our Leadership"

 spiders.120.desc:0 "The spiders have consented to our leadership, and thus a new alliance is born with us at the helm. May this union serve both our ends, and may we keep the spiders reined in."

 spiders.120.a:0 "Let us proceed with caution."

 spiders.121.t:0 "Mirkwood Spiders Reject Our Leadership"

 spiders.121.desc:0 "Our condition for leadership was met with refusal by the spiders. The notion of a faction alliance is dashed, leaving our relations strained and the proposal abandoned."

 spiders.121.a:0 "Perhaps it's for the best."

 spiders.119.b:0 "Terms rejected; alliance off!"

 spiders.122.t:0 "Harvest of the Deep Nest"

 spiders.122.desc:0 "Our nest thrives and our influence is expanding, allowing us to forage with greater reach than before. What resources should our foragers focus on?"

 spiders.122.a:0 "Let us weave more webs and ensnare abundant prey!"

 spiders.122.b:0 "Let us secure resources that are scarce to us."

 spiders.125.t:0 "A Proposal from the Spiders"

 spiders.125.desc:0 "Our cautious allies, the Spiders of Mirkwood, approach us with a proposition. They seek to learn from our knowledge and, in return, offer us invaluable intelligence concerning our adversaries."

 spiders.125.a:0 "Accept their terms."

 spiders.126.t:0 "A Proposal from the Mirkwood Spiders"

 spiders.126.desc:0 "The Spiders, our uneasy allies within the shadowed Mirkwood, have made a proposition. Their insatiable appetite is known to us, and it is inherent to their nature to prey upon any creature, even our kind, should opportunity arise. This has led to unfortunate 'incidents' in our collaboration.\n\nThe Spiders now offer a solution: if we would provide them with some of the prisoners that languish under our watch, they assure us their brood will remain sated, and no further mishaps will occur."

 spiders.126.a:0 "Bon Appetit!"

 spiders.127.t:0 "The Elves Yield to Our Proposal"

 spiders.127.desc:0 "The Elves of Mirkwood, though hesitant, have acquiesced to our request. A portion of their captives will be consigned to us for consumption. In return, we are pledged to sheath our fangs in their presence.\n\nA feast is promised, and our brood will be appeased."

 spiders.127.a:0 "Yum!"

 spiders.128.t:0 "The Elves Denounce Our Request"

 spiders.128.desc:0 "The elves found our suggestion to partake in their prisoners unthinkable. They reject our offer outright, choosing instead to risk the hunger that gnaws at us.\n\nIt seems we must go hungry again..."

 spiders.128.a:0 "Graaah! Arrogant, two-legged, pointy-eared herbivores!"

 spiders.126.b:0 "Savage brutes! This is inhumane!"

 spiders.129.t:0 "The Elves Accept the Proposal"

 spiders.129.desc:0 "Our proposal has been met with agreement. The Elves of Mirkwood shall trade their advanced knowledge with us in exchange for the insights we possess on impending threats."

 spiders.129.a:0 "A fruitful agreement."

 spiders.130.t:0 "The Elves Decline the Proposal"

 spiders.130.desc:0 "The Elves have turned down our proposition, citing a deep-seated mistrust that prevents any sharing of their treasured wisdom."

 spiders.130.a:0 "Hisss!"

 spiders.125.b:0 "We cannot place our trust in them."

 spiders.131.t:0 "The Great Spiders Attack"
 spiders.131.desc:0 "The scouts report that a great host of Spiders is scouring at the borders and moving towards us. Before long, their kind will be upon us, and we must prepare for the inevitable confrontation."
 spiders.131.a:0 "To arms!"

 spiders.124.t:0 "Territorial Disputes Settled"

 spiders.124.d:0 "In the light of the new alliance between Great Spiders and Elves, both sides are forced into making concessions, which includes giving up any claims on each other's territory. "

 spiders.124.a:0 "Let us hope this brings a lasting peace between our two kins"

 spiders.123.t:0 "Spider Incident"

 spiders.123.desc:0 "Our 'allies', the Great Spiders of the Mirkwood, are subject to a gnawing, restless hunger. Today these powerful urges caused an incident between our men and our allies. A contingent of uncontrolled spiders attacked one of our settlements and caused serious damage and casualties."

 spiders.123.a:0 "It can't be helped. It's their nature."

 spiders.123.b:0 "Demand immediate recompensation!"

 spiders.132.t:0 "Shelob Seizes the Ring!"

 spiders.132.desc:0 "The fellowship, passing through the pass of Cirith Ungol near Mordor, have stumbled into the nest of Shelob, the last daughter of Ungoliant.\n\nThe foolish ringbearer was apprehended by Shelob and she has brought the ring back home, to us!"

 spiders.132.a:0 "This changes everyhting."
