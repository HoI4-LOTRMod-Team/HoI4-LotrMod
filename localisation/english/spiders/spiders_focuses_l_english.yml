l_english:
 SPI_hunger:0 "Hunger"
 SPI_hunger_desc:0 "A deep, incessant gnawing... it pulses through the brood. Sssshh... the hunt must begin. The world offers so much to sate this ancient, unyielding hunger."
 SPI_cannibalistic_tendencies:0 "Cannibalistic Tendencies"
 SPI_cannibalistic_tendencies_desc:0 "The two-leggeds may not understand... is it not obvious? When two brothers have no food, they both go hungry. But if one were to eat the other... None of them do..."
 SPI_feed_and_breed:0 "Feed and Breed"
 SPI_feed_and_breed_desc:0 "Life from death, strength from suffering. We will not look inward for sustenance while the forest provides. Let the enemies of the web nourish our endless, hungry spawn."
 SPI_call_up_the_hatchlings:0 "Call Up the Hatchlings"
 SPI_call_up_the_hatchlings_desc:0 "No time for gentle hatching. The mothers call forth the swarm! Let the blind, scuttling masses pour forth from the spawning pits."
 SPI_let_eggs_mature:0 "Let Eggs Mature"
 SPI_let_eggs_mature_desc:0 "The little ones are eager to scuttle forth, but a true huntress knows patience. Let the silk-wrapped gifts grow fat and fierce in the dark."
 SPI_the_great_feast:0 "The Great Feast"
 SPI_the_great_feast_desc:0 "Gorged on the fallen, our brood stirs, restless with new power. A strength courses through us. Our venom boils, our webs entangle. Who will be next to sssatiate us?"
 SPI_the_brood_lairs:0 "The Brood Lairs"
 SPI_the_brood_lairs_desc:0 "Beneath the roots and boughs, the Great Mothers stir. Eggs, countless as fallen leaves, quiver and burst. A writhing tide of new life, endlessly hungry, emerges from the deep."
 SPI_the_colony_wakes:0 "The Colony Wakes"
 SPI_the_colony_wakes_desc:0 "The long dormancy is broken. From every dark crevice and unseen burrow, the colony's true numbers begin to reveal themselves."
 SPI_the_spiders_nest:0 "The Spiders' Nest"
 SPI_the_spiders_nest_desc:0 "Deep within the earth, the silk-spun chambers grow into a formidable labyrinth. This Nest shall be the crucible of our strength, and the grave of our enemies."
 SPI_the_mothers_guard:0 "The Mother's Guard"
 SPI_the_mothers_guard_desc:0 "Not all of the Broodmother's spawn are meant to roam. These are her tethered guardians, infused with an unyielding will to defend the eggchambers of the Nest. Their strength is immense, but they are creatures of the dark. The light burns them."
 SPI_control_over_mirkwood:0 "Control Over Mirkwood"
 SPI_control_over_mirkwood_desc:0 "The Mirkwood is ours. The two-legs flee, the beasts cower. Mirkwood is ours, deep and dark... all ours."
 SPI_defensive_stance:0 "Defensive Stance"
 SPI_defensive_stance_desc:0 "The outer webs are tightened, the camouflage perfected. We wait, unblinking, for the foolish, the loud, the unwary to venture into our prepared domain. The feast will be earned, in time."
 SPI_defensive_stance_2:0 "Defensive Stance"
 SPI_defensive_stance_2_desc:0 "The outer webs are tightened, the camouflage perfected. We wait, unblinking, for the foolish, the loud, the unwary to venture into our prepared domain. The feast will be earned, in time."
 SPI_aggresive_stance:0 "Aggressive Stance"
 SPI_aggresive_stance_desc:0 "No longer will we merely guard our darkened woods. The scent of fear is a potent lure, pulling us from our lairs. Let them know the Mirkwood's wrath, the true masters of the shadows."
 SPI_step_out_of_the_shadows:0 "Step Out of the Shadows"
 SPI_step_out_of_the_shadows_desc:0 "Hiiiiss. The forest floor, the sheltering gloom... they become a prison. The world beyond stretches, vast and vulnerable. But the light...! Bright it burns... It blinds us..."
 SPI_hierarchy_order:0 "Hierarchy Order"
 SPI_hierarchy_order_desc:0 "The strongest among us weaves a tight web of command, binding the errant, crushing dissent with snapping mandibles. All must learn their place, or become sustenance."
 SPI_subdue_the_lesser_broods:0 "Subdue the Lesser Broods"
 SPI_subdue_the_lesser_broods_desc:0 "The periphery... it twitches with insolent life. Unruly kin, they forget the source of true power. They will learn obedience."
 SPI_heed_the_necromancer:0 "Heed the Necromancer"
 SPI_heed_the_necromancer_desc:0 "A larger predator stalks the lands. The Necromancer offers a grim path to power. Will he be like the last one? The... friend... of All-mother Ungoliant?"
 SPI_hatred_of_the_bright_folk:0 "Hatred of the Bright Folk"
 SPI_hatred_of_the_bright_folk_desc:0 "An ancient, seething loathing for the Aelfar boils within the Brood. Curse them and their sharp blades! We shall feast upon their tender flesh..."
 SPI_the_taste_of_stone_flesh:0 "The Taste of Stone-Flesh"
 SPI_the_taste_of_stone_flesh_desc:0 "Screeching webs and gnashing fangs! The Dwarves, with their stony skins, tempting... They are well-fed, and we... we are always famished."
 SPI_stench_of_the_rotten:0 "Stench of the Rotten"
 SPI_stench_of_the_rotten_desc:0 "The air grows thick with their putrid presence. Orc-spawn... weak, numerous, and so easily ensnared... a feast ripens in Dol Guldur."
 SPI_light_and_shadow:0 "Light and Shadow"
 SPI_light_and_shadow_desc:0 "Hunter and... temporary ally. A strange taste, this 'diplomacy', but the Elves know much of Mirkwood's tender parts. We will learn from them, then consume."
 SPI_return_of_night_mother_shelob:0 "Return of Night Mother Shelob"
 SPI_return_of_night_mother_shelob_desc:0 "From the ancient tunnels, a shadow older than memory arrives. Welcome back, Mother of Spiders. Shelob returns to claim her rightful place."
 SPI_daughter_of_ungoliant:0 "Daughter of Ungoliant"
 SPI_daughter_of_ungoliant_desc:0 "A shadow from the First Age stretches across Mirkwood, a living, hungry dread. The Mother's true nature is laid bare: the Last Child of Ungoliant, has returned."
 SPI_control_all_mirkwood:0 "Control All Mirkwood"
 SPI_control_all_mirkwood_desc:0 "Every tree, every stone, every hidden creature now knows its master. Mirkwood is not merely occupied; it *is* us, a vast, writhing body of shadow and hunger."
 SPI_ensnare_the_invaders:0 "Ensnare the Invaders"
 SPI_ensnare_the_invaders_desc:0 "They come, clumsy-footed and loud. We spin, patiently, tirelessly. They stumble into our hidden threads, and then… we eat."
 SPI_aerial_webwalls:0 "Aerial Web-Walls"
 SPI_aerial_webwalls_desc:0 "The feathery kin grow bold, thinking themselves safe from the ground-hunters. We shall teach them otherwise. Tangle their wings and bring them crashing down. All who trespass shall feed the forest."
 SPI_ascension_of_a_brood_leader:0 "Ascension of a Brood Leader"
 SPI_ascension_of_a_brood_leader_desc:0 "The countless broods squabble, skitter, and hiss in their endless pursuit of prey. But the greatest hunt requires the greatest hunter."
 SPI_through_cannibal_rites:0 "Through Cannibal Rites"
 SPI_through_cannibal_rites_desc:0 "Through acts of cannibalism, driven by an insatiable hunger, a new leader is forged from the flesh of their rivals. Let the strongest be mother to us all!"
 SPI_through_silent_communion:0 "Through Silent Communion"
 SPI_through_silent_communion_desc:0 "Rather than the gruesome spectacle of ritualistic ascent, we seek a deeper communion. The chosen leader will be one whose will resonates with the vast, silent network of the web."
 SPI_the_alpha_hunter:0 "The Prime Hunter"
 SPI_the_alpha_hunter_desc:0 "Shrazul rises! Her hiss commands the Brood, sharpening every claw, every fang. The hunt is on, guided by the deadliest of us all."
 SPI_endless_struggle:0 "Endless Struggle"
 SPI_endless_struggle_desc:0 "Eons of hunger have taught us that to cease is to perish. The Great Brood knows no peace, only the relentless advance of its collective, deathless purpose."
 SPI_the_great_weaver:0 "The Broodmother Council"
 SPI_the_great_weaver_desc:0 "The All-Mother Ungoliant is no more. And without her, a single leader makes no sense. For many families we are. Let us be guided by consensus."
 SPI_the_dream_weaver:0 "The Dreaming Weaver"
 SPI_the_dream_weaver_desc:0 "True domination begins with understanding. Khazherze guides our collective consciousness into deep contemplation, a quiet period that will ensure no thought of the enemy remains unspun."
 SPI_harmonize_the_instincts:0 "Harmonize the Instincts"
 SPI_harmonize_the_instincts_desc:0 "The individual urges of the myriad spiders become a single, calculating mind. Our actions, from the smallest hunt to the grandest invasion, are now perfectly aligned."
 SPI_broodmothers_woodland:0 "Broodmother's Woodland"
 SPI_broodmothers_woodland_desc:0 "Mirkwood itself now pulses with the unified ambition of the Broodmothers, who seek to refine their instruments of war."
 SPI_arachnid_nature:0 "Arachnid Nature"
 SPI_arachnid_nature_desc:0 "They peer into the shadows, expecting simple beasts. They do not see the ancient, calculating intelligence that flows through our forms. This is our nature: alien, relentless, and always learning."
 SPI_matriarchs_court:0 "Matriarch's Court"
 SPI_matriarchs_court_desc:0 "Our vast brood requires more than instinct; it requires leadership. The Matriarch's court will be the nexus of her will, drawing in capable minds to administrate her growing dominion."
 SPI_guidance_of_fury:0 "Guidance of Fury"
 SPI_guidance_of_fury_desc:0 "Let the fear of the prey ignite the consuming fire within our many hearts. The time for silent creeping is over; let our fury echo through the trees."
 SPI_pheromonal_harmony:0 "Pheromonal Harmony"
 SPI_pheromonal_harmony_desc:0 "Mmmh... The broodmothers they... smell so good... No more uncontrolled hunting... No more fighting our brethren. We shall stay here. With mommy. And do as she says."
 SPI_the_queens_will:0 "The Queen's Will"
 SPI_the_queens_will_desc:0 "The Great Mother's will, a potent pheromone of command that binds the disparate instincts of the swarm into one focused, terrifying purpose."
 SPI_exalt_the_brood_warriors:0 "Exalt the Brood Warriors"
 SPI_exalt_the_brood_warriors_desc:0 "Lesser broods follow instinct; our exalted warriors command it."
 SPI_architects_of_silk:0 "Arachnid Architecture"
 SPI_architects_of_silk_desc:0 "What is a web but a carefully constructed marvel? Our natural talents for weaving extend beyond traps, now shaping our lairs into fortresses and havens."
 SPI_let_roam_the_brood:0 "Let Roam the Brood"
 SPI_let_roam_the_brood_desc:0 "The lairs has become too small for our teeming broods. Let them spill forth and claim new hunting grounds."
 SPI_consume_the_light:0 "Consume the Light"
 SPI_consume_the_light_desc:0 "The light... it blinds us, yes... but in its absence, we are made strrronger. The night becomes our hunting ground."
 SPI_build_up_defenses:0 "Build Up Defenses"
 SPI_build_up_defenses_desc:0 "Our territories are precious, and the Mirkwood has proven itself a formidable ally. We shall extend its natural defenses, weaving barriers of silk and shadow against any who would trespass."
 SPI_silk_spun_workshops:0 "Silk-Spun Workshops"
 SPI_silk_spun_workshops_desc:0 "Deep within the shadowed heart of Mirkwood, our specialized spinnerets are adapted for rapid production. These 'workshops' will ensure the ceaseless growth of the Great Nest."
 SPI_underground_colonies:0 "Underground Colonies"
 SPI_underground_colonies_desc:0 "Our engineers, if one can call them that, toil in the deep. With silk and chitin, they reinforce the rock, creating vast, hidden complexes dedicated to arming the ever-growing swarm."
 SPI_expand_the_brood_burrows:0 "Expand the Brood Burrows"
 SPI_expand_the_brood_burrows_desc:0 "Bro... You try and come up with a description for focuses of spiders building civilian factories. I have run out of ideas..."
 SPI_deepening_the_nest:0 "Deepening the Nest"
 SPI_deepening_the_nest_desc:0 "The Great Nest must expand, not just outwards, but inwards. We delve deeper, carving vast new caverns to house our growing brood and fortify our heartland."
 SPI_alliance_building:0 "Alliance Building"
 SPI_alliance_building_desc:0 "To speak without biting... This unnatural quiet aches, but perhaps we can barter with our food... I mean *allies*... to secure a more bountiful future."
 SPI_direct_the_hunting_brood:0 "Direct the Hunting Brood"
 SPI_direct_the_hunting_brood_desc:0 "The hunt has been unleashed, but our kin is unpredictable and without direction. The appropriate reasoning and right dose of pheromones may help to guide them onto the right enemy."
 SPI_proliferation_of_the_swarm:0 "Proliferation of the Swarm"
 SPI_proliferation_of_the_swarm_desc:0 "From the darkest corners of Mirkwood, countless new hatchlings pour forth, swelling the ranks of our insatiable brood."
 SPI_grand_ambitions:0 "Grand Ambitions"
 SPI_grand_ambitions_desc:0 "Our dominion over Mirkwood is complete, and our brood has learned to tread beyond its shadowy canopy. Now, every bordering land shall bear our mark."
 SPI_world_wide_web:0 "World Wide Web"
 SPI_world_wide_web_desc:0 "Our nest has no shortage of eager web developers. And with our ever-expanding territory, they shall construct the most magnificent web that spans kingdoms."
 SPI_seek_new_knowledge:0 "Seek New Knowledge"
 SPI_seek_new_knowledge_desc:0 "The shadow of Ungoliant stretches far, and within it lies forgotten wisdom. We shall delve into the ancestral memories and latent abilities of our bloodline to unlock new power."
 SPI_sharpened_fangs:0 "Sharpened Fangs"
 SPI_sharpened_fangs_desc:0 "Our fangs are the instruments of our survival. Through careful study and refinement, they shall become instruments of death, capable of piercing any armor or hide."
 SPI_volatile_gland_experiments:0 "Volatile Gland Experiments"
 SPI_volatile_gland_experiments_desc:0 "Bubbling, festering sacs. A chaotic mix of venom and digestive acids, always on the verge of rupture. It shall bring no glee to our prey, but to us."
 SPI_arachnid_engineering:0 "Arachnid Engineering"
 SPI_arachnid_engineering_desc:0 "Through meticulous study of our innate building instincts, we develop advanced methods for construction. Our subterranean nests will grow deeper, and our aerial webs stronger, baffling and breaking any intruder."
 SPI_whispers_in_the_webs:0 "Whispers in the Webs"
 SPI_whispers_in_the_webs_desc:0 "Every vibration, every desperate rustle in the dark, a morsel of their pitiful plots. We taste the fear in the threads and learn their hidden weaknesses."
 SPI_perfected_predation:0 "Perfected Predation"
 SPI_perfected_predation_desc:0 "The instinct to hunt is ancient, primal, but it can be refined. Our methods become swifter, our attacks more devastating, leaving no chance for escape once the prey is marked."
 SPI_enhanced_corrosive_force:0 "Enhanced Corrosive Force"
 SPI_enhanced_corrosive_force_desc:0 "The volatile glands of our brood have yielded their secrets. With a more potent blend of digestive acids, our ranged attacks will now turn metal to slag and flesh to pulp."
 SPI_webbound_mechanica:0 "Webbound Mechanica"
 SPI_webbound_mechanica_desc:0 "One may be surprised as to depth that silk-based construction provides."
 SPI_dark_brood_sorcery:0 "Dark Brood Sorcery"
 SPI_dark_brood_sorcery_desc:0 "The Night-Mother's grim legacy runs deep within us. It has yet to fade entirely."
 SPI_web_wisdom_converged:0 "Hive Mind Convergence"
 SPI_web_wisdom_converged_desc:0 "The lessons learned from a thousand hunts, a thousand traps, have been absorbed by the collective mind."
 SPI_focus_on_the_essentials:0 "Focus on the Essentials"
 SPI_focus_on_the_essentials_desc:0 "While other races dabble in a thousand distractions, the Brood must sharpen its purpose. We will prune away the less vital branches of our research, dedicating every available resource to perfecting what truly matters."
 SPI_study_the_two_leggeds:0 "Study the Two-Leggeds"
 SPI_study_the_two_leggeds_desc:0 "The two-legged creatures scurry about with curious contraptions. Our silent observers bring back fascinating insights into their world."
 SPI_the_errant_visionaries:0 "The Errant Visionaries"
 SPI_the_errant_visionaries_desc:0 "From the most unexpected corners of the nest, strange and brilliant ideas emerge."
 SPI_mastery_of_our_nature:0 "Mastery of Our Nature"
 SPI_mastery_of_our_nature_desc:0 "Our fangs grow sharper, our venom more potent, our webs stronger. Through dedicated refinement, we become not merely spiders, but the ultimate predators in the image of Ungoliant."
 SPI_matriphagy:0 "Matriphagy"
 SPI_matriphagy_desc:0 "Warmer is the motherly love of our kin than that of any two-leggeds'. For what act is there, more selfless and loving, than a mother who lets herself be consumed by her own offspring? And sweet that taste of one's mother is... Yes, so sweet."
 SPI_we_spin_our_own_threads:0 "We Spin Our Own Threads"
 SPI_we_spin_our_own_threads_desc:0 "Neither the Dark Tower nor the Woodland Realm hold true sway over our appetites. Our own threads are strong enough to bind the world."
 SPI_hungering_for_the_riverlands:0 "Hungering for the Riverlands"
 SPI_hungering_for_the_riverlands_desc:0 "The verdant Riverlands, with their flowing waters and abundant life, offer a feast our broods can no longer ignore. A new hunting ground awaits."
 SPI_protect_the_egg_chambers:0 "Protect the Egg Chambers"
 SPI_protect_the_egg_chambers_desc:0 "Our future lies within the delicate silk of the egg chambers. We shall raise bulwarks of stone and web to shield the next generation from the grasping world."
 SPI_harvests_of_the_deep_nest:0 "Harvests of the Deep Nest"
 SPI_harvests_of_the_deep_nest_desc:0 "Our sprawling, fortified lair teems with life and unplumbed depths. It is time to tap into the very essence of our ancient dwelling, drawing forth its hidden treasures to fuel the swarm."
 SPI_forging_the_fangpits:0 "Forging the Fangpits"
 SPI_forging_the_fangpits_desc:0 "Sss-crap! Sss-crush! The Fangpits awaken, a gnashing maw of industry. More tools for the hunt, more fangs for the feast. The hunger... the screams... Make them stop..."
 SPI_evolve_the_nests_cunning:0 "Evolve the Nest's Cunning"
 SPI_evolve_the_nests_cunning_desc:0 "Generations of endless hunger and countless consumed prey have honed our instincts. Now, a new form of cunning emerges from the deepest, most ancient chambers of the nest."
 SPI_expand_the_nest:0 "Expand the Nest"
 SPI_expand_the_nest_desc:0 "The Great Nest may be our beating heart, but it is not our only one. Minor hives and fortified outposts must rise across our domain, each a workshop for the brood, each a bastion against the light."
 SPI_erratic_ascendance:0 "Erratic Ascendance"
 SPI_erratic_ascendance_desc:0 "The Brood's understanding is not linear. Our evolution takes erratic turns, granting sudden, inexplicable surges of instinct or strange mutations that propel us forward in unexpected directions."
 SPI_measured_mutations:0 "Measured Mutations"
 SPI_measured_mutations_desc:0 "Random mutation yields unpredictable outcomes. We, the Children of Ungoliant, prefer a more... measured approach, cultivating only the most potent advantages."
 SPI_gifts_from_the_dark_tower:0 "Gifts from the Dark Tower"
 SPI_gifts_from_the_dark_tower_desc:0 "The Dark Tower speaks, and sends forth its bounty."
 SPI_send_tribute_to_baraddur:0 "Send Tribute to Barad-dûr"
 SPI_send_tribute_to_baraddur_desc:0 "What is a small offering of our lesser catches, if it can bring the favour of the Lord of Barad-dûr? A temporary inconvenience for a future feast."
 SPI_settle_territorial_disputes:0 "Settle Territorial Disputes"
 SPI_settle_territorial_disputes_desc:0 "The small, bright things of Mirkwood. We pick at their edges, but the hunger guides us to larger, softer prey. A momentary quiet, yes, to grow strong. Our webs shall stretch far, far beyond these trees."
 SPI_wisdom_for_knowledge:0 "Wisdom for Knowledge"
 SPI_wisdom_for_knowledge_desc:0 "The Bright Folk offer their ancient lore and sagely advice, believing it may temper our instincts. Will it?"
 SPI_flesh_for_peace:0 "Flesh for Peace"
 SPI_flesh_for_peace_desc:0 "The Elves must offer... *something*. Not as juicy as a fresh kill, but enough to turn our hungry eyes elsewhere, for a time."
 SPI_alliance_of_the_deep_woods:0 "Alliance of the Deep Woods"
 SPI_alliance_of_the_deep_woods_desc:0 "While unconventional, a pact with the tree guardians is more natural than a two-legged might suspect. For one, the ent flesh offers only hard spliters and poor taste. It will keep our hunger restrained and frictions to a minimum."
 SPI_look_west_for_aid:0 "Look West for Aid"
 SPI_look_west_for_aid_desc:0 "A greater darkness stirs in the East, one that threatens even our ancient lineage. Strange allies must be sought, even from those who would normally avoid our shadowy presence, if we are to endure."
 SPI_pact_of_shadows:0 "Pact of Shadows"
 SPI_pact_of_shadows_desc:0 "Our kin have long sensed the potent malice emanating from Dol Guldur. It is time to formalize this bond, uniting the shadows of the forest against the foolish folk of the world."
 SPI_the_great_weave:0 "Arachnid Alliance"
 SPI_the_great_weave_desc:0 "The age of solitary predation is over. We have drawn disparate powers into our burgeoning faction, and now, the true work begins: tightening the threads and asserting the unified will of the Arachnid Alliance."
 SPI_restrain_the_hunger:0 "Restrain the Hunger"
 SPI_restrain_the_hunger_desc:0 "Hhhhrrnnngh. The hunger throbs, a constant ache in our myriad stomachs. But the prey is still too quick, too strong. Patience, little ones. Let the venom stew."
 SPI_carpaces_and_fangs:0 "Carpaces and Fangs"
 SPI_carpaces_and_fangs_desc:0 "The chitin hardens, the fangs elongate. The brood-mothers command a terrible transformation, churning out new implements of war."
 SPI_adaptive_learning:0 "Adaptive Learning"
 SPI_adaptive_learning_desc:0 "The two-legged creatures scurry in predictable ways, but the web grows restless. We must adapt, change our attack, ensnare them with new, unseen methods."
 SPI_devour_the_deep_kin:0 "Devour the Deep Kin"
 SPI_devour_the_deep_kin_desc:0 "Their tunnels and fortresses, once bastions of the Deep Kin, now echo with the scuttling of our hungry brood. With every dwarf devoured, we consume their memories, their knowledge. Let us absorb what is useful to us."
 SPI_feast_on_the_fair:0 "Feast on the Fair"
 SPI_feast_on_the_fair_desc:0 "A true delight, these delicate Elves. With every elf devoured, we consume their memories, their knowledge. Let us absorb what is useful to us."
 SPI_webs_over_the_black_tower:0 "Feed on Black Blood"
 SPI_webs_over_the_black_tower_desc:0 "Rarely a shortage of orc-flesh. Always available in great numbers. Mediocre taste, but it sates our hunger. With every orc devoured, we consume their memories, their knowledge. Let us absorb what is useful to us."
 SPI_delicous_warm_blood:0 "Feast on Warm Blood"
 SPI_delicous_warm_blood_desc:0 "The vibrant ichor of Men... it grants us a curious, fleeting warmth. With every man devoured, we consume their memories, their knowledge. Let us absorb what is useful to us."
 SPI_economy_of_hunger:0 "Economy of Hunger"
 SPI_economy_of_hunger_desc:0 "The Mirkwood offers little beyond shadow and fear for many, but for us, it is a larder. By streamlining our consumption, we ensure a surplus for expansion, not mere comfort."
 SPI_rouse_the_war_broods:0 "Rouse the War Broods"
 SPI_rouse_the_war_broods_desc:0 "The time for quiet feasting is over. The Brood Mothers stir, sending tremors through the dark earth, rousing countless legs and fangs for the coming hunt."
 SPI_strike_north:0 "Strike North"
 SPI_strike_north_desc:0 "The northern reaches of Mirkwood call to us, promising new hunting grounds and the chance to ensnare unsuspecting prey."
 SPI_recall_the_roaming_brood:0 "Recall the Roaming Brood"
 SPI_recall_the_roaming_brood_desc:0 "To tame the endlessly wandering brood is to fight against the very essence of their being, yet the Matriarch's will bends even the wildest instincts."
 SPI_move_south:0 "Move South"
 SPI_move_south_desc:0 "The time for idle lurking is over. Our expansion demands fresh territories, and the south promises an endless feast for the ever-growing swarm."
 SPI_secure_the_north:0 "Secure the North"
 SPI_secure_the_north_desc:0 "To truly claim the north, we must transform it. New foundries for silk and tunnels for our young will ensure its place as a vital segment of our expanding domain."
 SPI_endless_sprawl:0 "Endless Sprawl"
 SPI_endless_sprawl_desc:0 "The deep, dark woods of Mirkwood offer ample space for our kin to multiply. Let the silent spread begin, creeping into every shadowed corner, leaving a legacy of fear and webbing."
 SPI_secure_the_south:0 "Secure the South"
 SPI_secure_the_south_desc:0 "Our territory expands, but the southern fringe remains... vulnerable. We must bind it with silk and stone, weaving an impenetrable barrier against the coming storm."
 SPI_purge_the_two_leggeds:0 "Purge the Two-Leggeds"
 SPI_purge_the_two_leggeds_desc:0 "The Great Web is complete, and it is vast. But it cannot be truly perfect until all foreign bodies, all two-legged debris, are thoroughly cleared out and devoured."
 SPI_the_great_nest:0 "The Great Nest"
 SPI_the_great_nest_desc:0 "They once knew it as Mirkwood, a place of dread. We shall make it the Great Nest, a monument to our dominion that will leave them no doubt of who truly rules this land."
 SPI_assert_out_control:0 "Assert Our Control"
 SPI_assert_out_control_desc:0 "The lesser races have been swept away. From the deepest caverns to the highest canopy, the Great Web expands, asserting our rightful claim and shaping the forest to our true purpose."
 SPI_the_one_ring_gambit:0 "The One Ring Gambit"
 SPI_the_one_ring_gambit_desc:0 "Whispers far and wide of a fellowship, and a ring... If this ring is heading to Orodruin, it may pass by our beloved sister, Shelob. Can you imagine the look on Sauron's face if she were to take the ring and... bring it here?"
 SPI_put_our_differences_aside:0 "Put Our Differences Aside"
 SPI_put_our_differences_aside_desc:0 "The Mother knows. There is more than enough fresh, screaming prey to sate us all, if only we work... together. A temporary aberration."
 SPI_ungoliants_apetite:0 "Ungoliant's Appetite"
 SPI_ungoliants_apetite_desc:0 "The primal hunger of Ungoliant stirs within our brood. No feast is ever enough, no victim too grand to satisfy the ancient, gnawing void that drives us."
 SPI_tender_flesh:0 "Tender Flesh"
 SPI_tender_flesh_desc:0 "The grace and ethereal beauty of the Elves makes them a prized hunt. Unlike the coarse meat of others, their tender bodies are perfectly suited to feed the hungry maw of the deep nest."
 SPI_black_blood:0 "Black Blood"
 SPI_black_blood_desc:0 "A foul, dark ichor, thick upon the ground. The taste of orc-blood is harsh, but it sates our hunger well enough."
 SPI_extend_the_perimeter:0 "Extend the Perimeter"
 SPI_extend_the_perimeter_desc:0 "Let the shadow of our reach lengthen across Mirkwood. Our Nest Guardians, emboldened by their terrible Mother, will now mark the wider boundaries of our hunting territory."
 SPI_ecdysis:0 "Ecdysis"
 SPI_ecdysis_desc:0 "The itch... the tearing! Agony... With a final pull, the old, tight skin is shucked, leaving behind a fresh, hardened armor, still gleaming."

 SPI_boons_of_the_nest:0 "Boons of the Nest"
 SPI_boons_of_the_nest_desc:0 "The nest has much to give. Not just to our young, but to us all."
 SPI_increase_silk_production:0 "Increase Silk Production"
 SPI_increase_silk_production_desc:0 "We spin silk for more than just traps. By refining our spinnerets we can create stronger, more versatile silk to fortify our lairs and ensnare our prey."
 SPI_the_silk_trade:0 "The Silk Trade"
 SPI_the_silk_trade_desc:0 "The outsiders may have something of use to offer us. By trading our silk, we can acquire resources and knowledge that will further our dominion over Mirkwood."
 SPI_arachnid_adaptations:0 "Arachnid Adaptations"
 SPI_arachnid_adaptations_desc:0 "While swords require steel and spears require wood, our weapons are not forged in the same manner as the two-leggeds'."
 SPI_skin_captured_prey:0 "Skin Captured Prey"
 SPI_skin_captured_prey_desc:0 "'Tis a simple process, really. The prey is captured, subdued, and then... peeled. The flesh is consumed, but the skin can be repurposed into armor or tools for the brood."
 SPI_boons_of_the_hunt:0 "Boons of the Hunt"
 SPI_boons_of_the_hunt_desc:0 "Our prey frequently carries useful items other than their flesh. Let us not be wasteful with this, just because it can't be eaten."

SPI_uncontrolled_swarm:0 "Uncontrolled Swarm"
SPI_uncontrolled_swarm_desc:0 "The Great Spiders are a decentralized, instinct-driven brood. They are not used to being commanded or ruled, and their hunger is a powerful force that can lead them astray. While the brood-mothers can take steps to guide and influence the swarm, they cannot fully control it. The swarm may act on its own impulses, leading to unpredictable and potentially dangerous outcomes."
SPI_uncontrolled_swarm_2:0 "Uncontrolled Swarm"
SPI_uncontrolled_swarm_2_desc:0 "The Great Spiders are a decentralized, instinct-driven brood. They are not used to being commanded or ruled, and their hunger is a powerful force that can lead them astray. While the brood-mothers can take steps to guide and influence the swarm, they cannot fully control it. The swarm may act on its own impulses, leading to unpredictable and potentially dangerous outcomes."