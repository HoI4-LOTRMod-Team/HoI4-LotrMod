l_english:
 GLD_ascend_the_carrock:0 "Ascend the Carrock"
 GLD_ascend_the_carrock_desc:0 "From the heights of the Carrock, our sight can span the entire river valley. Establishing a permanent stronghold here is not just about defense, but about claiming the skies above."
 GLD_tame_the_eagles_of_the_eyrie:0 "Tame the Eagles of the Eyrie"
 GLD_tame_the_eagles_of_the_eyrie_desc:0 "The Eyrie calls to us from the jagged peaks, home of the Great Eagles. It is a perilous climb, but if we can earn their favor, our enemies will learn that the true kings of the air are not to be trifled with."
 GLD_eyes_of_the_mountain:0 "Eyes of the Mountain"
 GLD_eyes_of_the_mountain_desc:0 "The mountains shall have eyes, and those eyes belong to our eagle companions. No longer will our enemies be able to move in secrecy across the plains."
 GLD_tribute_to_gwaihir:0 "Tribute to Gwaihir"
 GLD_tribute_to_gwaihir_desc:0 "The Great Eagles are not beasts to be commanded, but ancient and proud allies. A fitting homage to their Lord, Gwaihir, is paramount to earning their full favor."
 GLD_the_mountain_problem:0 "The Mountain Problem"
 GLD_the_mountain_problem_desc:0 "The Misty Mountains, a grim natural barrier to our west, are infested with the squalid Goblins of Goblin Town. Their constant raids and lurking presence are an ever-present danger that we must now address directly."
 GLD_purge_the_undercity:0 "Purge the Undercity"
 GLD_purge_the_undercity_desc:0 "A 'city' of such squalor and ill-intent cannot be allowed to endure on our borders. Consider this less a war, and more a long-overdue extermination of a persistent pest."
 GLD_fortify_the_mountain_passes:0 "Fortify the Mountain Passes"
 GLD_fortify_the_mountain_passes_desc:0 "The stench of Goblin-town drifts too often on the western wind. A sturdy wall and a vigilant guard might yet dissuade their foul enterprises."
 GLD_parley_with_the_goblins:0 "Parley with the Goblins"
 GLD_parley_with_the_goblins_desc:0 "One does not simply walk into Goblin Town... unless you're carrying a large bag of shiny things. Sometimes, a few concessions can keep the little nasties at bay."
 GLD_sack_of_the_hill_men:0 "Sack of the Hillmen"
 GLD_sack_of_the_hill_men_desc:0 "Our scouts report the Hill-Men are unprepared for an assault from the west. A sudden and overwhelming 'visit' to their homelands will not only secure our borders but also demonstrate the growing reach of our Chiefdoms."
 GLD_the_backdoor_to_the_west:0 "The Backdoor to the West"
 GLD_the_backdoor_to_the_west_desc:0 "The Goblins of the Misty Mountains are not known for their hospitality, yet a cunning deal has been struck. Their High Pass now offers us a secret route to the lands beyond, a true backdoor to the West."
 GLD_eagle_patrols:0 "Eagle Patrols"
 GLD_eagle_patrols_desc:0 "Our alliance with the Great Eagles extends to every crag and pass. From their lofty perches, their keen eyes now watch over the Gladden Vales, making goblin incursions far more difficult."
 GLD_assert_the_high_chief:0 "Assert the High Chief"
 GLD_assert_the_high_chief_desc:0 "With Mirkwood to the east and goblins to the west, scattered leadership is a luxury we can no longer afford. The High Chief's authority must be absolute, uniting us against all threats."
 GLD_war_councils_of_gladden:0 "War Councils of Gladden"
 GLD_war_councils_of_gladden_desc:0 "The time for idle talk is past. Our chieftains now gather, not for harvest festivals, but to deliberate the grim necessities of war."
 GLD_arms_before_comfort:0 "Arms Before Comfort"
 GLD_arms_before_comfort_desc:0 "With dangers on all sides, the choice is clear: we must arm ourselves. This shift will not be without its costs, but the alternative is unthinkable."
 GLD_the_strong_lead_the_weak:0 "The Strong Lead the Weak"
 GLD_the_strong_lead_the_weak_desc:0 "Some speak of alliances, of shared burdens. We speak of truth: there are those who command, and those who kneel. Let our actions determine where we stand."
 GLD_rally_the_banners:0 "Rally the Banners"
 GLD_rally_the_banners_desc:0 "The time for talk is over."
 GLD_lords_of_the_gladden_fields:0 "Lords of the Gladden Fields"
 GLD_lords_of_the_gladden_fields_desc:0 "The rivers and fields of Gladden have been our home for generations. It is time we formally declare our stewardship, gathering the will of our people to face the trials ahead."
 GLD_bolder_not_safer:0 "Bolder, Not Safer"
 GLD_bolder_not_safer_desc:0 "To remain truly safe, we must cease to cling to the illusion of our own vales as a sanctuary. Fortune favors the bold, and perhaps the Misty Mountains hold more than just dangers."
 GLD_the_west_bank:0 "The West Bank"
 GLD_the_west_bank_desc:0 "The western bank of the Great River holds strategic importance. Better roads and infrastructure will allow us to better control and protect these frontier lands."
 GLD_the_east_bank:0 "The East Bank"
 GLD_the_east_bank_desc:0 "The eastern bank of the Anduin is the heart of our chiefdoms, the fertile ground that feeds our people and pastures our horses. It is here we must first build up our strength."
 GLD_deal_with_the_great_spiders:0 "Deal with the Great Spiders"
 GLD_deal_with_the_great_spiders_desc:0 "They say ignorance is bliss, but when 'bliss' means stumbling into a giant web, perhaps some detailed reports are in order. We must gather all intelligence on the arachnid menace."
 GLD_legacy_of_the_eotheod:0 "Legacy of the Éothéod"
 GLD_legacy_of_the_eotheod_desc:0 "The spirit of the Eotheod lives on in our people. It is time to embrace the heritage of our ancestors, who rode across these very plains, unmatched in their horsemanship."
 GLD_secure_the_forest_edge:0 "Secure the Forest Edge"
 GLD_secure_the_forest_edge_desc:0 "Our settlements along the forest edge are vulnerable. The time for observation is over; now we must raise the palisades and dig the ditches, turning our frontier into an unyielding shield."
 GLD_lifestock_for_peace:0 "Livestock for Peace"
 GLD_lifestock_for_peace_desc:0 "A distasteful bargain, yet a necessary one for our survival. Our cattle and sheep, once signs of our prosperity, now serve as a shield against the creeping menace of the Woods, buying time at a heavy cost."
 GLD_burn_the_nests:0 "Burn the Nests"
 GLD_burn_the_nests_desc:0 "We have seen enough of their creeping terror. No amount of livestock will buy true peace from such evils. Our only recourse is to put torch to web, and sword to mandibles."
 GLD_attack_spiders:0 "Attack Spiders"
 GLD_attack_spiders_desc:0 "The dread of the Great Spiders is a burden we can no longer bear. Though the task is grim and the foe terrible, we will steel our hearts and strike into their very dens."
 GLD_trade_for_spidersilk:0 "Trade for Spidersilk"
 GLD_trade_for_spidersilk_desc:0 "Our need for durable materials grows with each passing year. The formidable strands spun by the Great Spiders offer a unique solution, one that can be acquired without bloodshed, for a suitable offering of livestock."
 GLD_riders_of_the_gladden:0 "Riders of the Gladden"
 GLD_riders_of_the_gladden_desc:0 "The Eotheod were masters of the horse. We shall honor that legacy by raising new companies of swift riders to guard our vales and plains."
 GLD_thunder_on_the_plains:0 "Thunder on the Plains"
 GLD_thunder_on_the_plains_desc:0 "When our riders take to the field, the earth trembles beneath a thousand hooves. The sound is a promise of overwhelming force, striking fear into the hearts of our enemies before the blades even clash."
 GLD_skirmish_doctrine:0 "Skirmish Doctrine"
 GLD_skirmish_doctrine_desc:0 "A fixed battle is a fool's game when the plains beckon. Our riders will learn to circle and harry, to strike hard and retreat faster."
 GLD_horse_breeding_clans:0 "Horse-Breeding Clans"
 GLD_horse_breeding_clans_desc:0 "Generations of Gladden-folk have known horses intimately. We shall foster this deep knowledge, ensuring our stables overflow with swift steeds and the robust equipment they require."
 GLD_among_the_free_peoples:0 "Among the Free Peoples"
 GLD_among_the_free_peoples_desc:0 "To stand apart in these darkening times is to invite doom. We must look beyond our borders and join hands with the Elves, the Beornings, and all who still breathe free air, against the encroaching shadow."
 GLD_middle_of_the_road:0 "Middle of the Road"
 GLD_middle_of_the_road_desc:0 "To commit prematurely is to invite ruin. We shall stand in the middle, watchful and prepared, allowing the tides of power to reveal themselves before we cast our lot."
 GLD_honor_old_friendships:0 "Honor Old Friendships"
 GLD_honor_old_friendships_desc:0 "Our forefathers forged bonds of kinship with the Free Peoples of these lands, and those ties still hold true. As shadows lengthen, it is time to honor these old friendships once more."
 GLD_reach_out_to_rohan:0 "Reach Out to Rohan"
 GLD_reach_out_to_rohan_desc:0 "Our people, descendants of the same proud riders, have long been separated by leagues and years. A formal delegation to Rohan is an overdue courtesy."
 GLD_send_riders_to_rohan:0 "Send Riders to Rohan"
 GLD_send_riders_to_rohan_desc:0 "A storm gathers, threatening all the Free Peoples. To stand alone is to fall. Our finest cavalry, seasoned by the wilds of the Anduin, will reinforce the Mark, a vital contribution to the coming struggle."
 GLD_the_council_of_the_vales:0 "The Council of the Vales"
 GLD_the_council_of_the_vales_desc:0 "The shadows lengthen in the East and West. The time for isolation is over; the Free Peoples of the Anduin must gather their strengths and formalize their defense, or be swallowed by the coming storm."
 GLD_approach_rhosgobel:0 "Approach Rhosgobel"
 GLD_approach_rhosgobel_desc:0 "Southward lie the green havens of Rhosgobel, a vital bulwark against the creeping influence from the forest. Their place in the Council of the Vales is essential for the common defence."
 GLD_approach_the_beornings:0 "Approach the Beornings"
 GLD_approach_the_beornings_desc:0 "An alliance with the Beornings would mean a formidable addition of men and bears to our cause. Our envoys must brave the wilderness, hoping that common enemies outweigh old suspicions."
 GLD_emissaries_to_the_woods:0 "Emissaries to the Woods"
 GLD_emissaries_to_the_woods_desc:0 "Our kin have long looked to the East with a wary eye. Now, with darkness stirring, we send forth envoys to Thranduil's halls, hoping to rekindle old alliances among the Free Peoples."
 GLD_in_pursuit_of_a_throne:0 "In Pursuit of a Throne"
 GLD_in_pursuit_of_a_throne_desc:0 "The whispers of a lost heritage, of a people who journeyed south to found the Mark, stir within our hearts. We look to that past glory, and dream of a future where a kingdom of Gladden stands tall and proud."
 GLD_offer_rhosgobel_protection:0 "Offer Rhosgobel Protection"
 GLD_offer_rhosgobel_protection_desc:0 "Threats gather on all horizons, demanding a strong and unified response from the Free Peoples of the Vales. Rhosgobel, though small, holds a strategic position and a wealth of unique skills that would be best lent to a common, united cause."
 GLD_watch_the_borders:0 "Watch the Borders"
 GLD_watch_the_borders_desc:0 "A wise chief knows what lurks beyond his sight. We shall raise watch-towers of a new kind, piercing the veils over the Misty Mountains and the tangled Mirkwood."
 GLD_armed_neutrality:0 "Armed Neutrality"
 GLD_armed_neutrality_desc:0 "We have no illusions about the dangers that surround us. The world beyond our vales is a perilous place, and only by standing firm and ready can we hope to preserve our peace."
 GLD_choose_our_moment:0 "Choose Our Moment"
 GLD_choose_our_moment_desc:0 "The world is a brewing cauldron of conflict. We are not fools to leap into every fray; we shall carefully pick our battles, ensuring that when we do engage, our blows are decisive."
 GLD_long_term_growth:0 "Long-Term Growth"
 GLD_long_term_growth_desc:0 "The future of Gladden lies in its fields and workshops, not solely on the battlefield. A steady hand building for tomorrow might not always satisfy today's warriors, but it ensures a tomorrow worth fighting for."
 GLD_cultivate_the_foodplains:0 "Cultivate the Floodplains"
 GLD_cultivate_the_foodplains_desc:0 "To prepare for the challenges ahead, we must maximize the yield of our fields. The foodplains will become a source of essential supplies, processed to fuel our industries and sustain our independence."
 GLD_expand_the_rivermarkets:0 "Expand the Rivermarkets"
 GLD_expand_the_rivermarkets_desc:0 "The bounty of our fields and the crafts of our hands now demand greater avenues of trade. The Great River, ever our faithful companion, shall become a bustling artery of commerce."
 GLD_war_camp_economy:0 "War Camp Economy"
 GLD_war_camp_economy_desc:0 "A hard truth, but a truth nonetheless: funding a proper army means everyone pays their share. The alternative is to pay a far greater price."
 GLD_eastside_forges:0 "Eastside Forges"
 GLD_eastside_forges_desc:0 "Steel does not appear from thin air, and our stockpiles are meager. Our skilled smiths will establish new foundries on the east bank, turning ore into the sinews of war."
 GLD_unify_the_vales:0 "Unify the Vales"
 GLD_unify_the_vales_desc:0 "A fractured people are a weak people. To face the encroaching shadows, the various chieftaincies must be brought under a single banner, by steel if persuasion fails."
 GLD_punitive_raids:0 "Punitive Raids"
 GLD_punitive_raids_desc:0 "Our patience has worn thin. Those who seek to trouble the Gladden-folk will soon learn the speed of our horses and the sharpness of our blades."
 GLD_attack_the_beornings:0 "Attack the Beornings"
 GLD_attack_the_beornings_desc:0 "For too long have the Beornings claimed dominion over the Carrock and the northern passes. Our Eotheod blood demands we assert our claim, and none shall stand against our riders."
 GLD_attack_rhosgobel:0 "Attack Rhosgobel"
 GLD_attack_rhosgobel_desc:0 "The time has come to unify the Anduin Vales under a single, strong hand. Rhosgobel, with its fertile lands and strategic position, is a vital piece in securing our dominion."
 GLD_war_loans:0 "War Loans"
 GLD_war_loans_desc:0 "In these desperate times, pragmatism must overcome prejudice. The Goblins may be our ancient enemies, but their hoards are vast. We shall take what we need, and worry about the interest later."
 GLD_emergency_levies:0 "Emergency Levies"
 GLD_emergency_levies_desc:0 "There is no more time for training, nor for crafting fine equipment. Give them what we have, point them towards the enemy, and pray to the Valar that their courage holds."
 GLD_underground_workshops:0 "Underground Workshops"
 GLD_underground_workshops_desc:0 "A blacksmith's shop in a cave might seem crude, but a hidden factory is a priceless asset. We will move our most critical production out of sight and out of mind of those who wish us ill."
 GLD_expand_the_nest:0 "Expand the Nest"
 GLD_expand_the_nest_desc:0 "Our ancient allies, the Lords of the Sky, deserve a fitting sanctuary. By expanding their domain on the Carrock, we signify our commitment to their strength and our ambition to claim the skies above the Anduin."
 GLD_lease_elven_bows:0 "Lease Elven Bows"
 GLD_lease_elven_bows_desc:0 "To gain the trust of the Woodland Realm and receive their keen bows is no small feat. It speaks volumes of the shadow that binds us all."
 GLD_request_an_heir:0 "Request an Heir"
 GLD_request_an_heir_desc:0 "One might call it rather forward, but Rohan's royal lineage is long and plentiful. Surely they have a spare monarch or two for a deserving kin?"
 GLD_form_the_kingdom_of_gladden:0 "Form the Kingdom of Gladden"
 GLD_form_the_kingdom_of_gladden_desc:0 "With an heir secured and the ambition burning bright, the time has come to formalize our rule. The Chiefdoms of Gladden shall fade into history, as the Kingdom of Gladden takes its first breath."
