l_english:

#################################
 dolguldur.100.t:0 "Attack on Mirkwood Elves"

 dolguldur.100.desc:0 "Some of our kin have made a rash assault upon the Elves of Mirkwood.\nThis attack was not directed by our Broodmothers and is now beyond our control. There is some evidence it was spurred by the dark influence of Dol Guldur."

 dolguldur.100.a:0 "Attempt to minimize the damage caused."

 dolguldur.101.t:0 "The Spiders launch a raid"

 dolguldur.101.desc:0 "A swarm of Ungoliant's brood has descended upon us, striking one of our woodland sanctuaries. Though they came unaided by any guiding hand, they have left little mark upon us, with only a few brave souls lost in defense."

 dolguldur.101.a:0 "A peril we endure living alongside Spiders..."

 dolguldur.102.t:0 "Exploiting the Divisions Among Woodman Clans"

 dolguldur.102.desc:0 "The clans of the Anduin woodmen are embroiled in disputes and discord. Now is our chance to exploit their divisions. We should approach one of these factions with a proposition... of mutual interest."
 dolguldur.102.a:0 "Ask Rhosgobel to attack Gladden together"
 dolguldur.103.t:0 "The Elves respond with force"

 dolguldur.103.desc:0 "The Elves, livid from the uncalled-for attack by our errant brethren, have stormed our territory. Their warriors slash through our webs and shatter our egg nests, leaving a trail of havoc in their wake!"

 dolguldur.103.a:0 "*Screeching noises*"

 dolguldur.100.b:0 "Encourage their advance, let them wreak havoc while they can."

 dolguldur.104.t:0 "The Spiders launch a raid"

 dolguldur.104.desc:0 "One of our peaceful groves suffered a grievous blow from a sudden ambush by the spawn of Ungoliant. With swiftness they descended upon us, leaving ruin and sorrow in their wake."

 dolguldur.104.a:0 "Dispatch aid forthwith!"

 dolguldur.101.b:0 "How dare they! We shall retaliate and hunt these vermin!"

 dolguldur.104.b:0 "Foul creatures! We will strike back with a heavy hand!"

 dolguldur.105.t:0 "A Dark Proposal from Dol Guldur"

 dolguldur.105.desc:0 "The orcs of Dol Guldur are marching to war, driven by the lure of conquest. They offer us a secret deal to strike against the Chiefdom of Gladden, promising wealth and spoils."

 dolguldur.105.a:0 "We accept their offer."

 dolguldur.106.t:0 "An Offer from Dol Guldur"

 dolguldur.106.desc:0 "The orcs of Dol Guldur approach us with a dark proposition. Together, they suggest, we could ravage the lands of Rhosgobel and divide their riches among ourselves."

 dolguldur.106.a:0 "We see the wisdom in their words."

 dolguldur.107.t:0 "A Sinister Proposal from Dol Guldur"

 dolguldur.107.desc:0 "The orcs of Dol Guldur have emerged from their dark fortress with ill intent, claiming that war presents a unique opportunity.\n\nThey have approached us with a devious plan. They suggest a joint assault: as they lay siege upon the men of Rhosgobel, we are to strike against the Chiefdoms of Gladden, ensuring our foes cannot unite against us."

 dolguldur.107.a:0 "We shall seize this opportunity."

 dolguldur.108.t:0 "Secret Deal with Rhosgobel Forged"

 dolguldur.108.desc:0 "The woodmen of Rhosgobel have sworn themselves to our cause, agreeing to our hidden machinations. They await our signal to strike."

 dolguldur.108.a:0 "A promising beginning."

 dolguldur.109.t:0 "The Rejection of Rhosgobel"

 dolguldur.109.desc:0 "The woodmen of Rhosgobel have turned away from our proposal, spurning the offer."

 dolguldur.109.a:0 "Their time of reckoning approaches."

 dolguldur.110.t:0 "Gladden Chiefs Join the Dark Alliance"

 dolguldur.110.desc:0 "The Chiefs of Gladden see the merit in our proposal, joining our shadowy coalition. They stand ready for our command."

 dolguldur.110.a:0 "The plan unfolds."

 dolguldur.111.t:0 "Gladden Chiefs Reject the Offer"

 dolguldur.111.desc:0 "The Chiefdoms of Gladden refuse our overtures, choosing to stand alone."

 dolguldur.111.a:0 "Their fall is inevitable."

 dolguldur.112.t:0 "The Beornings Prepare for War"

 dolguldur.112.desc:0 "The Vales of Anduin have pledged themselves to our plan, poised to act upon our signal."

 dolguldur.112.a:0 "Our power grows."

 dolguldur.113.t:0 "The Beornings Stand Defiant"

 dolguldur.113.desc:0 "The Vales of Anduin reject our offers, remaining steadfast in their defiance."

 dolguldur.113.a:0 "Their downfall is assured."

 dolguldur.102.b:0 "Ask Gladden to attack Rhosgobel together"

 dolguldur.102.c:0 "Ask the Beornings of the Vales for a joint attack"

 dolguldur.102.d:0 "We can't trust any of them."

 dolguldur.105.b:0 "Our honor forbids alliance with orcs."

 dolguldur.106.b:0 "We shall not trust the words of orcs."

 dolguldur.107.b:0 "Our honor is not for sale; we reject deceit."

 dolguldur.114.t:0 "Honoring the Secret Pact"

 dolguldur.114.desc:0 "A shadowy war now burns between Dol Guldur and the Chiefdoms of Gladden. By the terms of an oath whispered in secrecy, we swore our allegiance to Dol Guldur. The time has come for us to uphold our promise and march to war alongside them."

 dolguldur.114.a:0 "To arms, as honor demands!"

 dolguldur.115.t:0 "Honoring Our Secret Pact"

 dolguldur.115.desc:0 "Dol Guldur has taken the step of declaring war upon the Woodmen of Rhosgobel. Bound by the secret agreement forged with Dol Guldur, we are called to join this campaign of conquest. Our honor and commitment are at stake, and decisions must be made."

 dolguldur.115.a:0 "To arms! The time for battle has come."

 dolguldur.116.t:0 "Honoring Our Secret Oath"

 dolguldur.116.desc:0 "Dol Guldur has unleashed war upon the Woodmen of Rhosgobel. As sworn by our clandestine pact, we are compelled to march against the Chiefdoms of Gladden. It is our duty to ensure that aid does not reach the Woodmen."

 dolguldur.116.a:0 "To arms!"

 dolguldur.114.b:0 "Alas, we must break our vow."

 dolguldur.115.b:0 "Alas, we cannot honor that pact now."

 dolguldur.116.b:0 "We cannot uphold our pledge at this time."

 dolguldur.117.t:0 "Dol Guldur Seeks Our Aid"

 dolguldur.117.desc:0 "Dol Guldur recently mounted an assault on one of our mannish neighbors. They bid us to join them in this conquest, promising a share in the spoils of battle."

 dolguldur.117.a:0 "The offer is tempting. To arms!"

 dolguldur.117.b:0 "Such actions would ill serve our interests."

 dolguldur.117.c:0 "We shall march to war, but only with due compensation in resources and gold."

 dolguldur.118.t:0 "Goblin Town Heeds the Call"

 dolguldur.118.desc:0 "Goblin Town has risen to our summons and committed their forces to our campaign."

 dolguldur.118.a:0 "Excellent!"

 dolguldur.119.t:0 "Goblin Town Stands Aloof"

 dolguldur.119.desc:0 "Our plea for aid has been spurned by Goblin Town. They remain ensconced within the Misty Mountains."

 dolguldur.119.a:0 "Spineless wretches!"

 dolguldur.120.t:0 "Goblin Town Demands Compensation"

 dolguldur.120.desc:0 "Goblin Town has agreed to our summon but insists on receiving ample support in arms and treasure."

 dolguldur.120.a:0 "Satisfy their demands."

 dolguldur.120.b:0 "Hah! We shall win this war by ourselves then."

 dolguldur.121.t:0 "Dol Guldur Agrees to Terms"

 dolguldur.121.desc:0 "Dol Guldur has consented to our terms, delivering much needed supplies and gold. We are now bound to their cause."

 dolguldur.121.a:0 "Let us march to battle!"

 dolguldur.122.t:0 "Dol Guldur Denies Our Terms"

 dolguldur.122.desc:0 "Our request for aid has been completely rejected by Dol Guldur."

 dolguldur.122.a:0 "Let them face their fate unaided."

 dolguldur.123.t:0 "Our Plans with Gundabad"

 dolguldur.123.desc:0 "To the North, the ominous peaks of Gundabad are stirring for battle. As we prepare to strike towards the Anduin, it is prudent for us to consider aligning our efforts with Gundabad for a coordinated assault."

 dolguldur.123.a:0 "Request that they assault the Vales of Anduin as we declare war."

 dolguldur.123.b:0 "Propose that they stab the Vales of Anduin in the back at the opportune moment!"

 dolguldur.123.c:0 "Seek material support from them to bolster our forces."

 dolguldur.123.e:0 "We don't need their help."

 dolguldur.124.t:0 "Dol Guldur Seeks Coordination"

 dolguldur.124.desc:0 "Dol Guldur intends to advance upon the Anduin and seeks our participation. They propose we strike the Beornings of the Vale simultaneously with their own offensive, ensuring a divided enemy."

 dolguldur.124.a:0 "We won't decline an opportunity for battle and pillage!"

 dolguldur.125.t:0 "Dol Guldur Seeks Coordination"

 dolguldur.125.desc:0 "Dol Guldur plans to move against the Anduin and seeks our involvement.\n\nThey reveal to us a secret pact they have with the Vales: as they assault the Woodmen of Rhosgobel, the Vales are to strike the Chiefdoms of Gladden. They now wish for us to treacherously attack the Vales from the rear and claim the spoils for ourselves."

 dolguldur.125.a:0 "A cunning scheme. count us in!"

 dolguldur.126.t:0 "Dol Guldur Requests Support"

 dolguldur.126.desc:0 "Dol Guldur is preparing to march on the Anduin and requests our aid in the form of arms and provisions to strengthen their campaign."

 dolguldur.126.a:0 "Very well, we can afford to share some supplies."

 dolguldur.127.t:0 "Gundabad Sends Aid"

 dolguldur.127.desc:0 "Gundabad has consented to dispatch a consignment of equipment to bolster our impending campaign."

 dolguldur.127.a:0 "Excellent!"

 dolguldur.124.b:0 "We have other plans."

 dolguldur.125.b:0 "How can we trust Dol Guldur not to deceive us as well?"

 dolguldur.126.b:0 "We are facing shortages ourselves."

 dolguldur.127.b:0 "Thank them for it."

 dolguldur.128.t:0 "Gundabad Agrees"

 dolguldur.128.desc:0 "Gundabad has accepted our proposal and stands ready to engage the Beornings of the Vale when the hour of battle is upon us."

 dolguldur.128.a:0 "This bodes well!"

 dolguldur.129.t:0 "Gundabad Refuses"

 dolguldur.129.desc:0 "Gundabad has dismissed our notion of a synchronized assault."

 dolguldur.129.a:0 "Faint-hearted!"

 dolguldur.130.t:0 "Gundabad Declines"

 dolguldur.130.desc:0 "Gundabad has declined our appeal for resources, stating their own limitations and requirements."

 dolguldur.130.a:0 "Useless!"

 dolguldur.131.t:0 "Our Oath to Dol Guldur"
 dolguldur.131.desc:0 "As foretold by Dol Guldur, the Beornings of Anduin have waged war upon the Chiefdoms of Gladden, all part of Dol Guldur's cunning plot. We swore an oath to strike the Beornings from behind when the time came. Now, we must decide whether to uphold that oath and honor our commitment."
 dolguldur.131.a:0 "Very well. To arms!"
 dolguldur.131.b:0 "We cannot do that right now."

 dolguldur.132.t:0 "Honoring Our Pact with Dol Guldur"
 dolguldur.132.desc:0 "The time has come for the orcs of Gundabad to fulfill our oath. The orcs of Dol Guldur have emerged from the shadowed depths of Mirkwood and set upon the men who dwell along the Anduin. Our word was given that when this moment arrived, we would rise and strike against the Beornings of the Vale. Now, let us prepare to keep our promise."
 dolguldur.132.a:0 "So be it. Unleash our fury!"
 dolguldur.132.b:0 "Our forces are not ready for war."

 dolguldur.133.t:0 "Dol Guldur Proposes a Coordinated Strike"

 dolguldur.133.desc:0 "Dol Guldur has informed us of their plans to strike against Rohan, just as we prepare for our own offensive. They propose a united assault to increase the likelihood of our shared objectives. We must decide how to align our strategy with theirs in this endeavor."

 dolguldur.133.a:0 "Deliver a fierce blow to keep the Rohirrim occupied!"

 dolguldur.133.b:0 "Prioritize swift capture of strategic points!"

 dolguldur.133.c:0 "Ensure our warbands are well-provisioned for the advance!"

 dolguldur.133.e:0 "Reject Dol Guldur's proposition; we shall act independently."

 dolguldur.134.t:0 "Coordination with Isengard"

 dolguldur.134.desc:0 "Isengard has agreed to cooperate with us against Rohan. We may now choose what role we wish to assume in this attack."

 dolguldur.134.a:0 "We will maximize our damage against them to pin them in place!"

 dolguldur.134.b:0 "Speed is of the essence to allow us to quickly capture key locations!"

 dolguldur.134.c:0 "Rohan's countryside is sparse. We must look after our supplies."

 dolguldur.136.t:0 "Joint Military Exercises with Dol Guldur"

 dolguldur.136.desc:0 "The forces of Dol Guldur, allies in our designs against Rohan, have extended an invitation to partake in joint military maneuvers. Such exercises would strengthen our armies and prepare us for the battles to come."

 dolguldur.136.a:0 "Engage in the exercises."
 dolguldur.136.b:0 "We have no need for this."

 dolguldur.138.t:0 "The Role of Dol Guldur"

 dolguldur.138.desc:0 "The dark fortress of Dol Guldur stands firm within the shadowy depths of Mirkwood and has recently reaffirmed its allegiance to our cause.\n\nThe time is at hand to determine the part Dol Guldur shall play in our grand designs for Middle-earth. Given their location, it seems prudent to order them to engage the elves and prevent them sending reinforcements south. But other strategies are also on the table...\n\nWhich task shall they undertake to bring about the dominion of our Dark Lord?"

 dolguldur.138.a:0 "We have a better use for them than tying down the elves."

 dolguldur.138.b:0 "Direct them west to seize control of the Anduin Vales."

 dolguldur.138.c:0 "Stick to the original plan. Set them upon the Elven realms, thwarting aid to Gondor and Rohan."

 dolguldur.138.e:0 "We have a better use for them than tying down the elves."

 dolguldur.138.f:0 "Instruct them to fortify, ready to unleash chaos and attract enemy forces at the pivotal moment."

 dolguldur.139.t:0 "Orders from Mordor: Threaten the Eastern Front"

 dolguldur.139.desc:0 "Bound by our fealty to the Dark Lord in Barad-dûr, we are obliged to fulfill the will of the Lord of Mordor.\nOrders have been dispatched from our overlords in Mordor, decreeing thus:\n\nIn pursuit of Sauron's northern stratagem, we are to carve a path eastward, vanquish the Kingdom of Rhovanion, and thereafter threaten the Dwarves and Dale-folk from the south."

 dolguldur.139.a:0 "By the Dark Lord's command."

 dolguldur.140.t:0 "Orders from Mordor: Command the Anduin Vales"

 dolguldur.140.desc:0 "Bound by our fealty to the Dark Lord in Barad-dûr, we are obliged to fulfill the will of the Lord of Mordor.\nOrders have been dispatched from our overlords in Mordor, decreeing thus:\n\nIn alignment with Sauron's vast strategy, we are to advance to the west and seize the vales that cradle the Anduin river, impairing shipping routes, halting reinforcements, and linking with Goblin Town to forge a passage westward."

 dolguldur.140.a:0 "To serve is our purpose."

 dolguldur.141.t:0 "Orders from Mordor: Engage the Elven Realms"

 dolguldur.141.desc:0 "Bound by our fealty to the Dark Lord in Barad-dûr, we are obliged to fulfill the will of the Lord of Mordor.\nOrders have been dispatched from our overlords in Mordor, decreeing thus:\n\nTo further Sauron's overarching strategy, we are to strike the ancient elven realms, preventing their forces from lending aid to Erebor, Gondor, or Rohan."

 dolguldur.141.a:0 "It will be done."

 dolguldur.142.t:0 "Orders from Mordor: Assault Rohan"

 dolguldur.142.desc:0 "Bound by our fealty to the Dark Lord in Barad-dûr, we are obliged to fulfill the will of the Lord of Mordor.\nOrders have been dispatched from our overlords in Mordor, decreeing thus:\n\nIn furtherance of Sauron's comprehensive strategy, we are to descend upon the northern regions of Rohan, subduing the horse-lords to hinder their aid to Gondor."

 dolguldur.142.a:0 "By the Dark Lord's decree."

 dolguldur.143.t:0 "Orders from Mordor: Become the Decoy"

 dolguldur.143.desc:0 "Bound by our fealty to the Dark Lord in Barad-dûr, we are obliged to fulfill the will of the Lord of Mordor.\nOrders have been dispatched from our overlords in Mordor, decreeing thus:\n\nUnder Sauron's overarching strategy, we are to hold firm and prepare. At Mordor's signal of assault upon Gondor, we shall unleash mayhem and draw as many enemy forces to ourselves as possible."

 dolguldur.143.a:0 "By the Dark Lord's will."

 dolguldur.7.t:0 "Our Role in the Coming War"

 dolguldur.7.d:0 "Our master, the Dark Lord Sauron, is amassing a formidable army in Mordor, expecting unwavering loyalty and service from us in his quest for domination.\n\nWhile many among us are keen to align with his terrifying might, some voices whisper dissent, questioning allegiance to a distant lord. How shall we proceed?"

 dolguldur.7.a:0 "Pledge our loyalty to Sauron and follow his command."

 dolguldur.7.b:0 "We shall heed no lord but one of our own making!"

 dolguldur.144.t:0 "Dol Guldur Pledges Allegiance"

 dolguldur.144.desc:0 "Dol Guldur, the sinister stronghold within Mirkwood and former refuge of Sauron, has declared its allegiance to our cause. It falls upon us to determine their role in our grand designs for conquest."

 dolguldur.144.a:0 "A prudent choice."

 dolguldur.145.t:0 "Dol Guldur Defies Us"

 dolguldur.145.desc:0 "The defiant spirits within Dol Guldur have rejected our demands, choosing the foolish path of standing alone and inciting our wrath."

 dolguldur.145.a:0 "Fools. What a needless loss..."

 dolguldur.146.t:0 "Mordor Demands Our Allegiance"

 dolguldur.146.desc:0 "The Dark Lord of Mordor, Sauron, although distant, casts a long shadow. From the black tower of Barad-dûr, messengers have arrived bearing an ultimatum: we must swear a clandestine oath of allegiance to serve his dark designs in the coming strife. To decline this demand may provoke his wrath upon us."

 dolguldur.146.a:0 "Long live the Dark Lord!"

 dolguldur.146.b:0 "We shall refuse the ultimatum."

 dolguldur.147.t:0 "A Proposal for Cooperation with Dol Guldur"

 dolguldur.147.desc:0 "Dol Guldur, the sinister stronghold within Mirkwood, seeks to extend its shadow across the east and bring about the downfall of the frail kingdom of Rhovanion. They approach us with a request for a potential alliance in this dark endeavor."

 dolguldur.147.a:0 "Indeed, we shall stand with them when they commence their assault!"

 dolguldur.147.b:0 "Offer them some of our resources and knowledge to support their campaign."

 dolguldur.147.c:0 "We have our affairs to tend to."

 dolguldur.148.t:0 "Rhun Commits to the Onslaught"

 dolguldur.148.desc:0 "Rhun's leaders have affirmed their commitment to our cause against the Kingdom of Rhovanion. When the time for war arrives, they shall fight alongside us."

 dolguldur.148.a:0 "Rhovanion's days are numbered!"

 dolguldur.149.t:0 "Rhun Provides Support"

 dolguldur.149.desc:0 "Rhun has bestowed upon us valuable provisions, insights, and other assets, fortifying our might and extending our reach in preparation for the looming conflict."

 dolguldur.149.a:0 "Well met."

 dolguldur.150.t:0 "Rhun Declines Our Entreaty"

 dolguldur.150.desc:0 "Rhun, swayed by their own preoccupations, has turned away from our offer of alliance."

 dolguldur.150.a:0 "Cowards!"

 dolguldur.1.t:0 "Nimrodel River Poisoned!"

 dolguldur.1.d:0 "The waters of the silver river of Nimrodel, usually imbued with healing properties have been tampered with, and now flow with a black taint. It is beyond doubt that this taint originates from the dark fortress of Dol Guldur. The orcs have poisoned our river!"

 dolguldur.1.a:0 "The Nimrodel will recover on it's own."

 dolguldur.1.b:0 "Take measure to improve the situation!"

 dolguldur.2.t:0 "Dol Guldur Border Skirmish"

 dolguldur.2.d:0 "The orcs of Dol Guldur have launched an assault and skirmish along our southern border, testing our defenses. Our forces have fended off the attack, though not without casualties."

 dolguldur.2.a:0 "They may be getting ready for a larger assault."

 dolguldur.3.t:0 "Division and Strife on the Rise"

 dolguldur.3.d:0 "Amidst these troubling times, it is not only external enemies we must look to. According to reports, distrust and division are festering among the various tribes inhabiting the shores of the Anduin. Some say that this division has been perpetuated by supposed promises made by Dol Guldur."

 dolguldur.3.a:0 "It seems some would join the shadow to escape its wrath."

 dolguldur.4.t:0 "Dol Guldur Rejects our Leadership"

 dolguldur.4.d:0 "Despite once having been the hiding place for Sauron himself, the orcs of Dol Guldur have remained too distant and detached from the Great Eye for too long. Now, it appears they are in a treacherous, and mutinous mood. They cast off our chains and will take their chances on their own."

 dolguldur.4.a:0 "They would reject this gift? Fools."

 dolguldur.5.t:0 "Sauron's Reward"

 dolguldur.5.d:0 "We have successfully completed all the tasks the Dark Lord assigned us. Pleased with our performance, the Dark Tower sends its congratulations. Having deemed us worthy, Lord Sauron has deemed it wise to continue to grant us significant independence in decision making, as well as bequeath a substantial reward that ought to aid our war effort."

 dolguldur.5.a:0 "We live to serve."

 dolguldur.6.t:0 "Evil Stirs in Dol Guldur"

 dolguldur.6.d:0 "A dark cloud gathers over the the ancient fortress, and an evil festers within. A century ago, under the White Council, we once purged the dark presence and drove the evil out. But it seems to not have been enough. The orcs have returned, and it's said they are building a massive army, right at our doorstep... Such a growing menace is troubling to our people."

 dolguldur.6.a:0 "This is of grave concern..."

 dolguldur.8.t:0 "Dol Guldur Demands Submission"

 dolguldur.8.d:0 "The orcs of Dol Guldur, proclaiming themselves the true masters of the Greenwood, extend to us an offer of submission.\n\nUnder their shared banner, we may destroy the elves for good. Alternatively... orc-kind is not known for it's mercy."

 dolguldur.8.a:0 "We shall unite with the orcs."

 dolguldur.8.b:0 "Dol Guldur is food."

 dolguldur.9.t:0 "Dol Guldur Has Failed"

 dolguldur.9.d:0 "The forces of Dol Guldur, which have acted largely independently, have failed. We assigned them with a set of tasks to complete, and they have not managed it. Such weakness compromises Sauron's plans of conquest for Middle Earth, and cannot be tolerated among our ranks. It is time we assume direct control over the foretress' forces."

 dolguldur.9.a:0 "We will take matters into our own hands."
 dolguldur.9.b:0 "We will let them be, but they will be watched closely."

 dolguldur.10.t:0 "Mordor Assumes Direct Control"
 dolguldur.10.d:0 "Sauron is a most demanding master, and we have failed to meet his expectations. Our failure to complete the tasks assigned to us has not gone unnoticed, and the Dark Lord has decided that we are not fit to manage the forces of Dol Guldur. He has decreed that he will take direct control over the fortress and its armies."
 dolguldur.10.a:0 "We have no choice but to obey."

 dolguldur.137.t:0 "Southern Reinforcements Cut Off!"

 dolguldur.137.d:0 "The perfidiuous orcs of Dol Guldur have struck again! This time targetting our vulnerable, vital roads to the south. It appears they are getting ready for war, and sabotaging our efforts to reinforce the region."

 dolguldur.137.a:0 "Blasted orc-scum!"

 dolguldur.152.t:0 "The Role of Dol Guldur"

 dolguldur.152.desc:0 "The dark fortress of Dol Guldur stands firm within the shadowy depths of Mirkwood and has recently reaffirmed its allegiance to our cause.\n\nWhich task shall they undertake to bring about the dominion of our Dark Lord?"

 dolguldur.152.a:0 "Let them march eastward and assault Rhovanion to engage the Dwarves."

 dolguldur.152.b:0 "Direct them west to seize control of the Anduin Vales."

 dolguldur.152.c:0 "Command them southward to strike Rohan alongside Isengard."

 dolguldur.152.e:0 "Instruct them to fortify, ready to unleash chaos and attract enemy forces at the pivotal moment."


 dolguldur.11.t:0 "Mordor Appoints Ringwraiths to Oversee Dol Guldur"
 dolguldur.11.d:0 "The Dark Lord of Mordor, Sauron, has taken a keen interest in the affairs of Dol Guldur. To keep a tighter leash on our dealings, he has sent forth one of his most trusted servants, the Ringwraith Adunaphel, to oversee the operations of the fortress and ensure our loyalty and effectiveness in his grand designs for conquest."
 dolguldur.11.a:0 "We live to serve."

 dolguldur.12.t:0 "Mordor Sends Aid"
 dolguldur.12.d:0 "Sauron has deemed it a worthy effort to increase our presence in the southern regions of Mirkwood, and has sent forth reinforcements to bolster our forces."
 dolguldur.12.a:0 "The Dark Lord's generosity is appreciated."
