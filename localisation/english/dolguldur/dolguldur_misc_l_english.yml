l_english:
 DGU_shrouded_fortress:0 "Shrouded Fortress"
 DGU_shrouded_fortress_desc:0 "The fortress of Dol Guldur is hidden in the mists of the forest, and its location is not widely known. Dark clouds hang above it, and the mist that surrounds it is thick and impenetrable. The fortress is a place of great evil, and few dare to venture near it."
 DGU_infighting:0 "Infighting"
 DGU_infighting_desc:0 "Without direct supervision, the orcs inhabiting Dol Guldur are frequently at each other's throats. The great Eye's wrath is distant, and a good brawl is a lot more fun than actually doing any work."
 DGU_incoherent_military_command:0 "Incoherent Military Command"
 DGU_incoherent_military_command_desc:0 "The orcs of Dol Guldur are not known for their organizational skills. They are a disorganized and chaotic bunch, and their military command is no exception. Orders are often contradictory, and the hierarchy of command is often reduced to whoever has the thickes club."
 DGU_grand_plan:0 "The Grand Plan"
 DGU_grand_plan_desc:0 "Sauron's grand design for the conquest of Middle-earth is a complex and multifaceted one, and Dol Guldur is a vital part of it."
 DGU_grand_plan_extinguish_elven_light:0 "The Grand Plan: Extinguish Elven Light"
 DGU_grand_plan_extinguish_elven_light_desc:0 "Sauron's grand design for the conquest of Middle-earth is a complex and multifaceted one, and Dol Guldur is a vital part of it. As the forces of Mordor launch their attack on Gondor, Dol Guldur will pin down the elves and prevent them from sending reinforcements south."
 DGU_grand_plan_threaten_the_east:0 "The Grand Plan: Threaten the East"
 DGU_grand_plan_threaten_the_east_desc:0 "Sauron's grand design for the conquest of Middle-earth is a complex and multifaceted one, and Dol Guldur is a vital part of it. As the forces of Rhûn strike wesward towards Erebor and Mirkwood, Dol Guldur will complete the pincer movement from the south."
 DGU_grand_plan_terror_of_the_anduin:0 "The Grand Plan: Terror of the Anduin"
 DGU_grand_plan_terror_of_the_anduin_desc:0 "Sauron's grand design for the conquest of Middle-earth is a complex and multifaceted one, and Dol Guldur is a vital part of it. While the Free Peoples east of the Misty Mountains are preoccupied with the threat of Rhûn and Mordor, Dol Guldur will secure the Misty Mountains, cutting the elves of Mirkwood and dwarves of Erebor off from any western aid.."
 DGU_grand_plan_attack_rohan:0 "The Grand Plan: Attack Rohan"
 DGU_grand_plan_attack_rohan_desc:0 "Sauron's grand design for the conquest of Middle-earth is a complex and multifaceted one, and Dol Guldur is a vital part of it. As Isengard launches their attack on Rohan from the west, Dol Guldur will launch an attack on it's north, and seize the fields of the Wold."
 DGU_grand_plan_well_timed_distraction:0 "The Grand Plan: Well-Timed Distraction"
 DGU_grand_plan_well_timed_distraction_desc:0 "Sauron's grand design for the conquest of Middle-earth is a complex and multifaceted one, and Dol Guldur is a vital part of it. Just as Mordor launches its attack on the west, Dol Guldur will cause as much chaos as possible in the east, drawing as many troops onto themselves as possible, thus ensuring a swift fall of Minas Tirith and Edoras."
 DGU_grand_plan_well_timed_distraction_2:0 "The Grand Plan: Well-Timed Distraction"
 DGU_grand_plan_well_timed_distraction_2_desc:0 "Sauron's grand design for the conquest of Middle-earth is a complex and multifaceted one, and Dol Guldur is a vital part of it. Just as Mordor launches its attack on the west, Dol Guldur will cause as much chaos as possible in the east, drawing as many troops onto themselves as possible, thus ensuring a swift fall of Minas Tirith and Edoras."
 DGU_black_fletching_2:0 "Black Fletching"
 DGU_black_fletching_2_desc:0 "The black arrows of Dol Guldur inflict wounds that are slow to heal, and cause great pain. They are a favored weapon of the orcs, and are often used to harass and demoralize the enemy."
 DGU_necroforge_construction_efforts:0 "Necromantic Forge Construction Efforts"
 DGU_necroforge_construction_efforts_desc:0 "The necromantic forge is a design of great evil, conceived by the necromancer himself. The orcs are doubling their efforts to construct as many of them as possible."
 DGU_division_and_strife:0 "Division and Strife"
 DGU_division_and_strife_desc:0 "The men of the Vales of Anduin are a divided and quarrelsome lot, and the orcs of Dol Guldur are taking advantage of this. They are stirring up trouble and fomenting rebellion among the men, hoping to weaken them and make them easier to conquer."
 DGU_masters_of_mirkwood:0 "Masters of Mirkwood"
 DGU_masters_of_mirkwood_desc:0 "The orcs of Dol Guldur have done the impossible and conquered the entirety of Mirkwood. They have driven the elves out of their homes, and now rule over the forest with an iron fist."
 DGU_iron_crown_of_mirkwood:0 "Iron Crown of Mirkwood"
 DGU_iron_crown_of_mirkwood_desc:0 "Having cast off Sauron's leash, the orcs of Dol Guldur have found new purpose in resisting the forces of Mordor. They have taken to calling themselves the Iron Crown of Mirkwood, and have become a formidable force in their own right."
 DGU_stragglers_of_mordor:0 "Stragglers of Mordor"
 DGU_stragglers_of_mordor_desc:0 "As Sauron herds masses of orcs into the spears of men, many orcs flee or are left behind. These stragglers are a nuisance, and the orcs of Dol Guldur are taking advantage of them. They are recruiting them into their ranks, and using them to bolster their forces."
 DGU_coordinated_attack_attack:0 "Coordinated Attack"
 DGU_coordinated_attack_attack_desc:0 "Dol Guldur and Isengard have coordinated an attack on Rohan. Their efforts have ensured the Rohirrim are caught off-guard."
 DGU_coordinated_attack_speed:0 "Coordinated Attack"
 DGU_coordinated_attack_speed_desc:0 "Dol Guldur and Isengard have coordinated an attack on Rohan. Their efforts have ensured the Rohirrim are caught off-guard."
 DGU_coordinated_attack_supplies:0 "Coordinated Attack"
 DGU_coordinated_attack_supplies_desc:0 "Dol Guldur and Isengard have coordinated an attack on Rohan. Their efforts have ensured the Rohirrim are caught off-guard."
 DGU_southern_logistics_sabotaged:0 "Southern Logistics Sabotaged"
 DGU_southern_logistics_sabotaged_desc:0 "Dol Guldur has sabotaged the logistics of the Mirkwood elves through the deep woods. The elves are now struggling to get supplies to their frontlines, and are suffering as a result."
 DGU_poisoned_water_supply:0 "Poisoned River"
 DGU_poisoned_water_supply_desc:0 "The orcs of Dol Guldur have poisoned the waters that run by the Golden Wood. The elves are distraught at this affront against nature and are struggling to find a way to purify the water."
 DGU_less_consumer_goods:0 "Economic Consolidation"
 DGU_less_consumer_goods_desc:0 "The orcs of Dol Guldur have reorganized their production and construction efforts, ensuring that no scrap or endeavour is wasted on useless luxury or leisure."
 DGU_preparing_for_all_out_offensive:0 "Preparing for All-Out Offensive"
 DGU_preparing_for_all_out_offensive_desc:0 "The orcs of Dol Guldur are preparing for an all-out offensive against the Free Peoples. They are gathering their forces, and making sure they have enough supplies and equipment to sustain a long campaign in all directions."