l_english:
 DGU_rearmament_effort:0 "Rearmament Effort"
 DGU_rearmament_effort_desc:0 "To the forges, sluggards of the dark fortress! The necromancer demands it."
 DGU_the_shadow_over_the_mirkwood:0 "The Shadow Over Mirkwood"
 DGU_the_shadow_over_the_mirkwood_desc:0 "Do you feel the darkness creeping in, my lord? The shadow of the necromancer grows ever larger, and soon it will be time to strike."
 DGU_instill_strict_discipline:0 "Instill Strict Discipline"
 DGU_instill_strict_discipline_desc:0 "A soldier's job is to implement the orders of their superior. What gives you the impression an orc should be able to think for themselves?"
 DGU_encourage_individual_initiative:0 "Encourage Individual Initiative"
 DGU_encourage_individual_initiative_desc:0 "A good commander should be able to delegate authority to their subordinates. If you want to win, you need to let your orcs think for themselves."
 DGU_revised_army_drills:0 "Revised Army Drills"
 DGU_revised_army_drills_desc:0 "Our soldiers must be drilled, and drilled hard. For those who can't handle the rigors of training, will be left behind in the depots."
 DGU_meritocratic_army_command:0 "Meritocratic Army Command"
 DGU_meritocratic_army_command_desc:0 "Who should lead a pack of orcs into battle? The one who can command them, of course. We need to promote our best commanders to the top, and let them lead us to victory."
 DGU_the_grand_strategy:0 "The Grand Strategy"
 DGU_the_grand_strategy_desc:0 "Middle Earth lies vulnerable and disunited. We must decide on how we will conquer it."
 DGU_enxtinguish_elven_light:0 "Extinguish Elven Light"
 DGU_enxtinguish_elven_light_desc:0 "The flame of old blood quivers. We shall snuff it out for good."
 DGU_burn_the_ancient_woods:0 "Burn the Ancient Woods"
 DGU_burn_the_ancient_woods_desc:0 "Our forges require fuel to burn, and our arms require wood to be made. The ancient woods of Mirkwood are the perfect source for both."
 DGU_poison_the_river_running:0 "Poison the River Running"
 DGU_poison_the_river_running_desc:0 "Let the healing waters of Lothlórien be tainted with the foulness of Mordor. The elves will be weakened, and we will be stronger for it."
 DGU_weaken_the_woodland_guard:0 "Weaken the Woodland Guard"
 DGU_weaken_the_woodland_guard_desc:0 "Thranduil's kin are overstretched, and their forces are spread thin. We can strike at them, and they won't be able to respond."
 DGU_a_match_for_elven_might:0 "A Match for Elven Might"
 DGU_a_match_for_elven_might_desc:0 "The elves are strong, but they are not invincible. We can find ways to counter their strengths, and exploit their weaknesses."
 DGU_the_siege_of_the_elven_halls:0 "The Siege of the Elven Halls"
 DGU_the_siege_of_the_elven_halls_desc:0 "It shall be a historic day for the forces of the dark fortress. What would King Oropher think when his precious little child Thranduil is besieged by the armies of the necromancer?"
 DGU_terror_of_the_anduin:0 "Terror of the Anduin"
 DGU_terror_of_the_anduin_desc:0 "The great river Anduin is a vital barrier to the west and it's vicinity is weakly ruled and defended. We shall terrorize the region, and cut off any would-be reinforcements to the elves in Mirkwood."
 DGU_stalk_the_vales:0 "Stalk the Vales"
 DGU_stalk_the_vales_desc:0 "Let us observe the Beronings and clans that dwell along the riverbanks. We can learn much about their movements and habits, and strike when the time is right."
 DGU_cross_the_old_ford:0 "Cross the Old Ford"
 DGU_cross_the_old_ford_desc:0 "Reaching the riverbanks is one thing, but crossing the river is another. We need to find a way to cross the Old Ford and make our way west."
 DGU_divide_the_woodmen_clans:0 "Divide the Woodmen Clans"
 DGU_divide_the_woodmen_clans_desc:0 "Woodmen, Beornings and the people of the Gladden Fields... We may feed into their own ambitions and rivalries, and turn them against each other. If we can divide them, they will be easier to conquer."
 DGU_attack_rohan:0 "Attack Rohan"
 DGU_attack_rohan_desc:0 "Rohan stands as the only viable ally to the realm of Gondor. If the horsemen are busy fighting the orcs of Dol Guldur *and* Isengard, Gondor will surely fall to the forces of Mordor."
 DGU_the_armies_of_the_necromancer:0 "The Armies of the Necromancer"
 DGU_the_armies_of_the_necromancer_desc:0 "Was it ever in question whom we serve? The heir of Melkor, of course. Long live the Dark Lord, and may his shadow be cast over all of Middle Earth!"
 DGU_siege_trolls:0 "Siege Trolls"
 DGU_siege_trolls_desc:0 "Bring forth the siege trolls, and let them crush the walls of our enemies! They are strong, they are terrifying, and they are loyal to the necromancer. What more could we ask for in a siege engine?"
 DGU_dark_sorcery:0 "Dark Sorcery"
 DGU_dark_sorcery_desc:0 "Lord Sauron once dwelt in the fortress of Dol Guldur, and it is said that he left behind many secrets of dark sorcery. We must uncover these secrets, and use them to our advantage in battle."
 DGU_the_forges_of_night:0 "The Forges of Night"
 DGU_the_forges_of_night_desc:0 "The steel shall sing, and the fires shall burn. The forges of night will produce weapons of unparalleled quality, and our enemies will tremble before them."
 DGU_war_forges:0 "War Forges"
 DGU_war_forges_desc:0 "The forges of Dol Guldur are not just for show. They are the heart of our war machine, and we must ensure they are running at full capacity to produce the weapons we need to conquer Middle Earth."
 DGU_the_eyes_eyes:0 "The Eye's Eyes"
 DGU_the_eyes_eyes_desc:0 "The great Eye of Sauron sees all, but it cannot be everywhere at once. We need to establish a network of spies and informants to keep the Eye informed of our enemies' movements and plans."
 DGU_sorcerous_spires:0 "Sorcerous Spires"
 DGU_sorcerous_spires_desc:0 "We must progress construction of the Necromancer's forge. It will be a towering spire of dark sorcery, and it will strike fear into the hearts of our enemies. The forge will be a symbol of our power, and a tool for our conquest."
 DGU_necromantic_forge:0 "Necromantic Forge"
 DGU_necromantic_forge_desc:0 "This dark construct, conceived by the necromancer himself, will be a marvel of dark engineering. After this, who will dare to challenge the might of Dol Guldur?"
 DGU_excavate_the_hill_of_sorcery:0 "Excavate the Hill of Sorcery"
 DGU_excavate_the_hill_of_sorcery_desc:0 "The Hill of Sorcery is a place of great power, and it is said that there are many secrets buried beneath it. We must excavate the hill, and uncover its secrets to further our understanding of dark sorcery."
 DGU_clear_the_ruins:0 "Clear the Ruins"
 DGU_clear_the_ruins_desc:0 "The ruins that stand upon the Amon Lanc are a blight upon the landscape, and they serve no purpose. We must clear them away, and make way for new construction that will serve the needs of the necromancer."
 DGU_lay_the_foundations:0 "Lay the Foundations"
 DGU_lay_the_foundations_desc:0 "We shall begin construction of the necromancer's forge by laying the foundations. It will be a long and arduous process, but it will be worth it."
 DGU_expand_the_thrall_pits:0 "Expand the Thrall Pits"
 DGU_expand_the_thrall_pits_desc:0 "The thrall pits are where our old masters keep our slaves and prisoners. We are slaves no more, and the pits shall serve a new purpose."
 DGU_the_creeping_gloom:0 "The Creeping Gloom"
 DGU_the_creeping_gloom_desc:0 "Slow and steady wins the race. Let the elves exhaust themselves trying to stop us, and we will be the ones left standing in the end."
 DGU_the_masters_of_the_mirkwood:0 "The Masters of Mirkwood"
 DGU_the_masters_of_the_mirkwood_desc:0 "Soldiers! The Greenwood is our dominion, and we are its masters!"
 DGU_a_reward_from_mordor:0 "A Reward from Mordor"
 DGU_a_reward_from_mordor_desc:0 "We have served the necromancer well, and it is time for him to reward us. We shall receive a boon from Mordor, and it will be a powerful one."
 DGU_shadow_without_master:0 "Shadow Without Master"
 DGU_shadow_without_master_desc:0 "Sauron is far away, and we are left to our own devices. Without the One Ring, what authority does the Lord of Mordor have over the orcs of Dol Guldur?"
 DGU_treat_with_the_spawn_of_ungoliant:0 "Treat with the Spawn of Ungoliant"
 DGU_treat_with_the_spawn_of_ungoliant_desc:0 "The Great Spiders of Mirkwood are powerful creatures, and they have a vested interest in the success of the necromancer. We should treat with them, and see if we can forge an alliance that will benefit us both."
 DGU_salvage_the_ruins:0 "Salvage the Ruins"
 DGU_salvage_the_ruins_desc:0 "Much remains under the rubble of the old fortress. We can salvage it, and use it to further our construction efforts. The ruins are a valuable resource, and we should make use of them."
 DGU_restore_the_dungeons:0 "Restore the Dungeons"
 DGU_restore_the_dungeons_desc:0 "Any orc who does not know his place needs a place to rethink his life choices. The dungeons of Dol Guldur will be restored to their former glory, and they will serve as a reminder to all who enter them of the consequences of disobedience."
 DGU_whispers_in_the_boughs:0 "Whispers in the Boughs"
 DGU_whispers_in_the_boughs_desc:0 "As our power grows, rummors of it will reach the pointy ears of the elves. Let the thought of it haunt them in their sleep."
 DGU_centralize_military_planning:0 "Centralize Military Planning"
 DGU_centralize_military_planning_desc:0 "A coherent strategy is essential for victory. We must centralize our military planning, and ensure that all of our commanders are working towards the same goals."
 DGU_master_of_the_fortress:0 "Master of the Fortress"
 DGU_master_of_the_fortress_desc:0 "Whom shall the orcs of Dol Guldur serve? The choice is simple: Sauron, the Lord of Mordor, the heir of Melkor... Or nobody at all."
 DGU_purge_the_eyes_faithful:0 "Purge the Eye's Faithful"
 DGU_purge_the_eyes_faithful_desc:0 "Sauron loyalists lurk in our midst, and their rot will spread if we don't root it out."
 DGU_dark_constructs:0 "Dark Constructs"
 DGU_dark_constructs_desc:0 "There is no place more apt for the necromancer's devices than the fortress of Dol Guldur. The dark magic is strong here, it's malice is palpable."
 DGU_fortify_the_naked_hill:0 "Fortify the Naked Hill"
 DGU_fortify_the_naked_hill_desc:0 "The elves will not hesitate to strike should we show weakness. We must fortify the Naked Hill, and make it a stronghold that can withstand any assault."
 DGU_territorial_incursions:0 "Territorial Incursions"
 DGU_territorial_incursions_desc:0 "We must expand our territory, and push the elves back. We can strike at their outposts, and take control of the surrounding lands. The more territory we control, the stronger we will be."
 DGU_spur_the_spawn_of_ungoliant:0 "Spur the Spawn of Ungoliant"
 DGU_spur_the_spawn_of_ungoliant_desc:0 "The Great Spiders are notoriously uncontrolled and driven by hunger. With the right incentives, we can spur them to attack the elves and further our goals."
 DGU_a_guise_of_sorcery:0 "A Guise of Sorcery"
 DGU_a_guise_of_sorcery_desc:0 "A secret laboratory has the potential of bringing our magic to bear on much further than our immediate vicinity."
 DGU_the_veil_against_the_golden_wood:0 "The Veil Against the Golden Wood"
 DGU_the_veil_against_the_golden_wood_desc:0 "The Golden Wood of Lothlórien holds great power and defenses by means of Nenya. We must find a way to erect similar defenses for ourselves."
 DGU_subjugate_the_spiders:0 "Subjugate the Spiders"
 DGU_subjugate_the_spiders_desc:0 "The Ungoliant-spawn must be reminded of their place in the world. They are powerful, but they are not our equals. We must subjugate them, and make them serve us."
 DGU_restore_the_fortress:0 "Restore the Fortress"
 DGU_restore_the_fortress_desc:0 "Let the dark fortress stand taller and stronger than ever before. We will restore it to its former glory, and make it a symbol of our power and dominance over Middle Earth."
 DGU_construction_efforts:0 "Construction Efforts"
 DGU_construction_efforts_desc:0 "The necromantic forge is a marvel of dark engineering. We must focus our efforts on building more of these."
 DGU_improve_the_design:0 "Improve the Design"
 DGU_improve_the_design_desc:0 "Even the necromancer's designs can be improved upon. We must find ways to make our constructs more efficient, more powerful, and more terrifying."
 DGU_black_smoke_rises:0 "Black Smoke Rises"
 DGU_black_smoke_rises_desc:0 "The fires of our forges will burn brighter than ever before, and the black smoke will rise to the sky as a symbol of our power and dominance over Middle Earth."
