#Country events
bonus_event.1.t: "Rhudaur asks for a non-aggression pact"
bonus_event.1.d: "A delegation has arrived from our neighbor Rhudaur, they ask that we should withold from declaring war on them"
bonus_event.1.a: "We would be glad to accept"
bonus_event.1.b: "Rhudaur should tread carefully"
bonus_event.2.t: "Rhudaur requests independence guarantee"
bonus_event.2.d: "Rhudaur is requesting that we join them in the event that they are attacked"
bonus_event.2.a: "They have our full support"
bonus_event.2.b: "Why should we be dragged into their conflicts?"
bonus_event.3.t: "[From.GetName] wants to join our faction"
bonus_event.3.d: "They have requested an alliance, probably aware of the consequences they may face otherwise..."
bonus_event.3.a: "They may be permitted to join"
bonus_event.3.b: "We have no use for them right now"
bonus_event.4.t: "Rhudaur demands control of Weathertop"
bonus_event.4.d: "Rhudaur has recently become more hostile to it's Arnorian compatriates, now they are demanding that we give them the weather hills."
bonus_event.4.a: "They can have it"
bonus_event.4.b: "Not while we still draw breath"
bonus_event.5.t: "Rhudaur demands our submission"
bonus_event.5.d: "Rhudaur, our former compatriate has, for the second time, allied themselves with darkness. Now they demand that our leaders should swear fealty to theirs and that we should serve their will."
bonus_event.5.a: "Very well, we shall serve their will"
bonus_event.5.b: "We will do no such thing"
bonus_event.6.t: ""
bonus_event.6.d: ""
bonus_event.6.a: ""
bonus_event.6.b: ""
bonus_event.7.t: "Rivendell asks for assistance"
bonus_event.7.d: "Lord Elrond wants to form a deadly team of capable warriors for a dangerous quest to destroy Saurons One Ring once and for all. How shall we take part in this council?"
bonus_event.7.a: "Galdor will advise them"
bonus_event.7.a.tt: "Galdor will go to Rivendell but not go with the fellowship"
bonus_event.7.b: "Glorfindel will go with them"
bonus_event.7.b.tt: "Will retire Glorfindel and send him with the fellowship"
bonus_event.7.c: "We will not send anyone."
bonus_event.8.t: "Círdan has departed for Valinor"
bonus_event.8.d: "Círdan the shipright, the oldest elf remaining in middle earth has left by ship from the Grey Havens earlier this week following an increasing amount of unrest claiming his incompetence. His position as leader of the elves of Lindon will be given to an interrim while a long term ruler is found."
bonus_event.8.a: "What will become of Lindon?"
bonus_event.9.t: "The Peasant state of Lindon demands our submission"
bonus_event.9.d: "Lindon, after turning to collectivist politics has recently announced that they intend to force their ideology onto the rest of Middle Earth."
bonus_event.9.a: "We will join their cause"
bonus_event.9.b: "If they want war, they may try their best"
bonus_event.10.t: "Aid has arrived from Valinor!"
bonus_event.10.d: "Against all expectation our requests of help from the Valar have been heard. Though no Valar have personally arrived to stop the threat at hand, a host of elves from the blessed land have arrived via ship in the Gulf of Lhun. with this aid Lindon will have much better odds against the tides of darkness."
bonus_event.10.a: "A most welcome arrival"
bonus_event.10.tt: "Twenty Valinor divisions will spawn around the Gulf of Lhun"
bonus_event.11.t: "A force of outsiders has been spotted"
bonus_event.11.d: "A hunting party on the south side of the mountain has reported seeing a small force of armed individuals roaming the countryside and suspect that they are spies.  Neither group was eager to engage and the outsiders departed before more could be discovered about them, but this could still be a cause for concern."
bonus_event.11.a: "Peculiar."
bonus_event.12.t: "A proposal to remove the Orcs from Gundabad"
bonus_event.12.d: "A messanger has arrived from a group who would seek to take Mount Gundabad from the orcs who control it. They are requesting a sizeable force in order to fully clean Mount Gundabad of the orcs who populate it, an endeavor that would open the mountain for our people to settle."
bonus_event.12.a: "We will send a contingent at once."
bonus_event.12.b: "What use is that mountain to us?"
bonus_event.13.t: "[From.GetName] has sent forces to drive out the orcs"
bonus_event.13.d: "The small band who had been attacking are suddenly much more serious and large threats with the addition of an army sent by [From.GetName]."
bonus_event.13.a: "This may be the end of the orcs."
bonus_event.14.t: "[From.GetName] is not sending aid to the raiders"
bonus_event.14.d: "Though help was requested, [From.GetName] has refused to give up their own forces in the endeavor to take Mount Gundabad from the orcs."
bonus_event.14.a: "Perhaps others will send aid."
bonus_event.15.t: "The orcs have been defeated"
bonus_event.15.d: "The last of the orcs have been driven from the main mountain, a few still remain in the area but we are now safe to call Gundabad our own."
bonus_event.15.a: "Excellent News!"
bonus_event.16.t: "Rhudaur wants our opinion on their politics"
bonus_event.16.d: "Rhudaur has asked for our input on the direction in which their politics should go."
bonus_event.16.a: "They should seek greater power"
bonus_event.16.b: "They should empower the masses"
bonus_event.16.c: "They should remain true to the free peoples"
bonus_event.16.e: "They should stay out of conflict"
bonus_event.17.t: "Gundabad swears their allegience"
bonus_event.17.d: "The orcs of the north misty mountains have declared their wish to serve the wizard Saruman. Having recognized our power they know that the best option is to serve our will."
bonus_event.17.a: "As they should."
bonus_event.18.t: "The return of the Gundabad Expedition"
bonus_event.18.d: "The Gundabad Expedition who we aided were able to drive the orcs out of the mountain, their leaders have now sent us a proposal, to join them in an alliance."
bonus_event.18.a: "We will accept"
bonus_event.18.b: "I do not wish to hear from them again"
bonus_event.19.t: "Dol Amroth asks for horses"
bonus_event.19.d: "Dol Amroth is known for their Swan Knights, and are now requesting that we should give them some of our horses to use as chargers."
bonus_event.19.a: "We will support their cavalry"
bonus_event.19.b: "The mere request is an insult to Rohan"
bonus_event.20.t: "We have won our border war"
bonus_event.20.d: "We continue our march down the misty mountains having taken over control of the next state in our path."
bonus_event.20.a: "Excellent"
bonus_event.21.t: "A Way to Aid the Wise"
bonus_event.21.d: "Gandalf the wizard, is currently in Lindon and Círdan has seen the opportunity to help him in his endeavors to come. Having inherited Narya, the ring of fire and one of the three given to the elves, from Gil-Galad, the time may have come to give it up to Gandalf. This would be a great aid to Gandalf's cause though it may harm Lindon, as the ring is incredibly helpful in keeping the magic of the elves in Middle Earth."
bonus_event.21.a: "For the good of Middle Earth, Gandalf should take Narya."
bonus_event.21.att: "Will make Gandalf more powerful in the fellowship."
bonus_event.21.b: "We cannot risk what would happen to the elves."
bonus_event.22.t: "We found Narya in Círdan's quarters"
bonus_event.22.d: "Narya, one of the three rings of power has been found while searching Círdan's abandoned home meaning that he left it behind when he departed for Valinor."
bonus_event.22.a: "An Interesting Discovery"
bonus_event.23.t: "Círdan Apears to have taken Narya with him."
bonus_event.23.d: "Though it was not seen on him the day that Círdan left, his ring has not been found since then and it is likely that it is now far from us in the blessed realm."
bonus_event.23.a: "A Final trick from the old man."
bonus_event.24.t: "How to deal with the Wolves"
bonus_event.24.d: "Wolves have been a constant threat to society in Eriador since society first existed in Eriador. The rangers have proved apt at taking care of them in the past, but their numbers still increase as the darkness grows."
bonus_event.24.a: "Allow the rangers to continue their work"
bonus_event.24.b: "Payment for anyone willing to bring a wolf pelt!"
bonus_event.25.t: "How to deal with the Nazgul"
bonus_event.25.d: "Ringwraiths of Mordor have been sighted riding through our countryside. They terrify our people and ask for information on a 'Baggins'."
bonus_event.25.a: "Just try to keep our people safe"
bonus_event.25.b: "Interfere with them as we can"
bonus_event.25.c: "Cooperate with them, Sauron is a powerful ally"
bonus_event.26.t: "How to deal with the Barrow Wights"
bonus_event.26.d: "The barrow wights plague the barrow downs and scare away most of the people who would want to go there, they are said to be the ghosts of the people who died in the war with the witch King. How does one deal with ghosts anyway?"
bonus_event.26.a: "Leave the dead as they are"
bonus_event.26.b: "Take the old weapons from the downs"
bonus_event.26.c: "Can we just sing at them or something?"
bonus_event.27.t: "A Most Unusual Encounter"
bonus_event.27.d: "As we pondered what was to be done about the barrow wights, an odd man approached us while singing, he banished the barrow wights from before him and said that his name is Tom Bombadill. Apparently he lives in the old forest with his wife, and though he can be difficult to understand, it sounds as if he is older than any other being in Middle Earth."
bonus_event.27.a: "Strange but Welcome"
bonus_event.28.t: "Concerning News from the west"
bonus_event.28.d: "Though Sauron has been banished from Mordor by the forces of the orcish rebellion, it seems that he may not be entirely gone. Intelligence from Angmar tells of a strange 'necromancer' who is gaining prominence in their government, and while there is not yet confirmation on his identity, it is best to be aware of any possible threat."
bonus_event.28.a: "Concerning."

 bonus_event.100.t:0 "The Council of Rhudaur"

 bonus_event.100.desc:0 "The clan leaders and influential men of Rhudaur have been summoned to a grand council to deliberate on the path that our people must take.\n\nDark shadows gather on the horizon, and these are indeed troubling times. The realms of men find themselves in chaos, the elves are withdrawing into their forests, and ominous whispers speak of darkness rising in Mordor, Angmar, and beyond.\n\nWhat course shall we set for our future?"

 bonus_event.100.a:0 "Desperate times call for immediate and decisive political action!"

 bonus_event.100.b:0 "If war looms in the distance, then we must ready ourselves for battle!"

 bonus_event.100.c:0 "As long as our people remain united, we can withstand any adversary!"
