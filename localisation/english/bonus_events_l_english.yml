#Country events
bonus_event.1.t:0 "Rhudaur asks for a non-aggression pact"
bonus_event.1.d:0 "A delegation has arrived from our neighbor Rhudaur, they ask that we should withold from declaring war on them"
bonus_event.1.a:0 "We would be glad to accept"
bonus_event.1.b:0 "Rhudaur should tread carefully"
bonus_event.2.t:0 "Rhudaur requests independence guarantee"
bonus_event.2.d:0 "Rhudaur is requesting that we join them in the event that they are attacked"
bonus_event.2.a:0 "They have our full support"
bonus_event.2.b:0 "Why should we be dragged into their conflicts?"
bonus_event.3.t:0 "[From.GetName] wants to join our faction"
bonus_event.3.d:0 "They have requested an alliance, probably aware of the consequences they may face otherwise..."
bonus_event.3.a:0 "They may be permitted to join"
bonus_event.3.b:0 "We have no use for them right now"
bonus_event.4.t:0 "Rhudaur demands control of Weathertop"
bonus_event.4.d:0 "Rhudaur has recently become more hostile to it's Arnorian compatriates, now they are demanding that we give them the weather hills."
bonus_event.4.a:0 "They can have it"
bonus_event.4.b:0 "Not while we still draw breath"
bonus_event.5.t:0 "Rhudaur demands our submission"
bonus_event.5.d:0 "Rhudaur, our former compatriate has, for the second time, allied themselves with darkness. Now they demand that our leaders should swear fealty to theirs and that we should serve their will."
bonus_event.5.a:0 "Very well, we shall serve their will"
bonus_event.5.b:0 "We will do no such thing"
bonus_event.6.t:0 ""
bonus_event.6.d:0 ""
bonus_event.6.a:0 ""
bonus_event.6.b:0 ""
bonus_event.7.t:0 "Rivendell asks for assistance"
bonus_event.7.d:0 "Lord Elrond wants to form a deadly team of capable warriors for a dangerous quest to destroy Saurons One Ring once and for all. How shall we take part in this council?"
bonus_event.7.a:0 "Galdor will advise them"
bonus_event.7.a.tt:0 "Galdor will go to Rivendell but not go with the fellowship"
bonus_event.7.b:0 "Glorfindel will go with them"
bonus_event.7.b.tt:0 "Will retire Glorfindel and send him with the fellowship"
bonus_event.7.c:0 "We will not send anyone."
bonus_event.8.t:0 "Círdan has departed for Valinor"
bonus_event.8.d:0 "Círdan the shipright, the oldest elf remaining in middle earth has left by ship from the Grey Havens earlier this week following an increasing amount of unrest claiming his incompetence. His position as leader of the elves of Lindon will be given to an interrim while a long term ruler is found."
bonus_event.8.a:0 "What will become of Lindon?"
bonus_event.9.t:0 "The Peasant state of Lindon demands our submission"
bonus_event.9.d:0 "Lindon, after turning to collectivist politics has recently announced that they intend to force their ideology onto the rest of Middle Earth."
bonus_event.9.a:0 "We will join their cause"
bonus_event.9.b:0 "If they want war, they may try their best"
bonus_event.10.t:0 "Aid has arrived from Valinor!"
bonus_event.10.d:0 "Against all expectation our requests of help from the Valar have been heard. Though no Valar have personally arrived to stop the threat at hand, a host of elves from the blessed land have arrived via ship in the Gulf of Lhun. with this aid Lindon will have much better odds against the tides of darkness."
bonus_event.10.a:0 "A most welcome arrival"
bonus_event.10.tt:0 "Twenty Valinor divisions will spawn around the Gulf of Lhun"
gundabad.3.t:0 "The Gundabad Expedition"
gundabad.3.d:0 "With infighting weakening the orcs who infest the ancient dwarven fortress of Gundabad, a clandestine movement stirs among the villages and enclaves scattered across the land.\n\nThese people, tormented and wearied under the orcish yoke, dare to dream of freedom. Their plan is bold: a 'Gundabad Expedition', a modest yet determined force, united with a singular aim: to reclaim the mountain and banish the vile orcs forever.\n\nHowever, such an audacious endeavor will require substantial support to transform their vision into victory."
gundabad.3.a:0 "Peculiar."
gundabad.4.t:0 "Request for Aid from the Gundabad Expedition"
gundabad.4.d:0 "The ancient fortress of Gundabad lies under the oppressive grip of orcs. In a bold gesture of hope, a valiant band known as the 'Gundabad Expedition' has arisen, determined to reclaim this place and rid it of its dark occupiers. Their success could carve out a new haven for our people.\n\nThis brave coalition seeks our assistance, requesting a sizable deployment of our warriors to bolster their strength.\n\nAssisting them might forge a powerful alliance with the kingdom they seek to establish."
gundabad.4.a:0 "We will send a contingent at once."
gundabad.4.b:0 "What use is that mountain to us?"
gundabad.5.t:0 "[From.GetName] Commits Forces"
gundabad.5.d:0 "[From.GetName] has nobly pledged their aid to the Gundabad Expedition. Their forces have journeyed far and now stand ready beside us, prepared to strike against the orcs and reclaim the fortress."
gundabad.5.a:0 "This may be the end of the orcs."
gundabad.6.t:0 "[From.GetName] Refuses"
gundabad.6.d:0 "In a turn of events, [From.GetName] has declined the call of the Gundabad Expedition, choosing not to dispatch their forces to contest the orc-held Mount Gundabad."
gundabad.6.a:0 "Perhaps others will send aid."
gundabad.7.t:0 "The Assault on Gundabad"
gundabad.7.d:0 "For many months the brave souls of the Gundabad Expedition have planned, organized and prepared to drive the orcs out of the fortress once and for all.\n\nTonight, the assault took place and orcs were caught completely by surprise. \n\nThe Expedition's forces sustained some losses, and several orc stragglers remain scattered in the surrounding countryside, but their seat of power has fallen back into friendly hands."
gundabad.7.a:0 "Victory!"
rhudaur.5.t:0 "Rhudaur wants our opinion on their politics"
rhudaur.5.d:0 "Rhudaur has asked for our input on the direction in which their politics should go."
rhudaur.5.a:0 "They should seek greater power"
rhudaur.5.b:0 "They should empower the masses"
rhudaur.5.c:0 "They should remain true to the free peoples"
rhudaur.5.e:0 "They should stay out of conflict"
bonus_event.17.t:0 "Gundabad swears their allegience"
bonus_event.17.d:0 "The orcs of the north misty mountains have declared their wish to serve the wizard Saruman. Having recognized our power they know that the best option is to serve our will."
bonus_event.17.a:0 "As they should."
bonus_event.18.t:0 "The return of the Gundabad Expedition"
bonus_event.18.d:0 "The Gundabad Expedition who we aided were able to drive the orcs out of the mountain, their leaders have now sent us a proposal, to join them in an alliance."
bonus_event.18.a:0 "We will accept"
bonus_event.18.b:0 "I do not wish to hear from them again"
bonus_event.19.t:0 "Dol Amroth asks for horses"
bonus_event.19.d:0 "Dol Amroth is known for their Swan Knights, and are now requesting that we should give them some of our horses to use as chargers."
bonus_event.19.a:0 "We will support their cavalry"
bonus_event.19.b:0 "The mere request is an insult to Rohan"
bonus_event.20.t:0 "We have won our border war"
bonus_event.20.d:0 "We continue our march down the misty mountains having taken over control of the next state in our path."
bonus_event.20.a:0 "Excellent"
bonus_event.21.t:0 "A Way to Aid the Wise"
bonus_event.21.d:0 "Gandalf the wizard, is currently in Lindon and Círdan has seen the opportunity to help him in his endeavors to come. Having inherited Narya, the ring of fire and one of the three given to the elves, from Gil-Galad, the time may have come to give it up to Gandalf. This would be a great aid to Gandalf's cause though it may harm Lindon, as the ring is incredibly helpful in keeping the magic of the elves in Middle Earth."
bonus_event.21.a:0 "For the good of Middle Earth, Gandalf should take Narya."
bonus_event.21.att:0 "Will make Gandalf more powerful in the fellowship."
bonus_event.21.b:0 "We cannot risk what would happen to the elves."
bonus_event.22.t:0 "We found Narya in Círdan's quarters"
bonus_event.22.d:0 "Narya, one of the three rings of power has been found while searching Círdan's abandoned home meaning that he left it behind when he departed for Valinor."
bonus_event.22.a:0 "An Interesting Discovery"
bonus_event.23.t:0 "Círdan Apears to have taken Narya with him."
bonus_event.23.d:0 "Though it was not seen on him the day that Círdan left, his ring has not been found since then and it is likely that it is now far from us in the blessed realm."
bonus_event.23.a:0 "A Final trick from the old man."
bonus_event.24.t:0 "How to deal with the Wolves"
bonus_event.24.d:0 "Wolves have been a constant threat to society in Eriador since society first existed in Eriador. The rangers have proved apt at taking care of them in the past, but their numbers still increase as the darkness grows."
bonus_event.24.a:0 "Allow the rangers to continue their work"
bonus_event.24.b:0 "Payment for anyone willing to bring a wolf pelt!"
bonus_event.25.t:0 "How to deal with the Nazgul"
bonus_event.25.d:0 "Ringwraiths of Mordor have been sighted riding through our countryside. They terrify our people and ask for information on a 'Baggins'."
bonus_event.25.a:0 "Just try to keep our people safe"
bonus_event.25.b:0 "Interfere with them as we can"
bonus_event.25.c:0 "Cooperate with them, Sauron is a powerful ally"
bonus_event.26.t:0 "How to deal with the Barrow Wights"
bonus_event.26.d:0 "The barrow wights plague the barrow downs and scare away most of the people who would want to go there, they are said to be the ghosts of the people who died in the war with the witch King. How does one deal with ghosts anyway?"
bonus_event.26.a:0 "Leave the dead as they are"
bonus_event.26.b:0 "Take the old weapons from the downs"
bonus_event.26.c:0 "Can we just sing at them or something?"
bonus_event.27.t:0 "A Most Unusual Encounter"
bonus_event.27.d:0 "As we pondered what was to be done about the barrow wights, an odd man approached us while singing, he banished the barrow wights from before him and said that his name is Tom Bombadill. Apparently he lives in the old forest with his wife, and though he can be difficult to understand, it sounds as if he is older than any other being in Middle Earth."
bonus_event.27.a:0 "Strange but Welcome"
bonus_event.28.t:0 "Concerning News from the west"
bonus_event.28.d:0 "Though Sauron has been banished from Mordor by the forces of the orcish rebellion, it seems that he may not be entirely gone. Intelligence from Angmar tells of a strange 'necromancer' who is gaining prominence in their government, and while there is not yet confirmation on his identity, it is best to be aware of any possible threat."
bonus_event.28.a:0 "Concerning."

 rhudaur.6.t:0 "The Council of Rhudaur"

 rhudaur.6.desc:0 "The clan leaders and influential men of Rhudaur have been summoned to a grand council to deliberate on the path that our people must take.\n\nDark shadows gather on the horizon, and these are indeed troubling times. The realms of men find themselves in chaos, the elves are withdrawing into their forests, and ominous whispers speak of darkness rising in Mordor, Angmar, and beyond.\n\nWhat course shall we set for our future?"

 rhudaur.6.a:0 "Desperate times call for immediate and decisive political action!"

 rhudaur.6.b:0 "If war looms in the distance, then we must ready ourselves for battle!"

 rhudaur.6.c:0 "As long as our people remain united, we can withstand any adversary!"

